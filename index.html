2, "exp": "NADH is the reduced (electron-carrying) form; NAD+ is oxidized.", "src": "chapter"}, {"id": "c8_12", "ch": 8, "type": "mc", "q": "Most oxidation reactions in microbial bioenergetics involve the", "opts": ["Removal of electrons", "Addition of electrons", "Addition of oxygen", "Removal of oxygen"], "correct": 0, "exp": "Oxidation = loss of electrons (often as hydrogen atoms); reduction = gain.", "src": "chapter"}, {"id": "c8_13", "ch": 8, "type": "mc", "q": "A product or products of glycolysis is/are", "opts": ["ATP", "Pyruvic acid", "CO2", "Both a and b"], "correct": 3, "exp": "Glycolysis produces both net ATP and pyruvic acid (no CO2).", "src": "chapter"}, {"id": "c8_14", "ch": 8, "type": "mc", "q": "Fermentation of a glucose molecule has the potential to produce a net number of ______ ATPs.", "opts": ["4", "2", "38", "32"], "correct": 1, "exp": "Fermentation nets only 2 ATP (from glycolysis) -- no ETC involved.", "src": "chapter"}, {"id": "c8_15", "ch": 8, "type": "mc", "q": "Complete oxidation of glucose in aerobic respiration by a eukaryote could potentially yield a net maximum output of ______ ATPs.", "opts": ["40", "30", "38", "2"], "correct": 2, "exp": "Theoretical max is often cited as 38 ATP (36-38 in eukaryotes due to shuttle costs).", "src": "chapter"}, {"id": "c8_16", "ch": 8, "type": "mc", "q": "The compound that enters the Krebs cycle is", "opts": ["Citric acid", "Oxaloacetic acid", "Pyruvic acid", "Acetyl coenzyme A"], "correct": 3, "exp": "Acetyl-CoA (from pyruvate via the transition step) enters the Krebs cycle, combining with oxaloacetic acid to form citric acid.", "src": "chapter"}, {"id": "c8_17", "ch": 8, "type": "mc", "q": "The FADH2 formed during the Krebs cycle enters the electron transport system at which site?", "opts": ["NADH dehydrogenase", "Complex II", "Complex IV", "ATP synthase"], "correct": 1, "exp": "FADH2 feeds electrons in at Complex II (lower energy entry than NADH at Complex I).", "src": "chapter"}, {"id": "c8_18", "ch": 8, "type": "mc", "q": "The proton motive force is the result of", "opts": ["ATP synthase transporting protons during ATP synthesis", "An electron gradient between the matrix and intermembrane space", "A proton gradient between the matrix and intermembrane space of a mitochondrion", "A buildup of negatively charged ions"], "correct": 2, "exp": "The PMF is a proton (H+) gradient, not an electron gradient.", "src": "chapter"}, {"id": "c8_19", "ch": 8, "type": "mc", "q": "Photosynthetic organisms convert the energy of ______ into chemical energy.", "opts": ["Electrons", "Protons", "Photons", "Hydrogen atoms"], "correct": 2, "exp": "Photons (light energy) are converted into chemical energy (ATP/NADPH).", "src": "chapter"}, {"id": "c8_20", "ch": 8, "type": "mc", "q": "The Calvin cycle operates during which part of photosynthesis?", "opts": ["Only the light-dependent phase", "Only in the dark", "The light-independent phase", "Only during photosystem I"], "correct": 2, "exp": "The Calvin cycle is the light-independent phase (it can run in light, just doesn't require it directly).", "src": "chapter"}, {"id": "c8_21", "ch": 8, "type": "mc", "q": "The oxygen produced by photosynthesis comes from", "opts": ["CO2", "NO3", "H2O", "Glucose"], "correct": 2, "exp": "Photolysis of water releases O2 during the light-dependent reactions.", "src": "chapter"}, {"id": "c8_22", "ch": 8, "type": "match", "q": "Match each metabolic event to the process it belongs to (glycolysis, Krebs cycle, or electron transport/oxidative phosphorylation).", "items": ["H+ and electrons are delivered to O2 as the final electron acceptor", "Pyruvic acid is formed", "ATP is produced", "H2O is produced", "CO2 is formed", "Fructose diphosphate is split into two 3-carbon fragments", "NADH is oxidized", "ATP synthase is active"], "rights": ["Electron transport chain", "Glycolysis", "All three (glycolysis, Krebs cycle, and electron transport)", "Electron transport chain", "Krebs cycle", "Glycolysis", "Electron transport chain", "Electron transport chain"], "exp": "ATP is produced at all three stages; CO2 only in the Krebs cycle; O2 and H2O only at the electron transport chain.", "src": "chapter"}, {"id": "c8_23", "ch": 8, "type": "tf", "q": "The Krebs cycle provides a significant means to synthesize a small amount of ATP in the absence of oxygen and also to generate pyruvic acid, an essential intermediary metabolite.", "correct": false, "exp": "False -- that description is glycolysis, not the Krebs cycle. Glycolysis makes pyruvic acid, which then enters the Krebs cycle.", "src": "quiz2"}, {"id": "c8_24", "ch": 8, "type": "tf", "q": "The Krebs cycle allows the acetyl groups from the breakdown (beta oxidation) of certain fats to enter the pathway and be used as an energy source.", "correct": true, "exp": "True -- fatty acid breakdown feeds acetyl-CoA into the Krebs cycle.", "src": "quiz2"}, {"id": "c8_25", "ch": 8, "type": "mc", "q": "Protons (H+) released during electron transport:", "opts": ["Act as coenzymes", "Are passed along the electron transport chain along with the electrons", "Are the terminal electron acceptors", "Are pumped across the membrane, creating the proton motive force"], "correct": 3, "exp": "Protons are pumped across the membrane (not carried along with the electrons) to build the proton motive force.", "src": "quiz2"}, {"id": "c8_26", "ch": 8, "type": "mc", "q": "In aerobic respiration, oxygen acts as:", "opts": ["A carrier of electrons, passing them down the chain", "A reducing agent", "The terminal electron acceptor", "A coenzyme"], "correct": 2, "exp": "O2 is the final electron acceptor in aerobic respiration, forming H2O.", "src": "quiz2"}, {"id": "c8_27", "ch": 8, "type": "fill", "q": "Glycolysis produces 4 ATP via substrate-level phosphorylation but uses 2 to start, for a net of ______ ATP.", "answers": ["2", "two"], "exp": "Net ATP from glycolysis = 2 (gross 4 minus the 2 invested).", "terms": ["ATP yield"], "src": "added"}, {"id": "c8_28", "ch": 8, "type": "mc", "q": "An enzyme consisting only of the protein portion, without its required cofactor, is called a(n):", "opts": ["Holoenzyme", "Apoenzyme", "Coenzyme", "Exoenzyme"], "correct": 1, "exp": "Apoenzyme = protein-only, inactive without its cofactor.", "terms": ["enzyme vocab"], "src": "added"}, {"id": "c8_29", "ch": 8, "type": "mc", "q": "The complete, active enzyme -- apoenzyme plus its cofactor -- is called a(n):", "opts": ["Holoenzyme", "Apoenzyme", "Coenzyme", "Endoenzyme"], "correct": 0, "exp": "Holoenzyme = apoenzyme + cofactor/coenzyme = the fully functional enzyme.", "terms": ["enzyme vocab"], "src": "added"}, {"id": "c8_30", "ch": 8, "type": "mc", "q": "An enzyme that functions inside the cell, as opposed to being secreted, is called a(n):", "opts": ["Exoenzyme", "Endoenzyme", "Coenzyme", "Apoenzyme"], "correct": 1, "exp": "Endoenzyme = functions intracellularly; exoenzyme = secreted to act outside the cell.", "terms": ["enzyme vocab"], "src": "added"}, {"id": "d8_01", "ch": 8, "type": "discuss", "q": "Indicate whether O2, ATP, NADPH, and glucose are produced during the light-dependent or light-independent reactions.", "model": "Light-dependent: O2, ATP, NADPH. Light-independent (Calvin cycle): glucose (using the ATP/NADPH supplied by the light reactions).", "src": "chapter"}, {"id": "d8_02", "ch": 8, "type": "discuss", "q": "During which reactions are water and CO2 consumed, and what's the outcome?", "model": "Water is consumed (split) in the light-dependent reactions, releasing O2, electrons, and H+. CO2 is consumed in the light-independent (Calvin cycle) reactions, ultimately forming glucose.", "src": "chapter"}, {"id": "d8_03", "ch": 8, "type": "discuss", "q": "What are the functions of chlorophyll and the photosystems?", "model": "Chlorophyll absorbs light energy; photosystems (I and II) use that captured energy to excite and pass electrons along, driving ATP and NADPH production.", "src": "chapter"}, {"id": "d8_04", "ch": 8, "type": "discuss", "q": "What are the fates of ATP and NADPH in the Calvin cycle?", "model": "Both are consumed as energy/reducing power to fix CO2 into organic carbon (glucose), regenerating ADP and NADP+ for the light reactions.", "src": "chapter"}, {"id": "d8_05", "ch": 8, "type": "discuss", "q": "Compare oxygenic with anoxygenic photosynthesis.", "model": "Oxygenic (plants, algae, cyanobacteria) splits water, releasing O2. Anoxygenic (green/purple sulfur bacteria) uses electron donors like H2S instead of water, so no O2 is produced.", "src": "chapter"}, {"id": "d8_06", "ch": 8, "type": "discuss", "q": "Name the general enzyme type that: (a) converts citrate to isocitrate (b) reduces pyruvic acid to lactic acid (c) reduces nitrate to nitrite.", "model": "(a) Isomerase. (b) Lactate dehydrogenase (a reductase/dehydrogenase). (c) Nitrate reductase.", "src": "chapter"}, {"id": "d8_07", "ch": 8, "type": "discuss", "q": "Explain what's unique about ATP synthase's action.", "model": "It's a molecular turbine -- protons flowing down their gradient through it physically spin a rotor component, mechanically driving ATP synthesis from ADP + Pi (chemiosmosis).", "src": "chapter"}, {"id": "d8_08", "ch": 8, "type": "discuss", "q": "Compare the general equation for aerobic metabolism with its summary -- verify totals and where reactions occur.", "model": "Overall: glucose + O2 -> CO2 + H2O + ATP. Glycolysis occurs in the cytoplasm, the Krebs cycle in the mitochondrial matrix, and the electron transport chain on the inner mitochondrial membrane.", "src": "chapter"}, {"id": "d8_09", "ch": 8, "type": "discuss", "q": "Describe four requirements for fermentation to occur.", "model": "An organic substrate (e.g., glucose), glycolysis enzymes, an organic final electron acceptor (e.g., pyruvate or its derivative), and anaerobic (or O2-independent) conditions, mainly to regenerate NAD+.", "src": "chapter"}, {"id": "d8_10", "ch": 8, "type": "discuss", "q": "Is fermentation catabolic or anabolic? Explain.", "model": "Catabolic -- it breaks down glucose to release a small amount of ATP, without building larger molecules.", "src": "chapter"}, {"id": "d8_11", "ch": 8, "type": "discuss", "q": "Name three electron carriers and their essential vitamins; explain their role.", "model": "NAD+ (niacin/B3), FAD (riboflavin/B2), coenzyme A (pantothenic acid/B5) -- they shuttle electrons/hydrogens between reactions, linking catabolic energy release to ATP production.", "src": "chapter"}, {"id": "d8_12", "ch": 8, "type": "discuss", "q": "Explain similarities/differences between anaerobic respiration and fermentation.", "model": "Both occur without O2 and regenerate NAD+. But anaerobic respiration still uses an electron transport chain (with a non-oxygen final acceptor like nitrate/sulfate) and yields much more ATP; fermentation has no ETC and yields only the small net ATP from glycolysis.", "src": "chapter"}, {"id": "d8_13", "ch": 8, "type": "discuss", "q": "Diagram the energetics of a reaction with and without an enzyme.", "model": "Both start/end at the same reactant/product energy levels, but the catalyzed reaction has a much lower activation-energy peak -- enzymes speed up the reaction without changing its overall energy change.", "src": "chapter"}, {"id": "d8_14", "ch": 8, "type": "discuss", "q": "Explain the ‘biochemical circle of life’ between phototrophs and heterotrophs.", "model": "Phototrophs capture light energy to build organic molecules and release O2; heterotrophs consume those organic molecules and O2, releasing CO2 and H2O back to the phototrophs -- a continuous cycle.", "src": "chapter"}, {"id": "d8_15", "ch": 8, "type": "discuss", "q": "How can some microbes survive and grow in the presence of cyanide?", "model": "They may use alternative, cyanide-insensitive terminal oxidases in their electron transport chain, bypassing the cytochrome complex that cyanide normally blocks.", "src": "chapter"}, {"id": "d8_16", "ch": 8, "type": "discuss", "q": "What are the advantages of staging metabolic pathways in specific membranes/organelles rather than free in the cytoplasm?", "model": "Compartmentalization concentrates enzymes/substrates for efficiency, allows ion gradients (like the proton motive force) to be established and used, and separates competing reactions.", "src": "chapter"}, {"id": "d8_17", "ch": 8, "type": "discuss", "q": "Two allosteric enzymes regulate glycolysis (phosphoglucoisomerase, pyruvate kinase) -- what might regulate them?", "model": "Typically downstream products/energy signals -- e.g., high ATP or citrate levels inhibiting early glycolytic enzymes (feedback inhibition), while ADP/AMP can activate them when energy is low.", "src": "chapter"}, {"id": "d8_18", "ch": 8, "type": "discuss", "q": "Beer brewing needs early aerobic yeast metabolism, yet anaerobic conditions are needed to make alcohol -- why?", "model": "Yeast initially grows and reproduces rapidly using aerobic respiration (building up biomass); only once oxygen is depleted does fermentation take over to produce ethanol.", "src": "chapter"}, {"id": "d8_19", "ch": 8, "type": "discuss", "q": "What pH would you expect in the mitochondrial matrix vs. intermembrane space, and the chloroplast stroma vs. thylakoid lumen? Why?", "model": "The intermembrane space and thylakoid lumen are more acidic (proton-rich) due to pumped H+ accumulation; the matrix and stroma are comparatively more basic, since protons are pumped out of/into those compartments to form the gradient.", "src": "chapter"}, {"id": "d8_20", "ch": 8, "type": "discuss", "q": "Where do ATP molecules collect after being made by ATP synthase in the mitochondrion/chloroplast, and what's the advantage?", "model": "In the mitochondrial matrix and the chloroplast stroma, respectively -- right where the cell's biosynthetic reactions that need ATP are occurring.", "src": "chapter"}, {"id": "d8_21", "ch": 8, "type": "discuss", "q": "Explain the relationship between enzyme sensitivity and microbial environmental adaptations.", "model": "Microbes' enzymes are finely tuned (in structure/stability) to function optimally at the temperature, pH, and salinity of their native environment -- exactly why extremophiles have differently adapted enzymes than mesophiles.", "src": "chapter"}, {"id": "d8_22", "ch": 8, "type": "discuss", "q": "Why wouldn't antibiotics work as therapy for botulism?", "model": "Botulism is caused by a preformed toxin; killing the bacteria with antibiotics doesn't neutralize toxin already present, so antitoxin, not antibiotics, is the needed treatment.", "src": "chapter"}, {"id": "g1", "ch": 4, "type": "diagram", "q": "Label the numbered parts of this generalized bacterial cell (outer to inner, plus the appendage).", "svg": "<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><ellipse cx=\"200\" cy=\"140\" rx=\"170\" ry=\"95\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><ellipse cx=\"200\" cy=\"140\" rx=\"150\" ry=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><ellipse cx=\"200\" cy=\"140\" rx=\"135\" ry=\"68\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><ellipse cx=\"170\" cy=\"150\" rx=\"38\" ry=\"18\" fill=\"currentColor\" opacity=\"0.25\"/><line x1=\"30\" y1=\"140\" x2=\"-20\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M -20 140 Q -40 120 -55 140 Q -40 160 -20 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"200\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">1</text><text x=\"200\" y=\"55\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">2</text><text x=\"200\" y=\"78\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">3</text><text x=\"170\" y=\"153\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">4</text><text x=\"60\" y=\"130\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">5</text></svg>", "items": ["1 (outermost dashed layer)", "2 (middle solid layer)", "3 (inner solid layer)", "4 (shaded oval inside)", "5 (external whip-like structure)"], "rights": ["Glycocalyx (capsule/slime layer)", "Cell wall", "Cell membrane", "Nucleoid (DNA region)", "Flagellum"], "exp": "Outer to inner: glycocalyx, cell wall, cell membrane, with the nucleoid inside the cytoplasm and the flagellum projecting externally.", "src": "added"}, {"id": "g2", "ch": 4, "type": "diagram", "q": "Put the Gram stain reagents in the correct order (Step 1 through Step 4).", "svg": "<svg viewBox=\"0 0 420 160\" xmlns=\"http://www.w3.org/2000/svg\"><g font-size=\"12\" fill=\"currentColor\"><rect x=\"10\" y=\"40\" width=\"80\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"50\" y=\"30\" text-anchor=\"middle\">Step 1</text><text x=\"50\" y=\"110\" text-anchor=\"middle\">?</text><rect x=\"110\" y=\"40\" width=\"80\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150\" y=\"30\" text-anchor=\"middle\">Step 2</text><text x=\"150\" y=\"110\" text-anchor=\"middle\">?</text><rect x=\"210\" y=\"40\" width=\"80\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"250\" y=\"30\" text-anchor=\"middle\">Step 3</text><text x=\"250\" y=\"110\" text-anchor=\"middle\">?</text><rect x=\"310\" y=\"40\" width=\"80\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"350\" y=\"30\" text-anchor=\"middle\">Step 4</text><text x=\"350\" y=\"110\" text-anchor=\"middle\">?</text></g></svg>", "items": ["Step 1", "Step 2", "Step 3", "Step 4"], "rights": ["Crystal violet (primary stain)", "Iodine (mordant)", "Decolorizer (alcohol/acetone)", "Safranin (counterstain)"], "exp": "Mnemonic: “Come In And Stain” -- Crystal violet, Iodine, Alcohol, Safranin. Decolorization (step 3) is the highest-risk step.", "src": "added"}, {"id": "c1_34", "ch": 1, "type": "mc", "q": "Which of the following is NOT a eukaryotic microbe studied in microbiology?", "opts": ["Protozoa", "Fungi", "Parasitic worms (helminths)", "Viruses"], "correct": 3, "exp": "Viruses are acellular — no nucleus, no ribosomes, no organelles — so they can't be classified as prokaryotic or eukaryotic at all.", "src": "assignment"}, {"id": "c1_35", "ch": 1, "type": "match", "q": "Match each cell type to its defining feature and typical size range.", "items": ["Contains a nucleus and other membrane-bound organelles", "Typical size 1–10 micrometers (µm); lacks a nucleus", "Typical size 10–200 nanometers (nm); acellular, must be viewed with an electron microscope"], "rights": ["Eukaryote", "Prokaryote", "Virus"], "exp": "1 micrometer = 1,000 nanometers, so even a large 200nm virus is far smaller than a typical 1–10µm bacterium. Light microscopes can't resolve anything below about 200nm (a resolution limit, not a magnification problem) — that's why electron microscopes are needed to see viruses.", "src": "assignment"}, {"id": "c1_36", "ch": 1, "type": "mc", "q": "Which explains why archaeons are extremophiles?", "opts": ["One archaeon can live in both hot and cold temperatures", "They are ancient, primitive organisms that retained characteristics of the first cells, which evolved under Earth's far more extreme early conditions", "They cause extremely severe disease", "They represent the extremes in size of all bacteria"], "correct": 1, "exp": "Archaea are thought to have kept traits from the earliest cells on a hot, oxygen-free early Earth, which is why many still thrive in hot springs, salty lakes, and oxygen-free environments today. They aren't known to cause disease, and 'extremophile' is about environment, not size.", "src": "assignment"}, {"id": "c1_37", "ch": 1, "type": "mc", "q": "A subglacial lake buried under 800m of ice supports microbial life even though photosynthesis is completely inhibited by the total lack of light. Which other habitat would likely cause the same inhibition?", "opts": ["The surface of the ocean", "A swimming pool", "The large intestine", "The surface of a leaf"], "correct": 2, "exp": "The large intestine is permanently dark, just like a lake buried deep under ice — no light reaches either place, so photosynthesis can't happen. The other options all get plenty of light.", "src": "assignment"}, {"id": "c1_38", "ch": 1, "type": "mc", "q": "Researchers sterilize their drilling equipment with UV light and hydrogen peroxide before sampling an isolated subglacial lake. If this step were skipped, it would most likely result in:", "opts": ["Scientists being unable to access the lake", "The drill hole freezing shut", "Terrestrial microbes contaminating the lake", "Scientists becoming ill from exposure"], "correct": 2, "exp": "UV light and hydrogen peroxide are decontamination tools meant to keep surface microbes from being introduced into a lake that's been isolated for possibly millions of years — that's their whole purpose.", "src": "assignment"}, {"id": "c1_39", "ch": 1, "type": "mc", "q": "Researchers identified over 4,000 microbial species in an environmental water sample without culturing each one individually, by directly analyzing the sample for:", "opts": ["DNA", "Carbohydrates", "Lipids", "Proteins"], "correct": 0, "exp": "This technique is called metagenomics — extracting and sequencing DNA directly from an environmental sample to catalog species diversity, without needing to grow each organism first.", "src": "assignment"}, {"id": "c1_40", "ch": 1, "type": "mc", "q": "Microbes living in a frozen, sunless lake under ice and microbes living in a hot, oily tar pit seem to have what in common?", "opts": ["Adaptation to similar temperatures", "The ability to photosynthesize", "The capacity to use substances in their environment as an energy source", "The ability to cause disease in humans"], "correct": 2, "exp": "These two environments are about as different in temperature as possible. What unites the microbes is metabolic flexibility — one group gets energy from minerals/chemicals in cold water, the other metabolizes oil. Neither photosynthesizes (no light in either spot), and neither is linked to human disease.", "src": "assignment"}, {"id": "c1_41", "ch": 1, "type": "tf", "q": "Some diseases, including some cancers, once thought to be noninfectious are now known to involve microbial infection.", "correct": true, "exp": "True — H. pylori was once dismissed as unrelated to stomach ulcers (blamed on stress/diet) but is now known to cause most of them, and is linked to gastric cancer. HPV is similarly established as a cause of cervical cancer.", "src": "assignment"}, {"id": "c1_42", "ch": 1, "type": "match", "q": "Match each early microbiologist to their contribution.", "items": ["Developed a series of proofs (postulates) linking a specific microbe to a specific disease", "Performed an experiment (the swan-neck flask) that disproved spontaneous generation", "Introduced aseptic technique into the surgical setting to reduce wound infections"], "rights": ["Koch", "Pasteur", "Lister"], "exp": "A clean way to keep these three straight: Pasteur disproved (spontaneous generation), Koch proved (specific germ-disease links via his postulates), and Lister applied (turned germ theory into surgical practice).", "src": "assignment"}, {"id": "c1_43", "ch": 1, "type": "match", "q": "Match each taxonomy-related term to its definition.", "items": ["Formal system for organizing, classifying, and naming living things", "Taxonomic categories (e.g., a species, genus, or family)", "Classification scheme organized in descending ranks (Domain > Kingdom > ... > Species)", "Scientific name consisting of genus + species", "Relatedness between groups of living things (evolutionary lineage)"], "rights": ["Taxonomy", "Taxa", "Hierarchy", "Binomial nomenclature", "Phylogeny"], "exp": "Taxonomy is the science itself; hierarchy is its ranked structure; taxa are the individual units within that structure; binomial nomenclature is the specific two-part naming rule; and phylogeny is about evolutionary relatedness, which modern taxonomy is increasingly built around.", "terms": ["taxonomy"], "src": "assignment"}, {"id": "c1_44", "ch": 1, "type": "mc", "q": "Which of these is a confirmed example of microbes' role in the earth's ecosystem?", "opts": ["Photosynthetic microbes capture energy from organic compounds", "Microbes produce greenhouse gases, such as carbon dioxide and methane, which help trap heat in the atmosphere", "Microbes make up the structural building blocks of every higher organism's body", "None of the above"], "correct": 1, "exp": "Methanogens (Archaea) and other microbes are major natural producers of CO2 and methane through fermentation and anaerobic respiration. The first option gets photosynthesis backwards (it captures energy from light, not organic compounds) — that's a repeated trap.", "src": "assignment"}, {"id": "c4_32", "ch": 4, "type": "mc", "q": "Stains combined with light microscopy allow the visualization in bacteria of:", "opts": ["Cell size, shape, arrangement, and possibly a few cell structures", "DNA, RNA, and a defined nucleus", "Ribosomes and proteins", "Viruses infecting cells"], "correct": 0, "exp": "Light microscopy's resolution isn't sufficient to visualize DNA/RNA/nucleus detail, ribosomes, or viruses (those need electron microscopy) — and bacteria don't have a defined nucleus anyway.", "src": "assignment"}, {"id": "c4_33", "ch": 4, "type": "mc", "q": "Which is the primary stain in the acid-fast staining procedure?", "opts": ["Carbolfuchsin", "Crystal violet", "Safranin", "Methylene blue"], "correct": 0, "exp": "Carbolfuchsin is soluble in the waxy, lipoidal mycolic acid of mycobacterial cell walls, letting it penetrate where crystal violet or methylene blue can't. Crystal violet is the Gram stain's primary stain; methylene blue is acid-fast's counterstain.", "terms": ["acid-fast"], "src": "assignment"}, {"id": "c4_34", "ch": 4, "type": "mc", "q": "Which of the following microbes CANNOT be reliably seen with Gram stain?", "opts": ["Bacillus megaterium", "Mycobacterium tuberculosis", "Staphylococcus epidermidis", "E. coli"], "correct": 1, "exp": "M. tuberculosis's cell wall is loaded with waxy mycolic acid, which blocks the water-soluble Gram stain reagents. The other three have typical peptidoglycan-based walls and stain normally.", "terms": ["acid-fast"], "src": "assignment"}, {"id": "c4_35", "ch": 4, "type": "mc", "q": "Gram staining:", "opts": ["Allows the identification of bacteria", "Allows the classification of microbes into prokaryotes and eukaryotes", "Allows the differentiation of bacteria into gram positive and gram negative", "Allows detailed analysis of internal bacterial cell structure"], "correct": 2, "exp": "This is a classic trap set. 'Identification' is too strong — Gram stain narrows things down but doesn't identify a species on its own. It only applies to bacteria (prokaryotes), says nothing about prokaryote/eukaryote classification, and light microscopy can't resolve internal cell detail. Its real scope is exactly this: sorting bacteria into gram-positive vs. gram-negative.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "c4_36", "ch": 4, "type": "mc", "q": "The basis for differential Gram staining is:", "opts": ["Archaea vs. bacterial cell wall", "Prokaryotic vs. eukaryotic cell structure", "Differential cell wall structure between different groups of bacteria", "Aerobic vs. fermentative bacteria"], "correct": 2, "exp": "Specifically, it's the thickness/cross-linking of the peptidoglycan layer. Gram staining isn't about archaea (many lack peptidoglycan entirely), isn't about prokaryote/eukaryote structure, and doesn't sort by metabolism.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "d4_16", "ch": 4, "type": "discuss", "q": "Vibrio vulnificus, a gram-negative bacterium, led to septic shock in a patient. What component of gram-negative cells is often associated with septic shock?", "model": "Lipopolysaccharide (LPS) in the outer membrane — specifically lipid A, which acts as an endotoxin. When the bacteria die or multiply, lipid A is released and triggers a massive immune response (fever, inflammation, clotting problems, dropping blood pressure) that causes septic shock.", "src": "assignment"}, {"id": "d4_17", "ch": 4, "type": "discuss", "q": "Imagine a strain of bacteria with a mutation that weakens its cell wall. What would happen to this bacterium in a hypotonic solution? What about a hypertonic solution?", "model": "Hypotonic: water rushes in, and a weak wall can't resist the pressure, so the cell lyses (bursts). Hypertonic: water leaves and the cell shrinks/shrivels (crenation) — the weak wall doesn't matter here, since the problem is water loss, not pressure.", "src": "assignment"}, {"id": "d4_18", "ch": 4, "type": "discuss", "q": "A recurring Mycobacterium abscessus outbreak was traced to a dental clinic's water lines. What are biofilms, and how could they explain why the infections kept coming back even after cleaning and replacing equipment?", "model": "Biofilms are communities of bacteria that stick to a surface and coat themselves in a self-made slimy matrix. That slime protects them from disinfectants, antibiotics, and flowing water. Even after cleaning or replacing parts, leftover biofilm in the pipes keeps shedding bacteria into the water supply, so the infections return.", "terms": ["biofilm"], "src": "assignment"}, {"id": "c4_37", "ch": 4, "type": "mc", "q": "Mycobacterium species (like M. tuberculosis and M. abscessus) belong to which bacterial phylum?", "opts": ["Firmicutes", "Proteobacteria", "Actinobacteria", "Spirochetes"], "correct": 2, "exp": "Actinobacteria (also called Actinomycetota) are gram-positive, high-G+C bacteria. Other notable members include Streptomyces (makes many antibiotics) and Corynebacterium diphtheriae.", "src": "assignment"}, {"id": "c4_38", "ch": 4, "type": "mc", "q": "MRSA (methicillin-resistant Staphylococcus aureus) resists penicillin-type antibiotics mainly because it has:", "opts": ["An efflux pump that exports the antibiotic", "A mutated protein (PBP2a, from the mecA gene) that these antibiotics can't bind", "An extra-thick outer lipid membrane", "A capsule that physically blocks drug entry"], "correct": 1, "exp": "The mecA gene produces PBP2a, an altered penicillin-binding protein involved in cell wall synthesis that penicillin-type (beta-lactam) antibiotics can't effectively bind, letting the bacterium keep building its wall despite the drug.", "src": "assignment"}, {"id": "c4_39", "ch": 4, "type": "mc", "q": "When all the flagella on a bacterial cell rotate counterclockwise, the cell is propelled forward in a movement called a ______; when the flagella reverse direction, the cell stops and reorients in an action called a ______.", "opts": ["propulsion; reversal", "propulsion; run", "tumble; run", "run; tumble"], "correct": 3, "exp": "Counterclockwise rotation bundles the flagella together for a smooth 'run'; clockwise rotation makes the bundle fly apart, causing a random 'tumble' that points the cell in a new direction.", "src": "assignment"}, {"id": "c4_40", "ch": 4, "type": "mc", "q": "Which of the following is NOT found within the bacterial cytoplasm?", "opts": ["Chromosome (nucleoid)", "Ribosomes", "Water", "Fimbriae"], "correct": 3, "exp": "Fimbriae are external appendages on the cell surface, not cytoplasmic contents. The chromosome sits in the nucleoid region, and ribosomes float freely — both within the cytoplasm, which is mostly water.", "src": "assignment"}, {"id": "c4_41", "ch": 4, "type": "match", "q": "Match each internal bacterial structure to its description.", "items": ["Contains the cell's essential DNA", "Contains nonessential DNA (e.g., antibiotic resistance genes)", "Composed of RNA and protein; synthesizes new proteins", "Network of protein polymers that stabilizes cell shape from within", "Stores nutrients during times of plenty for use when scarce", "Stores inorganic compounds, such as sulfur or polyphosphate"], "rights": ["Chromosome", "Plasmid", "Ribosome", "Cytoskeleton", "Inclusion bodies", "Granules"], "exp": "Plasmids carry extra, nonessential genes (like antibiotic resistance) separate from the main chromosome. Inclusion bodies store organic nutrients for lean times; granules store inorganic compounds like sulfur or polyphosphate (the same idea as the metachromatic/volutin granules in Corynebacterium).", "src": "assignment"}, {"id": "c4_42", "ch": 4, "type": "tf", "q": "Boiling water is hot enough to destroy bacterial endospores.", "correct": false, "exp": "False — endospores resist boiling. Steam under pressure (like in an autoclave, ~121°C) is needed to destroy them, which is why pressure canning matters for food safety (e.g., preventing botulism).", "terms": ["endospore"], "src": "assignment"}, {"id": "c4_43", "ch": 4, "type": "mc", "q": "Which of the following has historically been the first division in a system of bacterial taxonomy?", "opts": ["Gram-positive versus gram-negative cells", "Cocci versus bacilli", "Endospore formers versus non-endospore formers", "Pathogen versus non-pathogen", "Aerobe versus anaerobe"], "correct": 0, "exp": "Bacteria were historically first split by cell wall type, as shown by the Gram stain, because it's such a fundamental difference and easy to test. Shape, endospore formation, pathogenicity, and oxygen needs are used too, but as smaller, later divisions.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "c4_44", "ch": 4, "type": "mc", "q": "Why must fresh cells be used when performing a Gram stain?", "opts": ["Fresh cells do not smell as badly as older cells", "Old cells may not Gram stain properly", "As cells age, they won't stick to the slide", "All of these choices are correct"], "correct": 1, "exp": "As cells age, their cell walls start to break down, so gram-positive cells can lose the purple stain and falsely appear pink, giving a wrong result.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "c4_45", "ch": 4, "type": "mc", "q": "When ethanol (the decolorizer) is applied correctly during a Gram stain, gram-positive cells appear ______ and gram-negative cells appear ______ (before the counterstain is added).", "opts": ["purple; pink/red", "purple; colorless", "colorless; purple"], "correct": 1, "exp": "Right after the ethanol step, gram-positive cells keep their purple color, but gram-negative cells lose it and become colorless — they only turn pink/red once safranin is applied afterward. 'Purple; pink/red' describes the final result, not this intermediate step.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "c4_46", "ch": 4, "type": "match", "q": "Match each description to vegetative cells, endospores, or both.", "items": ["Active metabolism and active growth", "Metabolically inert and resistant to hostile conditions", "Contains DNA", "Contains protein"], "rights": ["Vegetative cell", "Endospore", "Both", "Both"], "exp": "A vegetative cell is the normal, living, growing form of the bacterium. An endospore is its dormant, 'sleeping' form — metabolically shut down but extremely tough. Both still contain DNA and protein, since the endospore needs them to germinate back into a normal cell later.", "terms": ["endospore"], "src": "assignment"}, {"id": "c5_19", "ch": 5, "type": "match", "q": "Match each description to the correct eukaryotic group.", "items": ["Always unicellular", "Can be unicellular or multicellular (includes mushrooms)", "Photosynthetic; can be unicellular or multicellular (includes seaweed)", "Adult forms are always multicellular"], "rights": ["Protozoa", "Fungi", "Algae", "Helminths"], "exp": "'Always unicellular' only fits protozoa, since fungi and algae both have multicellular members. 'Photosynthetic' and 'seaweed' point to algae (fungi can't photosynthesize). 'Adult forms' points to helminths, since their eggs/larvae are microscopic even though adults are large, multicellular worms.", "src": "assignment"}, {"id": "c5_20", "ch": 5, "type": "mc", "q": "Which of the following is found in essentially ALL eukaryotic cells (unlike chloroplasts or cell walls, which are only in certain groups)?", "opts": ["Cytoskeleton", "Chloroplast", "Cell wall", "None of these"], "correct": 0, "exp": "The cytoskeleton (microtubules, actin filaments, intermediate filaments) is essential for shape, organelle movement, and pulling chromosomes apart during mitosis — needed by any eukaryote that divides. Cell walls (fungi/algae/plants only) and chloroplasts (photosynthetic eukaryotes only) are not universal.", "src": "assignment"}, {"id": "c5_21", "ch": 5, "type": "mc", "q": "Choose the pair that correctly completes this sentence: the cell ______ is found in fungi and algae to provide structure and support, while the cell ______ is found in ALL eukaryotic cells, is composed of phospholipids, proteins, and sterols, and separates the cell's interior from the environment.", "opts": ["membrane; glycocalyx", "membrane; wall", "wall; membrane", "wall; glycocalyx"], "correct": 2, "exp": "The cell wall (chitin in fungi, cellulose in algae) provides structure/support but isn't universal. The cell membrane is universal in eukaryotes and contains sterols (cholesterol in animal cells, ergosterol in fungal cells) that stabilize it — ergosterol is also the target of many antifungal drugs.", "src": "assignment"}, {"id": "c5_22", "ch": 5, "type": "tf", "q": "The nucleus is surrounded by a single membrane.", "correct": false, "exp": "False — the nuclear envelope is a double membrane (two lipid bilayers). The outer membrane is continuous with the endoplasmic reticulum. Mitochondria and chloroplasts also share this double-membrane feature.", "src": "assignment"}, {"id": "c5_23", "ch": 5, "type": "tf", "q": "The nucleolus is itself a complete, functioning ribosome.", "correct": false, "exp": "False — the nucleolus makes ribosomal RNA and ribosomal subunits, but those subunits are exported through the nuclear pores and only join into a complete, working ribosome in the cytoplasm or on the rough ER. In eukaryotes, transcription happens in the nucleus and translation happens in the cytoplasm.", "src": "assignment"}, {"id": "c5_24", "ch": 5, "type": "match", "q": "Match each organelle to its identifying clue.", "items": ["Network of tunnels with no ribosomes attached; makes, stores, and transports lipids", "Membrane studded with ribosomes; proteins made here move on to the Golgi", "Contains thylakoids stacked into grana; site of the light reactions of photosynthesis", "Has two membranes, with a folded inner membrane (cristae) housing the electron transport chain", "Network of microfilaments and microtubules; anchors, supports, and moves the cell"], "rights": ["Smooth ER", "Rough ER", "Chloroplast", "Mitochondrion", "Cytoskeleton"], "exp": "Decker tends to write look-alike options (smooth ER vs. rough ER); the one distinguishing feature — lipids vs. ribosomes, thylakoids vs. cristae — is usually what's actually being tested.", "src": "assignment"}, {"id": "c5_25", "ch": 5, "type": "mc", "q": "Choose the answer that describes the function of the Golgi apparatus.", "opts": ["It synthesizes, stores, and transports lipids", "It adds lipids and sugars to proteins and then packages these proteins for transport to their final destination", "It synthesizes, stores, and transports proteins", "It produces the energy needed to fuel the cell", "It stores the DNA of the cell and produces RNA from the DNA"], "correct": 1, "exp": "The Golgi works like a shipping center: it modifies proteins arriving from the rough ER (adding sugars/lipids) and packages them for their final destination. It doesn't make proteins (that's rough ER) or make lipids (that's smooth ER).", "src": "assignment"}, {"id": "c5_26", "ch": 5, "type": "mc", "q": "Eukaryotes that are not plants, animals, or fungi make up a diverse catch-all group known as:", "opts": ["Monerans", "Yeasts", "Protists", "Archaeons"], "correct": 2, "exp": "Protists are grouped by exclusion — any eukaryote that isn't a plant, animal, or fungus lands here (algae, protozoa). Monerans and archaeons are prokaryotes, so they aren't eukaryotes at all; yeasts are unicellular fungi, which the question excludes.", "src": "assignment"}, {"id": "c5_27", "ch": 5, "type": "mc", "q": "Which statement about fungi is TRUE?", "opts": ["Fungi are autotrophic saprobes", "Unicellular fungi are prokaryotic, while multicellular fungi are eukaryotic", "Most fungi obtain nutrients from decaying matter, but some fungi can be parasites of living hosts", "Fungi ingest food the way animals do"], "correct": 2, "exp": "'Autotrophic saprobe' is a contradiction (saprobes feed on dead matter, making them heterotrophs). Being unicellular doesn't make an organism prokaryotic — all fungi, including single-celled yeasts, are eukaryotic. Fungi absorb nutrients; they don't ingest food like animals.", "src": "assignment"}, {"id": "c5_28", "ch": 5, "type": "tf", "q": "A pseudohypha is the same thing as a fungus switching between hyphae and yeast forms (dimorphism).", "correct": false, "exp": "False — a pseudohypha is a chain of yeast cells (like Candida albicans) that bud but stay attached end-to-end, just looking hypha-like. Dimorphism means an organism can take on two separate, full forms (mold and yeast) depending on conditions — a different concept.", "terms": ["dimorphism"], "src": "assignment"}, {"id": "c5_29", "ch": 5, "type": "mc", "q": "Choose the statement that describes the primary medical threat due to algae.", "opts": ["Algae grow in lakes and ponds, using up oxygen and suffocating fish", "Algae are used for food additives", "Algae contain endotoxin in their cell wall, which causes a form of shock in humans", "Marine algae produce toxins which accumulate in seafood and can cause severe food poisoning", "Algae cause infection in human and animal tissues"], "correct": 3, "exp": "During a harmful algal bloom, dinoflagellates (like Karenia brevis, which causes Gulf Coast red tides) produce toxins that build up in filter-feeding shellfish, sickening people who eat them. Endotoxin belongs to gram-negative bacteria, not algae; algal infections are extremely rare; and fish suffocation is an indirect, ecological effect of decomposer bacteria, not a direct human health threat. This is an intoxication, not an infection.", "src": "assignment"}, {"id": "c5_30", "ch": 5, "type": "mc", "q": "Which is a TRUE characteristic of protozoa?", "opts": ["They have a thick cell wall that protects them from dying", "They can move using flagella, pseudopodia, or cilia", "They are typically photoautotrophs", "They lack any locomotor structures"], "correct": 1, "exp": "Protozoa are grouped mainly by how they move: flagellates, amoebas (pseudopodia), and ciliates. They have NO cell wall (a key feature separating them from fungi/algae) and are heterotrophs, not photoautotrophs.", "src": "assignment"}, {"id": "c5_31", "ch": 5, "type": "match", "q": "Match each helminth life-cycle host type to its role.", "items": ["Where the larval (immature) stages develop", "Where the parasite becomes an adult and reproduces sexually"], "rights": ["Intermediate host", "Definitive host"], "exp": "Example: pigs are the intermediate host for the pork tapeworm (larvae form cysts in muscle); humans who eat undercooked pork are the definitive host, where the adult tapeworm develops and reproduces.", "src": "assignment"}, {"id": "c5_32", "ch": 5, "type": "mc", "q": "In electron micrographs, portions of the endoplasmic reticulum appear rough on the edges. This is because:", "opts": ["Some regions of the ER are covered with ribosomes", "Eukaryotic membranes include sterols to increase their strength", "Rough regions of the ER are constantly secreting toxic waste products", "Those areas of the ER have been recently synthesized and haven't had a chance to smooth out yet"], "correct": 0, "exp": "Ribosomes attached to the outer surface of rough ER create the 'rough,' sandpaper-like appearance. Smooth ER, by definition, has no ribosomes attached.", "src": "assignment"}, {"id": "c5_33", "ch": 5, "type": "mc", "q": "Which organelle does NOT contain its own DNA?", "opts": ["Mitochondria", "Chloroplast", "Nucleus", "Golgi apparatus"], "correct": 3, "exp": "The nucleus, mitochondria, and chloroplasts all contain DNA. Mitochondria and chloroplasts have their own small, circular DNA — strong evidence for endosymbiotic theory. The Golgi, part of the endomembrane system, formed from folds of the cell's own membrane and never had its own genome.", "terms": ["endosymbiotic theory"], "src": "assignment"}, {"id": "c5_34", "ch": 5, "type": "mc", "q": "Eukaryotic ribosomes are the site of:", "opts": ["Protein synthesis", "Protein degradation", "Protein folding", "Protein glycosylation"], "correct": 0, "exp": "Ribosomes carry out translation, building a polypeptide chain from mRNA's code. Folding mostly happens in the rough ER, glycosylation in the ER and Golgi, and degradation in proteasomes/lysosomes.", "src": "assignment"}, {"id": "c5_35", "ch": 5, "type": "tf", "q": "Protists are broadly divided into two general groups based on whether the organism is capable of photosynthesis.", "correct": true, "exp": "True — algae (photosynthetic) and protozoa (heterotrophic) are the two traditional divisions. This is a practical split, not a true evolutionary grouping: Euglena is a mixotroph that blurs the line, since it photosynthesizes but can also feed heterotrophically in the dark.", "src": "assignment"}, {"id": "c5_36", "ch": 5, "type": "mc", "q": "Which of these statements about fungi's importance to ecology, agriculture, commerce, and medicine is FALSE?", "opts": ["Fungi synthesize antibiotics (e.g., penicillin) that inhibit bacterial growth", "Fungi can be pathogenic to field crops and can rot food during transport", "Fungi form associations (mycorrhizae) with plant roots to help them take up water and nutrients", "The photosynthetic activity of fungi provides energy that makes its way up the food chain"], "correct": 3, "exp": "Fungi have no chloroplasts and cannot photosynthesize — they're decomposers, not primary producers. The other three are all real, well-documented roles fungi play.", "src": "assignment"}, {"id": "d5_21", "ch": 5, "type": "discuss", "q": "A newly discovered pigmented microbe has a capsule and flagella but no chloroplasts or cilia. It's about 2 microns in size, divides by binary fission, and its nucleic acid is packaged within an envelope. Is this a eukaryote or a prokaryote? Explain your reasoning.", "model": "Eukaryote. The deciding clue is that the nucleic acid is packaged within an envelope — that's a nuclear envelope, meaning a membrane-bound nucleus, which is the one defining trait of eukaryotes. Everything else (small size, capsule, flagella, binary fission, no chloroplasts/cilia) sounds prokaryote-like but isn't actually unique to prokaryotes: some eukaryotes are tiny, many unicellular eukaryotes divide by fission, and eukaryotes can have capsules and flagella too.", "src": "assignment"}, {"id": "c7_26", "ch": 7, "type": "mc", "q": "Mesophiles can survive in brackish water and inside the human body. Their temperature preference is best described as:", "opts": ["Extreme cold, below 0°C", "Moderate, roughly 20–45°C with an optimum near human body temperature", "Extreme heat, above 80°C", "Highly variable, with no defined range"], "correct": 1, "exp": "Mesophiles are 'middle-loving' organisms with an optimum around 37°C — this fits both brackish water (moderate temps) and the human body.", "src": "assignment"}, {"id": "d7_19", "ch": 7, "type": "discuss", "q": "Some archaea, like Halobacterium and Halococcus, grow in environments where the salt concentration reaches 25%. How can these microbes survive such extreme environments?", "model": "They're extreme (obligate) halophiles — they actually need high salt to survive, not just tolerate it. Their cell walls and membranes are structurally adapted to stay stable at high salt, they pump in compatible solutes (like potassium ions) to balance the osmotic pressure, and their proteins are specially folded to stay functional in all that salt. Without the salt, their structure actually falls apart.", "src": "assignment"}, {"id": "c7_27", "ch": 7, "type": "match", "q": "Match each temperature-growth curve description to its classification, from coldest to hottest optimum.", "items": ["Peak growth around 5–10°C", "Peak growth around 25–30°C", "Peak growth around 37–40°C", "Peak growth around 65–70°C", "Peak growth around 105–125°C"], "rights": ["Psychrophile", "Psychrotroph", "Mesophile", "Thermophile", "Extreme thermophile"], "exp": "Five temperature classes in increasing order of optimum temperature: psychrophile (coldest), psychrotroph (cold-tolerant but grows better at moderate temps), mesophile (moderate, includes most human pathogens), thermophile (hot), and extreme thermophile (hottest, e.g., hydrothermal vent archaea).", "src": "assignment"}, {"id": "c7_28", "ch": 7, "type": "mc", "q": "Select the factor that ALL microbes require, regardless of their other preferences:", "opts": ["Ultraviolet radiation", "Neutral pH", "Alkaline pH", "Warm temperatures", "Source of bioelements"], "correct": 4, "exp": "pH, temperature, and oxygen needs vary enormously between species, but every microbe needs basic elements (carbon, nitrogen, hydrogen, oxygen, phosphorus, sulfur, etc.) to build cell parts and get energy. UV radiation is actually harmful to most microbes.", "terms": ["bioelements"], "src": "assignment"}, {"id": "c7_29", "ch": 7, "type": "mc", "q": "Nutrient molecules that contain the basic framework of carbon and hydrogen are called ______ nutrients.", "opts": ["Micro", "Organic", "Trace", "Inorganic"], "correct": 1, "exp": "Organic nutrients are built around a carbon-hydrogen backbone (carbohydrates, proteins, lipids, nucleic acids). Inorganic nutrients — water, metal ions, salts — lack that framework.", "src": "assignment"}, {"id": "c7_30", "ch": 7, "type": "tf", "q": "Purple and green sulfur bacteria get their energy from oxygenic photosynthesis.", "correct": false, "exp": "False — they perform anoxygenic photosynthesis. Instead of splitting water (like plants and cyanobacteria), they use hydrogen sulfide or other sulfur compounds as an electron donor, so no oxygen is released; sulfur granules are produced instead.", "src": "assignment"}, {"id": "c7_31", "ch": 7, "type": "tf", "q": "The majority of heterotrophic microorganisms are chemoheterotrophs, deriving both energy and carbon from organic compounds.", "correct": true, "exp": "True — most bacteria, fungi, and protozoa get both their energy and their carbon source from breaking down organic compounds, the same basic strategy humans use.", "src": "assignment"}, {"id": "c7_32", "ch": 7, "type": "tf", "q": "A true aerobe lacks the metabolic enzyme systems for using oxygen gas in respiration.", "correct": false, "exp": "False — this actually describes an obligate anaerobe. A true aerobe has the enzyme systems (catalase, superoxide dismutase) needed to use oxygen and detoxify its byproducts, and needs that oxygen to survive.", "src": "assignment"}, {"id": "c7_33", "ch": 7, "type": "mc", "q": "Obligate ______ live at low pH extremes and sometimes maintain the low pH by releasing strong acid.", "opts": ["Osmophiles", "Alkalinophiles", "Acidophiles", "Halophiles"], "correct": 2, "exp": "Obligate acidophiles need a low (acidic) pH to grow, and some (like Thiobacillus, which oxidizes sulfur into sulfuric acid) even help maintain that acidity themselves.", "src": "assignment"}, {"id": "c7_34", "ch": 7, "type": "mc", "q": "The general term used to denote a situation in which two organisms live together in a close partnership required by one or both members is:", "opts": ["Mutualism", "Symbiosis", "Synergy", "Antibiosis"], "correct": 1, "exp": "Symbiosis is the umbrella term for any close, long-term relationship between two species where at least one depends on it. Mutualism (both benefit), commensalism (one benefits, other unaffected), and parasitism (one benefits, other harmed) are all specific types of symbiosis — not synonyms for it.", "src": "assignment"}, {"id": "c7_35", "ch": 7, "type": "mc", "q": "Which best completes this sentence: ______ metabolize organic matter from dead organisms, while ______ require a live host.", "opts": ["Symbiotic microbes; saprobes", "Autotrophs; heterotrophs", "Saprobes; symbiotic microbes", "Chemoheterotrophs; photoheterotrophs"], "correct": 2, "exp": "Saprobes (decomposers) break down dead organic matter. Symbiotic microbes live in close relationship with a living host, whether that relationship is mutualistic, commensal, or parasitic.", "src": "assignment"}, {"id": "c7_36", "ch": 7, "type": "mc", "q": "Organisms referred to as obligate halophiles require at least a 9% salt concentration to grow, whereas ______ halophiles can adapt to a wide range of solute concentrations.", "opts": ["Osmotolerant", "Facultative", "Alkalinophile", "Acidophile"], "correct": 1, "exp": "This follows the same obligate-vs-facultative pattern as aerobes/anaerobes: obligate halophiles absolutely need high salt; facultative halophiles are flexible and can grow across a wide range of salt concentrations.", "src": "assignment"}, {"id": "c7_37", "ch": 7, "type": "fill", "q": "The use of concentrated salt or sugar solutions as a food preservative creates a ______ environment, which inhibits bacterial growth.", "answers": ["hypertonic"], "exp": "A hypertonic environment (high outside solute) pulls water out of bacterial cells by osmosis, shrinking and dehydrating them so they can't carry out normal metabolism — exactly why salted meats, jams, and pickles last so long.", "terms": ["hypertonic"], "src": "assignment"}, {"id": "c7_38", "ch": 7, "type": "mc", "q": "Which of the following is NOT one of the six core elements (CHNOPS) found in lipids, nucleic acids, and proteins?", "opts": ["Carbon", "Nitrogen", "Potassium", "Sulfur"], "correct": 2, "exp": "CHNOPS = Carbon, Hydrogen, Nitrogen, Oxygen, Phosphorus, Sulfur. Potassium (along with calcium and iron) is still an important bioelement for the cell, but it isn't part of the core building blocks of these macromolecules.", "terms": ["bioelements"], "src": "assignment"}, {"id": "c7_39", "ch": 7, "type": "match", "q": "Match each growth-curve phase to its description.", "items": ["Cells require a period of adjustment after being newly inoculated", "Population reaches its maximum growth rate", "Rate of cell death balances the rate of multiplication; population size stays roughly constant", "Population declines as cell death exceeds the rate of multiplication"], "rights": ["Lag phase", "Exponential growth phase", "Stationary growth phase", "Death phase"], "exp": "The four phases of the bacterial growth curve; stationary phase isn't 'no growth' — it's births balancing deaths as nutrients run low.", "terms": ["growth curve"], "src": "assignment"}, {"id": "c7_40", "ch": 7, "type": "tf", "q": "The direct cell count involves counting the number of cells in a sample microscopically.", "correct": true, "exp": "True — a direct microscopic count (e.g., using a Petroff-Hausser chamber) counts all visible cells, living and dead, unlike a viable plate count.", "src": "assignment"}, {"id": "c7_41", "ch": 7, "type": "mc", "q": "Lactobacilli are part of the natural microbiota found in the human vagina. They feed off glucose the host produces and ferment it to lactic acid, lowering vaginal pH to a level other, more harmful bacteria can't tolerate. This relationship is best described as:", "opts": ["Mutualism", "Parasitism", "Commensalism", "Amensalism", "Syntrophy"], "correct": 0, "exp": "Both sides benefit: Lactobacilli get a nutrient source, and the host is protected from pathogens by the lowered pH. That mutual benefit is what makes this mutualism rather than one-sided commensalism.", "src": "assignment"}, {"id": "d7_20", "ch": 7, "type": "discuss", "q": "Some microbes that cause severe periodontal (gum) disease are anaerobic. How can such microbes exist inside the mouth, given how often air passes through the oral cavity during talking, laughing, and breathing?", "model": "Not every spot in the mouth actually gets airflow. Anaerobic bacteria hide in deep places like the pockets between teeth and gums, or under thick layers of plaque. Aerobic bacteria living on top also use up the available oxygen, leaving little oxygen-free pockets underneath where anaerobes can grow.", "src": "assignment"}, {"id": "c7_42", "ch": 7, "type": "match", "q": "Match each extremophile type to its description.", "items": ["Lives in high-salt environments (e.g., the Dead Sea)", "Lives in extremely hot environments (e.g., Yellowstone's hot springs)", "Anaerobic; converts carbon dioxide and hydrogen into methane", "Lives in very cold conditions, including below freezing"], "rights": ["Halophile", "Hyperthermophile", "Methanogen", "Psychrophile"], "exp": "Word roots help here: 'halo' = salt, 'thermo' = heat, 'methano' = methane, 'psychro' = cold.", "src": "assignment"}, {"id": "c8_31", "ch": 8, "type": "mc", "q": "Ribozymes, unlike typical protein enzymes, are catalysts made of:", "opts": ["Protein", "Carbohydrate", "RNA", "Lipid"], "correct": 2, "exp": "Ribozymes are one of the few exceptions to 'enzymes are proteins' — they're catalytic RNA molecules. Decker's questions often test this distinction directly.", "src": "assignment"}, {"id": "d8_23", "ch": 8, "type": "discuss", "q": "Some microbes can only generate ATP via fermentation, with no functional electron transport chain. What are the metabolic consequences of being limited this way?", "model": "They only net about 2 ATP per glucose (versus ~30–38 via aerobic respiration), can't fully oxidize glucose down to CO2, and have to burn through sugar much faster to meet their energy needs. The leftover, only partially-oxidized products (like ethanol or lactic acid) get dumped as waste.", "src": "assignment"}, {"id": "d8_24", "ch": 8, "type": "discuss", "q": "What is the name for the coupling of ATP synthesis to the electron transport chain?", "model": "Oxidative phosphorylation (also called chemiosmotic coupling) — the proton motive force generated by the electron transport chain drives ATP synthase to phosphorylate ADP into ATP.", "terms": ["chemiosmosis"], "src": "assignment"}, {"id": "d8_25", "ch": 8, "type": "discuss", "q": "In fermentation, why is it important for the cell to consume NADH (turning it back into NAD+)?", "model": "Glycolysis needs a steady supply of NAD+ to keep running, but the cell only has a small, fixed amount. Fermentation regenerates NAD+ by dumping NADH's electrons onto pyruvate (forming lactic acid or alcohol), which keeps glycolysis going. That's the 'redox balance' being maintained.", "src": "assignment"}, {"id": "d8_26", "ch": 8, "type": "discuss", "q": "Besides making ATP, how else does a cell use glucose or its derivatives?", "model": "As building blocks: glucose-6-phosphate can feed the pentose phosphate pathway to make ribose for DNA/RNA, and pyruvate can be converted into building blocks for fatty acids and some amino acids.", "src": "assignment"}, {"id": "c8_32", "ch": 8, "type": "tf", "q": "Gut fermentation (auto-brewery) syndrome can only be caused by yeast, never bacteria.", "correct": false, "exp": "False — yeast (Saccharomyces, Candida) are the most common cause, but certain bacteria, like some Klebsiella pneumoniae strains, can also ferment sugar into alcohol in the gut.", "src": "assignment"}, {"id": "c8_33", "ch": 8, "type": "mc", "q": "Which of the following is NOT a goal of fermentation?", "opts": ["To recycle NADH back to NAD+ for continued glycolysis", "To release a small amount of ATP", "To produce between 2–38 ATPs per glucose", "To oxidize glucose in the absence of oxygen"], "correct": 2, "exp": "Fermentation only nets a small, fixed amount (2 ATP) — the 2–38 range describes aerobic respiration's much larger and more variable yield, not fermentation alone.", "src": "assignment"}, {"id": "c8_34", "ch": 8, "type": "mc", "q": "Which of these products is NOT made via microbial fermentation?", "opts": ["Alcoholic beverages", "High fructose corn syrup", "Bread", "Dairy products", "Vinegars"], "correct": 1, "exp": "HFCS is made by enzymatically converting corn starch into sugar, not through microbial fermentation — unlike alcohol, bread (yeast CO2), dairy (lactic acid bacteria), and vinegar (acetic acid bacteria).", "src": "assignment"}, {"id": "c8_35", "ch": 8, "type": "tf", "q": "Lactic acid fermentation only occurs in human muscle cells.", "correct": false, "exp": "False — lactic acid fermentation also happens in many bacteria, including the ones used to make yogurt and cheese.", "src": "assignment"}, {"id": "c8_36", "ch": 8, "type": "match", "q": "Match each event to the stage of aerobic respiration it belongs to.", "items": ["A six-carbon compound is split into two three-carbon compounds", "Four ATP are made via substrate-level phosphorylation (net 2, after 2 are spent)", "The cycle's starting reactant (oxaloacetate) is regenerated by the end of each turn", "Both NADH and FADH2 are produced", "Two ATP are made via substrate-level phosphorylation", "Oxygen is required as the final electron acceptor", "ATP is made via oxidative phosphorylation, yielding the bulk of the theoretical ~38 ATP total"], "rights": ["Glycolysis", "Glycolysis", "Krebs cycle", "Krebs cycle", "Krebs cycle", "Electron transport chain", "Electron transport chain"], "exp": "A classic gross-vs-net ATP trap: glycolysis makes 4 ATP but nets only 2 (2 are spent getting started); the Krebs cycle makes 2 ATP via substrate-level phosphorylation (not 4) — the ~38 ATP theoretical total belongs to the electron transport chain category.", "terms": ["ATP yield"], "src": "assignment"}, {"id": "c8_37", "ch": 8, "type": "tf", "q": "Vitamin deficiencies can prevent a complete holoenzyme from forming, because the key components of many coenzymes are vitamins.", "correct": true, "exp": "True — many vitamins are coenzyme precursors (niacin → NAD+, riboflavin → FAD). Without the vitamin, the coenzyme can't form, so the apoenzyme can't combine with it into the active holoenzyme.", "terms": ["enzyme vocab"], "src": "assignment"}, {"id": "c8_38", "ch": 8, "type": "mc", "q": "What form of enzyme inhibition occurs when the inhibitor molecule competes with the substrate for the binding site?", "opts": ["Repressive", "Noncompetitive", "Competitive", "Constitutive"], "correct": 2, "exp": "Competitive inhibitors resemble the substrate and compete for the same active site; adding more substrate can outcompete the inhibitor and restore activity.", "src": "assignment"}, {"id": "c8_39", "ch": 8, "type": "mc", "q": "ATP (adenosine triphosphate) is made up of a 5-carbon ribose sugar, adenine, and:", "opts": ["A chain of two phosphate groups", "A chain of three phosphate groups", "Guanine", "A chain of four phosphate groups"], "correct": 1, "exp": "ATP = Adenosine TriPhosphate — 'tri' tells you it's three phosphate groups, not two. Guanine is a different base, found in GTP, not ATP.", "src": "assignment"}, {"id": "c8_40", "ch": 8, "type": "mc", "q": "Which of the following is NOT one of the three core stages of aerobic respiration?", "opts": ["Glycolysis", "Krebs cycle", "Electron transport chain", "Beta oxidation"], "correct": 3, "exp": "Aerobic respiration = glycolysis + Krebs cycle + electron transport chain. Beta oxidation (fat breakdown) can feed acetyl-CoA into the Krebs cycle, but it isn't one of the three core stages; it's a separate feeder pathway.", "src": "assignment"}, {"id": "c8_41", "ch": 8, "type": "mc", "q": "Which concept describes the active transport of protons across a membrane to build the proton motive force that drives ATP synthesis?", "opts": ["Glycolysis", "Phosphorylation", "Chemiosmosis", "Photosynthesis"], "correct": 2, "exp": "Chemiosmosis is the process of pumping H+ across a membrane during electron transport to build the proton gradient, which then drives ATP synthase to generate ATP.", "terms": ["chemiosmosis"], "src": "assignment"}, {"id": "c8_42", "ch": 8, "type": "mc", "q": "Assuming a ratio of 3 ATP per NADH and 2 ATP per FADH2, the theoretical net ATP production during PROKARYOTIC aerobic respiration is:", "opts": ["36", "38", "2", "40"], "correct": 1, "exp": "Prokaryotes net the full theoretical 38 ATP, since there's no mitochondrial membrane to shuttle NADH across (so no energy is lost in transport). Eukaryotes typically net around 36, due to that shuttle cost.", "terms": ["ATP yield"], "src": "assignment"}, {"id": "c8_43", "ch": 8, "type": "tf", "q": "All anaerobic pathways (fermentation and anaerobic respiration) produce less ATP than aerobic respiration.", "correct": true, "exp": "True — fermentation skips the electron transport chain entirely (netting only 2 ATP), and anaerobic respiration uses final electron acceptors (like nitrate or sulfate) that are less efficient than oxygen, so both fall short of aerobic respiration's ATP yield.", "src": "assignment"}, {"id": "c8_44", "ch": 8, "type": "mc", "q": "Where does the CO2 released during the Krebs cycle's reactions go?", "opts": ["It diffuses out of the cell", "It donates electrons to the electron transport chain for ATP production", "It catalyzes a glycolytic reaction", "It enters a fermentation pathway to form ATP"], "correct": 0, "exp": "CO2 is just a waste byproduct of decarboxylation in the Krebs cycle — it doesn't participate further in the pathway, it just diffuses out as a gas.", "src": "assignment"}, {"id": "c8_45", "ch": 8, "type": "mc", "q": "For each glucose molecule that enters glycolysis, how many times does the Krebs cycle turn?", "opts": ["Two", "One", "Six", "Three"], "correct": 0, "exp": "Glucose splits into two pyruvate molecules during glycolysis, and each pyruvate is converted into one acetyl-CoA that enters the Krebs cycle — so the cycle turns twice per glucose.", "src": "assignment"}, {"id": "c8_46", "ch": 8, "type": "tf", "q": "In both prokaryotes and eukaryotes, the Krebs cycle takes place in the mitochondria.", "correct": false, "exp": "False — this is only true for eukaryotes. Prokaryotes don't have mitochondria at all, so their Krebs cycle (and glycolysis) takes place right in the cytoplasm instead.", "src": "assignment"}, {"id": "c8_47", "ch": 8, "type": "mc", "q": "For one turn of the Krebs cycle, how many NADH are produced?", "opts": ["Depends on if the process is aerobic or anaerobic", "Three", "Two", "Six"], "correct": 1, "exp": "One turn of the Krebs cycle produces three NADH (plus one FADH2 and one ATP via substrate-level phosphorylation).", "src": "assignment"}, {"id": "c8_48", "ch": 8, "type": "mc", "q": "In feedback inhibition, the inhibitor of a biochemical pathway is typically:", "opts": ["The substrate of the enzyme inhibited", "The product of the enzyme inhibited", "A substance produced toward the middle of the pathway", "The final product of the biochemical pathway", "A product of another biochemical pathway"], "correct": 3, "exp": "Once enough of a pathway's end product has accumulated, that final product loops back and inhibits an enzyme earlier in the pathway (usually the first committed step), preventing the cell from wasting resources overproducing something it already has enough of.", "src": "assignment"}, {"id": "c8_49", "ch": 8, "type": "tf", "q": "Whenever a molecule is oxidized, another molecule must be reduced.", "correct": true, "exp": "True — oxidation and reduction always occur together as a pair (redox reactions). When one molecule loses electrons (is oxidized), another molecule must gain them (is reduced).", "src": "assignment"}, {"id": "c8_50", "ch": 8, "type": "mc", "q": "The function of the enzyme ATP synthase is to:", "opts": ["Accept a proton from inside the cell membrane as it accepts electrons", "Utilize the energy of the proton motive force to convert ADP to ATP", "Produce reduced coenzymes like NADH", "Transfer hydrogen to the electron transport chain", "Shuttle electrons from NADH to a terminal electron acceptor"], "correct": 1, "exp": "As protons flow back across the membrane through ATP synthase, down the gradient built by the electron transport chain, that energy is harnessed to phosphorylate ADP into ATP.", "terms": ["proton motive force"], "src": "assignment"}, {"id": "c8_51", "ch": 8, "type": "match", "q": "Match each type of phosphorylation to its definition.", "items": ["Series of reactions involving electron transport and ATP synthase", "ATP formed by direct transfer of a phosphate group from a high-energy compound to ADP", "ATP formed by a light-driven electron transport mechanism"], "rights": ["Oxidative phosphorylation", "Substrate-level phosphorylation", "Photophosphorylation"], "exp": "Oxidative phosphorylation is the ETC + ATP synthase process used in cellular respiration; substrate-level phosphorylation is the direct transfer seen in glycolysis and the Krebs cycle (no ETC involved); photophosphorylation is the light-driven version used in photosynthesis.", "src": "assignment"}, {"id": "c8_52", "ch": 8, "type": "match", "q": "Match each metabolic process to where it takes place (note: bacteria lack mitochondria).", "items": ["Glycolysis (bacteria)", "Krebs cycle (bacteria)", "Pyruvate oxidation (bacteria)", "Electron transport (bacteria)", "Glycolysis (eukaryotes)", "Pyruvate oxidation & Krebs cycle (eukaryotes)", "Electron transport (eukaryotes)"], "rights": ["Bacterial cytoplasm", "Bacterial cytoplasm", "Bacterial plasma membrane", "Bacterial plasma membrane", "Eukaryotic cytoplasm", "Mitochondrial matrix", "Mitochondrial inner membrane"], "exp": "A classic trap: in bacteria, pyruvate oxidation is membrane-associated, like electron transport — NOT free-floating in the cytoplasm like the Krebs cycle enzymes. In eukaryotes, pyruvate oxidation and the Krebs cycle move into the mitochondrial matrix, and electron transport runs on the inner mitochondrial membrane.", "src": "assignment"}, {"id": "c8_53", "ch": 8, "type": "mc", "q": "Protons (H+) received from NADH, during electron transport:", "opts": ["Act as coenzymes", "Are passed along the electron transport chain along with the electrons", "Are the terminal electron acceptors", "Are pumped outside the cell"], "correct": 3, "exp": "The energy released as electrons move through the chain's carrier proteins is used to actively pump protons across the membrane to the outside of the cell, building the proton motive force — they aren't simply carried along with the electrons.", "terms": ["proton motive force"], "src": "assignment"}, {"id": "c8_54", "ch": 8, "type": "mc", "q": "Aerobic respiration and fermentation are similar in that they both:", "opts": ["Begin with the process of glycolysis and produce ATP and CO2", "Begin with the process of glycolysis and produce ATP and O2", "Begin with the process of the Krebs cycle and produce ATP and CO2", "Begin with the process of the Krebs cycle and produce ATP and O2", "Begin with the process of phosphorylation and produce ATP and O2"], "correct": 0, "exp": "Both pathways start with glycolysis and net ATP. Oxygen is never a product of either pathway — that rules out every option mentioning O2 as a product.", "src": "assignment"}, {"id": "lm_01", "ch": 7, "type": "tf", "q": "Bacteria have an average generation time of 24 hours.", "correct": false, "exp": "False -- most bacteria have generation times of 20 minutes to a few hours under good conditions; 24 hours is unusually slow (true for a few species like M. tuberculosis, but not the average).", "src": "lastminute"}, {"id": "lm_02", "ch": 7, "type": "mc", "q": "The term heterotroph refers to an organism that:", "opts": ["Does not need a carbon source", "Gets energy by oxidizing organic compounds", "Must obtain organic compounds for its carbon needs", "Gets energy from sunlight", "Uses CO2 for its carbon source"], "correct": 2, "exp": "Heterotroph is defined by CARBON SOURCE (must get organic carbon from the environment), not by energy source -- that's a separate axis (photo-/chemo-). A chemoheterotroph oxidizes organic compounds for energy too, but the definition itself is about carbon, which is why 'oxidizing organic compounds' isn't the best answer.", "src": "lastminute"}, {"id": "lm_03", "ch": 7, "type": "mc", "q": "An organism that can exist in both oxygen and oxygen-free environments is a(n):", "opts": ["Facultative anaerobe", "Aerobe", "Obligate aerobe", "Microaerophile"], "correct": 0, "exp": "Facultative anaerobes can switch metabolism to survive with or without oxygen.", "src": "lastminute"}, {"id": "lm_04", "ch": 7, "type": "mc", "q": "The term obligate refers to:", "opts": ["Existing in a very narrow niche", "Using light for energy production", "The ability to exist in a wide range of conditions", "Using oxygen for metabolism", "Using chemicals for energy production"], "correct": 0, "exp": "'Obligate' means required/restricted -- a narrow, fixed requirement (the opposite of 'facultative,' which means flexible).", "src": "lastminute"}, {"id": "lm_05", "ch": 7, "type": "mc", "q": "An organism with a temperature growth range of 45°C–60°C would be called a:", "opts": ["Thermophile", "Psychrophile", "Extremophile", "Thermogenic", "Facultative psychrophile"], "correct": 0, "exp": "45–60°C is the thermophile range (hot-loving). 'Extremophile' is too generic/broad to be the best specific answer here.", "src": "lastminute"}, {"id": "lm_06", "ch": 7, "type": "tf", "q": "The degree of turbidity (cloudiness) in a broth culture correlates to the amount of cell growth.", "correct": true, "exp": "True -- more cells scatter more light, so turbidity (measured by a spectrophotometer as optical density) is a quick, standard proxy for population size.", "src": "lastminute"}, {"id": "lm_07", "ch": 7, "type": "mc", "q": "The term facultative refers to:", "opts": ["Using light for energy production", "Using chemicals for energy production", "Using oxygen for metabolism", "Existing in a very narrow niche", "The ability to exist in a wide range of conditions"], "correct": 4, "exp": "'Facultative' means flexible/adaptable -- the organism CAN use a condition but doesn't strictly require it (the opposite of 'obligate').", "src": "lastminute"}, {"id": "lm_08", "ch": 7, "type": "fill", "q": "The movement of molecules from an area of high concentration to an area of low concentration is called:", "answers": ["diffusion"], "exp": "Diffusion is passive movement down a concentration gradient -- no energy or transport protein required (unlike active transport).", "src": "lastminute"}, {"id": "lm_09", "ch": 7, "type": "tf", "q": "The time for a freshly inoculated agar culture to develop visible colonies is principally governed by generation time.", "correct": false, "exp": "False -- there's usually a lag phase first (cells adjusting, not yet dividing) before generation time even starts to apply, so lag phase -- not generation time alone -- is what principally governs how long visible colonies take to appear.", "src": "lastminute"}, {"id": "lm_10", "ch": 7, "type": "mc", "q": "In the viable plate count method, each ______ represents one ______ from the sample.", "opts": ["Cell, cell", "Colony, cell", "Species, colony", "Generation, cell"], "correct": 1, "exp": "Each visible colony on the plate is assumed to have grown from a single original cell (or CFU, colony-forming unit) in the sample.", "src": "lastminute"}, {"id": "lm_11", "ch": 7, "type": "fill", "q": "The phase of the bacterial growth curve where growth slows and the rate of multiplication equals the rate of cell death is called the:", "answers": ["stationary phase", "stationary"], "exp": "In stationary phase, births and deaths balance out, so the population size plateaus rather than growing or shrinking.", "src": "lastminute"}, {"id": "lm_12", "ch": 7, "type": "mc", "q": "Freshwater bacteria suddenly moved into seawater would:", "opts": ["Now be in an isotonic solution", "Gain water as a result", "Shrivel as a result, now being in a hypertonic solution", "Now be in a hypotonic solution"], "correct": 2, "exp": "Seawater has a much higher solute concentration than the bacteria's cytoplasm, making it hypertonic to the cell -- water leaves the cell by osmosis, causing it to shrivel (plasmolyze).", "src": "lastminute"}, {"id": "lm_13", "ch": 7, "type": "mc", "q": "A new bacterial species is found in an acid pool, and it cannot be cultured in a pH 7 (neutral) medium. It would correctly be classified as a(n):", "opts": ["Facultative acidophile", "Obligate acidophile", "Facultative alkalinophile", "Obligate alkalinophile"], "correct": 1, "exp": "It REQUIRES low pH and fails to grow at neutral pH -- that strict requirement makes it an obligate (not facultative) acidophile.", "src": "lastminute"}, {"id": "lm_14", "ch": 7, "type": "mc", "q": "An organism that cannot grow without oxygen is a(n):", "opts": ["Obligate anaerobe", "Anaerobe", "Obligate aerobe", "Facultative anaerobe", "Microaerophile"], "correct": 2, "exp": "'Cannot grow WITHOUT oxygen' means oxygen is required -- that's the definition of an obligate (true) aerobe.", "src": "lastminute"}, {"id": "lm_15", "ch": 7, "type": "mc", "q": "A microbe shows no growth at 37°C or 50°C, but abundant growth at refrigeration temperature. This organism is a:", "opts": ["Halophile", "Psychrophile", "Anaerobe", "Mesophile"], "correct": 1, "exp": "Thriving specifically at refrigeration temperatures while failing at human-body and higher temperatures is the signature of a psychrophile (cold-loving organism).", "src": "lastminute"}, {"id": "lm_16", "ch": 7, "type": "fill", "q": "The phase of the bacterial growth curve showing the maximum rate of cell division is the:", "answers": ["exponential phase", "exponential", "log phase", "logarithmic phase", "exponential (log) phase"], "exp": "During exponential (log) phase, cells divide at their fastest, most consistent rate, with nutrients abundant and no limiting waste buildup yet.", "terms": ["growth curve"], "src": "lastminute"}, {"id": "lm_17", "ch": 7, "type": "fill", "q": "What type of location would best support the growth of a halophile?", "answers": ["salt lake", "a salt lake"], "exp": "Halophiles require high salt concentrations to survive -- a salt lake (or similarly salty environment, like the Dead Sea) is ideal.", "src": "lastminute"}, {"id": "lm_18", "ch": 8, "type": "fill", "q": "A holoenzyme is a combination of a protein (the apoenzyme) and one or more non-protein substances called:", "answers": ["cofactors", "cofactor", "coenzymes", "coenzyme"], "exp": "The apoenzyme (protein) plus its cofactor(s)/coenzyme(s) together form the complete, active holoenzyme.", "terms": ["enzyme vocab"], "src": "lastminute"}, {"id": "lm_19", "ch": 8, "type": "mc", "q": "Substrate-level phosphorylation occurs in both:", "opts": ["Krebs cycle and electron transport chain", "Glycolysis and Krebs cycle", "All of these choices are correct", "Photosynthesis and glycolysis", "Glycolysis and electron transport chain"], "correct": 1, "exp": "Substrate-level phosphorylation (direct phosphate transfer to ADP) happens in glycolysis and the Krebs cycle. The electron transport chain makes ATP a different way -- via oxidative phosphorylation/chemiosmosis, not substrate-level phosphorylation.", "src": "lastminute"}, {"id": "lm_20", "ch": 8, "type": "mc", "q": "Which would produce the most ATP?", "opts": ["E. coli growing in sealed (anaerobic) glucose broth for 48 hours", "E. coli growing in well-aerated (aerobic) glucose broth for 48 hours", "Both cultures produce the same amount of ATP", "This prediction cannot be made from the information provided"], "correct": 1, "exp": "With oxygen available, E. coli can run full aerobic respiration (~30-38 ATP/glucose) instead of being limited to fermentation (~2 ATP
