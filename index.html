/glucose) in the sealed, oxygen-free broth.", "src": "lastminute"}, {"id": "lm_21", "ch": 8, "type": "mc", "q": "Molecules A and B are similar in shape and size, and both compete to bond with the same enzyme. What process is being observed?", "opts": ["Active inhibition", "Competitive inhibition", "Allosteric inhibition", "Noncompetitive inhibition"], "correct": 1, "exp": "A look-alike molecule competing for the same binding site (the active site) is the definition of competitive inhibition.", "src": "lastminute"}, {"id": "lm_22", "ch": 8, "type": "mc", "q": "Which component of an enzyme binds to the substrate?", "opts": ["Substrate attachment site", "Allosteric site", "Induced fit site", "Active site"], "correct": 3, "exp": "The active site is where the substrate binds and the reaction is catalyzed. The allosteric site is a separate regulatory site (used in feedback inhibition), not where the substrate itself binds.", "src": "lastminute"}, {"id": "lm_23", "ch": 8, "type": "mc", "q": "What kind of enzymes are produced only when their specific substrate is present?", "opts": ["Constitutive enzymes", "Endoenzymes", "Induced enzymes", "Exoenzymes", "Conjugated enzymes"], "correct": 2, "exp": "Induced enzymes are only synthesized in response to their substrate being available -- an efficient, on-demand strategy (unlike constitutive enzymes, which are always made).", "src": "lastminute"}, {"id": "lm_24", "ch": 8, "type": "mc", "q": "In bacterial cells and eukaryotic microbes, the maximum theoretical ATP yield from complete glucose oxidation is:", "opts": ["38 ATP", "36 ATP", "24 ATP", "2 ATP", "30 ATP"], "correct": 0, "exp": "38 ATP is given here as the theoretical maximum for BOTH bacterial and eukaryotic cells. NOTE: this directly conflicts with an earlier app question that assumed eukaryotes net only ~36 ATP (due to NADH shuttle costs across the mitochondrial membrane) while prokaryotes net the full 38. Flagging this so it can be reconciled -- this source says no such distinction applies.", "terms": ["ATP yield"], "src": "lastminute"}, {"id": "lm_25", "ch": 8, "type": "fill", "q": "What is the net production of ATP when one glucose molecule is broken down by glycolysis alone, during bacterial fermentation?", "answers": ["2", "2 atp", "two"], "exp": "Glycolysis makes 4 ATP (gross) via substrate-level phosphorylation but spends 2 to get started, netting 2 ATP -- true whether the pathway continues into aerobic respiration or stops at fermentation.", "terms": ["ATP yield"], "src": "lastminute"}, {"id": "lm_26", "ch": 8, "type": "mc", "q": "Enzymes that are always present in a cell, regardless of how much substrate is around, are called:", "opts": ["Regulated enzymes", "Endoenzymes", "Axoenzymes", "Apoenzymes", "Constitutive enzymes"], "correct": 4, "exp": "Constitutive enzymes are made continuously at a steady rate -- the opposite of induced enzymes, which only appear when their substrate shows up.", "src": "lastminute"}, {"id": "lm_27", "ch": 8, "type": "mc", "q": "What metabolic process is shared between human muscle cells and bacterial cells when both are deprived of oxygen?", "opts": ["The electron transport chain", "Alcohol fermentation", "Mixed acid fermentation", "Lactic acid fermentation"], "correct": 3, "exp": "Human muscle cells and many bacteria (like the ones used to make yogurt) both fall back on lactic acid fermentation when oxygen runs out. Alcohol and mixed-acid fermentation are specific to certain microbes, not humans.", "src": "lastminute"}, {"id": "lm_28", "ch": 8, "type": "mc", "q": "Negative feedback inhibition is best described as:", "opts": ["Product binding to DNA, blocking enzyme transcription", "Substrate binding to DNA, blocking enzyme transcription", "Substrate binding to an enzyme's noncompetitive (allosteric) site", "Product binding to an enzyme's noncompetitive (allosteric) site"], "correct": 3, "exp": "The pathway's own end PRODUCT loops back and binds an allosteric (noncompetitive) site on an earlier enzyme, shutting the pathway down once enough product has accumulated -- it acts directly on the enzyme, not on DNA/transcription.", "src": "lastminute"}, {"id": "lm_29", "ch": 8, "type": "mc", "q": "Glycolysis:", "opts": ["Uses 2 ATP, produces 2 ATP, and is aerobic", "Uses 2 ATP, produces 4 ATP, and is aerobic", "Uses 2 ATP, produces 2 ATP, and is anaerobic", "Uses 2 ATP, produces 4 ATP, and is anaerobic"], "correct": 3, "exp": "Glycolysis spends 2 ATP to start and makes 4 (gross) via substrate-level phosphorylation, netting 2 -- and it doesn't require oxygen at all (that's why fermentation, which has no oxygen step, can still run on glycolysis alone).", "src": "lastminute"}, {"id": "lm_30", "ch": 8, "type": "fill", "q": "During which phase of cellular respiration is the majority of ATP formed?", "answers": ["oxidative phosphorylation", "electron transport chain", "etc"], "exp": "Oxidative phosphorylation (the electron transport chain + chemiosmosis + ATP synthase) generates the bulk of the ~30-38 ATP total -- far more than the small, direct substrate-level phosphorylation ATP made in glycolysis and the Krebs cycle.", "terms": ["ATP yield"], "src": "lastminute"}, {"id": "lm_31", "ch": 8, "type": "mc", "q": "What is the final electron acceptor during aerobic respiration?", "opts": ["Oxygen", "Nitrate", "FAD", "Cytochrome c", "Pyruvic acid"], "correct": 0, "exp": "Oxygen is the terminal electron acceptor at the end of the electron transport chain in aerobic respiration, combining with electrons and protons to form water.", "src": "lastminute"}, {"id": "lm_32", "ch": 8, "type": "mc", "q": "The term referring to all of the chemical reactions occurring within a cell is:", "opts": ["Redox reactions", "Phosphorylation", "Metabolism", "Catabolism", "Cellular respiration"], "correct": 2, "exp": "Metabolism is the umbrella term for every chemical reaction in the cell, including both catabolism (breaking down) and anabolism (building up).", "src": "lastminute"}, {"id": "lm_33", "ch": 8, "type": "mc", "q": "Enzymes that are secreted by a cell to catalyze reactions (like hydrolysis) OUTSIDE the cell are called:", "opts": ["Constitutive enzymes", "Exoenzymes", "Apoenzymes", "Regulated enzymes", "Endoenzymes"], "correct": 1, "exp": "Exoenzymes are exported out of the cell to break down large molecules in the environment (e.g., a fungus secreting cellulase); endoenzymes work inside the cell.", "src": "lastminute"}, {"id": "lm_34", "ch": 8, "type": "mc", "q": "All of the following pertain to glycolysis EXCEPT:", "opts": ["Occurs during fermentation", "Occurs without oxygen", "Ends with the formation of pyruvic acid", "Degrades glucose all the way to CO2 and H2O", "Involves the reduction of NAD to NADH"], "correct": 3, "exp": "Glycolysis only breaks glucose down to pyruvic acid -- it never produces CO2 or H2O. Full breakdown to CO2 and H2O requires the Krebs cycle and electron transport chain afterward.", "src": "lastminute"}, {"id": "lm_35", "ch": 8, "type": "mc", "q": "Which of the following is FALSE regarding anaerobic respiration?", "opts": ["It involves glycolysis", "It generates some ATP", "It uses the same final electron acceptor as aerobic respiration", "It utilizes an electron transport system"], "correct": 2, "exp": "This is the false statement -- anaerobic respiration still uses an electron transport chain, but with a DIFFERENT final electron acceptor (like nitrate or sulfate) instead of oxygen, which is what aerobic respiration uses.", "src": "lastminute"}, {"id": "lm_36", "ch": 1, "type": "mc", "q": "Disease-causing microorganisms are called:", "opts": ["Decomposers", "Prokaryotes", "Pathogens", "Eukaryotes", "Fermenters"], "correct": 2, "exp": "Pathogen is the general term for any disease-causing organism, regardless of whether it's prokaryotic or eukaryotic.", "src": "lastminute"}, {"id": "lm_37", "ch": 1, "type": "mc", "q": "The study of evolutionary relationships among organisms is called:", "opts": ["Biotechnology", "Genetics", "Recombinant DNA", "Phylogeny", "Taxonomy"], "correct": 3, "exp": "Phylogeny specifically studies evolutionary relatedness/lineage. Taxonomy is the broader classification system that increasingly uses phylogeny as its basis -- but phylogeny itself is the study of relatedness.", "terms": ["taxonomy"], "src": "lastminute"}, {"id": "lm_38", "ch": 5, "type": "mc", "q": "A single-celled eukaryote without a cell wall belongs to which kingdom?", "opts": ["Bacteria", "Protista", "Fungi", "Animalia", "Plantae"], "correct": 1, "exp": "Protista is the catch-all kingdom for eukaryotes that aren't plants, animals, or fungi -- including cell-wall-free protozoa. Fungi, by contrast, do have a cell wall.", "src": "lastminute"}, {"id": "lm_39", "ch": 1, "type": "mc", "q": "All microorganisms are best defined as organisms that:", "opts": ["Cause human disease", "Lack a cell nucleus", "Are infectious particles", "Are too small to be seen with the unaided eye", "Can only be found growing in laboratories"], "correct": 3, "exp": "The defining trait of a microorganism is simply being too small to see without magnification -- most microbes are harmless or beneficial, and many (like most protozoa and fungi) DO have a nucleus.", "src": "lastminute"}, {"id": "lm_40", "ch": 1, "type": "mc", "q": "Which activity is an example of biotechnology?", "opts": ["Bacteria in soil secrete an antibiotic to kill competitors", "A microbiologist uses a microscope to study bacteria", "Humans use yeast to make beer and wine", "Mycobacterium tuberculosis causes tuberculosis in the lungs", "Public health officials monitor diseases in a community"], "correct": 2, "exp": "Biotechnology is any human use of organisms/their products to make a useful product -- brewing with yeast is one of the oldest examples. The others are natural microbial behavior, basic research, pathogenesis, and epidemiology, not biotechnology.", "src": "lastminute"}, {"id": "lm_41", "ch": 5, "type": "mc", "q": "In Whittaker's taxonomic system, which kingdom includes protozoans and algae?", "opts": ["Mycetae", "Protista", "Bacteria", "Animalia", "Plantae"], "correct": 1, "exp": "Whittaker's five-kingdom system groups protozoans and algae together in Kingdom Protista.", "src": "lastminute"}, {"id": "lm_42", "ch": 4, "type": "mc", "q": "All of the following are correct about prokaryotes EXCEPT:", "opts": ["They are smaller than eukaryotes", "They lack a nucleus", "They are less complex than eukaryotes", "They have organelles", "They are found nearly everywhere"], "correct": 3, "exp": "Prokaryotes lack membrane-bound organelles -- that's one of their defining features, distinguishing them from eukaryotes.", "src": "lastminute"}, {"id": "lm_43", "ch": 1, "type": "tf", "q": "Within the Woese-Fox three-domain system, the three domains are Bacteria, Protista, and Eukarya.", "correct": false, "exp": "False -- the three domains are Bacteria, Archaea, and Eukarya. Protista is a eukaryotic KINGDOM (within Domain Eukarya), not one of the three domains itself.", "src": "lastminute"}, {"id": "lm_44", "ch": 1, "type": "mc", "q": "When humans deliberately manipulate the genes of microorganisms, the process is called:", "opts": ["Bioremediation", "Genetic engineering", "Epidemiology", "Immunology", "Taxonomy"], "correct": 1, "exp": "Genetic engineering (recombinant DNA technology) is the deliberate alteration of an organism's genes.", "src": "lastminute"}, {"id": "lm_45", "ch": 4, "type": "mc", "q": "Peptidoglycan is a unique macromolecule that composes the bacterial:", "opts": ["Slime layers", "Capsules", "Inclusions", "Cell membranes", "Cell walls"], "correct": 4, "exp": "Peptidoglycan is the structural backbone of the bacterial cell wall -- not the membrane, capsule, slime layer, or internal inclusions.", "src": "lastminute"}, {"id": "lm_46", "ch": 4, "type": "mc", "q": "Which term is NOT used to describe bacterial cell SHAPES?", "opts": ["Tetrad", "Coccus", "Rod", "Spirochete", "Vibrio"], "correct": 0, "exp": "Tetrad describes an ARRANGEMENT (four cells grouped in a square), not an individual cell shape. Coccus, rod, spirochete, and vibrio are all shape terms.", "src": "lastminute"}, {"id": "lm_47", "ch": 4, "type": "mc", "q": "All bacterial cells have:", "opts": ["Flagella", "Endospores", "Fimbriae", "Capsules", "A chromosome"], "correct": 4, "exp": "Every bacterial cell has a chromosome (its essential DNA). Flagella, endospores, fimbriae, and capsules are all present only in some species.", "src": "lastminute"}, {"id": "lm_48", "ch": 4, "type": "mc", "q": "The function of bacterial endospores is:", "opts": ["For reproduction and growth", "To provide sites for photosynthesis", "For protection of genetic material during harsh conditions", "The storage of excess cell materials", "To convert gaseous nitrogen into a usable form for plants"], "correct": 2, "exp": "Endospores are a dormant survival structure that protects the cell's DNA through extreme heat, drying, radiation, and chemicals -- not a means of reproduction.", "src": "lastminute"}, {"id": "lm_49", "ch": 4, "type": "mc", "q": "Short, numerous, bristle-like appendages used for adhering to surfaces are called:", "opts": ["Fimbriae", "Sex pili", "Cilia", "Flagella", "Periplasmic flagella (axial filaments)"], "correct": 0, "exp": "Fimbriae are the short, numerous attachment structures. Pili are longer and used for conjugation; cilia are eukaryotic; axial filaments are specific to spirochete motility.", "src": "lastminute"}, {"id": "lm_50", "ch": 4, "type": "mc", "q": "Endospores are:", "opts": ["Resistant to destruction by radiation", "All of these choices are correct", "Living structures", "Metabolically inactive", "Resistant to heat and chemical destruction"], "correct": 1, "exp": "All of these are true at once: endospores remain alive (viable, capable of germinating) while being metabolically inactive (dormant), and are highly resistant to heat, chemicals, and radiation.", "src": "lastminute"}, {"id": "lm_51", "ch": 4 // ======================= STATS / DIAGNOSTICS =======================
function computeStats(){
  var ids = Object.keys(progress);
  var totalAnswered=0, totalCorrect=0;
  var byCh = {}; CHAPTERS.forEach(function(c){ byCh[c]={a:0,c:0,qTotal:0}; });
  QUESTIONS.forEach(function(q){ if(byCh[q.ch]) byCh[q.ch].qTotal++; });
  var flagged = [];
  ids.forEach(function(id){
    var rec = progress[id]; if(!rec) return;
    var answered = (rec.correctCount||0)+(rec.wrongCount||0);
    totalAnswered += answered; totalCorrect += (rec.correctCount||0);
    var q = QUESTIONS.find(function(x){return x.id===id;});
    if(q && byCh[q.ch]){ byCh[q.ch].a += answered; byCh[q.ch].c += (rec.correctCount||0); }
    if(rec.flag) flagged.push(id);
  });
  return {
    totalAnswered:totalAnswered, totalCorrect:totalCorrect,
    accuracy: totalAnswered? Math.round(100*totalCorrect/totalAnswered):0,
    byChapter: byCh, flaggedIds: flagged, flaggedCount: flagged.length,
    totalQuestions: QUESTIONS.length, updatedAt: Date.now()
  };
}
function heatColor(acc, answered){
  if(answered===0) return "var(--border)";
  if(acc>=85) return "var(--good)";
  if(acc>=65) return "#84cc16";
  if(acc>=45) return "var(--warn)";
  return "var(--bad)";
}
function classifyAttempt(rec, correct, confidence){
  if(correct) return confidence==="high" ? "solid" : "fragile";
  if(confidence==="high") return "overconfident";
  if((rec.wrongCount||0) >= 1){
    return (rec.correctCount||0) > 0 ? "slipped" : "recurring";
  }
  return "new_gap";
}
var DIAG_LABEL = {
  solid:"Solid -- confident and correct.",
  fragile:"Fragile -- right, but you weren't sure. Worth a second look.",
  overconfident:"Overconfident -- you were sure, but it's wrong. These are the most dangerous gaps for exam day.",
  slipped:"Slipped -- you had this before and missed it now. Knowledge may be destabilizing; revisit the concept.",
  recurring:"Recurring miss -- you've missed this one more than once. High priority to review.",
  new_gap:"New gap -- first miss, totally normal. Now it's flagged for review."
};

function recordAnswer(q, isCorrect, confidence){
  var rec = progress[q.id] || {box:1, correctCount:0, wrongCount:0, lastSeen:0, flag:false};
  var cls = classifyAttempt(rec, isCorrect, confidence);
  rec.lastSeen = Date.now();
  rec.lastClass = cls;
  if(isCorrect){
    rec.correctCount = (rec.correctCount||0)+1;
    rec.box = Math.min((rec.box||1)+1, 4);
    rec.flag = (cls==="fragile");
    streak++;
  } else {
    rec.wrongCount = (rec.wrongCount||0)+1;
    rec.box = 1;
    rec.flag = true;
    streak = 0;
  }
  saveStreak();
  progress[q.id] = rec;
  saveProgress();
  syncQuestionDoc(q, rec);
  pushSummary();
  if(settings.sound){ isCorrect ? playCorrectChime() : playWrongTone(); }
  if(isCorrect && streak>0 && streak%5===0){ triggerConfetti(); }
  return cls;
}

var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ var AC = window.AudioContext||window.webkitAudioContext; audioCtx = new AC(); }catch(e){}
  }
  return audioCtx;
}
function playTone(freq, start, dur, vol){
  try{
    var ctx = getAudioCtx(); if(!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.type = "sine";
    o.connect(g); g.connect(ctx.destination);
    var t0 = ctx.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol||0.15, t0+0.02);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}

function playWrongTone(){ playTone(180,0,0.25,0.12); }

function triggerConfetti(){
  var root = document.getElementById("confetti-root");
  var colors = ["#2563eb","#15803d","#f59e0b","#db2777","#7c3aed"];
  for(var i=0;i<24;i++){
    var p = document.createElement("div");
    p.className="confetti-piece";
    p.style.left = (Math.random()*100)+"vw";
    p.style.background = colors[i%colors.length];
    p.style.borderRadius = (Math.random()>0.5?"50%":"2px");
    p.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    root.appendChild(p);
    (function(el){
      var dur = 1200+Math.random()*900;
      var dx = (Math.random()-0.5)*160;
      try{
        if(el.animate){
          el.animate([
            { transform: el.style.transform, top:"-10px", opacity:1 },
            { transform: "translate("+dx+"px, 100vh) rotate(720deg)", opacity:0.9 }
          ], { duration: dur, easing:"cubic-bezier(.2,.6,.6,1)" });
        } else {
          el.style.transition = "top "+dur+"ms linear, opacity "+dur+"ms linear";
          setTimeout(function(){ try{ el.style.top="100vh"; el.style.opacity="0.2"; }catch(e){} }, 10);
        }
      }catch(e){}
      setTimeout(function(){ try{ el.remove(); }catch(e){} }, dur+50);
    })(p);
  }
}

// ======================= SESSION LOGIC =======================
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function boxOf(id){ return (progress[id]&&progress[id].box)||1; }
function isQuizLike(q){ return q.type!=="discuss"; }

function weightedUniqueQueue(pool, cap){
  var weighted = [];
  pool.forEach(function(q){
    var w = Math.max(5-boxOf(q.id),1);
    for(var i=0;i<w;i++) weighted.push(q);
  });
  shuffle(weighted);
  var seen={}, queue=[];
  for(var i=0;i<weighted.length;i++){
    var q=weighted[i];
    if(!seen[q.id]){ seen[q.id]=true; queue.push(q); if(cap && queue.length>=cap) break; }
  }
  if((!cap || queue.length<cap) && queue.length < pool.length){
    pool.forEach(function(q){ if(!seen[q.id]){ seen[q.id]=true; queue.push(q); } });
  }
  return queue;
}

function buildSession(filterFn, count){
  var pool = QUESTIONS.filter(filterFn);
  return weightedUniqueQueue(pool, count).slice(0, count);
}

// Pulls roughly evenly from every chapter in the filtered pool (round-robin),
// so a chapter with more questions (e.g. after new additions) doesn't crowd
// out the others in Mixed practice / Speed round -- each still weighted
// toward whatever that chapter's own missed questions are (Leitner boxes).
function buildBalancedSession(filterFn, count){
  var pool = QUESTIONS.filter(filterFn);
  var byChapter = {};
  CHAPTERS.forEach(function(ch){ byChapter[ch] = weightedUniqueQueue(pool.filter(function(q){return q.ch===ch;})); });
  var order = shuffle(CHAPTERS.slice());
  var queue = [], idx = {}; order.forEach(function(ch){ idx[ch]=0; });
  var remaining = true;
  while(queue.length < count && remaining){
    remaining = false;
    for(var i=0;i<order.length;i++){
      var ch = order[i];
      if(idx[ch] < byChapter[ch].length){
        queue.push(byChapter[ch][idx[ch]]); idx[ch]++;
        remaining = true;
        if(queue.length>=count) break;
      }
    }
  }
  return queue;
}

function copyText(t){ try{ navigator.clipboard.writeText(t); alert("Copied."); }catch(e){ alert("Could not copy automatically -- select and copy manually."); } }
function downloadText(filename, text){
  try{
    var blob = new Blob([text], {type:"text/plain"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(e){ alert("Download failed in this browser."); }
}
function missedAsText(){
  var s = computeStats();

    var qs = ids.map(function(id){return QUESTIONS.find(function(q){return q.id===id;});}).filter(function(q){return q&&q.ch===ch;});
    if(!qs.length) return;
    lines.push("=== Chapter "+ch+" ===");
    qs.forEach(function(q){
      lines.push("Q: "+q.q);
      if(q.type==="mc") lines.push("A: "+q.opts[q.correct]);
      else if(q.type==="tf") lines.push("A: "+(q.correct?"True":"False"));
      else if(q.type==="fill") lines.push("A: "+q.answers[0]);
      else if(q.type==="match"||q.type==="diagram") lines.push("A: "+q.items.map(function(it,i){return it+" -> "+q.rights[i];}).join("; "));
      else if(q.type==="discuss") lines.push("A: "+q.model);
      lines.push("Why: "+(q.exp||q.model||""));
      lines.push("");

  });
  return lines.join("\n");

function importProgress(evt){
  var file = evt.target.files && evt.target.files[0];

  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(data && data.progress){
        progress = data.progress; saveProgress();
        if(data.settings){ settings = data.settings; saveSettings(); }
        if(typeof data.streak==="number"){ streak = data.streak; saveStreak(); }
        alert("Progress imported.");
        go("home");
      } else { alert("That file doesn't look like a BIO 207 progress backup."); }
    }catch(e){ alert("Couldn't read that file."); }
  };
  reader.readAsText(file);
}

}

// ======================= RENDER: QUIZ =======================
function optLetter(i){ return String.fromCharCode(97+i); }

function renderQuiz(){
  if(session.idx >= session.queue.length){ clearInterval(session.timer); return renderDone(); }
  var q = session.queue[session.idx];
  var html = "";
  html += "<div class=\"progresstop\"><span><button class=\"iconbtn\" style=\"padding:3px 8px;margin-right:8px;\" onclick=\"exitSession()\">\u2039 Exit</button>"+session.mode+(session.speed?" \u26a1":"")+"</span><span>Question "+(session.idx+1)+" / "+session.queue.length+"</span></div>";
  if(session.speed){ html += "<div class=\"timerbar\"><div class=\"timerfill\" id=\"timerFill\" style=\"width:100%;\"></div></div>"; }

  html += "<div class=\"card\">";
  html += "<span class=\"chip\">Ch "+q.ch+"</span>";
  if(q.src==="quiz1") html += "<span class=\"chip tag-warn\">Quiz 1</span>";
  else if(q.src==="quiz2") html += "<span class=\"chip tag-warn\">Quiz 2</span>";
  else if(q.src==="chapter") html += "<span class=\"chip\">End of chapter</span>";
  else if(q.src==="assignment") html += "<span class=\"chip\">Assignment</span>";
  else if(q.src==="lastminute") html += "<span class=\"chip tag-warn\">Last-Minute</span>";
  html += "<button class=\"iconbtn\" style=\"float:right;\" onclick=\"speakQuestion(QUESTIONS.find(function(x){return x.id==='"+q.id+"';}))\">\ud83d\udd0a Read aloud</button>";
  html += "<div class=\"qtext\" style=\"margin-top:10px;clear:both;\">"+escapeHtml(q.q)+"</div>";

  if(q.terms && q.terms.length){
    q.terms.forEach(function(t){ html += "<button class=\"chip\" onclick=\"openGlossary('"+t.replace(/'/g,"\\'")+"')\">\u2139 "+t+"</button>"; });
  }

  if(q.type==="diagram"){
    html += "<div onclick=\"openZoom('"+q.id+"')\">"+q.svg.replace("<svg ","<svg class=\\\"diagram\\\" ")+"</div><div class=\"small\">Tap the diagram to zoom.</div>";
  }

  if(q.type==="mc"){
    q.opts.forEach(function(opt,i){
      var cls="opt";
      if(current.checked){ if(i===q.correct) cls+=" correct"; else if(i===current.selectedOpt) cls+=" incorrect"; }
      else if(i===current.selectedOpt) cls+=" selected";
      html += "<div class=\""+cls+"\" onclick=\"selectOpt("+i+")\">"+optLetter(i)+". "+escapeHtml(opt)+"</div>";
    });
  } else if(q.type==="tf"){
    [true,false].forEach(function(val){
      var label = val?"True":"False"; var cls="opt";
      if(current.checked){ if(val===q.correct) cls+=" correct"; else if(val===current.tfSelected) cls+=" incorrect"; }
      else if(val===current.tfSelected) cls+=" selected";
      html += "<div class=\""+cls+"\" onclick=\"selectTf("+val+")\">"+label+"</div>";
    });
  } else if(q.type==="fill"){
    html += "<input type=\"text\" id=\"fillInput\" placeholder=\"Type your answer\" value=\""+(current.fillVal||"").replace(/\"/g,"")+"\" oninput=\"current.fillVal=this.value\" "+(current.checked?"disabled":"")+">";
    if(current.checked){ html += "<div class=\"feedback "+(current.wasCorrect?"good":"bad")+"\">"+(current.wasCorrect?"Correct.":"Correct answer: "+q.answers[0])+"</div>"; }
    if(current.err) html += "<div class=\"err\">Enter an answer first.</div>";
  } else if(q.type==="match" || q.type==="diagram"){
    if(!current.matchSel) current.matchSel = new Array(q.items.length).fill("");
    var pool = shuffle(Array.from(new Set(q.rights)));
    q.items.forEach(function(item,i){
      html += "<div class=\"matchrow\"><div class=\"mleft\">"+(i+1)+". "+escapeHtml(item)+"</div>";
      html += "<select onchange=\"current.matchSel["+i+"]=this.value\" "+(current.checked?"disabled":"")+"><option value=\"\">(choose)</option>";
      pool.forEach(function(opt){
        html += "<option "+(current.matchSel[i]===opt?"selected":"")+" value=\""+opt.replace(/\"/g,"")+"\">"+escapeHtml(opt)+"</option>";
      });
      html += "</select>";
      if(current.checked){
        var ok = current.matchSel[i]===q.rights[i];
        html += "<div class=\"small\" style=\"color:"+(ok?"var(--good)":"var(--bad)")+";margin-top:4px;\">"+(ok?"Correct":"Correct: "+q.rights[i])+"</div>";
      }
      html += "</div>";
    });
    if(current.err) html += "<div class=\"err\">Answer every row first.</div>";
  } else if(q.type==="discuss"){
    if(!current.revealedDiscuss){
      html += "<button class=\"btn\" onclick=\"current.revealedDiscuss=true;render();\">Show model answer</button>";
    } else {
      html += "<div class=\"feedback good\" style=\"margin-bottom:10px;\">"+escapeHtml(q.model)+"</div>";
      if(!current.checked){
        html += "<p class=\"small\">How did you do, honestly?</p>";
        html += "<div class=\"row\"><button class=\"btn btn-sm\" onclick=\"discussResult(true)\">I got the gist</button><button class=\"btn btn-sm\" onclick=\"discussResult(false)\">I need to review this</button></div>";
      }
    }
  }

  if(q.type!=="discuss"){
    if(!current.checked){
      html += "<div class=\"confband\">";
      ["low","med","high"].forEach(function(c){
        var label = c==="low"?"Not sure":c==="med"?"Somewhat sure":"Confident";
        html += "<div class=\"confbtn "+(current.confidence===c?"selected":"")+"\" onclick=\"current.confidence='"+c+"';render();\">"+label+"</div>";
      });
      html += "</div>";
    }
  }

  if(current.checked){
    html += "<div class=\"feedback "+(current.wasCorrect?"good":"bad")+"\" style=\"margin-top:12px;\">"+(current.wasCorrect?"\u2713 Correct. ":"\u2717 Not quite. ")+escapeHtml(q.exp||"")+"</div>";
    if(current.cls){ html += "<div class=\"feedback warn\">"+DIAG_LABEL[current.cls]+"</div>"; }
  }
  html += "</div>";

  html += "<div class=\"footerbtn\">";
  if(q.type==="discuss"){
    if(current.checked){ html += "<button class=\"btn btn-primary\" onclick=\"nextQuestion()\">"+(session.idx+1<session.queue.length?"Next question":"See results")+"</button>"; }
  } else if(!current.checked){
    html += "<button class=\"btn btn-primary\" onclick=\"checkAnswer()\">Check answer</button>";
  } else {
    html += "<button class=\"btn btn-primary\" onclick=\"nextQuestion()\">"+(session.idx+1<session.queue.length?"Next question":"See results")+"</button>";
  }
  html += "</div>";
  return html;
}

function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function selectOpt(i){ if(current.checked) return; current.selectedOpt=i; current.err=false; render(); }
function selectTf(v){ if(current.checked) return; current.tfSelected=v; current.err=false; render(); }

function discussResult(gotIt){
  var q = session.queue[session.idx];
  var rec = progress[q.id] || {box:1,correctCount:0,wrongCount:0,lastSeen:0,flag:false};
  var cls = classifyAttempt(rec, gotIt, "med");
  current.checked = true; current.wasCorrect = gotIt; current.cls = cls;
  if(gotIt) session.correct++;
  recordAnswer(q, gotIt, "med");
  render();
}

function checkAnswer(timedOut){
  var q = session.queue[session.idx];
  if(!timedOut && !current.confidence){ current.err=true; render(); return; }
  var conf = current.confidence || "low";
  var isCorrect = false;
  if(q.type==="mc"){
    if(current.selectedOpt===null){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = current.selectedOpt===q.correct;
  } else if(q.type==="tf"){
    if(current.tfSelected===null){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = current.tfSelected===q.correct;
  } else if(q.type==="fill"){
    var val=(current.fillVal||"").trim();
    if(!val){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = q.answers.some(function(a){return a.toLowerCase()===val.toLowerCase();});
  } else if(q.type==="match" || q.type==="diagram"){
    if(!current.matchSel || current.matchSel.some(function(v){return !v;})){
      if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; }
    } else {
      isCorrect = q.items.every(function(it,i){ return current.matchSel[i]===q.rights[i]; });
    }
  }
  clearInterval(session.timer);
  current.checked=true; current.wasCorrect=isCorrect; current.err=false;
  if(isCorrect) session.correct++;
  current.cls = recordAnswer(q, isCorrect, conf);
  render();
}

function exitSession(){ clearInterval(session.timer); go("home"); }

function nextQuestion(){
  session.idx++;
  resetCurrent();
  if(session.idx >= session.queue.length){ clearInterval(session.timer); view="done"; }
  render();
  if(session.speed && session.idx < session.queue.length && view==="quiz") armTimer();
}

function renderDone(){
  var html = "<h1>Session complete</h1><div class=\"card\"><div class=\"statgrid\">";
  html += "<div class=\"stat\"><div class=\"num\">"+session.correct+" / "+session.queue.length+"</div><div class=\"lab\">this session</div></div>";
  var s = computeStats();
  html += "<div class=\"stat\"><div class=\"num\">"+s.accuracy+"%</div><div class=\"lab\">overall accuracy</div></div>";
  html += "</div></div>";
  html += "<button class=\"btn btn-primary\" onclick=\"go('home')\">Back to home</button>";
  return html;
}

// ======================= MODALS: GLOSSARY POPOVER + IMAGE ZOOM + TUTORIAL =======================
function openGlossary(term){ modal = {type:"glossary", term:term}; render(); }
function openZoom(qid){ var q=QUESTIONS.find(function(x){return x.id===qid;}); modal={type:"zoom", svg:q.svg}; render(); }
function closeModal(){
  var wasTutorial = modal && modal.type==="tutorial";
  modal=null;
  if(wasTutorial){ settings.seenTutorial=true; saveSettings(); }
  render();
}

var TUTORIAL_STEPS = [
  "Welcome! This app has 248 practice questions across Chapters 1, 4, 5, 7, and 8 -- multiple choice, true/false, fill-in, matching, labeling diagrams, and discussion review.",
  "After each answer, rate your confidence. It's not just right/wrong -- being confident and wrong gets flagged as your highest-priority gap.",
  "Check Weak Areas anytime for a color-coded heat-map by chapter, plus exactly which questions keep tripping you up.",
  "Use the Study Plan Builder to turn your days-until-exam and available hours into a session-by-session plan.",
  "Everything saves automatically on this device. Export a backup file anytime from Settings, or download your missed questions as text.",
  "Tip: tap the theme icon (top-right) to cycle Auto/Light/Dark, and use arrow keys + Enter to answer hands-free."
];
function openTutorial(){ modal = {type:"tutorial", step:0}; render(); }
function replayTutorial(){ openTutorial(); }
function tutorialNext(){
  if(modal.step < TUTORIAL_STEPS.length-1){ modal.step++; render(); }
  else { closeModal(); }
}
function tutorialPrev(){ if(modal.step>0){ modal.step--; render(); } }

function renderModal(){
  var old = document.getElementById("modalRoot");
  if(old) old.remove();
  var div = document.createElement("div");
  div.id = "modalRoot";
  div.className = "modal-overlay";
  div.onclick = function(e){ if(e.target===div && modal.type!=="tutorial") closeModal(); };
  var box = document.createElement("div");
  box.className = "modal-box";
  if(modal.type==="glossary"){
    box.innerHTML = "<h2>"+modal.term+"</h2><p>"+(GLOSSARY[modal.term]||"No definition found.")+"</p><button class=\"btn btn-primary\" onclick=\"closeModal()\">Close</button>";
  } else if(modal.type==="zoom"){
    box.innerHTML = modal.svg.replace("<svg ","<svg style=\\\"width:100%;height:auto;\\\" ") + "<button class=\"btn btn-primary\" style=\"margin-top:10px;\" onclick=\"closeModal()\">Close</button>";
  } else if(modal.type==="tutorial"){
    var i = modal.step;
    var dots = "<div class=\"tutorial-dots\">"+TUTORIAL_STEPS.map(function(_,idx){ return "<div class=\"tutorial-dot"+(idx===i?" active":"")+"\"></div>"; }).join("")+"</div>";
    var nav = "<div class=\"row\" style=\"margin-top:14px;\">";
    if(i>0) nav += "<button class=\"iconbtn\" onclick=\"tutorialPrev()\">Back</button>";
    nav += "<button class=\"btn btn-primary\" style=\"flex:1;margin-bottom:0;\" onclick=\"tutorialNext()\">"+(i<TUTORIAL_STEPS.length-1?"Next":"Let's go")+"</button>";
    nav += "<button class=\"iconbtn\" onclick=\"closeModal()\">Skip</button>";
    nav += "</div>";
    box.innerHTML = "<h2>Quick tour ("+(i+1)+"/"+TUTORIAL_STEPS.length+")</h2><p>"+TUTORIAL_STEPS[i]+"</p>"+dots+nav;
  }
  div.appendChild(box);
  document.body.appendChild(div);
}

// ======================= KEYBOARD SHORTCUTS =======================
function handleKey(e){
  if(modal){
    if(e.key==="Escape"){ closeModal(); return; }
    if(modal.type==="tutorial"){
      if(e.key==="ArrowRight"||e.key==="Enter"){ tutorialNext(); e.preventDefault(); }
      else if(e.key==="ArrowLeft"){ tutorialPrev(); e.preventDefault(); }
    }
    return;
  }
  if(view!=="quiz") return;
  var q = session.queue[session.idx]; if(!q) return;
  var tag = (e.target && e.target.tagName) || "";
  var inField = (tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA");

  if(q.type==="discuss"){
    if(!current.revealedDiscuss){
      if(e.key==="Enter"){ current.revealedDiscuss=true; render(); e.preventDefault(); }
    } else if(!current.checked){
      if(e.key==="y"||e.key==="Y"||e.key==="1"){ discussResult(true); e.preventDefault(); }
      else if(e.key==="n"||e.key==="N"||e.key==="2"){ discussResult(false); e.preventDefault(); }
    } else if(e.key==="Enter"||e.key===" "){ nextQuestion(); e.preventDefault(); }
    return;
  }

  if(current.checked){
    if(e.key==="Enter"||e.key===" "){ nextQuestion(); e.preventDefault(); }
    return;
  }

  if(q.type==="mc" && !inField){
    var n = parseInt(e.key,10);
    if(!isNaN(n) && n>=1 && n<=q.opts.length){ selectOpt(n-1); e.preventDefault(); return; }
    var letterIdx = "abcdefgh".indexOf((e.key||"").toLowerCase());
    if(letterIdx>=0 && letterIdx<q.opts.length){ selectOpt(letterIdx); e.preventDefault(); return; }
  }
  if(q.type==="tf" && !inField){
    if(e.key==="t"||e.key==="T"){ selectTf(true); e.preventDefault(); return; }
    if(e.key==="f"||e.key==="F"){ selectTf(false); e.preventDefault(); return; }
  }
  if(q.type==="mc"||q.type==="tf"){
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      var order=["low","med","high"];
      var idx = order.indexOf(current.confidence);
      if(idx===-1) idx = e.key==="ArrowRight" ? -1 : order.length;
      idx = e.key==="ArrowRight" ? Math.min(order.length-1, idx+1) : Math.max(0, idx-1);
      current.confidence = order[idx];
      render(); e.preventDefault(); return;
    }
  }
  if(e.key==="Enter"){ checkAnswer(); e.preventDefault(); }
}
try{ document.addEventListener("keydown", handleKey); }catch(e){}

// ======================= SWIPE GESTURES =======================
var touchStartX=null, touchStartY=null;
function onTouchStart(e){
  if(!e.touches || !e.touches.length) return;
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}
function onTouchEnd(e){
  if(touchStartX===null) return;
  var t = (e.changedTouches && e.changedTouches[0]) || null;
  var endX = t ? t.clientX : touchStartX;
  var endY = t ? t.clientY : touchStartY;
  var dx = endX-touchStartX, dy = endY-touchStartY;
  touchStartX=null; touchStartY=null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
    if(view==="quiz" && current.checked && !modal){ nextQuestion(); }
  }
}
try{
  document.addEventListener("touchstart", onTouchStart, {passive:true});
  document.addEventListener("touchend", onTouchEnd, {passive:true});
}catch(e){}

render();
</script>
