<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIO 207 -- Exam II Practice</title>
<style>
:root{
  --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --card:#ffffff; --border:#ddd;
  --accent:#2563eb; --accent-fg:#ffffff; --good:#15803d; --good-bg:#dcfce7;
  --bad:#b91c1c; --bad-bg:#fee2e2; --chip:#eef2ff; --warn:#b45309; --warn-bg:#fef3c7;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --fg:#f0f0f0; --muted:#a0a0a0; --card:#1e1e1e; --border:#333;
    --accent:#60a5fa; --accent-fg:#0b1220; --good:#4ade80; --good-bg:#0f2e1a;
    --bad:#f87171; --bad-bg:#3a1414; --chip:#1f2540; --warn:#fbbf24; --warn-bg:#3a2e0f;
  }
  html{ color-scheme: dark; }
}
:root[data-theme="dark"]{
  --bg:#121212; --fg:#f0f0f0; --muted:#a0a0a0; --card:#1e1e1e; --border:#333;
  --accent:#60a5fa; --accent-fg:#0b1220; --good:#4ade80; --good-bg:#0f2e1a;
  --bad:#f87171; --bad-bg:#3a1414; --chip:#1f2540; --warn:#fbbf24; --warn-bg:#3a2e0f;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color: transparent;
}
#app{ max-width:580px; margin:0 auto; padding:16px 16px 48px; position:relative; }
.topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.topbar .brand{ font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
.tutorial-dots{ display:flex; gap:6px; justify-content:center; margin-top:14px; }
.tutorial-dot{ width:7px; height:7px; border-radius:50%; background:var(--border); }
.tutorial-dot.active{ background:var(--accent); }
h1{ font-size:20px; font-weight:600; margin:4px 0 2px; }
h2{ font-size:16px; font-weight:600; margin:0 0 10px; }
.muted{ color:var(--muted); font-size:13px; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{
  display:block; width:100%; text-align:left; background:var(--card); color:var(--fg);
  border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;
  font-size:15px; margin-bottom:10px; cursor:pointer;
}
.btn:active{ transform:scale(0.99); }
.btn-primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; text-align:center; }
.btn-primary:disabled{ opacity:0.5; }
.btn-ghost{ background:transparent; }
.btn-sm{ display:inline-block; width:auto; padding:8px 12px; font-size:13px; margin:0 6px 6px 0; }
.chip{ display:inline-block; background:var(--chip); color:var(--accent); font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; margin-right:6px; margin-bottom:6px; cursor:pointer; border:none; }
.chip.tag-warn{ background:var(--warn-bg); color:var(--warn); }
.statgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:10px 0; }
.stat{ background:var(--chip); border-radius:var(--radius); padding:12px; }
.stat .num{ font-size:22px; font-weight:600; }
.stat .lab{ font-size:12px; color:var(--muted); }
.barwrap{ background:var(--border); border-radius:6px; height:10px; overflow:hidden; margin-top:6px;}
.bar{ height:100%; background:var(--accent); transition:width .3s; }
.heatbar{ height:16px; border-radius:6px; }
.progresstop{ font-size:13px; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.qtext{ font-size:16px; line-height:1.5; margin-bottom:10px; }
.opt{ display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; font-size:15px; cursor:pointer; }
.opt.selected{ border-color:var(--accent); border-width:2px; }
.opt.correct{ border-color:var(--good); background:var(--good-bg); border-width:2px; }
.opt.incorrect{ border-color:var(--bad); background:var(--bad-bg); border-width:2px; }
input[type=text],input[type=number]{
  width:100%; padding:12px 14px; font-size:15px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); color:var(--fg);
}
select{
  width:100%; padding:10px 12px; font-size:14px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); color:var(--fg); margin-top:4px;
}
.matchrow{ margin-bottom:12px; }
.matchrow .mleft{ font-size:14px; margin-bottom:4px; }
.feedback{ border-radius:var(--radius); padding:12px 14px; margin-top:10px; font-size:14px; }
.feedback.good{ background:var(--good-bg); color:var(--good); }
.feedback.bad{ background:var(--bad-bg); color:var(--bad); }
.feedback.warn{ background:var(--warn-bg); color:var(--warn); font-weight:600; }
.err{ color:var(--bad); font-size:13px; margin-top:6px; }
.footerbtn{ position:sticky; bottom:0; background:var(--bg); padding:10px 0 4px; }
.small{ font-size:12px; color:var(--muted); margin-top:4px; }
a{ color:var(--accent); }
.iconbtn{ background:none; border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; color:var(--fg); cursor:pointer; }
.timerbar{ height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:10px; }
.timerfill{ height:100%; background:var(--warn); transition:width .2s linear; }
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal-box{ background:var(--card); border-radius:var(--radius); padding:20px; max-width:440px; width:100%; max-height:80vh; overflow-y:auto; }
.modal-box svg{ width:100%; height:auto; color:var(--fg); }
.confband{ display:flex; gap:8px; margin:10px 0; }
.confbtn{ flex:1; padding:10px 6px; font-size:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--fg); cursor:pointer; text-align:center; }
.confbtn.selected{ border-color:var(--accent); border-width:2px; background:var(--chip); }
svg.diagram{ width:100%; height:auto; color:var(--fg); cursor:zoom-in; }
.hero-card{ background:linear-gradient(135deg,var(--accent),#7c3aed); border-radius:var(--radius); padding:16px; color:#fff; margin-bottom:12px; cursor:pointer; box-shadow:0 8px 20px rgba(37,99,235,.25); border:none; width:100%; text-align:left; display:flex; align-items:center; gap:12px; }
.hero-card-urgent{ background:linear-gradient(135deg,#dc2626,#ea580c); box-shadow:0 8px 20px rgba(220,38,38,.3); }
.hero-icon{ font-size:26px; flex-shrink:0; }
.hero-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; opacity:.85; }
.hero-title{ font-size:17px; font-weight:700; margin-top:2px; }
.hero-sub{ font-size:12.5px; opacity:.85; margin-top:2px; }
.hero-chev{ font-size:20px; opacity:.85; flex-shrink:0; }
.alert-card{ border-radius:var(--radius); padding:16px; margin-bottom:12px; border-width:1px; border-style:solid; }
.alert-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.alert-title{ font-weight:600; font-size:14px; flex:1; }
.alert-count{ font-size:12px; font-weight:600; }
.alert-chip{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; margin:0 6px 6px 0; display:inline-block; }
.alert-msg{ font-size:13px; margin:6px 0 10px; }
.modecard{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px; cursor:pointer; text-align:left; width:100%; }
.modecard-icon{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.modecard-body{ flex:1; min-width:0; }
.modecard-title{ font-weight:600; font-size:14.5px; }
.modecard-desc{ font-size:12px; color:var(--muted); margin-top:1px; }
.modecard-chev{ color:var(--muted); font-size:18px; flex-shrink:0; }
.hue-emerald{ background:rgba(16,185,129,.15); color:#10b981; }
.hue-amber{ background:rgba(245,158,11,.15); color:#f59e0b; }
.hue-cyan{ background:rgba(6,182,212,.15); color:#06b6d4; }
.hue-rose{ background:rgba(244,63,94,.15); color:#f43f5e; }
.hue-violet{ background:rgba(124,58,237,.15); color:#7c3aed; }
.hue-slate{ background:rgba(100,116,139,.15); color:#64748b; }
.tiptext{ font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
.confetti-piece{ position:fixed; top:-10px; width:8px; height:8px; z-index:100; pointer-events:none; }
textarea.plan-out{ width:100%; min-height:220px; font-size:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--fg); padding:12px; font-family:inherit; }
</style>
</head>
<body>
<div id="app"></div>
<div id="confetti-root"></div>
<script>
// ======================= DATA =======================
var QUESTIONS = [{"id": "c6_01", "ch": 6, "type": "mc", "q": "A virus is a tiny, infectious:", "opts": ["Cell", "Living thing", "Particle", "Nucleic acid"], "correct": 2, "exp": "Viruses are acellular infectious particles -- not cells, not independently 'living' things.", "src": "chapter"}, {"id": "c6_02", "ch": 6, "type": "mc", "q": "Viruses are known to infect:", "opts": ["Plants", "Bacteria", "Fungi", "All organisms"], "correct": 3, "exp": "Every kind of cellular life -- plants, animals, fungi, protists, and bacteria (via bacteriophages) -- can be infected by viruses.", "src": "chapter"}, {"id": "c6_03", "ch": 6, "type": "mc", "q": "The capsid is composed of protein subunits called:", "opts": ["Spikes", "Protomers", "Virions", "Capsomeres"], "correct": 3, "exp": "Capsomeres are the individual protein subunits that assemble into the capsid shell.", "src": "chapter"}, {"id": "c6_04", "ch": 6, "type": "mc", "q": "The envelope of an animal virus is derived from the ________ of its host cell.", "opts": ["Cell wall", "Membrane", "Glycocalyx", "Receptors"], "correct": 1, "exp": "The envelope buds off from the host's own membrane (plasma, nuclear, or ER), picking up viral spike proteins along the way.", "src": "chapter"}, {"id": "c6_05", "ch": 6, "type": "mc", "q": "The nucleic acid of a virus is:", "opts": ["DNA only", "RNA only", "Both DNA and RNA", "Either DNA or RNA"], "correct": 3, "exp": "A virus carries only one type of nucleic acid -- DNA or RNA, never both at once.", "src": "chapter"}, {"id": "c6_06", "ch": 6, "type": "mc", "q": "The general steps in a viral multiplication cycle are:", "opts": ["Adsorption, penetration, synthesis, assembly, and release", "Endocytosis, replication, assembly, and budding", "Adsorption, duplication, assembly, and lysis", "Endocytosis, penetration, replication, maturation, and exocytosis"], "correct": 0, "exp": "The five-stage general cycle -- adsorption, penetration, synthesis, assembly, release -- applies to both phages and animal viruses, even though the specific mechanisms of each stage differ.", "src": "chapter"}, {"id": "c6_07", "ch": 6, "type": "mc", "q": "A prophage is a/an ________ stage in the cycle of ________.", "opts": ["Latent, bacterial viruses", "Infective, RNA viruses", "Early, poxviruses", "Late, enveloped viruses"], "correct": 0, "exp": "A prophage is the dormant, integrated (latent) stage of a bacteriophage's lysogenic cycle.", "src": "chapter"}, {"id": "c6_08", "ch": 6, "type": "mc", "q": "The nucleic acid of animal viruses enters the host cell through:", "opts": ["Injection", "Fusion", "Endocytosis", "b and c"], "correct": 3, "exp": "Unlike phages (which inject nucleic acid through a tail tube), animal viruses enter whole, via membrane fusion or endocytosis, then uncoat inside the cell.", "src": "chapter"}, {"id": "c6_09", "ch": 6, "type": "mc", "q": "In general, RNA viruses multiply in the cell ________, and DNA viruses multiply in the cell ________.", "opts": ["Nucleus, cytoplasm", "Cytoplasm, nucleus", "Vesicles, ribosomes", "Endoplasmic reticulum, nucleolus"], "correct": 1, "exp": "Most RNA viruses replicate in the cytoplasm; most DNA viruses replicate in the nucleus (where host DNA machinery is available) -- retroviruses are a notable exception.", "src": "chapter"}, {"id": "c6_10", "ch": 6, "type": "mc", "q": "Enveloped viruses carry surface receptors called:", "opts": ["Buds", "Spikes", "Fibers", "Sheaths"], "correct": 1, "exp": "Spikes (glycoproteins) studding the envelope bind specifically to host cell receptors and determine host range.", "src": "chapter"}, {"id": "c6_11", "ch": 6, "type": "mc", "q": "Viruses that persist in the cell and cause recurrent disease are considered:", "opts": ["Oncogenic", "Cytopathic", "Latent", "Resistant"], "correct": 2, "exp": "Latent viruses (like herpesviruses) remain dormant for long periods and periodically reactivate to cause recurrent symptoms.", "src": "chapter"}, {"id": "c6_12", "ch": 6, "type": "mc", "q": "Viruses cannot be cultivated in:", "opts": ["Cell culture", "Bird embryos", "Live mammals", "Blood agar"], "correct": 3, "exp": "Blood agar is an inert nutrient medium -- viruses are obligate intracellular parasites and require living host cells/tissue, not an agar plate.", "src": "chapter"}, {"id": "c6_13", "ch": 6, "type": "mc", "q": "Clear patches in cell cultures that indicate sites of virus infection are called:", "opts": ["Plaques", "Pocks", "Colonies", "Prions"], "correct": 0, "exp": "Plaques are clear zones where the virus has lysed/killed the cells in a confluent monolayer -- the viral equivalent of a bacterial colony count.", "src": "chapter"}, {"id": "c6_14", "ch": 6, "type": "mc", "q": "Which of these is NOT a general pattern of virus morphology?", "opts": ["Enveloped, helical", "Naked, icosahedral", "Enveloped, icosahedral", "Complex, helical"], "correct": 3, "exp": "Complex viruses (like T4 phage) have their own distinct, non-helical/non-icosahedral architecture -- 'complex, helical' isn't a recognized morphology category.", "src": "chapter"}, {"id": "c6_15", "ch": 6, "type": "mc", "q": "Which of these is true of prions?", "opts": ["They are small RNA viruses", "They replicate in the nucleus", "They lack protein", "They cause death of brain cells"], "correct": 3, "exp": "Prions are infectious proteins (not RNA viruses, and they don't 'replicate' or lack protein) that cause fatal, progressive destruction of nerve cells in spongiform encephalopathies.", "src": "chapter"}, {"id": "c6_16", "ch": 6, "type": "mc", "q": "Phages infect:", "opts": ["Bacterial cells", "Viruses", "Human cells", "Any type of cell"], "correct": 0, "exp": "Bacteriophages are viruses specific to bacteria -- their narrow host range is exactly what makes phage therapy selectively harmless to human cells.", "src": "chapter"}, {"id": "c6_17", "ch": 6, "type": "mc", "q": "What most likely happened after a patient was cured of an illness by phage therapy?", "opts": ["He was prescribed antiviral medication to inactivate the phage", "The phage disappeared from his body", "The phage infected the patient's cells", "He was prescribed antibiotics to prevent further phage replication"], "correct": 1, "exp": "Once the target bacteria are cleared, the phage has no host left to replicate in and is naturally cleared from the body -- phages don't infect human cells.", "src": "chapter"}, {"id": "c6_18", "ch": 6, "type": "mc", "q": "Which of the following is a component of a virus?", "opts": ["Cell wall", "Ribosome", "Capsid", "Nucleus"], "correct": 2, "exp": "Viruses are acellular -- no cell wall, no ribosomes, no nucleus. The capsid (protein coat) is their defining structural component.", "src": "chapter"}, {"id": "c6_19", "ch": 6, "type": "mc", "q": "Which is the earliest step in the replication cycle of hepatitis B virus?", "opts": ["Release", "Assembly", "Adsorption", "Penetration"], "correct": 2, "exp": "Adsorption (attachment to the host cell) is always the first step in any viral replication cycle, before penetration can occur.", "src": "chapter"}, {"id": "c9_01", "ch": 9, "type": "mc", "q": "What is the fundamental unit of heredity?", "opts": ["Chromosome", "Gene", "Codon", "Intron"], "correct": 1, "exp": "A gene is the basic unit of heredity -- a specific DNA sequence coding for a protein or functional RNA.", "src": "chapter"}, {"id": "c9_02", "ch": 9, "type": "mc", "q": "A nucleotide contains which of the following?", "opts": ["5-carbon sugar", "Nitrogenous base", "Phosphate", "b and c only", "All of these"], "correct": 4, "exp": "A nucleotide = a 5-carbon sugar + a phosphate group + a nitrogenous base, all three together.", "src": "chapter"}, {"id": "c9_03", "ch": 9, "type": "mc", "q": "The nitrogenous bases in DNA are bonded to the:", "opts": ["Phosphate", "Deoxyribose", "Ribose", "Hydrogen"], "correct": 1, "exp": "Each base attaches to the deoxyribose sugar of its nucleotide; the sugar in turn links to the phosphate to form the backbone.", "src": "chapter"}, {"id": "c9_04", "ch": 9, "type": "mc", "q": "DNA replication is considered semiconservative because the ________ strand will remain as half of the ________ molecule.", "opts": ["Antisense, DNA", "Template, final DNA", "Sense, mRNA", "Codon, anticodon"], "correct": 1, "exp": "Each new DNA double helix keeps one original template strand paired with one newly synthesized strand -- 'semi' (half) conserved.", "src": "chapter"}, {"id": "c9_05", "ch": 9, "type": "mc", "q": "In DNA, adenine is the complementary base for ________, and cytosine is the complement for ________.", "opts": ["Guanine, thymine", "Uracil, guanine", "Thymine, guanine", "Thymine, uracil"], "correct": 2, "exp": "A pairs with T, and C pairs with G in DNA -- a classic base-pairing fact.", "src": "chapter"}, {"id": "c9_06", "ch": 9, "type": "mc", "q": "The base pairs are held together primarily by:", "opts": ["Covalent bonds", "Ionic bonds", "Hydrogen bonds", "Gyrases"], "correct": 2, "exp": "Hydrogen bonds hold complementary base pairs together (2 between A-T, 3 between G-C) -- weak enough to be unzipped for replication/transcription, but strong enough in number to stabilize the helix. Gyrase is an enzyme, not a bond type.", "src": "chapter"}, {"id": "c9_07", "ch": 9, "type": "mc", "q": "Why must the lagging strand of DNA be replicated in short pieces?", "opts": ["Because space is limited", "Otherwise, the helix will become distorted", "The DNA polymerase can synthesize in only one direction", "To make proofreading of code easier"], "correct": 2, "exp": "DNA polymerase only synthesizes 5' to 3', so on the lagging strand (running the 'wrong' way relative to the replication fork) it must work in short, discontinuous Okazaki fragments.", "src": "chapter"}, {"id": "c9_08", "ch": 9, "type": "mc", "q": "Messenger RNA is formed by ________ of a gene on the DNA template strand.", "opts": ["Transcription", "Replication", "Translation", "Transformation"], "correct": 0, "exp": "Transcription is the DNA-to-RNA copying process that produces mRNA from a gene's template strand.", "src": "chapter"}, {"id": "c9_09", "ch": 9, "type": "mc", "q": "Transfer RNA is the molecule that:", "opts": ["Contributes to the structure of ribosomes", "Adapts the genetic code to protein structure", "Transfers the DNA code to mRNA", "Provides the master code for amino acids"], "correct": 1, "exp": "tRNA physically 'adapts' the genetic code into protein by matching its anticodon to an mRNA codon while carrying the corresponding amino acid.", "src": "chapter"}, {"id": "c9_10", "ch": 9, "type": "mc", "q": "As a general rule, the first codon on a DNA template strand that signals the start for a protein is:", "opts": ["TAC", "AUG", "ATG", "UAC"], "correct": 0, "exp": "TAC on the DNA template strand transcribes to AUG on the mRNA (the start codon) -- don't confuse the DNA template triplet (TAC) with the mRNA start codon itself (AUG), a classic trap.", "terms": ["start codon"], "src": "chapter"}, {"id": "c9_11", "ch": 9, "type": "mc", "q": "What components are involved in transcription?", "opts": ["Sigma factor", "RNA polymerase", "Promoter", "Only b and c", "All of these"], "correct": 4, "exp": "Transcription involves RNA polymerase binding the promoter, often with the help of a sigma factor (in prokaryotes) to recognize the correct start site -- all three play a role.", "src": "chapter"}, {"id": "c9_12", "ch": 9, "type": "mc", "q": "The lac operon is usually in the ________ position and is activated by a/an ________ molecule.", "opts": ["On, repressor", "Off, inducer", "On, inducer", "Off, repressor"], "correct": 1, "exp": "The lac operon is an inducible operon: normally OFF, switched ON by an inducer (lactose/allolactose).", "src": "chapter"}, {"id": "c9_13", "ch": 9, "type": "mc", "q": "For mutations to have an effect on populations of microbes, they must be:", "opts": ["Inheritable", "Permanent", "Beneficial", "a and b", "All of these"], "correct": 3, "exp": "A mutation must be both inheritable (passed to offspring) and permanent (a lasting DNA change) to affect a population over time -- it does NOT need to be beneficial; harmful and neutral mutations also persist and spread.", "src": "chapter"}, {"id": "c9_14", "ch": 9, "type": "mc", "q": "Which of the following characteristics is NOT true of a plasmid?", "opts": ["It is a circular piece of DNA", "It is required for normal cell function", "It is found in bacteria", "It can be transferred from cell to cell"], "correct": 1, "exp": "Plasmids carry nonessential (though often advantageous) genes like antibiotic resistance -- a cell survives fine without one.", "src": "chapter"}, {"id": "c9_15", "ch": 9, "type": "mc", "q": "Which of these features is found in eukaryotes but NOT bacteria?", "opts": ["Polygene mRNAs", "Introns", "Stop codon", "AUG codon"], "correct": 1, "exp": "Introns (non-coding intervening sequences requiring splicing) are a eukaryotic gene feature; bacterial genes generally lack them. Polycistronic ('polygene') mRNA is actually a bacterial feature, and stop/start codons are universal.", "src": "chapter"}, {"id": "c9_16", "ch": 9, "type": "mc", "q": "Which of the following is present in prokaryotes but NOT eukaryotes?", "opts": ["Exons", "Polyribosomes", "Spliceosomes", "Simultaneous transcription and translation"], "correct": 3, "exp": "With no nuclear membrane separating the two processes, prokaryotes can translate an mRNA while it's still being transcribed -- impossible in eukaryotes, where transcription (nucleus) and translation (cytoplasm) are physically separated.", "src": "chapter"}, {"id": "c9_17", "ch": 9, "type": "mc", "q": "The enzymes responsible for the movement of the vanA transposon are:", "opts": ["Transposase and polymerase", "Replicase and resolvase", "Transposase and resolvase", "Transposase and replicase"], "correct": 2, "exp": "Transposase cuts/pastes the transposon into a new site, and resolvase helps resolve the DNA intermediate structure created during that process.", "src": "chapter"}, {"id": "c9_18", "ch": 9, "type": "mc", "q": "With regard to the vanA operon, vancomycin acts as a(n):", "opts": ["Promoter", "Repressor", "Inducer", "Operator"], "correct": 2, "exp": "Exposure to vancomycin itself triggers (induces) expression of the vanA resistance operon's genes.", "src": "chapter"}, {"id": "c9_19", "ch": 9, "type": "mc", "q": "Which base will pair with uracil in RNA?", "opts": ["Adenine", "Guanine", "Thymine", "Cytosine"], "correct": 0, "exp": "Uracil takes thymine's place in RNA and still pairs with adenine, just as thymine does in DNA.", "src": "chapter"}, {"id": "c9_20", "ch": 9, "type": "mc", "q": "What cell structure is responsible for protein synthesis?", "opts": ["Golgi body", "Lysosome", "DNA", "Ribosome"], "correct": 3, "exp": "Ribosomes (rRNA + protein) are the physical site where translation -- the actual assembly of proteins -- takes place.", "src": "chapter"}, {"id": "a6_01", "ch": 6, "type": "mc", "q": "Together, the capsid and the nucleic acid of a virus are referred to as the ________.", "opts": ["Nucleocapsid", "Virion", "Envelope", "Capsomere"], "correct": 0, "exp": "The capsid (protein shell) plus the enclosed nucleic acid together make up the nucleocapsid; a virus with only this (no outer membrane) is a naked virus.", "src": "assignment"}, {"id": "a6_02", "ch": 6, "type": "mc", "q": "Which of the following is NOT used to classify a virus into a particular family?", "opts": ["Capsid structure (type of capsid)", "Presence or absence of an envelope", "Genetic makeup (nucleic acid type)", "Type of infection it causes"], "correct": 3, "exp": "Classification criteria include capsid type, envelope presence, nucleic acid strand number/type, overall size, and host-cell area of multiplication -- type of infection caused is not one of the listed criteria.", "src": "assignment"}, {"id": "a6_03", "ch": 6, "type": "tf", "q": "Presence or absence of a capsid is a criterion used to classify viruses into families.", "correct": false, "exp": "False -- essentially all viruses have a capsid, so this isn't a useful classification criterion; capsid *structure/type* is used, not its mere presence.", "src": "assignment"}, {"id": "a6_04", "ch": 6, "type": "tf", "q": "The viral-host relationship is extremely important for pathogenicity, mode of transmission, the immune response, and the human measures used to control viral infections.", "correct": true, "exp": "True -- the specific virus-host interaction shapes how disease develops, how it spreads, how the immune system reacts, and which control measures (vaccines, antivirals) actually work.", "src": "assignment"}, {"id": "a6_05", "ch": 6, "type": "tf", "q": "Viral nucleic acid enters the host cell and uses the host cell's replication and synthesis machinery to produce new nucleic acid molecules, capsid proteins, spikes, and viral enzymes.", "correct": true, "exp": "True -- once inside, viral nucleic acid redirects the host's own machinery to manufacture all the components needed for new virus particles.", "src": "assignment"}, {"id": "a6_06", "ch": 6, "type": "mc", "q": "Which term is associated with the release of nonenveloped or complex viruses from the host cell?", "opts": ["Phagocytosis", "Exocytosis", "Endocytosis", "Budding", "Lysis"], "correct": 4, "exp": "Nonenveloped and complex viruses are released by rupturing (lysing) the host cell; enveloped viruses, by contrast, bud/exocytose out gradually.", "src": "assignment"}, {"id": "a6_07", "ch": 6, "type": "mc", "q": "Which of the following does NOT represent an event in bacteriophage multiplication?", "opts": ["Synthesis and assembly occur in the cytoplasm", "Precise attachment to the host cell", "Uncoating of the nucleic acid in cytoplasm", "Release from the host cell by cell lysis", "Destruction of the cell is immediate when released"], "correct": 2, "exp": "Phages inject their nucleic acid directly through a rigid tail tube -- there's no whole-virus engulfment, so there's no separate 'uncoating' step the way animal viruses have.", "src": "assignment"}, {"id": "a6_08", "ch": 6, "type": "mc", "q": "Which of the following is NOT a primary purpose of viral cultivation?", "opts": ["To isolate and identify viruses in clinical specimens", "To observe viral morphology on a solid medium", "To research viral structure, multiplication, genetics, and effects on host cells", "To prepare viruses for vaccines"], "correct": 1, "exp": "Viruses can't be grown on an inert solid medium like agar -- they require living host cells, so 'observing morphology on a solid medium' isn't a real purpose of viral cultivation.", "src": "assignment"}, {"id": "a6_09", "ch": 6, "type": "mc", "q": "Which viral culture method is described as a specific cell line available for viruses with a very narrow host range?", "opts": ["Cell culture", "Bird embryos", "Live animals", "Blood agar"], "correct": 0, "exp": "A specific, standing cell line can be maintained for viruses that only infect a narrow range of host cells.", "src": "assignment"}, {"id": "a6_10", "ch": 6, "type": "mc", "q": "Which viral culture method is an intact, self-contained unit with its own sterile environment and nourishment?", "opts": ["Cell culture", "Bird embryos", "Live animals", "Tissue scrapings"], "correct": 1, "exp": "An incubating bird egg is a self-supporting sterile unit, complete with its own nourishment -- ideal for cultivating certain viruses (e.g., influenza).", "src": "assignment"}, {"id": "a6_11", "ch": 6, "type": "mc", "q": "Which viral culture method allows viral effects on the whole organism to be observed?", "opts": ["Cell culture", "Bird embryos", "Live animal inoculation", "Blood agar"], "correct": 2, "exp": "Only a live animal host lets researchers observe systemic effects of infection across an entire living organism, not just isolated cells.", "src": "assignment"}, {"id": "a6_12", "ch": 6, "type": "tf", "q": "Most viral infections result in the death of the host.", "correct": false, "exp": "False -- most viral infections (like the common cold) are mild and non-lethal; only a subset, like rabies, HIV, and Ebola, carry very high mortality rates.", "src": "assignment"}, {"id": "a6_13", "ch": 6, "type": "tf", "q": "The use of antibiotics is an effective treatment for viral infections.", "correct": false, "exp": "False -- antibiotics target bacterial structures/processes (like cell walls or bacterial ribosomes) that viruses don't have, so they're useless against viral infections.", "src": "assignment"}, {"id": "a6_14", "ch": 6, "type": "mc", "q": "The only active biological agents lacking any nucleic acid (DNA or RNA) are:", "opts": ["Satellite viruses", "Viroids", "Virions", "Prions"], "correct": 3, "exp": "Prions are infectious proteins with no genetic material at all -- unlike viroids (naked RNA) or satellite viruses (which have nucleic acid but need a helper virus).", "src": "assignment"}, {"id": "a6_15", "ch": 6, "type": "mc", "q": "The first event to occur during the release of enveloped viruses is when:", "opts": ["The inside of the host cell membrane becomes coated with capsid", "Viral spike proteins are inserted into the host cell membrane", "The inside of the host cell membrane becomes coated with viral matrix protein", "The viral capsid becomes enclosed by cell membrane"], "correct": 1, "exp": "Per the budding sequence: spike proteins insert into the host membrane FIRST, then matrix protein coats the inside of that patch, and finally the nucleocapsid extrudes through it.", "src": "assignment"}, {"id": "a6_16", "ch": 6, "type": "mc", "q": "During budding of an enveloped virus, the viral capsid:", "opts": ["Surrounds the viral matrix protein", "Becomes completely enclosed by the region of the membrane into which the spikes and matrix protein are embedded", "Is dissolved", "Engulfs the viral spikes"], "correct": 1, "exp": "The nucleocapsid extrudes through the already-modified patch of host membrane (spikes + matrix protein), becoming wrapped in it as its new envelope.", "src": "assignment"}, {"id": "a6_17", "ch": 6, "type": "mc", "q": "Enveloped viruses are usually released from the host cell by:", "opts": ["Phagocytosis", "Endocytosis", "Budding", "Lysis of the host cell"], "correct": 2, "exp": "Enveloped viruses bud/exocytose out of the cell, allowing gradual release without necessarily destroying the host cell outright.", "src": "assignment"}, {"id": "a6_18", "ch": 6, "type": "tf", "q": "A portion of the viral envelope comes from the cell membrane of the host cell.", "correct": true, "exp": "True -- the envelope is a piece of the host's own membrane, picked up during budding, though it's modified to carry viral spike proteins.", "src": "assignment"}, {"id": "a6_19", "ch": 6, "type": "mc", "q": "In the lytic cycle of phage replication:", "opts": ["Phage genes exist as prophage", "Phage nucleic acid is replicated and phage genes are expressed, making new phage protein and lysing the host cell", "Phage DNA remains inside the protein coat", "Phage genes integrate into the host cell genome and are not expressed"], "correct": 1, "exp": "The lytic cycle actively replicates phage nucleic acid, expresses phage genes, assembles new virions, and lyses the host -- the other options all describe the dormant lysogenic cycle instead.", "src": "assignment"}, {"id": "a6_20", "ch": 6, "type": "mc", "q": "A prophage is:", "opts": ["Phage DNA integrated into the host cell genome", "Phage protein left outside the bacterium", "Toxic to the host bacterial cell", "Phage DNA being actively expressed"], "correct": 0, "exp": "A prophage is dormant viral DNA inserted into the host chromosome -- not actively expressed, not toxic, replicated passively along with the host's own DNA.", "terms": ["lysogeny"], "src": "assignment"}, {"id": "a6_21", "ch": 6, "type": "mc", "q": "Which of the following can cause a phage in the lysogenic stage to revert to the lytic stage?", "opts": ["A competing phage", "Darkness", "An electrical charge", "Ultraviolet light", "Lack of nutrients"], "correct": 3, "exp": "UV light (and other DNA-damaging stressors) can trigger lysogenic induction, causing the prophage to excise and re-enter the lytic cycle.", "terms": ["lysogeny"], "src": "assignment"}, {"id": "a6_22", "ch": 6, "type": "tf", "q": "In the lysogenic stage of phage replication, the host cell is lysed.", "correct": false, "exp": "False -- in the lysogenic stage, the prophage lies dormant and the host cell continues growing and dividing normally; lysis only happens if the prophage is induced into the lytic cycle.", "terms": ["lysogeny"], "src": "assignment"}, {"id": "a6_23", "ch": 6, "type": "mc", "q": "Retroviruses have:", "opts": ["Two copies of single-stranded DNA", "Two copies of single-stranded RNA", "One copy of single-stranded RNA", "One copy of double-stranded RNA"], "correct": 1, "exp": "Retroviruses (like HIV) are diploid RNA viruses, carrying two identical copies of single-stranded RNA plus reverse transcriptase to convert that RNA into DNA.", "src": "assignment"}, {"id": "a6_24", "ch": 6, "type": "tf", "q": "If a virus is present as a provirus in the host cell, it remains latent and never produces new virus.", "correct": false, "exp": "False -- a provirus typically stays dormant/latent, but it is not necessarily permanent; it can later be reactivated to direct production of new virus, making 'never' too absolute.", "src": "assignment"}, {"id": "a6_25", "ch": 6, "type": "mc", "q": "The stage of T4 phage replication that involves protein fibers on the phage attaching to receptors on the bacterial cell wall is the:", "opts": ["Lysis stage", "Penetration stage", "Transcription stage", "Assembly stage", "Attachment stage"], "correct": 4, "exp": "This is adsorption/attachment -- the phage's tail fibers make precise contact with specific receptor sites on the bacterial surface.", "src": "assignment"}, {"id": "a6_26", "ch": 6, "type": "mc", "q": "The stage of T4 phage replication that involves injection of phage DNA is the:", "opts": ["Assembly stage", "Attachment stage", "Penetration stage", "Lysis stage", "Transcription stage"], "correct": 2, "exp": "Penetration is the step where phage DNA is injected through a rigid tail tube into the host, while the empty capsid stays outside.", "src": "assignment"}, {"id": "a6_27", "ch": 6, "type": "mc", "q": "The stage of T4 phage replication that involves copying phage DNA and synthesizing phage proteins is the:", "opts": ["Penetration stage", "Attachment stage", "Assembly stage", "Lysis stage", "Transcription stage"], "correct": 4, "exp": "This 'transcription' (synthesis) stage redirects the host's machinery to replicate phage DNA and manufacture new phage proteins, occurring after penetration and before assembly.", "src": "assignment"}, {"id": "a6_28", "ch": 6, "type": "tf", "q": "The enzyme lysozyme is used by T4 phages to enter and exit the host cell.", "correct": true, "exp": "True -- a lysozyme-like domain in the phage's tail locally digests peptidoglycan to let DNA in at entry, and phage-encoded lysozyme (endolysin) degrades the wall from within to trigger lysis at release.", "src": "assignment"}, {"id": "a6_29", "ch": 6, "type": "tf", "q": "During the transcription stage, the phage DNA merges with the host DNA.", "correct": false, "exp": "False -- during the lytic cycle's transcription/synthesis stage, phage DNA is replicated and expressed independently; merging with the host chromosome only happens in the lysogenic cycle, forming a prophage.", "src": "assignment"}, {"id": "a6_30", "ch": 6, "type": "mc", "q": "In the attachment step of phage replication:", "opts": ["Attachment is nonspecific", "Protein fibers in the phage tail attach to specific receptors on the bacterial cell wall", "Phage DNA exits the protein coat and attaches to receptors on the bacterium", "Carbohydrate receptors in the phage tail attach to specific receptors on the bacterial cell wall"], "correct": 1, "exp": "Phage attachment is highly specific -- protein tail fibers bind particular receptor molecules on the bacterial surface, which is why phages generally have a narrow host range.", "src": "assignment"}, {"id": "a6_31", "ch": 6, "type": "mc", "q": "In phage replication:", "opts": ["Only the phage protein enters the bacterial cell", "Multiple phage particles enter the same host bacterial cell at the same time", "The whole phage particle enters the cell and the protein outer coat is removed", "Only the phage nucleic acid enters the bacterial cell"], "correct": 3, "exp": "Unlike animal viruses, phages inject only their nucleic acid through a tail tube -- the capsid stays attached outside the cell.", "src": "assignment"}, {"id": "a6_32", "ch": 6, "type": "mc", "q": "What is the correct order of the stages of phage replication: Attachment, Penetration, Transcription/replication, Assembly, Release?", "opts": ["Release, Attachment, Transcription/replication, Assembly, Penetration", "Attachment, Penetration, Transcription/replication, Assembly, Release", "Attachment, Penetration, Assembly, Transcription/replication, Release", "Penetration, Attachment, Assembly, Transcription/replication, Release"], "correct": 1, "exp": "The standard lytic sequence: Attachment (adsorption) -> Penetration -> Transcription/replication (synthesis) -> Assembly -> Release.", "src": "assignment"}, {"id": "a6_33", "ch": 6, "type": "tf", "q": "Viral lysozyme digests the host cell wall, releasing the newly made phage and lysing the host cell in the release step.", "correct": true, "exp": "True -- phage-encoded lysozyme degrades the peptidoglycan from within, weakening the wall to the point of rupture and releasing progeny phages.", "src": "assignment"}, {"id": "a6_34", "ch": 6, "type": "mc", "q": "Every virus particle contains:", "opts": ["Either DNA or RNA", "DNA", "Ribosomes", "DNA and RNA"], "correct": 0, "exp": "Viruses contain either DNA or RNA as their genetic material, never both, and they have no ribosomes of their own.", "src": "assignment"}, {"id": "a6_35", "ch": 6, "type": "mc", "q": "Viral capsids are composed of:", "opts": ["Nucleic acids", "Carbohydrates", "Protein", "Lipids"], "correct": 2, "exp": "The capsid is built from protein subunits (capsomeres), not nucleic acid, carbohydrate, or lipid.", "src": "assignment"}, {"id": "a6_36", "ch": 6, "type": "mc", "q": "When present, the viral envelope is composed mainly of:", "opts": ["Protein", "Nucleic acid", "Lipids", "Carbohydrates"], "correct": 2, "exp": "The envelope is derived from the host's lipid bilayer membrane, though it's studded with viral glycoprotein spikes.", "src": "assignment"}, {"id": "a6_37", "ch": 6, "type": "tf", "q": "Almost immediately upon entry, the viral nucleic acid alters the genetic expression of the host cell.", "correct": true, "exp": "True -- once inside, viral nucleic acid quickly redirects the host's gene expression to begin synthesizing the building blocks for new virus particles.", "src": "assignment"}, {"id": "a6_38", "ch": 6, "type": "mc", "q": "Viral spikes:", "opts": ["Attach specifically to host cell receptors", "Attach nonspecifically to host cell receptors", "Are present in all viruses", "Are made of lipids"], "correct": 0, "exp": "Spikes (glycoproteins) bind specifically to particular host receptor molecules -- this specificity determines a virus's host range. Not all viruses are enveloped, so not all have spikes.", "src": "assignment"}, {"id": "a6_39", "ch": 6, "type": "mc", "q": "In viral entry by endocytosis:", "opts": ["The host cell's plasma membrane surrounds only the viral nucleic acid and forms a vesicle", "Viral spikes fuse with the host cell's plasma membrane to form a vesicle", "The host cell's plasma membrane surrounds only the viral protein coat and forms a vesicle", "The host cell's plasma membrane surrounds the whole virion and forms a vesicle"], "correct": 3, "exp": "In endocytosis, the entire virus particle (enveloped or naked) is engulfed into a vesicle/endosome; uncoating happens afterward, inside the cell.", "src": "assignment"}, {"id": "a6_40", "ch": 6, "type": "tf", "q": "Both enveloped and naked viruses can enter a cell by endocytosis.", "correct": true, "exp": "True -- endocytosis is used by enveloped viruses (like herpesviruses) and naked viruses (like poliovirus) alike.", "src": "assignment"}, {"id": "a6_41", "ch": 6, "type": "tf", "q": "A naked virus can fuse directly with the host cell membrane.", "correct": false, "exp": "False -- naked viruses lack an envelope (no lipid membrane), so they can't fuse with the host membrane; only enveloped viruses enter that way. Naked viruses rely on endocytosis instead.", "src": "assignment"}, {"id": "a6_42", "ch": 6, "type": "mc", "q": "What happens once a virus has entered a host cell and uncoated?", "opts": ["The virus will kill the cell", "A new envelope will surround the nucleic acid", "The synthesis of new virions will occur", "The genetic material of the virus will disintegrate"], "correct": 2, "exp": "Once uncoated, viral nucleic acid takes over the host's machinery to direct synthesis of new viral components, leading to assembly and release.", "src": "assignment"}, {"id": "a6_43", "ch": 6, "type": "tf", "q": "Viruses can be grown on culture media like bacteria.", "correct": false, "exp": "False -- viruses are obligate intracellular parasites and need living host cells; they cannot grow on inert nutrient media the way bacteria can.", "src": "assignment"}, {"id": "a6_44", "ch": 6, "type": "tf", "q": "Animal viruses always kill the cells they infect.", "correct": false, "exp": "False -- not all infections are lethal; some viruses cause persistent, latent, or chronic infections, and some even transform cells rather than killing them.", "src": "assignment"}, {"id": "a6_45", "ch": 6, "type": "mc", "q": "An envelope is acquired during which step of the viral life cycle?", "opts": ["Adsorption", "Release", "Synthesis", "Penetration"], "correct": 1, "exp": "The envelope is acquired as the nucleocapsid buds through the host membrane during release -- that membrane patch becomes the envelope.", "src": "assignment"}, {"id": "a6_46", "ch": 6, "type": "tf", "q": "All viruses leave a cell by exocytosis.", "correct": false, "exp": "False -- only enveloped viruses leave by budding/exocytosis; nonenveloped and complex viruses are released by cell lysis instead.", "src": "assignment"}, {"id": "a6_47", "ch": 6, "type": "mc", "q": "Which step is present in bacteriophage multiplication but NOT in multiplication of an animal virus?", "opts": ["Viral genetic material is injected into the host cell", "The viral genome is replicated by the host cell", "Assembly of new viral particles occurs in the cytoplasm", "New viruses exit the cell by budding from the cell membrane", "New viral particles are released from the host cell by lysis"], "correct": 0, "exp": "Phages uniquely inject their nucleic acid through a tail tube; animal viruses instead enter whole (via fusion or endocytosis) and uncoat afterward.", "src": "assignment"}, {"id": "a6_48", "ch": 6, "type": "mc", "q": "Fully formed viral particles capable of establishing infection in a new host are called:", "opts": ["Virions", "Capsomeres", "Prophages", "Nucleocapsids"], "correct": 0, "exp": "A virion is a complete, extracellular, infectious virus particle -- the final product of a successful multiplication cycle.", "src": "assignment"}, {"id": "a6_49", "ch": 6, "type": "mc", "q": "During replication of an enveloped animal virus, 'vesicle membrane and viral envelope fuse, releasing capsid into the host cytoplasm' describes which stage?", "opts": ["Adsorption", "Penetration", "Uncoating", "Assembly", "Release"], "correct": 2, "exp": "This fusion-and-release-of-capsid step is uncoating -- freeing the nucleocapsid into the cytoplasm so its genome can take over.", "src": "assignment"}, {"id": "a6_50", "ch": 6, "type": "mc", "q": "During replication of an enveloped animal virus, 'viral nucleic acid encased in capsid, viral proteins inserted into the host cell membrane' describes which stage?", "opts": ["Adsorption", "Penetration", "Synthesis", "Assembly", "Release"], "correct": 3, "exp": "This packaging of nucleic acid into capsid alongside membrane-embedded viral proteins is the assembly stage, immediately preceding release.", "src": "assignment"}, {"id": "a9_01", "ch": 9, "type": "mc", "q": "In eukaryotic cells, which cellular structure is composed of a neatly packaged DNA molecule?", "opts": ["Gene", "Genome", "Genotype", "Chromosome", "Histone"], "correct": 3, "exp": "A chromosome is a discrete structure of neatly packaged DNA; a gene is a sub-unit within it, the genome is the sum total of all DNA, and genotype is the overall genetic makeup (a concept, not a structure).", "src": "assignment"}, {"id": "a9_02", "ch": 9, "type": "mc", "q": "Which of the following is NOT part of a DNA nucleotide?", "opts": ["Deoxyribose sugar", "Phosphate group", "Nitrogenous base", "Ribose sugar"], "correct": 3, "exp": "A DNA nucleotide = phosphate + deoxyribose sugar + nitrogenous base. Ribose sugar belongs to RNA, not DNA -- that's the 'deoxy' distinction.", "src": "assignment"}, {"id": "a9_03", "ch": 9, "type": "tf", "q": "The base pairs in DNA are held together by ionic bonds.", "correct": false, "exp": "False -- base pairs are held by hydrogen bonds (2 between A-T, 3 between G-C); the sugar-phosphate backbone itself uses covalent bonds.", "src": "assignment"}, {"id": "a9_04", "ch": 9, "type": "mc", "q": "Which of the following is NOT a nitrogen base found in DNA?", "opts": ["Adenine", "Cytosine", "Guanine", "Thymine", "Uracil"], "correct": 4, "exp": "Uracil is found in RNA, not DNA -- in DNA, thymine fills that role as adenine's complementary partner.", "src": "assignment"}, {"id": "a9_05", "ch": 9, "type": "tf", "q": "Codons are found on tRNA, and anticodons are found on mRNA.", "correct": false, "exp": "False -- this is reversed. Codons are on mRNA; anticodons (which pair with codons) are on tRNA.", "src": "assignment"}, {"id": "a9_06", "ch": 9, "type": "mc", "q": "Which of the following is NOT directly needed for translation to occur?", "opts": ["mRNA", "tRNA", "rRNA", "DNA", "Amino acids"], "correct": 3, "exp": "Translation needs mRNA (the message), tRNA (brings amino acids), rRNA (forms the ribosome), and amino acids themselves -- DNA already did its job earlier, during transcription.", "src": "assignment"}, {"id": "a9_07", "ch": 9, "type": "mc", "q": "Compared to eukaryotic mRNA, bacterial (prokaryotic) mRNA is typically:", "opts": ["Monocistronic (codes for one protein)", "Polycistronic (codes for several proteins in series)", "Spliced to remove introns before translation", "Transcribed inside a nucleus"], "correct": 1, "exp": "Bacterial mRNAs are often polycistronic, carrying information from several genes in series; eukaryotic mRNA is monocistronic (one protein per transcript).", "src": "assignment"}, {"id": "a9_08", "ch": 9, "type": "tf", "q": "Prokaryotic mRNA must be processed by excising introns before translation takes place.", "correct": false, "exp": "False -- intron excision (splicing) is a eukaryotic feature; prokaryotic genes generally lack introns, so no splicing step is needed.", "src": "assignment"}, {"id": "a9_09", "ch": 9, "type": "mc", "q": "Which choice represents a section of prokaryotic DNA containing one or more genes along with a corresponding operator to control transcription?", "opts": ["Operon", "Transposon", "Promoter", "Repressor"], "correct": 0, "exp": "An operon bundles structural genes with a shared operator/regulatory region. A transposon is a mobile DNA element, a promoter is just the RNA-polymerase binding site, and a repressor is a protein, not a DNA segment.", "src": "assignment"}, {"id": "a9_10", "ch": 9, "type": "mc", "q": "A random change in DNA arising from errors in replication, with no known cause, is called a:", "opts": ["Spontaneous mutation", "Induced mutation", "Substitution mutation", "Frameshift mutation"], "correct": 0, "exp": "Spontaneous mutations arise from natural replication errors with no identifiable external cause.", "src": "assignment"}, {"id": "a9_11", "ch": 9, "type": "mc", "q": "A mutation resulting from exposure to a physical or chemical mutagen is a(n):", "opts": ["Spontaneous mutation", "Induced mutation", "Substitution mutation", "Frameshift mutation"], "correct": 1, "exp": "Induced mutations are caused by known mutagens -- physical (like UV/radiation) or chemical agents that damage DNA.", "src": "assignment"}, {"id": "a9_12", "ch": 9, "type": "mc", "q": "Changing a single base in the DNA code, which may place a different amino acid into the protein, is called a:", "opts": ["Spontaneous mutation", "Induced mutation", "Substitution mutation", "Frameshift mutation"], "correct": 2, "exp": "A substitution mutation swaps one base for another -- this can cause a missense (different amino acid), nonsense (stop codon), or silent (no change) effect.", "src": "assignment"}, {"id": "a9_13", "ch": 9, "type": "mc", "q": "Addition or deletion of bases that changes the reading of mRNA codons downstream is called a:", "opts": ["Spontaneous mutation", "Induced mutation", "Substitution mutation", "Frameshift mutation"], "correct": 3, "exp": "Frameshift mutations insert or delete bases, shifting the reading frame and scrambling every codon that follows.", "src": "assignment"}, {"id": "a9_14", "ch": 9, "type": "mc", "q": "When one bacterium donates DNA to another bacterium, producing a recombinant strain, this is known as:", "opts": ["Transposition", "Sexual reproduction", "Horizontal gene transfer", "Vertical gene transfer"], "correct": 2, "exp": "DNA moving between two existing bacteria (rather than parent-to-offspring) is horizontal gene transfer -- via conjugation, transformation, or transduction.", "src": "assignment"}, {"id": "a9_15", "ch": 9, "type": "mc", "q": "The acceptance by a bacterial cell of small, free DNA fragments from the surrounding environment is termed:", "opts": ["Transposition", "Conjugation", "Transduction", "Transformation"], "correct": 3, "exp": "Transformation is a competent cell taking up loose DNA fragments released into its environment -- no direct cell contact or viral vector needed.", "src": "assignment"}, {"id": "a9_16", "ch": 9, "type": "tf", "q": "All viruses require the use of host cell ribosomes and host cell tRNA to translate viral mRNA into viral proteins.", "correct": true, "exp": "True -- viruses lack their own protein-synthesis machinery entirely, so every virus type depends on hijacking the host's ribosomes and tRNAs to make viral proteins.", "src": "assignment"}, {"id": "a9_17", "ch": 9, "type": "mc", "q": "Which of the following best describes transcription?", "opts": ["DNA -> DNA", "DNA -> RNA", "DNA -> protein", "RNA -> DNA", "RNA -> protein"], "correct": 1, "exp": "Transcription synthesizes RNA (mRNA) using a DNA template -- DNA to RNA.", "src": "assignment"}, {"id": "a9_18", "ch": 9, "type": "tf", "q": "A structural gene encodes the information for a specific protein.", "correct": true, "exp": "True -- structural genes (like lacZ, lacY, lacA in the lac operon) each code for a specific enzyme/protein, as opposed to regulatory genes, which control expression.", "src": "assignment"}, {"id": "a9_19", "ch": 9, "type": "tf", "q": "The amino acid sequence of a protein determines its shape and specific function.", "correct": true, "exp": "True -- the order of amino acids causes a protein to fold into a particular shape, and that shape dictates what the protein can do.", "src": "assignment"}, {"id": "a9_20", "ch": 9, "type": "mc", "q": "Which of the following best describes translation?", "opts": ["DNA -> DNA", "DNA -> RNA", "DNA -> protein", "RNA -> DNA", "RNA -> protein"], "correct": 4, "exp": "Translation is the process of building a protein from an mRNA sequence -- RNA to protein.", "src": "assignment"}, {"id": "a9_21", "ch": 9, "type": "mc", "q": "Translation is characterized by:", "opts": ["A messenger RNA molecule synthesized from the DNA molecule in the nucleus", "A transfer RNA molecule synthesized from the DNA molecule in the nucleus", "A ribosomal RNA molecule synthesized from the DNA molecule in the nucleus", "The blueprint of the RNA molecule used to bind amino acids together to form proteins", "The binding of enzymes to their substrates to produce products"], "correct": 3, "exp": "Translation is where ribosomes read the mRNA 'blueprint' and, with tRNA bringing amino acids, assemble them into a protein -- the other options describe transcription or generic catalysis.", "src": "assignment"}, {"id": "a9_22", "ch": 9, "type": "mc", "q": "Which of the following is a TRUE statement concerning protein synthesis in eukaryotic organisms?", "opts": ["Translation occurs in the nucleus and transcription occurs in the cytoplasm", "Transcription occurs in the nucleus and translation occurs in the cytoplasm", "Translation occurs in the nucleus and transcription occurs in the mitochondria", "Transcription occurs in the nucleus and translation occurs in the mitochondria", "For every RNA produced, there is an enzyme or enzyme product produced"], "correct": 1, "exp": "The nuclear membrane keeps eukaryotic transcription (nucleus) physically separated from translation (cytoplasm/ER) -- unlike prokaryotes, which have no such separation.", "src": "assignment"}, {"id": "a9_23", "ch": 9, "type": "tf", "q": "The sequence for protein synthesis is translation, then transcription.", "correct": false, "exp": "False -- it's reversed. Transcription (DNA to mRNA) always happens first, followed by translation (mRNA to protein) -- the Central Dogma.", "src": "assignment"}, {"id": "a9_24", "ch": 9, "type": "mc", "q": "The enzyme that accomplishes transcription is termed:", "opts": ["DNA polymerase", "RNA polymerase", "DNA ligase", "RNA ligase", "RNA replicase"], "correct": 1, "exp": "RNA polymerase synthesizes RNA using DNA as a template -- notably, it can bind DNA, unwind it, and synthesize RNA all on its own, without needing a separate helicase.", "src": "assignment"}, {"id": "a9_25", "ch": 9, "type": "tf", "q": "The terminator of a gene is located upstream of the coding region.", "correct": false, "exp": "False -- the terminator sits downstream, signaling RNA polymerase to stop. It's the promoter that sits upstream, marking where transcription begins.", "src": "assignment"}, {"id": "a9_26", "ch": 9, "type": "tf", "q": "The RNA transcript produced by RNA polymerase is complementary to the template strand of the DNA.", "correct": true, "exp": "True -- RNA polymerase reads the DNA template strand and builds mRNA by complementary base-pairing against it.", "src": "assignment"}, {"id": "a9_27", "ch": 9, "type": "tf", "q": "Translation termination concludes with the dissociation of the two ribosomal subunits and mRNA from each other.", "correct": true, "exp": "True -- once a stop codon triggers release of the finished polypeptide, the ribosome's subunits and the mRNA all separate and are recycled for another round of translation.", "src": "assignment"}, {"id": "a9_28", "ch": 9, "type": "mc", "q": "How many structural genes are within the trp operon?", "opts": ["One", "Two", "Three", "Four", "Five"], "correct": 4, "exp": "The trp operon has five structural genes (trpE, trpD, trpC, trpB, trpA), each encoding an enzyme for tryptophan synthesis -- more than the lac operon's three.", "src": "assignment"}, {"id": "a9_29", "ch": 9, "type": "mc", "q": "In the presence of tryptophan, tryptophan binds to the:", "opts": ["Operator", "Promoter", "RNA polymerase", "Trp genes", "Trp repressor"], "correct": 4, "exp": "Tryptophan acts as a corepressor, binding the (normally inactive) trp repressor protein and activating it so the complex can then bind the operator and block transcription.", "terms": ["repressible operon"], "src": "assignment"}, {"id": "a9_30", "ch": 9, "type": "tf", "q": "In the presence of tryptophan, transcription of the trp operon is on.", "correct": false, "exp": "False -- the trp operon is repressible: normally ON, but tryptophan (as corepressor) turns it OFF once it's abundant, since the cell no longer needs to make more.", "terms": ["repressible operon"], "src": "assignment"}, {"id": "a9_31", "ch": 9, "type": "tf", "q": "An operon is a group of genes that is under the control of a single operator site.", "correct": true, "exp": "True -- all structural genes within an operon share one operator, so they're switched on or off together as a unit.", "src": "assignment"}, {"id": "a9_32", "ch": 9, "type": "tf", "q": "A mutation that changes a single nucleotide can result in a different amino acid being added into a protein.", "correct": true, "exp": "True -- this describes a missense mutation, where a single base change alters a codon to specify a different amino acid.", "src": "assignment"}, {"id": "a9_33", "ch": 9, "type": "tf", "q": "The entire genome of the donor cell is usually transferred to the recipient cell during bacterial gene transfer.", "correct": false, "exp": "False -- conjugation, transformation, and transduction each typically transfer only a plasmid or a small DNA fragment, not the donor's whole genome.", "src": "assignment"}, {"id": "a9_34", "ch": 9, "type": "mc", "q": "Transposons are:", "opts": ["Transported by transduction", "Transported by a sex pilus", "Transported by conjugation", "Transported by bacteriophages", "Transported by plasmids"], "correct": 4, "exp": "Transposons can insert into plasmids, and because plasmids move easily between cells (via conjugation), this is the classic route by which transposons -- and the resistance genes they often carry -- spread between bacteria.", "src": "assignment"}, {"id": "a9_35", "ch": 9, "type": "mc", "q": "Transcription begins when RNA polymerase binds to the:", "opts": ["Terminator on DNA", "Promoter on RNA", "Promoter on DNA", "Initiator on DNA"], "correct": 2, "exp": "RNA polymerase recognizes and binds the promoter -- a DNA sequence (not RNA) -- to begin transcription.", "src": "assignment"}, {"id": "a9_36", "ch": 9, "type": "mc", "q": "If one strand of DNA contains the bases ACAGT, what is the complementary mRNA sequence?", "opts": ["ACAGT", "UGUCA", "TGTCA", "GUGAC"], "correct": 1, "exp": "Pairing each DNA base to its RNA complement (A-U, C-G, A-U, G-C, T-A): ACAGT becomes UGUCA. TGTCA is a trap -- that's the complementary DNA strand, not RNA.", "src": "assignment"}, {"id": "a9_37", "ch": 9, "type": "mc", "q": "Synthesis of mRNA occurs:", "opts": ["In the 5' to 3' direction, adding new nucleotides to the 3' end", "In the 3' to 5' direction, adding new nucleotides to the 3' end", "In the 3' to 5' direction, adding new nucleotides to the 5' end", "In the 5' to 3' direction, adding new nucleotides to the 5' end"], "correct": 0, "exp": "RNA polymerase, like DNA polymerase, can only extend a growing strand by adding nucleotides to its exposed 3' end -- so synthesis proceeds 5' to 3'.", "src": "assignment"}, {"id": "a9_38", "ch": 9, "type": "mc", "q": "What happens when a hairpin loop forms in mRNA during termination?", "opts": ["Exons are removed from the RNA transcript", "The RNA polymerase and the mRNA dissociate from the DNA", "Transcription of DNA to mRNA begins", "Transcription of the coding strand begins"], "correct": 1, "exp": "A hairpin loop destabilizes RNA polymerase's grip on the DNA template (rho-independent termination), causing the polymerase and finished mRNA to release.", "src": "assignment"}, {"id": "a9_39", "ch": 9, "type": "mc", "q": "A segment of DNA encoding a protein or an RNA molecule is a:", "opts": ["Chromosome", "Phenotype", "Gene", "Genotype"], "correct": 2, "exp": "A gene is a specific DNA sequence coding for a protein or functional RNA molecule -- a chromosome is the larger structure containing many genes.", "src": "assignment"}, {"id": "a9_40", "ch": 9, "type": "mc", "q": "Which term describes the physical expression of the genes present, which can change depending on which genes are turned 'on'?", "opts": ["Chromosome", "Phenotype", "Genotype", "Plasmid"], "correct": 1, "exp": "Phenotype is the expressed, observable trait -- genotype is the underlying genetic makeup, whether expressed or not.", "src": "assignment"}, {"id": "a9_41", "ch": 9, "type": "mc", "q": "Which nitrogenous base is NOT present in RNA?", "opts": ["Adenine", "Cytosine", "Guanine", "Thymine", "Uracil"], "correct": 3, "exp": "RNA uses uracil in place of thymine; thymine is exclusive to DNA.", "src": "assignment"}, {"id": "a9_42", "ch": 9, "type": "tf", "q": "Both DNA and RNA are usually double-stranded molecules.", "correct": false, "exp": "False -- DNA is normally double-stranded, but RNA is normally single-stranded (though it can fold back on itself into shapes, like tRNA's cloverleaf).", "src": "assignment"}, {"id": "a9_43", "ch": 9, "type": "mc", "q": "Which bond connects amino acids together in a protein?", "opts": ["Peptide", "Ionic", "Hydrogen", "Glycosidic"], "correct": 0, "exp": "Peptide bonds link adjacent amino acids during translation; hydrogen bonds hold DNA base pairs, and glycosidic bonds connect sugars.", "src": "assignment"}, {"id": "a9_44", "ch": 9, "type": "tf", "q": "If you know the sequence of nucleotides in mRNA, you can deduce the DNA sequence it was transcribed from.", "correct": true, "exp": "True -- since mRNA is built by direct complementary base-pairing with the DNA template (U instead of T), you can work backward from mRNA to DNA.", "src": "assignment"}, {"id": "a9_45", "ch": 9, "type": "mc", "q": "Which of the following depicts the direction genetic information flows?", "opts": ["Protein -> DNA -> RNA", "DNA -> RNA -> protein", "RNA -> protein -> DNA", "RNA -> DNA -> protein"], "correct": 1, "exp": "This is the Central Dogma of molecular biology: DNA to RNA to protein (RNA viruses/retroviruses are the only exceptions that can reverse part of this flow).", "src": "assignment"}, {"id": "a9_46", "ch": 9, "type": "tf", "q": "Replication, transcription, and translation all take place in the bacterial cytoplasm.", "correct": true, "exp": "True -- with no nucleus to separate them, all three processes happen in the same cytoplasmic space in bacteria.", "src": "assignment"}, {"id": "a9_47", "ch": 9, "type": "tf", "q": "Prokaryotes lack membrane-enclosed organelles.", "correct": true, "exp": "True -- bacteria and archaea have no nucleus or other membrane-bound organelles, unlike eukaryotic cells.", "src": "assignment"}, {"id": "a9_48", "ch": 9, "type": "mc", "q": "Which of the following occurs in BOTH prokaryotes and eukaryotes?", "opts": ["Translation", "DNA replication", "Transcription", "All of these choices are correct"], "correct": 3, "exp": "Translation, replication, and transcription are all fundamental processes shared by every cellular life form -- what differs is HOW and WHERE each occurs, not whether it happens.", "src": "assignment"}, {"id": "a9_49", "ch": 9, "type": "mc", "q": "Translation of mRNA into protein begins before transcription is complete in:", "opts": ["Neither prokaryotes nor eukaryotes", "Eukaryotes only", "Prokaryotes only", "Both prokaryotes and eukaryotes"], "correct": 2, "exp": "Because prokaryotes lack a nuclear membrane, ribosomes can begin translating an mRNA transcript while RNA polymerase is still transcribing further down the gene -- impossible in eukaryotes.", "src": "assignment"}, {"id": "a9_50", "ch": 9, "type": "tf", "q": "In prokaryotes, the mRNA transcript encounters ribosomal parts immediately as it leaves the DNA.", "correct": true, "exp": "True -- this is exactly why prokaryotic transcription and translation can run simultaneously; ribosomes attach almost as soon as mRNA starts forming.", "src": "assignment"}, {"id": "a9_51", "ch": 9, "type": "mc", "q": "In prokaryotes, which term describes a cluster of genes that perform related functions, regulated together?", "opts": ["Intron", "Transposon", "Exon", "Operon"], "correct": 3, "exp": "An operon bundles structural genes for a shared pathway under one regulatory region, so they're all switched on or off together.", "src": "assignment"}, {"id": "a9_52", "ch": 9, "type": "mc", "q": "Eukaryotic mRNA contains non-coding regions called:", "opts": ["Transcriptors", "Introns", "Transposons", "Exons"], "correct": 1, "exp": "Introns are the non-coding, intervening sequences in eukaryotic genes that get excised during splicing; exons are the coding regions that remain.", "src": "assignment"}, {"id": "a9_53", "ch": 9, "type": "mc", "q": "Introns are removed and exons are spliced together:", "opts": ["After translation", "Before translation", "Before transcription"], "correct": 1, "exp": "Splicing (via the spliceosome) happens after transcription produces the pre-mRNA, but before that mature mRNA leaves the nucleus for translation.", "src": "assignment"}, {"id": "a9_54", "ch": 9, "type": "tf", "q": "Eukaryotic mRNA usually specifies multiple proteins.", "correct": false, "exp": "False -- eukaryotic mRNA is monocistronic (codes for just one protein); it's bacterial mRNA that's often polycistronic (codes for several in series).", "src": "assignment"}, {"id": "a9_55", "ch": 9, "type": "tf", "q": "Only eukaryotic mRNA is processed (spliced) prior to translation.", "correct": true, "exp": "True -- only eukaryotic pre-mRNA undergoes intron removal/splicing; prokaryotic mRNA, lacking introns, needs no such processing.", "src": "assignment"}, {"id": "a9_56", "ch": 9, "type": "tf", "q": "Translation of eukaryotic mRNA can occur in the nucleus after exons are spliced together.", "correct": false, "exp": "False -- splicing happens in the nucleus, but translation always occurs in the cytoplasm (or at the ER); mature mRNA must exit the nucleus first.", "src": "assignment"}, {"id": "a9_57", "ch": 9, "type": "tf", "q": "Translation occurs on ribosomes only in prokaryotes.", "correct": false, "exp": "False -- ribosomes are universal machinery for translation in both prokaryotes and eukaryotes; only the ribosome's size/type (70S vs. 80S) and location differ.", "src": "assignment"}, {"id": "a9_58", "ch": 9, "type": "mc", "q": "How do the processes of transcription and translation differ between prokaryotes and eukaryotes?", "opts": ["Prokaryotes transcribe DNA in the nucleus", "Eukaryotes transcribe DNA in the cytoplasm", "Eukaryotes translate DNA in the nucleus", "Prokaryotic mRNA must be processed by removing introns prior to translation", "Prokaryotes transcribe and translate simultaneously"], "correct": 4, "exp": "The key, well-supported difference is that prokaryotes (no nuclear membrane) can transcribe and translate simultaneously, which eukaryotes cannot do.", "src": "assignment"}, {"id": "a9_59", "ch": 9, "type": "mc", "q": "One advantage of having genetic control mechanisms (like operons) is that:", "opts": ["Enzymes are only produced when they are needed", "The chance of mutations during RNA synthesis is reduced", "Too many sections of the DNA molecule are not used at the same time", "Free nucleotides are not used up too rapidly"], "correct": 0, "exp": "Gene regulation ensures enzymes are made only when their products are actually required, preventing the cell from wasting energy and materials on unneeded synthesis.", "src": "assignment"}, {"id": "a9_60", "ch": 9, "type": "mc", "q": "A mechanism that blocks transcription will:", "opts": ["Block the production of mRNA", "Block mRNA from binding to ribosomes", "Block passage of mRNA out of the nucleus", "Block ribosomes from producing protein"], "correct": 0, "exp": "Transcription is, by definition, what produces mRNA -- if it's blocked, RNA polymerase never makes mRNA in the first place. Blocking ribosome binding or nuclear export would instead interfere with translation, a separate downstream step.", "src": "assignment"}, {"id": "a9_61", "ch": 9, "type": "mc", "q": "When a repressor binds to the operator site on DNA, it:", "opts": ["Blocks RNA polymerase and mRNA synthesis", "Prevents the binding of the substrate to the operator site", "Causes the operator site to form a hairpin loop with the structural locus", "Links adjacent thymines and alters DNA folding"], "correct": 0, "exp": "A repressor physically occupying the operator blocks RNA polymerase from transcribing the structural genes, so no mRNA is made.", "src": "assignment"}, {"id": "a9_62", "ch": 9, "type": "mc", "q": "Repressible operons, such as the arg operon, are usually:", "opts": ["In the off mode", "In the on mode", "Inactivated by low levels of nutrients", "Activated by high levels of nutrients"], "correct": 1, "exp": "Repressible operons are normally ON and are switched OFF by a corepressor (like arginine or tryptophan) once that end-product builds up -- the opposite pattern from inducible operons like lac.", "terms": ["repressible operon"], "src": "assignment"}, {"id": "a9_63", "ch": 9, "type": "mc", "q": "In some positive-control pathways, in the absence of an inducer (e.g., arabinose):", "opts": ["The activator protein can't bind DNA, and RNA polymerase can't bind the promoter site", "The activator protein can't compete with the repressor for the operator site", "Formation of polyribosome complexes is blocked", "The activator protein can't bind DNA, and RNA polymerase can't bind the operator site"], "correct": 0, "exp": "In positive-control systems like the ara operon, an activator protein must bind DNA to help recruit RNA polymerase to the promoter; without the inducer, the activator can't bind, so RNA polymerase can't effectively engage the promoter.", "src": "assignment"}, {"id": "a9_64", "ch": 9, "type": "mc", "q": "When a ribosome reaches one of three stop codons, it halts protein synthesis and releases the finished polypeptide chain. These three codons are known as:", "opts": ["Stop codons (nonsense codons)", "Start codons", "Silent codons", "Anticodons"], "correct": 0, "exp": "The three stop (nonsense) codons -- UAA, UAG, UGA -- have no corresponding tRNA; reaching one triggers a release factor that frees the finished protein from the ribosome.", "src": "assignment"}, {"id": "a9_65", "ch": 9, "type": "tf", "q": "Depending on where it occurs, a missense mutation can create a nonfunctional protein, produce a protein with altered function, or have no significant impact on protein function at all.", "correct": true, "exp": "True -- this is a key exam trap, since a missense mutation can go any of these three ways depending on how critical the substituted amino acid is to the protein's structure.", "src": "assignment"}, {"id": "a9_66", "ch": 9, "type": "mc", "q": "Direct transfer of DNA from a donor cell to a recipient cell via physical contact is called:", "opts": ["Transformation", "Transduction", "Conjugation"], "correct": 2, "exp": "Conjugation requires direct cell-to-cell contact through a sex pilus to transfer DNA (usually a plasmid).", "src": "assignment"}, {"id": "a9_67", "ch": 9, "type": "mc", "q": "Uptake of free DNA from the surrounding environment by a competent bacterial cell is called:", "opts": ["Transformation", "Transduction", "Conjugation"], "correct": 0, "exp": "Transformation involves a competent cell absorbing loose DNA fragments released into its environment -- no direct contact or viral vector needed.", "src": "assignment"}, {"id": "a9_68", "ch": 9, "type": "mc", "q": "Transfer of DNA between bacteria using a bacteriophage as the vector is called:", "opts": ["Transformation", "Transduction", "Conjugation"], "correct": 1, "exp": "Transduction uses a bacteriophage that accidentally packages host DNA and delivers it to a new bacterial cell during infection.", "src": "assignment"}, {"id": "q_c9_01", "ch": 9, "type": "mc", "q": "During translation, a new tRNA enters the ribosome at the ________ site, while the tRNA being discharged exits via the ________ site.", "opts": ["A site; E site", "P site; A site", "E site; P site", "A site; P site"], "correct": 0, "exp": "A new tRNA enters at the A (aminoacyl) site; the tRNA being released exits via the E (exit) site, after shifting through the P (peptidyl) site.", "terms": ["translation"], "src": "quiz1"}, {"id": "q_c9_02", "ch": 9, "type": "tf", "q": "The peptide bond formed during translation is created by a condensation reaction linking the amino acids on two adjacent tRNAs.", "correct": true, "exp": "True -- this condensation reaction (per Process Figure 9.18) joins the growing polypeptide to the newly arrived amino acid, releasing a water molecule.", "terms": ["translation"], "src": "quiz1"}, {"id": "q_c9_03", "ch": 9, "type": "mc", "q": "Which term is defined as the sum total of genetic material in a cell?", "opts": ["Genetics", "Heredity", "Genome", "Phenotype"], "correct": 2, "exp": "Genome is the sum total of all genetic material (DNA) in a cell. Genetics is the study of heredity; heredity is trait transmission; phenotype is expressed traits.", "src": "quiz1"}, {"id": "q_c9_04", "ch": 9, "type": "tf", "q": "DNA is the blueprint that indicates which kinds of proteins to make and how to make them.", "correct": true, "exp": "True -- the order of triplets along the DNA strand directs a protein's amino acid sequence, which determines its shape and function.", "src": "quiz1"}, {"id": "q_c9_05", "ch": 9, "type": "tf", "q": "The lac operon is normally in an off mode and does not initiate enzyme synthesis when the appropriate substrate is absent.", "correct": true, "exp": "True -- the lac operon is inducible: normally OFF, and only switched ON by an inducer (lactose) when the substrate is actually present.", "src": "quiz1"}, {"id": "q_c9_06", "ch": 9, "type": "mc", "q": "Population changes, and thus evolution, result from variations called genetic:", "opts": ["Regulations", "Translations", "Mutations", "Operons"], "correct": 2, "exp": "Mutations are heritable DNA changes that create the variation populations need for evolution by natural selection.", "src": "quiz1"}, {"id": "q_c9_07", "ch": 9, "type": "tf", "q": "Transformation is a mode of genetic recombination in which a plasmid is transferred from a donor cell to a recipient cell via a direct connection.", "correct": false, "exp": "False -- that description is conjugation (direct cell-to-cell contact via a pilus). Transformation is uptake of free DNA fragments from the environment, with no direct connection involved.", "src": "quiz1"}, {"id": "q_c9_08", "ch": 9, "type": "mc", "q": "Transcription is characterized by:", "opts": ["A messenger RNA molecule synthesized from the DNA molecule in the nucleus", "A transfer RNA molecule synthesized from the DNA molecule in the nucleus", "A ribosomal RNA molecule synthesized from the DNA molecule in the nucleus", "The blueprint of the RNA molecule used to bind amino acids together to form proteins", "The binding of enzymes to their substrates to produce products"], "correct": 0, "exp": "Transcription is most directly characterized by mRNA synthesis from a DNA template -- the molecule that carries the protein-coding message onward to translation.", "src": "quiz1"}, {"id": "q_c9_09", "ch": 9, "type": "mc", "q": "Extra pieces of DNA found in bacteria are called:", "opts": ["Genomic fragments", "Gene fragments", "Chromosomes", "Plasmids", "Mitochondrial DNA"], "correct": 3, "exp": "Plasmids are small, circular, extrachromosomal DNA pieces in bacteria, separate from the main chromosome, often carrying advantageous genes like antibiotic resistance.", "src": "quiz1"}, {"id": "q_c9_10", "ch": 9, "type": "mc", "q": "In eukaryotes, transcription occurs in the ________. In prokaryotes, transcription occurs in the ________.", "opts": ["Nucleus; cytoplasm", "Cytoplasm; nucleus", "Nucleus; nucleus", "Cytoplasm; cytoplasm"], "correct": 0, "exp": "Eukaryotes have a nuclear membrane confining transcription to the nucleus; prokaryotes have no nucleus, so transcription happens directly in the cytoplasm.", "src": "quiz1"}, {"id": "q_c6_01", "ch": 6, "type": "tf", "q": "The viral envelope is entirely formed from viral material.", "correct": false, "exp": "False -- the envelope is derived from the host cell's own membrane as the virus buds out; it's a hybrid, since host membrane proteins get replaced with viral spike proteins, but the lipid bilayer itself is host-derived.", "src": "quiz1"}, {"id": "q_c6_02", "ch": 6, "type": "mc", "q": "What is the correct sequence for bacteriophage multiplication, from first step to last?", "opts": ["Adsorption, Penetration, Synthesis, Assembly, Release", "Penetration, Adsorption, Synthesis, Assembly, Release", "Adsorption, Synthesis, Penetration, Assembly, Release", "Adsorption, Penetration, Assembly, Synthesis, Release"], "correct": 0, "exp": "Adsorption (attach) -> Penetration (inject DNA) -> Synthesis (replicate/make proteins) -> Assembly (package virions) -> Release (lyse host cell).", "src": "quiz1"}, {"id": "q_c6_03", "ch": 6, "type": "tf", "q": "Once a phage becomes lysogenic, it will remain lysogenic and never be lytic again.", "correct": false, "exp": "False -- a lysogenic (prophage) state isn't permanent. Triggers like UV light can induce the prophage to excise and re-enter the lytic cycle.", "terms": ["lysogeny"], "src": "quiz1"}, {"id": "q_c6_04", "ch": 6, "type": "mc", "q": "Which of the following is NOT true of all viruses?", "opts": ["They possess a capsid composed of protein", "They are reliant on a host cell for their own reproduction", "They are free-living organisms", "They contain either DNA or RNA, never both"], "correct": 2, "exp": "Viruses are obligate intracellular parasites, not free-living -- they can't replicate or carry out metabolism outside a host cell. The other three statements are true of every virus.", "src": "quiz1"}, {"id": "q_c6_05", "ch": 6, "type": "tf", "q": "All viruses possess a capsid composed of protein.", "correct": true, "exp": "True -- every virus has a protein capsid enclosing its genetic material, regardless of whether it also has an envelope.", "src": "quiz1"}, {"id": "q_c6_06", "ch": 6, "type": "mc", "q": "Which of the following diseases is caused by a prion, not a virus?", "opts": ["Measles", "Mumps", "Creutzfeldt-Jakob disease", "Influenza"], "correct": 2, "exp": "CJD is a prion disease (a transmissible spongiform encephalopathy); measles, mumps, and influenza are all caused by RNA viruses, not prions.", "src": "quiz1"}, {"id": "q_c6_07", "ch": 6, "type": "tf", "q": "Prions are resistant to routine sterilization techniques.", "correct": true, "exp": "True -- prions resist standard heat, chemical disinfection, and radiation sterilization, which is exactly what makes them so hard to decontaminate (e.g., on surgical instruments).", "src": "quiz1"}];
