matter externally.", "src": "chapter"}, {"id": "c5_14", "ch": 5, "type": "mc", "q": "Mitochondria likely originated from", "opts": ["Archaea", "Invaginations of the cell membrane", "Bacteria", "Cyanobacteria"], "correct": 2, "exp": "Mitochondria descend from engulfed aerobic bacteria (endosymbiotic theory); chloroplasts descend from cyanobacteria.", "src": "chapter"}, {"id": "c7_04", "ch": 7, "type": "mc", "q": "An obligate halophile requires high", "opts": ["pH", "Temperature", "Salt", "Pressure"], "correct": 2, "exp": "Halophiles need high salt concentrations to survive.", "src": "chapter"}, {"id": "c7_06", "ch": 7, "type": "mc", "q": "Which of the following substances are required by all organisms?", "opts": ["Organic nutrients", "Inorganic nutrients", "Growth factors", "Oxygen gas"], "correct": 1, "exp": "All organisms need inorganic nutrients; the other options vary by organism type.", "src": "chapter"}, {"id": "c7_08", "ch": 7, "type": "mc", "q": "Which of the following is true of passive transport?", "opts": ["Requires a gradient", "Uses the cell wall", "Includes endocytosis", "Only moves water"], "correct": 0, "exp": "Passive transport moves substances down their concentration gradient, no energy needed.", "src": "chapter"}, {"id": "c7_09", "ch": 7, "type": "mc", "q": "A cell exposed to a hypertonic environment will ______ by osmosis.", "opts": ["Gain water", "Lose water", "Neither gain nor lose water", "Burst"], "correct": 1, "exp": "In a hypertonic environment (more solute outside), water leaves the cell.", "src": "chapter"}, {"id": "c7_11", "ch": 7, "type": "mc", "q": "Psychrophiles would be expected to grow", "opts": ["In hot springs", "On the human body", "At refrigeration temperatures", "At low pH"], "correct": 2, "exp": "Psychrophiles are cold-loving, optimal growth below 15°C.", "src": "chapter"}, {"id": "c7_14", "ch": 7, "type": "mc", "q": "The time required for a cell to undergo binary fission is called the", "opts": ["Exponential growth rate", "Growth curve", "Generation time", "Lag period"], "correct": 2, "exp": "Generation (doubling) time is the time per division cycle.", "src": "chapter"}, {"id": "c7_15", "ch": 7, "type": "mc", "q": "In a viable plate count, each ______ represents a ______ from the sample population.", "opts": ["cell, colony", "colony, cell", "hour, generation", "cell, generation"], "correct": 1, "exp": "Each visible colony arose from one viable cell.", "src": "chapter"}, {"id": "c7_16", "ch": 7, "type": "mc", "q": "The stage in population growth with the highest rate of cell division is the", "opts": ["Stationary phase", "Lag phase", "Exponential phase", "Enlargement phase"], "correct": 2, "exp": "Exponential (log) phase has the fastest division rate.", "src": "chapter"}, {"id": "c8_05", "ch": 8, "type": "mc", "q": "Catalysis occurs at the ______ site of an enzyme.", "opts": ["cofactor", "allosteric", "redox", "active"], "correct": 3, "exp": "The active site is where substrate binds and the reaction is catalyzed.", "src": "chapter"}, {"id": "c8_06", "ch": 8, "type": "mc", "q": "Many coenzymes contain", "opts": ["Metals", "Vitamins", "Proteins", "Substrates"], "correct": 1, "exp": "Many coenzymes are vitamin-derived (e.g., NAD+ from niacin).", "src": "chapter"}, {"id": "c8_07", "ch": 8, "type": "mc", "q": "To digest cellulose in its environment, a fungus produces a/an", "opts": ["Endoenzyme", "Exoenzyme", "Catalase", "Polymerase"], "correct": 1, "exp": "Exoenzymes are secreted outside the cell to digest material in the environment.", "terms": ["enzyme vocab"], "src": "chapter"}, {"id": "c8_13", "ch": 8, "type": "mc", "q": "A product or products of glycolysis is/are", "opts": ["ATP", "Pyruvic acid", "CO2", "Both a and b"], "correct": 3, "exp": "Glycolysis produces both net ATP and pyruvic acid (no CO2).", "src": "chapter"}, {"id": "c8_14", "ch": 8, "type": "mc", "q": "Fermentation of a glucose molecule has the potential to produce a net number of ______ ATPs.", "opts": ["4", "2", "38", "32"], "correct": 1, "exp": "Fermentation nets only 2 ATP (from glycolysis) -- no ETC involved.", "src": "chapter"}, {"id": "c8_15", "ch": 8, "type": "mc", "q": "Complete oxidation of glucose in aerobic respiration by a eukaryote could potentially yield a net maximum output of ______ ATPs.", "opts": ["40", "30", "38", "2"], "correct": 2, "exp": "38 ATP is the theoretical maximum for complete glucose oxidation, in both bacterial and eukaryotic cells -- no prokaryote/eukaryote distinction is drawn here.", "src": "chapter"}, {"id": "c8_16", "ch": 8, "type": "mc", "q": "The compound that enters the Krebs cycle is", "opts": ["Citric acid", "Oxaloacetic acid", "Pyruvic acid", "Acetyl coenzyme A"], "correct": 3, "exp": "Acetyl-CoA (from pyruvate via the transition step) enters the Krebs cycle, combining with oxaloacetic acid to form citric acid.", "src": "chapter"}, {"id": "c8_18", "ch": 8, "type": "mc", "q": "The proton motive force is the result of", "opts": ["ATP synthase transporting protons during ATP synthesis", "An electron gradient between the matrix and intermembrane space", "A proton gradient between the matrix and intermembrane space of a mitochondrion", "A buildup of negatively charged ions"], "correct": 2, "exp": "The PMF is a proton (H+) gradient, not an electron gradient.", "src": "chapter"}, {"id": "n1_01", "ch": 1, "type": "mc", "q": "A tentative, testable explanation for an observation is called a:", "opts": ["Law", "Hypothesis", "Theory", "Postulate", "None of these choices are correct"], "correct": 1, "exp": "A hypothesis is the first, tentative step -- a testable explanation, not yet broadly confirmed.", "src": "quiz1"}, {"id": "n1_02", "ch": 1, "type": "mc", "q": "Once an explanation is supported by numerous peer-reviewed studies over time, it is elevated to the status of a:", "opts": ["Hypothesis", "Law", "Theory", "Fact", "Postulate"], "correct": 2, "exp": "Repeated, peer-reviewed support moves an explanation from hypothesis to theory.", "src": "quiz1"}, {"id": "n1_03", "ch": 1, "type": "mc", "q": "Which of the following represents the HIGHEST level of confidence in science?", "opts": ["A hypothesis", "An experiment", "A theory", "A law", "An observation"], "correct": 3, "exp": "A law is reserved for the highest-confidence, most rigorously tested scientific explanations.", "src": "quiz1"}, {"id": "n1_04", "ch": 1, "type": "mc", "q": "A disease that is new to a population and being reported in increasing numbers is called a(n) ______ disease, while one that had declined but is now rising again is called a(n) ______ disease.", "opts": ["reemerging; emerging", "emerging; reemerging", "zoonotic; pandemic", "pandemic; epidemic"], "correct": 1, "exp": "Emerging = new to the population; reemerging = previously present, now rising again.", "src": "quiz1"}, {"id": "n1_05", "ch": 1, "type": "mc", "q": "When cases of a disease have been detected across multiple continents, it is declared a(n):", "opts": ["Epidemic", "Outbreak", "Endemic", "Pandemic", "Zoonosis"], "correct": 3, "exp": "Pandemic = multi-continent spread, distinct from a regional epidemic.", "src": "quiz1"}, {"id": "n1_06", "ch": 1, "type": "mc", "q": "A disease acquired by humans from a particular animal is considered:", "opts": ["Endemic", "Zoonotic", "Nosocomial", "Idiopathic", "Iatrogenic"], "correct": 1, "exp": "Zoonotic diseases jump from an animal reservoir to humans.", "src": "quiz1"}, {"id": "n1_07", "ch": 1, "type": "mc", "q": "In the late 1600s, ______ designed simple single-lens microscopes to observe microbes, which he called 'animalcules.'", "opts": ["Robert Koch", "Van Leeuwenhoek", "Louis Pasteur", "Joseph Lister"], "correct": 1, "exp": "Van Leeuwenhoek pioneered simple microscopy and coined the term 'animalcules.'", "src": "quiz1"}, {"id": "n1_08", "ch": 1, "type": "mc", "q": "Which pioneer introduced aseptic technique into the operating room to reduce surgical infections?", "opts": ["Joseph Lister", "Robert Koch", "Louis Pasteur", "Ignaz Semmelweis", "Edward Jenner"], "correct": 0, "exp": "Lister pioneered antiseptic surgery -- don't confuse with Semmelweis, who focused on handwashing in obstetrics.", "src": "quiz1"}, {"id": "n1_09", "ch": 1, "type": "mc", "q": "Which Golden Age microbiologist established four postulates for determining an organism's pathogenicity, and developed many lab techniques still used today?", "opts": ["Louis Pasteur", "Joseph Lister", "Robert Koch", "John Tyndall", "Edward Jenner"], "correct": 2, "exp": "Koch's postulates and pure-culture technique are his two lasting contributions.", "src": "quiz1"}, {"id": "n1_10", "ch": 1, "type": "mc", "q": "Which group of microorganisms is acellular, consisting of minute particles that can only parasitize and replicate inside living cells?", "opts": ["Bacteria", "Protozoa", "Viruses", "Fungi", "Helminths"], "correct": 2, "exp": "Viruses alone are acellular among the groups studied in microbiology.", "src": "quiz1"}, {"id": "n1_11", "ch": 1, "type": "mc", "q": "Which group consists of multicellular eukaryotic organisms, such as parasitic worms?", "opts": ["Protozoa", "Helminths", "Fungi", "Algae", "Bacteria"], "correct": 1, "exp": "Helminths (parasitic worms) are multicellular animals, unlike the other microbial groups.", "src": "quiz1"}, {"id": "n1_12", "ch": 1, "type": "mc", "q": "Which group is defined as single- or multi-cellular eukaryotes that photosynthesize to obtain energy?", "opts": ["Fungi", "Protozoa", "Algae", "Bacteria", "Helminths"], "correct": 2, "exp": "Algae are the photosynthetic eukaryotic group (unlike fungi and protozoa, which are heterotrophic).", "src": "quiz1"}, {"id": "n1_13", "ch": 1, "type": "mc", "q": "Which domain has the closest molecular (rRNA) relationship to Domain Eukarya, and includes methane-producers and extremophiles?", "opts": ["Domain Bacteria", "Domain Archaea", "Domain Eukarya itself", "Domain Protista"], "correct": 1, "exp": "Archaea -- despite being prokaryotic -- are molecularly closer to Eukarya than to Bacteria.", "src": "quiz1", "terms": ["Archaea"]}, {"id": "n1_14", "ch": 1, "type": "mc", "q": "Staphylococcus aureus, a prokaryote with a peptidoglycan cell wall, belongs to which domain?", "opts": ["Domain Archaea", "Domain Eukarya", "Domain Bacteria", "Domain Protista"], "correct": 2, "exp": "Peptidoglycan cell walls are characteristic of Domain Bacteria.", "src": "quiz1"}, {"id": "n1_15", "ch": 1, "type": "mc", "q": "Which of these is true of viruses, but NOT of either prokaryotic or eukaryotic cells?", "opts": ["They contain nucleic acid", "They contain ribosomes and enzymes", "They cannot replicate independently and contain no ribosomes", "They undergo mitosis", "They replicate via binary fission"], "correct": 2, "exp": "Viruses lack ribosomes entirely and cannot replicate on their own -- they hijack a host cell's machinery.", "src": "quiz1"}, {"id": "n1_16", "ch": 1, "type": "mc", "q": "Which structure/capability is shared by BOTH prokaryotic and eukaryotic cells, but NOT by viruses?", "opts": ["A nucleus", "Ribosomes and enzymes", "Mitosis", "Chloroplasts", "A nuclear envelope"], "correct": 1, "exp": "Both cell types have ribosomes and enzymes; viruses have neither.", "src": "quiz1"}, {"id": "n1_17", "ch": 1, "type": "mc", "q": "Which size range and feature correctly describes a prokaryote?", "opts": ["10-200 nm; acellular", "1-10 micrometers; lacks a nucleus", "1-10 micrometers; has a nucleus", "10-200 nm; has a nucleus"], "correct": 1, "exp": "Prokaryotes are typically 1-10 micrometers and lack a nucleus; viruses (10-200 nm) are smaller still and acellular.", "src": "assignment"}, {"id": "n1_18", "ch": 1, "type": "mc", "q": "Which of these correctly pairs each scientist with his key contribution: Koch, Pasteur, Lister?", "opts": ["Koch disproved spontaneous generation; Pasteur developed postulates; Lister introduced aseptic surgery", "Koch developed postulates linking a microbe to a disease; Pasteur disproved spontaneous generation; Lister introduced aseptic surgery", "Koch introduced aseptic surgery; Pasteur developed postulates; Lister disproved spontaneous generation", "All three disproved spontaneous generation independently"], "correct": 1, "exp": "A clean way to keep these straight: Pasteur disproved (spontaneous generation), Koch proved (specific germ-disease links via his postulates), Lister applied (germ theory to surgery).", "src": "assignment"}, {"id": "n1_19", "ch": 1, "type": "mc", "q": "Which term refers specifically to the EVOLUTIONARY RELATEDNESS between groups of organisms, as opposed to the formal system of naming and classifying them?", "opts": ["Taxonomy", "Nomenclature", "Phylogeny", "Taxa", "Hierarchy"], "correct": 2, "exp": "Phylogeny is about relatedness/lineage; taxonomy is the broader classification science built increasingly on phylogeny.", "src": "assignment", "terms": ["taxonomy"]}, {"id": "n1_20", "ch": 1, "type": "mc", "q": "An individual taxonomic category -- such as a particular species, genus, or family -- is called a:", "opts": ["Taxon (plural: taxa)", "Phylogeny", "Hierarchy", "Nomenclature"], "correct": 0, "exp": "Taxa are the individual ranked units within the taxonomic hierarchy.", "src": "assignment", "terms": ["taxonomy"]}, {"id": "n4_01", "ch": 4, "type": "mc", "q": "Teichoic acid is a cell wall component found in:", "opts": ["Gram-negative cells only", "Gram-positive cells only", "Both gram-positive and gram-negative cells", "Acid-fast cells only", "Mycoplasmas only"], "correct": 1, "exp": "Teichoic acid is embedded in the thick peptidoglycan layer unique to gram-positive walls.", "src": "quiz1"}, {"id": "n4_02", "ch": 4, "type": "mc", "q": "Lipopolysaccharide (LPS) and the outer membrane are found in:", "opts": ["Gram-positive cells only", "Gram-negative cells only", "Both gram-positive and gram-negative cells", "Mycoplasmas only"], "correct": 1, "exp": "LPS and the outer membrane are defining, exclusive features of the gram-negative wall.", "src": "quiz1"}, {"id": "n4_03", "ch": 4, "type": "mc", "q": "Which type of cell wall is composed of a thick layer of mycolic acid (cord factor)?", "opts": ["Gram-positive cells", "Gram-negative cells", "Acid-fast cells", "Mycoplasmas"], "correct": 2, "exp": "Acid-fast cells (e.g., Mycobacterium) have a waxy, mycolic-acid-rich wall that resists standard Gram staining.", "src": "quiz1", "terms": ["acid-fast"]}, {"id": "n4_04", "ch": 4, "type": "mc", "q": "Which type of cell lacks a peptidoglycan wall entirely but has sterols in its membrane for strength?", "opts": ["Gram-positive cells", "Gram-negative cells", "Acid-fast cells", "Mycoplasmas"], "correct": 3, "exp": "Mycoplasmas naturally lack a cell wall and rely on membrane sterols instead.", "src": "quiz1"}, {"id": "n4_05", "ch": 4, "type": "mc", "q": "A single flagellum attached at one end of the cell is described as:", "opts": ["Peritrichous", "Monotrichous", "Lophotrichous", "Amphitrichous", "Atrichous"], "correct": 1, "exp": "Mono- = one flagellum at one pole.", "src": "quiz1"}, {"id": "n4_06", "ch": 4, "type": "mc", "q": "A tuft of several flagella originating from the same point on one end of the cell is described as:", "opts": ["Monotrichous", "Peritrichous", "Lophotrichous", "Amphitrichous"], "correct": 2, "exp": "Lopho- = a tuft at one point.", "src": "quiz1"}, {"id": "n4_07", "ch": 4, "type": "mc", "q": "Flagella at BOTH poles of the cell is described as:", "opts": ["Monotrichous", "Lophotrichous", "Amphitrichous", "Peritrichous"], "correct": 2, "exp": "Amphi- = both ends.", "src": "quiz1"}, {"id": "n4_08", "ch": 4, "type": "mc", "q": "Flagella distributed randomly all over the entire cell surface is described as:", "opts": ["Monotrichous", "Lophotrichous", "Amphitrichous", "Peritrichous"], "correct": 3, "exp": "Peri- = all around.", "src": "quiz1"}, {"id": "n4_09", "ch": 4, "type": "mc", "q": "Short, bristle-like projections used to attach a bacterial cell to other cells or surfaces are:", "opts": ["Flagella", "Fimbriae", "Pili", "Axial filaments"], "correct": 1, "exp": "Fimbriae are for attachment; don't confuse with the longer pili (conjugation).", "src": "quiz1"}, {"id": "n4_10", "ch": 4, "type": "mc", "q": "Long, coiled internal threads that provide corkscrew-like movement to spirochetes are called:", "opts": ["Fimbriae", "Pili", "Axial filaments (endoflagella)", "Flagella"], "correct": 2, "exp": "Axial filaments run within the periplasmic space and flex the spirochete's body for movement.", "src": "quiz1"}, {"id": "n4_11", "ch": 4, "type": "mc", "q": "A loosely attached, thin, mucoid layer that protects a cell from drying out or losing nutrients, but is NOT well organized, is called a:", "opts": ["Capsule", "Slime layer", "Cell wall", "Outer membrane"], "correct": 1, "exp": "A slime layer is the loose, disorganized form of glycocalyx (vs. the tightly-bound capsule).", "src": "quiz1"}, {"id": "n4_12", "ch": 4, "type": "mc", "q": "Which bacterial structure contains NONESSENTIAL DNA, such as antibiotic resistance genes, separate from the main chromosome?", "opts": ["Chromosome", "Plasmid", "Ribosome", "Cytoskeleton", "Nucleoid"], "correct": 1, "exp": "Plasmids carry extra, nonessential genes -- like antibiotic resistance -- apart from the essential chromosome.", "src": "assignment"}, {"id": "n4_13", "ch": 4, "type": "mc", "q": "Which internal bacterial structure is a network of protein polymers that stabilizes cell shape from within?", "opts": ["Cytoskeleton", "Plasmid", "Ribosome", "Inclusion body"], "correct": 0, "exp": "The bacterial cytoskeleton provides internal structural support, much like in eukaryotic cells.", "src": "assignment"}, {"id": "n4_14", "ch": 4, "type": "mc", "q": "A bacterial structure that stores ORGANIC nutrients during times of plenty for use when scarce is called a(n):", "opts": ["Granule", "Inclusion body", "Plasmid", "Ribosome"], "correct": 1, "exp": "Inclusion bodies store organic nutrients; granules (by contrast) store inorganic compounds like sulfur or polyphosphate.", "src": "assignment"}, {"id": "n4_15", "ch": 4, "type": "mc", "q": "A bacterial structure that stores INORGANIC compounds, such as sulfur or polyphosphate, is called a(n):", "opts": ["Inclusion body", "Granule", "Plasmid", "Cytoskeleton element"], "correct": 1, "exp": "Granules store inorganic compounds -- the same concept behind the metachromatic (volutin) granules seen in Corynebacterium.", "src": "assignment"}, {"id": "n4_16", "ch": 4, "type": "mc", "q": "Which statement correctly contrasts a vegetative bacterial cell with its endospore?", "opts": ["The vegetative cell is metabolically inert; the endospore is actively growing", "The vegetative cell shows active metabolism and growth; the endospore is metabolically inert and resistant to hostile conditions", "Both are equally resistant to heat and chemicals", "Only the endospore contains DNA"], "correct": 1, "exp": "The vegetative cell is the normal, living, growing form; the endospore is its dormant, tough survival form -- both still contain DNA and protein.", "src": "assignment", "terms": ["endospore"]}, {"id": "n4_17", "ch": 4, "type": "mc", "q": "Which component of gram-negative bacterial cell walls is most directly associated with triggering septic shock when bacteria die or multiply?", "opts": ["Teichoic acid", "Peptidoglycan", "Lipid A (part of LPS)", "Flagellin", "Capsule polysaccharide"], "correct": 2, "exp": "Lipid A, part of the LPS endotoxin, triggers the massive immune response (fever, inflammation, dropping blood pressure) behind septic shock.", "src": "assignment"}, {"id": "n4_18", "ch": 4, "type": "mc", "q": "A bacterium with a mutation that weakens its cell wall is placed first in a hypotonic solution, then in a hypertonic solution. What happens in each, respectively?", "opts": ["Lyses (bursts); shrivels (crenates)", "Shrivels; lyses", "Lyses; lyses", "Shrivels; shrivels", "No effect in either case"], "correct": 0, "exp": "Hypotonic: water rushes in and the weakened wall can't resist the pressure, so the cell bursts. Hypertonic: water leaves and the cell shrivels -- the weak wall doesn't matter here, since the problem is water loss, not pressure.", "src": "assignment"}, {"id": "n4_19", "ch": 4, "type": "mc", "q": "A recurring bacterial outbreak is traced to a water line, and infections return even after the equipment is cleaned and replaced. What best explains this?", "opts": ["The bacteria are endospore-forming and survive boiling", "A biofilm's protective matrix lets bacteria resist disinfectants and persist even after cleaning", "The bacteria are viruses and cannot be removed by cleaning", "The water line was never actually contaminated"], "correct": 1, "exp": "Biofilms coat bacterial communities in a self-made protective matrix that resists disinfectants and flowing water, so leftover biofilm keeps reseeding the supply even after cleaning.", "src": "assignment", "terms": ["biofilm"]}, {"id": "n5_01", "ch": 5, "type": "mc", "q": "Which eukaryotic microbial group is ALWAYS unicellular?", "opts": ["Fungi", "Algae", "Protozoa", "Helminths"], "correct": 2, "exp": "Protozoa are always single-celled; fungi, algae, and helminths can all include multicellular forms.", "src": "assignment"}, {"id": "n5_02", "ch": 5, "type": "mc", "q": "Which eukaryotic group can be unicellular or multicellular, and includes mushrooms?", "opts": ["Protozoa", "Fungi", "Helminths", "Bacteria"], "correct": 1, "exp": "Fungi range from unicellular yeasts to multicellular molds and mushrooms.", "src": "assignment"}, {"id": "n5_03", "ch": 5, "type": "mc", "q": "Helminths are unusual among eukaryotic microbes studied in microbiology because:", "opts": ["They are always unicellular", "Their adult forms are always multicellular, even though eggs/larvae are microscopic", "They always lack a nervous system", "They are photosynthetic"], "correct": 1, "exp": "Helminths are multicellular animals as adults -- they're studied in microbiology because their eggs and larvae are microscopic.", "src": "assignment"}, {"id": "n5_04", "ch": 5, "type": "mc", "q": "Which organelle contains thylakoids stacked into grana and is the site of the light-dependent reactions of photosynthesis?", "opts": ["Mitochondrion", "Chloroplast", "Smooth ER", "Golgi apparatus"], "correct": 1, "exp": "Thylakoids/grana and the light reactions are defining features of the chloroplast.", "src": "assignment"}, {"id": "n5_05", "ch": 5, "type": "mc", "q": "Which organelle has two membranes, with a folded inner membrane (cristae) that houses the electron transport chain?", "opts": ["Chloroplast", "Mitochondrion", "Rough ER", "Nucleus"], "correct": 1, "exp": "Cristae -- the folded inner mitochondrial membrane -- house the electron transport chain.", "src": "assignment"}, {"id": "n5_06", "ch": 5, "type": "mc", "q": "Which structure is a network of microfilaments and microtubules that anchors, supports, and helps move the cell?", "opts": ["Cytoskeleton", "Golgi apparatus", "Smooth ER", "Nucleolus"], "correct": 0, "exp": "The cytoskeleton provides internal scaffolding and enables organelle/cell movement in all eukaryotic cells.", "src": "assignment"}, {"id": "n5_07", "ch": 5, "type": "mc", "q": "In a helminth life cycle, the host where LARVAL stages develop is called the ______ host, while the host where the parasite matures into an adult and reproduces sexually is the ______ host.", "opts": ["definitive; intermediate", "intermediate; definitive", "primary; secondary", "reservoir; definitive"], "correct": 1, "exp": "Example: pigs are the intermediate host for pork tapeworm larvae; humans who eat undercooked pork are the definitive host, where the adult tapeworm develops.", "src": "assignment"}, {"id": "n5_08", "ch": 5, "type": "mc", "q": "A pigmented microbe has a capsule and flagella but no chloroplasts or cilia. It is about 2 microns in size, divides by binary fission, and its nucleic acid is packaged within an envelope. Is this a eukaryote or prokaryote?", "opts": ["Prokaryote -- small size and binary fission are decisive", "Eukaryote -- the nucleic acid packaged within an envelope means a nuclear envelope, the one defining eukaryotic trait", "Prokaryote -- capsules and flagella only occur in prokaryotes", "Cannot be determined from the information given"], "correct": 1, "exp": "The deciding clue is the nuclear envelope -- the one defining trait of eukaryotes. Small size, binary fission, capsules, and flagella all sound prokaryote-like but aren't actually exclusive to prokaryotes.", "src": "assignment"}, {"id": "n7_01", "ch": 7, "type": "mc", "q": "Which term describes a relationship where ONE organism benefits while the other is neither harmed nor helped?", "opts": ["Mutualism", "Commensalism", "Parasitism", "Syntrophy"], "correct": 1, "exp": "Commensalism = one benefits, other unaffected (vs. mutualism = both benefit; parasitism = one benefits, other harmed).", "src": "quiz2"}, {"id": "n7_02", "ch": 7, "type": "mc", "q": "Which term describes a relationship where one organism is harmed while providing the other with nutrients and habitat?", "opts": ["Mutualism", "Commensalism", "Parasitism", "Amensalism"], "correct": 2, "exp": "Parasitism = one organism benefits at the other's expense.", "src": "quiz2"}, {"id": "n7_03", "ch": 7, "type": "mc", "q": "An organism that can use gaseous oxygen AND possesses enzymes to neutralize toxic oxygen byproducts is a(n):", "opts": ["Anaerobe", "Aerobe", "Microaerophile", "Methanogen"], "correct": 1, "exp": "Aerobes both use O2 and can detoxify its reactive byproducts (via catalase/superoxide dismutase).", "src": "quiz2"}, {"id": "n7_04", "ch": 7, "type": "mc", "q": "Organisms that can only tolerate very minute concentrations of oxygen fall into which oxygen-requirement group?", "opts": ["Obligate aerobes", "Facultative anaerobes", "Microaerophiles", "Obligate anaerobes"], "correct": 2, "exp": "Microaerophiles need a little O2, but are harmed by normal atmospheric levels.", "src": "quiz2"}, {"id": "n7_05", "ch": 7, "type": "mc", "q": "Organisms that lack the enzymes needed to use oxygen in respiration, and may not tolerate any free oxygen at all, are called:", "opts": ["Aerobes", "Microaerophiles", "Facultative anaerobes", "Anaerobes (strict anaerobes)"], "correct": 3, "exp": "Strict anaerobes lack oxygen-detoxifying enzymes (catalase, superoxide dismutase) entirely.", "src": "quiz2"}, {"id": "n7_06", "ch": 7, "type": "mc", "q": "Which bioelement plays a key role in protein synthesis and membrane transport?", "opts": ["Phosphorus", "Potassium", "Calcium", "Iron"], "correct": 1, "exp": "Potassium is important for protein synthesis and membrane transport processes.", "src": "quiz2", "terms": ["bioelements"]}, {"id": "n7_07", "ch": 7, "type": "mc", "q": "Which bioelement is the key structural component of genetic material (DNA/RNA) in cells?", "opts": ["Phosphorus", "Potassium", "Calcium", "Iron"], "correct": 0, "exp": "Phosphorus is central to the phosphate backbone of DNA and RNA.", "src": "quiz2", "terms": ["bioelements"]}, {"id": "n7_08", "ch": 7, "type": "mc", "q": "Which bioelement stabilizes bacterial cell walls and adds resistance to endospores?", "opts": ["Iron", "Phosphorus", "Calcium", "Potassium"], "correct": 2, "exp": "Calcium (as calcium dipicolinate) is central to endospore heat resistance.", "src": "quiz2", "terms": ["bioelements"]}, {"id": "n7_09", "ch": 7, "type": "mc", "q": "Which bioelement is essential for the structure of respiratory proteins (e.g., cytochromes)?", "opts": ["Calcium", "Potassium", "Phosphorus", "Iron"], "correct": 3, "exp": "Iron is a core structural element of cytochromes and other respiratory proteins.", "src": "quiz2", "terms": ["bioelements"]}, {"id": "n7_10", "ch": 7, "type": "mc", "q": "An organism with peak growth around 25-30°C -- cold-tolerant, but growing better at moderate temperatures than a true cold-lover -- is a:", "opts": ["Psychrophile", "Psychrotroph", "Mesophile", "Thermophile"], "correct": 1, "exp": "Psychrotrophs tolerate cold but actually grow best at cooler-moderate (not truly cold) temperatures -- distinct from true psychrophiles.", "src": "assignment"}, {"id": "n7_11", "ch": 7, "type": "mc", "q": "An organism with peak growth around 105-125°C, such as those found at deep-sea hydrothermal vents, is classified as a(n):", "opts": ["Thermophile", "Hyperthermophile (extreme thermophile)", "Mesophile", "Psychrotroph"], "correct": 1, "exp": "Extreme thermophiles (hyperthermophiles) push the upper limit of life, thriving above 100°C near hydrothermal vents.", "src": "assignment"}, {"id": "n7_12", "ch": 7, "type": "mc", "q": "Using concentrated salt or sugar as a food preservative works by creating a(n) ______ environment that inhibits bacterial growth.", "opts": ["Isotonic", "Hypotonic", "Hypertonic", "Neutral pH"], "correct": 2, "exp": "A hypertonic environment pulls water out of bacterial cells by osmosis, dehydrating and inhibiting them.", "src": "assignment"}, {"id": "n7_13", "ch": 7, "type": "mc", "q": "The phase of the bacterial growth curve in which cells require a period of adjustment after being newly inoculated, with little division yet, is the:", "opts": ["Lag phase", "Exponential phase", "Stationary phase", "Death phase"], "correct": 0, "exp": "During lag phase, cells are adjusting to their new environment and synthesizing what they need before dividing rapidly.", "src": "assignment", "terms": ["growth curve"]}, {"id": "n7_14", "ch": 7, "type": "mc", "q": "The phase of the bacterial growth curve in which the population declines because cell death exceeds the rate of multiplication is the:", "opts": ["Lag phase", "Exponential phase", "Stationary phase", "Death phase"], "correct": 3, "exp": "In death phase, nutrients are depleted and cells die faster than they divide.", "src": "assignment", "terms": ["growth curve"]}, {"id": "n7_15", "ch": 7, "type": "mc", "q": "An anaerobic organism that converts carbon dioxide and hydrogen gas into methane is called a:", "opts": ["Halophile", "Hyperthermophile", "Methanogen", "Psychrophile"], "correct": 2, "exp": "Methanogens (mostly Archaea) combine H2 and CO2 anaerobically to produce methane, generating ATP via chemoautotrophy.", "src": "assignment"}, {"id": "n7_16", "ch": 7, "type": "mc", "q": "Archaea like Halobacterium can grow in environments where salt concentration reaches 25%. How do they survive such extreme salinity?", "opts": ["They avoid the salt by forming spores", "Their proteins and membranes are structurally adapted to stay stable at high salt, and they use compatible solutes to balance osmotic pressure", "They actively pump all water out of the cell permanently", "They convert the salt into a less concentrated form"], "correct": 1, "exp": "Extreme (obligate) halophiles have cell walls, membranes, and proteins specially adapted to remain stable and functional at very high salt concentrations, and use compatible solutes (like potassium ions) to balance osmotic pressure.", "src": "assignment"}, {"id": "n7_17", "ch": 7, "type": "mc", "q": "Anaerobic bacteria cause periodontal (gum) disease despite air regularly passing through the mouth. How is this possible?", "opts": ["All mouth bacteria are actually aerobic", "Anaerobes hide in deep pockets (like between teeth and gums) where aerobic bacteria on top consume the available oxygen, creating oxygen-free pockets", "Oxygen cannot enter the mouth at all", "Anaerobes convert oxygen into carbon dioxide instantly"], "correct": 1, "exp": "Not every spot in the mouth gets airflow -- anaerobes persist in deep pockets and under plaque, and aerobic bacteria on the surface use up available oxygen, creating anaerobic micro-pockets nearby.", "src": "assignment"}, {"id": "n7_18", "ch": 7, "type": "mc", "q": "The movement of molecules from an area of high concentration to an area of low concentration is called:", "opts": ["Osmosis", "Active transport", "Diffusion", "Facilitated transport", "Endocytosis"], "correct": 2, "exp": "Diffusion is passive movement down a concentration gradient -- no energy or transport protein required.", "src": "lastminute"}, {"id": "n7_19", "ch": 7, "type": "mc", "q": "The phase of the bacterial growth curve where growth slows and the rate of multiplication equals the rate of cell death is called the:", "opts": ["Lag phase", "Exponential phase", "Stationary phase", "Death phase", "Log phase"], "correct": 2, "exp": "In stationary phase, births and deaths balance out, so population size plateaus.", "src": "lastminute"}, {"id": "n7_20", "ch": 7, "type": "mc", "q": "The phase of the bacterial growth curve showing the maximum rate of cell division is the:", "opts": ["Lag phase", "Stationary phase", "Exponential (log) phase", "Death phase"], "correct": 2, "exp": "During exponential (log) phase, cells divide at their fastest, most consistent rate.", "src": "lastminute", "terms": ["growth curve"]}, {"id": "n7_21", "ch": 7, "type": "mc", "q": "What type of location would best support the growth of a halophile?", "opts": ["A freshwater pond", "A salt lake", "A compost pile", "A glacier"], "correct": 1, "exp": "Halophiles require high salt concentrations to survive -- a salt lake (or the Dead Sea) is ideal.", "src": "lastminute"}, {"id": "n8_01", "ch": 8, "type": "mc", "q": "At how many of the three stages of aerobic respiration (glycolysis, Krebs cycle, electron transport chain) is ATP directly produced?", "opts": ["Only one (the electron transport chain)", "Only two (Krebs cycle and electron transport chain)", "All three stages", "None -- ATP is only made afterward, during fermentation"], "correct": 2, "exp": "ATP is made at all three stages: a little via substrate-level phosphorylation in glycolysis and the Krebs cycle, and the bulk via oxidative phosphorylation at the electron transport chain.", "src": "chapter"}, {"id": "n8_02", "ch": 8, "type": "mc", "q": "In aerobic respiration, where are CO2 and H2O produced, respectively?", "opts": ["Krebs cycle; electron transport chain", "Glycolysis; Krebs cycle", "Electron transport chain; Krebs cycle", "Glycolysis; electron transport chain", "Krebs cycle; Krebs cycle"], "correct": 0, "exp": "CO2 is released only during the Krebs cycle's decarboxylation steps; H2O is formed only at the electron transport chain, when oxygen accepts electrons and protons.", "src": "chapter"}, {"id": "n8_03", "ch": 8, "type": "mc", "q": "During glycolysis, a six-carbon compound (fructose diphosphate) is split into:", "opts": ["Two three-carbon fragments", "Three two-carbon fragments", "One six-carbon fragment", "Six one-carbon fragments"], "correct": 0, "exp": "This split is the key structural event of glycolysis, producing two 3-carbon molecules that are each further processed toward pyruvic acid.", "src": "assignment"}, {"id": "n8_04", "ch": 8, "type": "mc", "q": "In the Krebs cycle, which starting reactant is regenerated by the end of each turn, allowing the cycle to continue?", "opts": ["Pyruvic acid", "Acetyl-CoA", "Oxaloacetic acid", "Citric acid"], "correct": 2, "exp": "Oxaloacetate combines with incoming acetyl-CoA to form citrate at the start of each turn, and is regenerated by the cycle's end.", "src": "assignment"}, {"id": "n8_05", "ch": 8, "type": "mc", "q": "Which stage of aerobic respiration produces BOTH NADH and FADH2?", "opts": ["Glycolysis", "Krebs cycle", "Electron transport chain", "Pyruvate oxidation alone"], "correct": 1, "exp": "The Krebs cycle is the only stage that generates both types of electron carriers (3 NADH and 1 FADH2 per turn).", "src": "assignment"}, {"id": "n8_06", "ch": 8, "type": "mc", "q": "In the Krebs cycle, ATP is made directly via substrate-level phosphorylation, yielding how many ATP per turn?", "opts": ["Zero", "One", "Two", "Four"], "correct": 2, "exp": "The Krebs cycle makes 2 ATP (not 4) via substrate-level phosphorylation per turn -- a classic gross-vs-net trap with glycolysis.", "src": "assignment"}, {"id": "n8_07", "ch": 8, "type": "mc", "q": "ATP formed through a series of reactions involving electron transport and ATP synthase is called:", "opts": ["Substrate-level phosphorylation", "Oxidative phosphorylation", "Photophosphorylation", "Chemiosmotic hydrolysis"], "correct": 1, "exp": "Oxidative phosphorylation is the ETC + ATP synthase process that generates the bulk of ATP in cellular respiration.", "src": "assignment"}, {"id": "n8_08", "ch": 8, "type": "mc", "q": "ATP formed via a light-driven electron transport mechanism (used in photosynthesis) is called:", "opts": ["Substrate-level phosphorylation", "Oxidative phosphorylation", "Photophosphorylation", "Chemiosmosis"], "correct": 2, "exp": "Photophosphorylation is the light-driven version of chemiosmotic ATP synthesis used in photosynthesis.", "src": "assignment"}, {"id": "n8_09", "ch": 8, "type": "mc", "q": "Since bacteria lack mitochondria, where do pyruvate oxidation AND the electron transport chain take place in a bacterial cell?", "opts": ["Free in the cytoplasm, same as glycolysis and the Krebs cycle", "The bacterial (plasma) membrane", "The nucleoid", "They do not occur in bacteria at all"], "correct": 1, "exp": "Unlike glycolysis and the Krebs cycle (free in the bacterial cytoplasm), pyruvate oxidation and electron transport are membrane-associated processes in bacteria -- a classic trap.", "src": "assignment"}, {"id": "n8_10", "ch": 8, "type": "mc", "q": "In eukaryotes, where do pyruvate oxidation and the Krebs cycle take place?", "opts": ["Bacterial plasma membrane", "Mitochondrial matrix", "Cytoplasm", "Inner mitochondrial membrane"], "correct": 1, "exp": "In eukaryotes, pyruvate oxidation and the Krebs cycle move into the mitochondrial matrix, while electron transport runs on the inner mitochondrial membrane.", "src": "assignment"}, {"id": "n8_11", "ch": 8, "type": "mc", "q": "A microbe can only generate ATP via fermentation, with no functional electron transport chain. What is the metabolic consequence?", "opts": ["It nets the full ~38 ATP per glucose, same as aerobic respiration", "It nets only about 2 ATP per glucose, can't fully oxidize glucose to CO2, and must burn through sugar much faster to meet its energy needs", "It produces more ATP than aerobic respiration, since no oxygen is needed", "It cannot survive, since fermentation yields zero ATP"], "correct": 1, "exp": "Without an ETC, the microbe is capped at glycolysis's small net ATP yield, can't fully oxidize glucose, and dumps partially-oxidized waste products (like ethanol or lactic acid).", "src": "assignment"}, {"id": "n8_12", "ch": 8, "type": "mc", "q": "In fermentation, why is it important for the cell to convert NADH back into NAD+?", "opts": ["To produce additional ATP directly from NAD+", "Glycolysis needs a steady, limited supply of NAD+ to keep running, and fermentation regenerates it by dumping NADH's electrons onto pyruvate", "NAD+ is required as the final electron acceptor in fermentation", "To prevent the cell from undergoing lysis"], "correct": 1, "exp": "The cell only has a small, fixed pool of NAD+/NADH. Fermentation regenerates NAD+ so glycolysis (the only ATP source available) can keep running -- this is 'redox balance.'", "src": "assignment"}, {"id": "n8_13", "ch": 8, "type": "mc", "q": "Besides generating ATP, how else can a cell use glucose or its metabolic derivatives?", "opts": ["As building blocks -- e.g., glucose-6-phosphate can feed the pentose phosphate pathway to make ribose for DNA/RNA, and pyruvate can form fatty acid/amino acid precursors", "Glucose derivatives have no use besides ATP production", "Only to build additional glucose molecules", "Only to produce oxygen gas"], "correct": 0, "exp": "Glycolytic intermediates double as the starting material for nucleotide, fatty acid, and amino acid biosynthesis -- not just energy production.", "src": "assignment"}, {"id": "n8_14", "ch": 8, "type": "mc", "q": "A holoenzyme is a combination of a protein (the apoenzyme) and one or more non-protein substances called:", "opts": ["Substrates", "Cofactors (coenzymes)", "Products", "Ribozymes"], "correct": 1, "exp": "The apoenzyme (protein) plus its cofactor(s)/coenzyme(s) together form the complete, active holoenzyme.", "src": "lastminute", "terms": ["enzyme vocab"]}, {"id": "n8_15", "ch": 8, "type": "mc", "q": "What is the net production of ATP when one glucose molecule is broken down by glycolysis alone, during bacterial fermentation?", "opts": ["4 ATP", "2 ATP", "38 ATP", "0 ATP"], "correct": 1, "exp": "Glycolysis makes 4 ATP (gross) via substrate-level phosphorylation but spends 2 to start, netting 2 -- true whether the pathway continues into aerobic respiration or stops at fermentation.", "src": "lastminute", "terms": ["ATP yield"]}, {"id": "n8_16", "ch": 8, "type": "mc", "q": "During which phase of cellular respiration is the MAJORITY of ATP formed?", "opts": ["Glycolysis", "The transition (pyruvate oxidation) step", "Oxidative phosphorylation (electron transport chain)", "The Krebs cycle alone"], "correct": 2, "exp": "Oxidative phosphorylation (ETC + chemiosmosis + ATP synthase) generates the bulk of the ~30-38 ATP total -- far more than the small, direct substrate-level phosphorylation ATP made in glycolysis and the Krebs cycle.", "src": "lastminute", "terms": ["ATP yield"]}, {"id": "n1_21", "ch": 1, "type": "mc", "q": "A classification scheme organized in descending ranks -- Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species -- is called a:", "opts": ["Taxon", "Hierarchy", "Phylogeny", "Nomenclature"], "correct": 1, "exp": "This ranked structure is the taxonomic hierarchy, from broadest (Domain) to most specific (Species). Mnemonic: 'Dear King Philip Came Over For Good Soup.'", "src": "assignment", "terms": ["taxonomy"]}, {"id": "n1_22", "ch": 1, "type": "mc", "q": "Which of the following correctly distinguishes a hypothesis from a theory?", "opts": ["A hypothesis is well-tested; a theory is untested", "A hypothesis is a tentative, testable explanation; a theory is a hypothesis thoroughly suppo // ======================= STATS / DIAGNOSTICS =======================
function computeStats(){
  var ids = Object.keys(progress);
  var totalAnswered=0, totalCorrect=0;
  var byCh = {}; CHAPTERS.forEach(function(c){ byCh[c]={a:0,c:0,qTotal:0}; });
  QUESTIONS.forEach(function(q){ if(byCh[q.ch]) byCh[q.ch].qTotal++; });
  var flagged = [];
  ids.forEach(function(id){
    var rec = progress[id]; if(!rec) return;
    var answered = (rec.correctCount||0)+(rec.wrongCount||0);
    totalAnswered += answered; totalCorrect += (rec.correctCount||0);
    var q = QUESTIONS.find(function(x){return x.id===id;});
    if(q && byCh[q.ch]){ byCh[q.ch].a += answered; byCh[q.ch].c += (rec.correctCount||0); }
    if(rec.flag) flagged.push(id);
  });
  return {
    totalAnswered:totalAnswered, totalCorrect:totalCorrect,
    accuracy: totalAnswered? Math.round(100*totalCorrect/totalAnswered):0,
    byChapter: byCh, flaggedIds: flagged, flaggedCount: flagged.length,
    totalQuestions: QUESTIONS.length, updatedAt: Date.now()
  };
}
function heatColor(acc, answered){
  if(answered===0) return "var(--border)";
  if(acc>=85) return "var(--good)";
  if(acc>=65) return "#84cc16";
  if(acc>=45) return "var(--warn)";
  return "var(--bad)";
}
function classifyAttempt(rec, correct, confidence){
  if(correct) return confidence==="high" ? "solid" : "fragile";
  if(confidence==="high") return "overconfident";
  if((rec.wrongCount||0) >= 1){
    return (rec.correctCount||0) > 0 ? "slipped" : "recurring";
  }
  return "new_gap";
}
var DIAG_LABEL = {
  solid:"Solid -- confident and correct.",
  fragile:"Fragile -- right, but you weren't sure. Worth a second look.",
  overconfident:"Overconfident -- you were sure, but it's wrong. These are the most dangerous gaps for exam day.",
  slipped:"Slipped -- you had this before and missed it now. Knowledge may be destabilizing; revisit the concept.",
  recurring:"Recurring miss -- you've missed this one more than once. High priority to review.",
  new_gap:"New gap -- first miss, totally normal. Now it's flagged for review."
};

function recordAnswer(q, isCorrect, confidence){
  var rec = progress[q.id] || {box:1, correctCount:0, wrongCount:0, lastSeen:0, flag:false};
  var cls = classifyAttempt(rec, isCorrect, confidence);
  rec.lastSeen = Date.now();
  rec.lastClass = cls;
  if(isCorrect){
    rec.correctCount = (rec.correctCount||0)+1;
    rec.box = Math.min((rec.box||1)+1, 4);
    rec.flag = (cls==="fragile");
    streak++;
  } else {
    rec.wrongCount = (rec.wrongCount||0)+1;
    rec.box = 1;
    rec.flag = true;
    streak = 0;
  }
  saveStreak();
  progress[q.id] = rec;
  saveProgress();
  syncQuestionDoc(q, rec);
  pushSummary();
  if(settings.sound){ isCorrect ? playCorrectChime() : playWrongTone(); }
  if(isCorrect && streak>0 && streak%5===0){ triggerConfetti(); }
  return cls;
}

var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ var AC = window.AudioContext||window.webkitAudioContext; audioCtx = new AC(); }catch(e){}
  }
  return audioCtx;
}
function playTone(freq, start, dur, vol){
  try{
    var ctx = getAudioCtx(); if(!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.type = "sine";
    o.connect(g); g.connect(ctx.destination);
    var t0 = ctx.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol||0.15, t0+0.02);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function playCorrectChime(){ playTone(523.25,0,0.12); playTone(783.99,0.1,0.16); }
function playWrongTone(){ playTone(180,0,0.25,0.12); }

function triggerConfetti(){
  var root = document.getElementById("confetti-root");
  var colors = ["#2563eb","#15803d","#f59e0b","#db2777","#7c3aed"];
  for(var i=0;i<24;i++){
    var p = document.createElement("div");
    p.className="confetti-piece";
    p.style.left = (Math.random()*100)+"vw";
    p.style.background = colors[i%colors.length];
    p.style.borderRadius = (Math.random()>0.5?"50%":"2px");
    p.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    root.appendChild(p);
    (function(el){
      var dur = 1200+Math.random()*900;
      var dx = (Math.random()-0.5)*160;
      try{
        if(el.animate){
          el.animate([
            { transform: el.style.transform, top:"-10px", opacity:1 },
            { transform: "translate("+dx+"px, 100vh) rotate(720deg)", opacity:0.9 }
          ], { duration: dur, easing:"cubic-bezier(.2,.6,.6,1)" });
        } else {
          el.style.transition = "top "+dur+"ms linear, opacity "+dur+"ms linear";
          setTimeout(function(){ try{ el.style.top="100vh"; el.style.opacity="0.2"; }catch(e){} }, 10);
        }
      }catch(e){}
      setTimeout(function(){ try{ el.remove(); }catch(e){} }, dur+50);
    })(p);
  }
}

    u.rate = 0.98;
    window.speechSynthesis.speak(u);

function speakQuestion(q){
  if(!q) return;
  var parts = [q.q];
  if(q.type==="mc"){ parts.push("Your options are: "+q.opts.map(function(o,i){return optLetter(i)+": "+o;}).join(". ")); }
  else if(q.type==="tf"){ parts.push("True, or false?"); }
  else if(q.type==="match" || q.type==="diagram"){ parts.push("Match these: "+q.items.map(function(it,i){return (i+1)+": "+it;}).join(". ")); }
  speak(parts.join(". "));
}

// ======================= SESSION LOGIC =======================
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function boxOf(id){ return (progress[id]&&progress[id].box)||1; }
function isQuizLike(q){ return true; }

function weightedUniqueQueue(pool, cap){
  var weighted = [];
  pool.forEach(function(q){
    var w = Math.max(5-boxOf(q.id),1);
    for(var i=0;i<w;i++) weighted.push(q);
  });
  shuffle(weighted);
  var seen={}, queue=[];
  for(var i=0;i<weighted.length;i++){
    var q=weighted[i];
    if(!seen[q.id]){ seen[q.id]=true; queue.push(q); if(cap && queue.length>=cap) break; }
  }
  if((!cap || queue.length<cap) && queue.length < pool.length){
    pool.forEach(function(q){ if(!seen[q.id]){ seen[q.id]=true; queue.push(q); } });
  }
  return queue;
}

function buildSession(filterFn, count){
  var pool = QUESTIONS.filter(filterFn);
  return weightedUniqueQueue(pool, count).slice(0, count);
}

// Pulls roughly evenly from every chapter in the filtered pool (round-robin),
// so a chapter with more questions (e.g. after new additions) doesn't crowd
// out the others in Mixed practice / Speed round -- each still weighted
// toward whatever that chapter's own missed questions are (Leitner boxes).
function buildBalancedSession(filterFn, count){
  var pool = QUESTIONS.filter(filterFn);
  var byChapter = {};
  CHAPTERS.forEach(function(ch){ byChapter[ch] = weightedUniqueQueue(pool.filter(function(q){return q.ch===ch;})); });
  var order = shuffle(CHAPTERS.slice());
  var queue = [], idx = {}; order.forEach(function(ch){ idx[ch]=0; });
  var remaining = true;
  while(queue.length < count && remaining){
    remaining = false;
    for(var i=0;i<order.length;i++){
      var ch = order[i];
      if(idx[ch] < byChapter[ch].length){
        queue.push(byChapter[ch][idx[ch]]); idx[ch]++;
        remaining = true;
        if(queue.length>=count) break;
      }
    }
  }
  return queue;
}

// Samples `count` questions distributed across chapters by EXAM_WEIGHTS (the
// confirmed real exam's chapter ratio) using the largest-remainder method for
// whole-number allocation, then fills each chapter's share with weightedUniqueQueue
// (so missed questions still surface more often). If a chapter's own pool can't
// cover its target share, the shortfall is backfilled from the rest of the pool.
// Used by Mixed practice and the Exam Simulator -- the weighting itself is never
// displayed in the UI, only used internally to pick questions.
function buildWeightedSession(filterFn, count){
  var pool = QUESTIONS.filter(filterFn);
  var chs = CHAPTERS.slice();
  var raw = chs.map(function(ch){ return count*(EXAM_WEIGHTS[ch]||0); });
  var counts = raw.map(Math.floor);
  var used = counts.reduce(function(a,b){return a+b;},0);
  var leftover = count - used;
  var fracOrder = chs.map(function(ch,i){ return {i:i, frac: raw[i]-counts[i]}; })
    .sort(function(a,b){ return b.frac-a.frac; });
  for(var k=0; k<leftover; k++){ counts[fracOrder[k % fracOrder.length].i]++; }

  var queue = [], seen = {};
  chs.forEach(function(ch,i){
    var chPool = pool.filter(function(q){return q.ch===ch;});
    var chQueue = weightedUniqueQueue(chPool, counts[i]).slice(0, counts[i]);
    chQueue.forEach(function(q){ if(!seen[q.id]){ seen[q.id]=true; queue.push(q); } });
  });
  if(queue.length < count){
    var rest = pool.filter(function(q){ return !seen[q.id]; });
    var extra = weightedUniqueQueue(rest, count-queue.length).slice(0, count-queue.length);
    extra.forEach(function(q){ if(!seen[q.id]){ seen[q.id]=true; queue.push(q); } });
  }
  return shuffle(queue).slice(0, count);
}

var SPEED_BUDGET = { mc:20, tf:15 };
// Exam Simulator sampling weights -- the confirmed real Exam 1's chapter distribution
// (Ch1=10%, Ch4=20%, Ch5=10%, Ch7=29%, Ch8=31%), derived from 59 confirmed real exam
// questions. Applied internally to sampling only -- intentionally never shown in the UI.
var EXAM_WEIGHTS = { 1:0.10, 4:0.20, 5:0.10, 7:0.29, 8:0.31 };
// Real exam pace: 60 questions / 80 minutes = 1.33 min/question = 80 seconds/question.
var EXAM_PACE_SECONDS = 80;

var current = { selectedOpt:null, tfSelected:null, fillVal:"", matchSel:null, confidence:null, checked:false, wasCorrect:false, err:false, cls:null };
var studyPlanForm = { days:1, hours:6, sessionLen:45 };
var modal = null; // {type:'glossary', term} or {type:'zoom', svg}

var app = document.getElementById("app");
function go(v){ view=v; stopSpeak(); render(); window.scrollTo(0,0); }

function resetCurrent(){
  current = { selectedOpt:null, tfSelected:null, fillVal:"", matchSel:null, confidence:null, checked:false, wasCorrect:false, err:false, cls:null };
}

function startSession(filterFn, count, modeLabel, speedMode){
  session = { queue:buildSession(filterFn,count), idx:0, correct:0, mode:modeLabel, speed:!!speedMode, timer:null, timeLeft:0, budget:0, fixedBudget:0 };
  resetCurrent();
  go("quiz");
  if(session.speed) armTimer();
}
function startSessionBalanced(filterFn, count, modeLabel, speedMode){
  session = { queue:buildBalancedSession(filterFn,count), idx:0, correct:0, mode:modeLabel, speed:!!speedMode, timer:null, timeLeft:0, budget:0, fixedBudget:0 };
  resetCurrent();
  go("quiz");
  if(session.speed) armTimer();
}
// Weighted sampling: distributes `count` across chapters using EXAM_WEIGHTS (the
// confirmed real exam's chapter ratio), then fills each chapter's share using the
// existing Leitner-box weighting (weightedUniqueQueue) so missed questions still
// surface more often within each chapter. Used by Mixed practice and Exam Simulator.
// fixedBudget (seconds), when set, overrides SPEED_BUDGET so every question in the
// session gets the same amount of time -- used by Exam Simulator to match the real
// exam's constant ~1.33 min/question pace, regardless of session length.
function startSessionWeighted(filterFn, count, modeLabel, speedMode, fixedBudget){
  session = { queue:buildWeightedSession(filterFn,count), idx:0, correct:0, mode:modeLabel, speed:!!speedMode, timer:null, timeLeft:0, budget:0, fixedBudget:fixedBudget||0 };
  resetCurrent();
  go("quiz");
  if(session.speed) armTimer();
}

function armTimer(){
  clearInterval(session.timer);
  var q = session.queue[session.idx]; if(!q) return;
  session.budget = session.fixedBudget || (SPEED_BUDGET[q.type]||20);
  session.timeLeft = session.budget;
  session.timer = setInterval(function(){
    session.timeLeft -= 0.2;
    if(session.timeLeft<=0){ clearInterval(session.timer); if(!current.checked) checkAnswer(true); }
    renderTimerOnly();
  }, 200);
}
function renderTimerOnly(){
  var el = document.getElementById("timerFill");
  if(el){ el.style.width = Math.max(0,(100*session.timeLeft/session.budget))+"%"; }
}

function renderPlanOutput(){

  });
  var totalMinutes = studyPlanForm.hours*60;

    lines.push("Session "+(i+1)+" (~"+Math.round(perSession)+" min): Chapter "+ch+" -- weakest area first. Target ~"+qCount+" questions (mixed practice weighted to misses), then 5 min reviewing the Weak Areas screen.");

  lines.push("");

function copyText(t){ try{ navigator.clipboard.writeText(t); alert("Copied."); }catch(e){ alert("Could not copy automatically -- select and copy manually."); } }
function downloadText(filename, text){
  try{
    var blob = new Blob([text], {type:"text/plain"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(e){ alert("Download failed in this browser."); }
}
function missedAsText(){
  var s = computeStats();
  var ids = s.flaggedIds;
  var lines = ["BIO 207 -- Missed / flagged questions ("+ids.length+")",""];

      lines.push("Why: "+(q.exp||""));
      lines.push("");
    });
  });
  return lines.join("\n");
}

function exportProgress(){
  var payload = { app:"bio207-exam1", exportedAt:new Date().toISOString(), progress:progress, settings:settings, streak:streak };
  downloadText("bio207_progress_backup.json", JSON.stringify(payload, null, 2));
}
function importProgress(evt){
  var file = evt.target.files && evt.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(data && data.progress){
        progress = data.progress; saveProgress();
        if(data.settings){ settings = data.settings; saveSettings(); }
        if(typeof data.streak==="number"){ streak = data.streak; saveStreak(); }
        alert("Progress imported.");
        go("home");
      } else { alert("That file doesn't look like a BIO 207 progress backup."); }
    }catch(e){ alert("Couldn't read that file."); }
  };
  reader.readAsText(file);
}
function resetProgress(){
  if(!confirm("Reset all saved progress on this device? This can't be undone.")) return;
  progress = {}; streak = 0; saveProgress(); saveStreak(); pushSummary(); go("home");
}

// ======================= RENDER: QUIZ =======================
function optLetter(i){ return String.fromCharCode(97+i); }

function renderQuiz(){
  if(session.idx >= session.queue.length){ clearInterval(session.timer); return renderDone(); }
  var q = session.queue[session.idx];
  var html = "";
  html += "<div class=\"progresstop\"><span><button class=\"iconbtn\" style=\"padding:3px 8px;margin-right:8px;\" onclick=\"exitSession()\">\u2039 Exit</button>"+session.mode+(session.speed?" \u26a1":"")+"</span><span>Question "+(session.idx+1)+" / "+session.queue.length+"</span></div>";
  if(session.speed){ html += "<div class=\"timerbar\"><div class=\"timerfill\" id=\"timerFill\" style=\"width:100%;\"></div></div>"; }

  html += "<div class=\"card\">";
  html += "<span class=\"chip\">Ch "+q.ch+"</span>";
  if(q.src==="quiz1") html += "<span class=\"chip tag-warn\">Quiz 1</span>";
  else if(q.src==="quiz2") html += "<span class=\"chip tag-warn\">Quiz 2</span>";
  else if(q.src==="chapter") html += "<span class=\"chip\">End of chapter</span>";
  else if(q.src==="assignment") html += "<span class=\"chip\">Assignment</span>";
  else if(q.src==="lastminute") html += "<span class=\"chip tag-warn\">Last-Minute</span>";
  html += "<button class=\"iconbtn\" style=\"float:right;\" onclick=\"speakQuestion(QUESTIONS.find(function(x){return x.id==='"+q.id+"';}))\">\ud83d\udd0a Read aloud</button>";
  html += "<div class=\"qtext\" style=\"margin-top:10px;clear:both;\">"+escapeHtml(q.q)+"</div>";

  if(q.terms && q.terms.length){
    q.terms.forEach(function(t){ html += "<button class=\"chip\" onclick=\"openGlossary('"+t.replace(/'/g,"\\'")+"')\">\u2139 "+t+"</button>"; });
  }

  if(q.type==="diagram"){
    html += "<div onclick=\"openZoom('"+q.id+"')\">"+q.svg.replace("<svg ","<svg class=\\\"diagram\\\" ")+"</div><div class=\"small\">Tap the diagram to zoom.</div>";
  }

  if(q.type==="mc"){
    q.opts.forEach(function(opt,i){
      var cls="opt";
      if(current.checked){ if(i===q.correct) cls+=" correct"; else if(i===current.selectedOpt) cls+=" incorrect"; }
      else if(i===current.selectedOpt) cls+=" selected";
      html += "<div class=\""+cls+"\" onclick=\"selectOpt("+i+")\">"+optLetter(i)+". "+escapeHtml(opt)+"</div>";
    });
  } else if(q.type==="tf"){
    [true,false].forEach(function(val){
      var label = val?"True":"False"; var cls="opt";
      if(current.checked){ if(val===q.correct) cls+=" correct"; else if(val===current.tfSelected) cls+=" incorrect"; }
      else if(val===current.tfSelected) cls+=" selected";
      html += "<div class=\""+cls+"\" onclick=\"selectTf("+val+")\">"+label+"</div>";
    });
  } else if(q.type==="fill"){
    html += "<input type=\"text\" id=\"fillInput\" placeholder=\"Type your answer\" value=\""+(current.fillVal||"").replace(/\"/g,"")+"\" oninput=\"current.fillVal=this.value\" "+(current.checked?"disabled":"")+">";
    if(current.checked){ html += "<div class=\"feedback "+(current.wasCorrect?"good":"bad")+"\">"+(current.wasCorrect?"Correct.":"Correct answer: "+q.answers[0])+"</div>"; }
    if(current.err) html += "<div class=\"err\">Enter an answer first.</div>";
  } else if(q.type==="match" || q.type==="diagram"){
    if(!current.matchSel) current.matchSel = new Array(q.items.length).fill("");
    var pool = shuffle(Array.from(new Set(q.rights)));
    q.items.forEach(function(item,i){
      html += "<div class=\"matchrow\"><div class=\"mleft\">"+(i+1)+". "+escapeHtml(item)+"</div>";
      html += "<select onchange=\"current.matchSel["+i+"]=this.value\" "+(current.checked?"disabled":"")+"><option value=\"\">(choose)</option>";
      pool.forEach(function(opt){
        html += "<option "+(current.matchSel[i]===opt?"selected":"")+" value=\""+opt.replace(/\"/g,"")+"\">"+escapeHtml(opt)+"</option>";
      });
      html += "</select>";
      if(current.checked){
        var ok = current.matchSel[i]===q.rights[i];
        html += "<div class=\"small\" style=\"color:"+(ok?"var(--good)":"var(--bad)")+";margin-top:4px;\">"+(ok?"Correct":"Correct: "+q.rights[i])+"</div>";
      }
      html += "</div>";
    });
    if(current.err) html += "<div class=\"err\">Answer every row first.</div>";
  }

  if(!current.checked){
    html += "<div class=\"confband\">";
    ["low","med","high"].forEach(function(c){
      var label = c==="low"?"Not sure":c==="med"?"Somewhat sure":"Confident";
      html += "<div class=\"confbtn "+(current.confidence===c?"selected":"")+"\" onclick=\"current.confidence='"+c+"';render();\">"+label+"</div>";
    });
    html += "</div>";
  }

  if(current.checked){
    html += "<div class=\"feedback "+(current.wasCorrect?"good":"bad")+"\" style=\"margin-top:12px;\">"+(current.wasCorrect?"\u2713 Correct. ":"\u2717 Not quite. ")+escapeHtml(q.exp||"")+"</div>";
    if(current.cls){ html += "<div class=\"feedback warn\">"+DIAG_LABEL[current.cls]+"</div>"; }
    var isFlagged = !!manualFlags[q.id];
    html += "<button class=\"btn btn-sm\" style=\"margin-top:4px;\" onclick=\"toggleManualFlag('"+q.id+"')\">"+(isFlagged?"\ud83d\udd16 Flagged for review (tap to unflag)":"\ud83d\udd16 Flag for review")+"</button>";
  }
  html += "</div>";

  html += "<div class=\"footerbtn\">";
  if(!current.checked){
    html += "<button class=\"btn btn-primary\" onclick=\"checkAnswer()\">Check answer</button>";
  } else {
    html += "<button class=\"btn btn-primary\" onclick=\"nextQuestion()\">"+(session.idx+1<session.queue.length?"Next question":"See results")+"</button>";
  }
  html += "</div>";
  return html;
}

function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function selectOpt(i){ if(current.checked) return; current.selectedOpt=i; current.err=false; render(); }
function selectTf(v){ if(current.checked) return; current.tfSelected=v; current.err=false; render(); }

function checkAnswer(timedOut){
  var q = session.queue[session.idx];
  if(!timedOut && !current.confidence){ current.err=true; render(); return; }
  var conf = current.confidence || "low";
  var isCorrect = false;
  if(q.type==="mc"){
    if(current.selectedOpt===null){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = current.selectedOpt===q.correct;
  } else if(q.type==="tf"){
    if(current.tfSelected===null){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = current.tfSelected===q.correct;
  } else if(q.type==="fill"){
    var val=(current.fillVal||"").trim();
    if(!val){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = q.answers.some(function(a){return a.toLowerCase()===val.toLowerCase();});
  } else if(q.type==="match" || q.type==="diagram"){
    if(!current.matchSel || current.matchSel.some(function(v){return !v;})){
      if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; }
    } else {
      isCorrect = q.items.every(function(it,i){ return current.matchSel[i]===q.rights[i]; });
    }
  }
  clearInterval(session.timer);
  current.checked=true; current.wasCorrect=isCorrect; current.err=false;
  if(isCorrect) session.correct++;
  current.cls = recordAnswer(q, isCorrect, conf);
  render();
}

function exitSession(){ clearInterval(session.timer); go("home"); }

function nextQuestion(){
  session.idx++;
  resetCurrent();
  if(session.idx >= session.queue.length){ clearInterval(session.timer); view="done"; }
  render();
  if(session.speed && session.idx < session.queue.length && view==="quiz") armTimer();
}

function renderDone(){
  var html = "<h1>Session complete</h1><div class=\"card\"><div class=\"statgrid\">";
  html += "<div class=\"stat\"><div class=\"num\">"+session.correct+" / "+session.queue.length+"</div><div class=\"lab\">this session</div></div>";
  var s = computeStats();
  html += "<div class=\"stat\"><div class=\"num\">"+s.accuracy+"%</div><div class=\"lab\">overall accuracy</div></div>";
  html += "</div></div>";
  html += "<button class=\"btn btn-primary\" onclick=\"go('home')\">Back to home</button>";
  return html;
}

// ======================= MODALS: GLOSSARY POPOVER + IMAGE ZOOM + TUTORIAL =======================
function openGlossary(term){ modal = {type:"glossary", term:term}; render(); }
function openZoom(qid){ var q=QUESTIONS.find(function(x){return x.id===qid;}); modal={type:"zoom", svg:q.svg}; render(); }
function closeModal(){
  var wasTutorial = modal && modal.type==="tutorial";
  modal=null;
  if(wasTutorial){ settings.seenTutorial=true; saveSettings(); }
  render();
}

var TUTORIAL_STEPS = [
  "Welcome! This app has "+QUESTIONS.length+" practice questions across Chapters 1, 4, 5, 7, and 8 -- multiple choice and true/false only, matching the real exam's format.",
  "The Exam Simulator samples questions weighted like the real exam's chapter balance, and times you at the real exam's pace -- pick Quick check, Half exam, or the Full exam replica.",
  "After each answer, rate your confidence. It's not just right/wrong -- being confident and wrong gets flagged as your highest-priority gap.",
  "Check Weak Areas anytime for a color-coded heat-map by chapter, plus exactly which questions keep tripping you up. You can also manually flag any question for later, right or wrong, from its result screen.",
  "Use the Study Plan Builder to turn your days-until-exam and available hours into a session-by-session plan.",
  "Everything saves automatically on this device. Export a backup file anytime from Settings, or download your missed questions as text.",
  "Tip: tap the theme icon (top-right) to cycle Auto/Light/Dark, and use arrow keys + Enter to answer hands-free."
];
function openTutorial(){ modal = {type:"tutorial", step:0}; render(); }
function replayTutorial(){ openTutorial(); }
function tutorialNext(){
  if(modal.step < TUTORIAL_STEPS.length-1){ modal.step++; render(); }
  else { closeModal(); }
}
function tutorialPrev(){ if(modal.step>0){ modal.step--; render(); } }

function renderModal(){
  var old = document.getElementById("modalRoot");
  if(old) old.remove();
  var div = document.createElement("div");
  div.id = "modalRoot";
  div.className = "modal-overlay";
  div.onclick = function(e){ if(e.target===div && modal.type!=="tutorial") closeModal(); };
  var box = document.createElement("div");
  box.className = "modal-box";
  if(modal.type==="glossary"){
    box.innerHTML = "<h2>"+modal.term+"</h2><p>"+(GLOSSARY[modal.term]||"No definition found.")+"</p><button class=\"btn btn-primary\" onclick=\"closeModal()\">Close</button>";
  } else if(modal.type==="zoom"){
    box.innerHTML = modal.svg.replace("<svg ","<svg style=\\\"width:100%;height:auto;\\\" ") + "<button class=\"btn btn-primary\" style=\"margin-top:10px;\" onclick=\"closeModal()\">Close</button>";
  } else if(modal.type==="tutorial"){
    var i = modal.step;
    var dots = "<div class=\"tutorial-dots\">"+TUTORIAL_STEPS.map(function(_,idx){ return "<div class=\"tutorial-dot"+(idx===i?" active":"")+"\"></div>"; }).join("")+"</div>";
    var nav = "<div class=\"row\" style=\"margin-top:14px;\">";
    if(i>0) nav += "<button class=\"iconbtn\" onclick=\"tutorialPrev()\">Back</button>";
    nav += "<button class=\"btn btn-primary\" style=\"flex:1;margin-bottom:0;\" onclick=\"tutorialNext()\">"+(i<TUTORIAL_STEPS.length-1?"Next":"Let's go")+"</button>";
    nav += "<button class=\"iconbtn\" onclick=\"closeModal()\">Skip</button>";
    nav += "</div>";
    box.innerHTML = "<h2>Quick tour ("+(i+1)+"/"+TUTORIAL_STEPS.length+")</h2><p>"+TUTORIAL_STEPS[i]+"</p>"+dots+nav;
  }
  div.appendChild(box);
  document.body.appendChild(div);
}

// ======================= KEYBOARD SHORTCUTS =======================
function handleKey(e){
  if(modal){
    if(e.key==="Escape"){ closeModal(); return; }
    if(modal.type==="tutorial"){
      if(e.key==="ArrowRight"||e.key==="Enter"){ tutorialNext(); e.preventDefault(); }
      else if(e.key==="ArrowLeft"){ tutorialPrev(); e.preventDefault(); }
    }
    return;
  }
  if(view!=="quiz") return;
  var q = session.queue[session.idx]; if(!q) return;
  var tag = (e.target && e.target.tagName) || "";
  var inField = (tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA");

  if(current.checked){
    if(e.key==="Enter"||e.key===" "){ nextQuestion(); e.preventDefault(); }
    return;
  }

  if(q.type==="mc" && !inField){
    var n = parseInt(e.key,10);
    if(!isNaN(n) && n>=1 && n<=q.opts.length){ selectOpt(n-1); e.preventDefault(); return; }
    var letterIdx = "abcdefgh".indexOf((e.key||"").toLowerCase());
    if(letterIdx>=0 && letterIdx<q.opts.length){ selectOpt(letterIdx); e.preventDefault(); return; }
  }
  if(q.type==="tf" && !inField){
    if(e.key==="t"||e.key==="T"){ selectTf(true); e.preventDefault(); return; }
    if(e.key==="f"||e.key==="F"){ selectTf(false); e.preventDefault(); return; }
  }
  if(q.type==="mc"||q.type==="tf"){
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      var order=["low","med","high"];
      var idx = order.indexOf(current.confidence);
      if(idx===-1) idx = e.key==="ArrowRight" ? -1 : order.length;
      idx = e.key==="ArrowRight" ? Math.min(order.length-1, idx+1) : Math.max(0, idx-1);
      current.confidence = order[idx];
      render(); e.preventDefault(); return;
    }
  }
  if(e.key==="Enter"){ checkAnswer(); e.preventDefault(); }
}
try{ document.addEventListener("keydown", handleKey); }catch(e){}

// ======================= SWIPE GESTURES =======================
var touchStartX=null, touchStartY=null;
function onTouchStart(e){
  if(!e.touches || !e.touches.length) return;
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}
function onTouchEnd(e){
  if(touchStartX===null) return;
  var t = (e.changedTouches && e.changedTouches[0]) || null;
  var endX = t ? t.clientX : touchStartX;
  var endY = t ? t.clientY : touchStartY;
  var dx = endX-touchStartX, dy = endY-touchStartY;
  touchStartX=null; touchStartY=null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
    if(view==="quiz" && current.checked && !modal){ nextQuestion(); }
  }
}
try{
  document.addEventListener("touchstart", onTouchStart, {passive:true});
  document.addEventListener("touchend", onTouchEnd, {passive:true});
}catch(e){}

render();
