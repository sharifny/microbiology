ural genes (like lacZ, lacY, lacA in the lac operon) each code for a specific enzyme/protein, as opposed to regulatory genes, which control expression.", "src": "assignment", "wrongExp": "This really is true -- structural genes each code for a specific enzyme/protein, unlike regulatory genes, which control expression."}, {"id": "a9_19", "ch": 9, "type": "tf", "q": "The amino acid sequence of a protein determines its shape and specific function.", "correct": true, "exp": "True -- the order of amino acids causes a protein to fold into a particular shape, and that shape dictates what the protein can do.", "src": "assignment", "wrongExp": "The order of amino acids really does cause a protein to fold into a particular shape, which dictates what the protein can do."}, {"id": "a9_20", "ch": 9, "type": "mc", "q": "Which of the following best describes translation?", "opts": ["DNA -> DNA", "DNA -> RNA", "DNA -> protein", "RNA -> DNA", "RNA -> protein"], "correct": 4, "exp": "Translation is the process of building a protein from an mRNA sequence -- RNA to protein.", "src": "assignment", "wrongExp": {"0": "DNA to DNA describes replication.", "1": "DNA to RNA describes transcription, which comes BEFORE translation.", "2": "DNA to protein skips a step -- it requires transcription and translation combined.", "3": "RNA to DNA describes reverse transcription, used only by retroviruses."}}, {"id": "a9_21", "ch": 9, "type": "mc", "q": "Translation is characterized by:", "opts": ["A messenger RNA molecule synthesized from the DNA molecule in the nucleus", "A transfer RNA molecule synthesized from the DNA molecule in the nucleus", "A ribosomal RNA molecule synthesized from the DNA molecule in the nucleus", "The blueprint of the RNA molecule used to bind amino acids together to form proteins", "The binding of enzymes to their substrates to produce products"], "correct": 3, "exp": "Translation is where ribosomes read the mRNA 'blueprint' and, with tRNA bringing amino acids, assemble them into a protein -- the other options describe transcription or generic catalysis.", "src": "assignment", "wrongExp": {"0": "mRNA synthesis from DNA describes TRANSCRIPTION, not translation.", "1": "tRNA synthesis from DNA also describes transcription, not translation.", "2": "rRNA synthesis from DNA also describes transcription, not translation.", "4": "This is a generic description of enzyme catalysis, not specific to translation."}}, {"id": "a9_22", "ch": 9, "type": "mc", "q": "Which of the following is a TRUE statement concerning protein synthesis in eukaryotic organisms?", "opts": ["Translation occurs in the nucleus and transcription occurs in the cytoplasm", "Transcription occurs in the nucleus and translation occurs in the cytoplasm", "Translation occurs in the nucleus and transcription occurs in the mitochondria", "Transcription occurs in the nucleus and translation occurs in the mitochondria", "For every RNA produced, there is an enzyme or enzyme product produced"], "correct": 1, "exp": "The nuclear membrane keeps eukaryotic transcription (nucleus) physically separated from translation (cytoplasm/ER) -- unlike prokaryotes, which have no such separation.", "src": "assignment", "wrongExp": {"0": "This reverses the actual locations -- transcription happens in the nucleus, translation in the cytoplasm.", "2": "Translation happens in the cytoplasm/ER, not the nucleus; transcription doesn't occur in mitochondria.", "3": "Translation of nuclear-genome mRNA happens in the cytoplasm/ER, not the mitochondria.", "4": "Not all RNA is translated -- many RNAs (like tRNA, rRNA) are non-coding."}}, {"id": "a9_23", "ch": 9, "type": "tf", "q": "The sequence for protein synthesis is translation, then transcription.", "correct": false, "exp": "False -- it's reversed. Transcription (DNA to mRNA) always happens first, followed by translation (mRNA to protein) -- the Central Dogma.", "src": "assignment", "wrongExp": "This is backwards -- transcription (DNA to mRNA) always happens first, followed by translation (mRNA to protein)."}, {"id": "a9_24", "ch": 9, "type": "mc", "q": "The enzyme that accomplishes transcription is termed:", "opts": ["DNA polymerase", "RNA polymerase", "DNA ligase", "RNA ligase", "RNA replicase"], "correct": 1, "exp": "RNA polymerase synthesizes RNA using DNA as a template -- notably, it can bind DNA, unwind it, and synthesize RNA all on its own, without needing a separate helicase.", "src": "assignment", "wrongExp": {"0": "DNA polymerase handles DNA replication, not transcription.", "2": "DNA ligase seals nicks during DNA replication -- unrelated to transcription.", "3": "RNA ligase isn't the enzyme used for standard cellular transcription.", "4": "RNA replicase is used by certain RNA viruses to replicate their genome, not standard transcription."}}, {"id": "a9_25", "ch": 9, "type": "tf", "q": "The terminator of a gene is located upstream of the coding region.", "correct": false, "exp": "False -- the terminator sits downstream, signaling RNA polymerase to stop. It's the promoter that sits upstream, marking where transcription begins.", "src": "assignment", "wrongExp": "It's the PROMOTER that sits upstream (marking where transcription starts) -- the terminator sits downstream, signaling where it stops."}, {"id": "a9_26", "ch": 9, "type": "tf", "q": "The RNA transcript produced by RNA polymerase is complementary to the template strand of the DNA.", "correct": true, "exp": "True -- RNA polymerase reads the DNA template strand and builds mRNA by complementary base-pairing against it.", "src": "assignment", "wrongExp": "RNA polymerase really does build the RNA transcript by complementary base-pairing against the DNA template strand."}, {"id": "a9_27", "ch": 9, "type": "tf", "q": "Translation termination concludes with the dissociation of the two ribosomal subunits and mRNA from each other.", "correct": true, "exp": "True -- once a stop codon triggers release of the finished polypeptide, the ribosome's subunits and the mRNA all separate and are recycled for another round of translation.", "src": "assignment", "wrongExp": "Once the finished protein is released at a stop codon, the ribosome's two subunits and the mRNA really do separate to be recycled."}, {"id": "a9_28", "ch": 9, "type": "mc", "q": "How many structural genes are within the trp operon?", "opts": ["One", "Two", "Three", "Four", "Five"], "correct": 4, "exp": "The trp operon has five structural genes (trpE, trpD, trpC, trpB, trpA), each encoding an enzyme for tryptophan synthesis -- more than the lac operon's three.", "src": "assignment", "wrongExp": {"0": "The trp operon has more than one structural gene -- it has five.", "1": "The trp operon has more than two structural genes -- it has five.", "2": "Three is actually the LAC operon's structural gene count -- the trp operon has five.", "3": "The trp operon has five structural genes, not four."}}, {"id": "a9_29", "ch": 9, "type": "mc", "q": "In the presence of tryptophan, tryptophan binds to the:", "opts": ["Operator", "Promoter", "RNA polymerase", "Trp genes", "Trp repressor"], "correct": 4, "exp": "Tryptophan acts as a corepressor, binding the (normally inactive) trp repressor protein and activating it so the complex can then bind the operator and block transcription.", "terms": ["repressible operon"], "src": "assignment", "wrongExp": {"0": "The operator is where the ACTIVATED repressor-tryptophan complex binds -- not where tryptophan itself binds.", "1": "The promoter is where RNA polymerase binds -- unrelated to tryptophan binding.", "2": "RNA polymerase gets blocked as a downstream EFFECT -- tryptophan doesn't bind to it directly.", "3": "Tryptophan doesn't bind directly to the genes being regulated."}}, {"id": "a9_30", "ch": 9, "type": "tf", "q": "In the presence of tryptophan, transcription of the trp operon is on.", "correct": false, "exp": "False -- the trp operon is repressible: normally ON, but tryptophan (as corepressor) turns it OFF once it's abundant, since the cell no longer needs to make more.", "terms": ["repressible operon"], "src": "assignment", "wrongExp": "This is reversed -- tryptophan turns the trp operon OFF (as a corepressor), not on."}, {"id": "a9_31", "ch": 9, "type": "tf", "q": "An operon is a group of genes that is under the control of a single operator site.", "correct": true, "exp": "True -- all structural genes within an operon share one operator, so they're switched on or off together as a unit.", "src": "assignment", "wrongExp": "This really is true -- all structural genes within an operon share one operator, so they're switched on or off together."}, {"id": "a9_32", "ch": 9, "type": "tf", "q": "A mutation that changes a single nucleotide can result in a different amino acid being added into a protein.", "correct": true, "exp": "True -- this describes a missense mutation, where a single base change alters a codon to specify a different amino acid.", "src": "assignment", "wrongExp": "This really is true -- this describes a missense mutation, where a single base change alters a codon to specify a different amino acid."}, {"id": "a9_33", "ch": 9, "type": "tf", "q": "The entire genome of the donor cell is usually transferred to the recipient cell during bacterial gene transfer.", "correct": false, "exp": "False -- conjugation, transformation, and transduction each typically transfer only a plasmid or a small DNA fragment, not the donor's whole genome.", "src": "assignment", "wrongExp": "Conjugation, transformation, and transduction each typically transfer only a plasmid or a small fragment, not the donor's whole genome."}, {"id": "a9_34", "ch": 9, "type": "mc", "q": "Transposons are:", "opts": ["Transported by transduction", "Transported by a sex pilus", "Transported by conjugation", "Transported by bacteriophages", "Transported by plasmids"], "correct": 4, "exp": "Transposons can insert into plasmids, and because plasmids move easily between cells (via conjugation), this is the classic route by which transposons -- and the resistance genes they often carry -- spread between bacteria.", "src": "assignment", "wrongExp": {"0": "Transduction is how BACTERIAL DNA moves via a phage -- not specifically how transposons spread.", "1": "A sex pilus is the physical conduit for conjugation -- but the transposon itself rides ON a plasmid.", "2": "Conjugation is the PROCESS that moves a plasmid (carrying the transposon) between cells -- the transposon travels via the plasmid.", "3": "Bacteriophages CAN move transposons too, but plasmid transfer via conjugation is more classically emphasized."}}, {"id": "a9_35", "ch": 9, "type": "mc", "q": "Transcription begins when RNA polymerase binds to the:", "opts": ["Terminator on DNA", "Promoter on RNA", "Promoter on DNA", "Initiator on DNA"], "correct": 2, "exp": "RNA polymerase recognizes and binds the promoter -- a DNA sequence (not RNA) -- to begin transcription.", "src": "assignment", "wrongExp": {"0": "The terminator signals the END of transcription -- RNA polymerase binds the promoter to START.", "1": "The promoter is a DNA sequence, not an RNA sequence.", "3": "'Initiator on DNA' isn't the standard term used -- 'promoter' is."}}, {"id": "a9_36", "ch": 9, "type": "mc", "q": "If one strand of DNA contains the bases ACAGT, what is the complementary mRNA sequence?", "opts": ["ACAGT", "UGUCA", "TGTCA", "GUGAC"], "correct": 1, "exp": "Pairing each DNA base to its RNA complement (A-U, C-G, A-U, G-C, T-A): ACAGT becomes UGUCA. TGTCA is a trap -- that's the complementary DNA strand, not RNA.", "src": "assignment", "wrongExp": {"0": "This just repeats the original DNA sequence -- it isn't complementary to anything.", "2": "This is the complementary DNA strand (using T) -- but mRNA is RNA, so it uses U instead.", "3": "This doesn't follow the correct base-pairing pattern for this sequence."}}, {"id": "a9_37", "ch": 9, "type": "mc", "q": "Synthesis of mRNA occurs:", "opts": ["In the 5' to 3' direction, adding new nucleotides to the 3' end", "In the 3' to 5' direction, adding new nucleotides to the 3' end", "In the 3' to 5' direction, adding new nucleotides to the 5' end", "In the 5' to 3' direction, adding new nucleotides to the 5' end"], "correct": 0, "exp": "RNA polymerase, like DNA polymerase, can only extend a growing strand by adding nucleotides to its exposed 3' end -- so synthesis proceeds 5' to 3'.", "src": "assignment", "wrongExp": {"1": "Polymerases can't synthesize 3' to 5' -- synthesis only proceeds 5' to 3'.", "2": "Nucleotides are added to the 3' end, and synthesis proceeds 5' to 3', not the reverse.", "3": "Nucleotides are added to the 3' end, not the 5' end."}}, {"id": "a9_38", "ch": 9, "type": "mc", "q": "What happens when a hairpin loop forms in mRNA during termination?", "opts": ["Exons are removed from the RNA transcript", "The RNA polymerase and the mRNA dissociate from the DNA", "Transcription of DNA to mRNA begins", "Transcription of the coding strand begins"], "correct": 1, "exp": "A hairpin loop destabilizes RNA polymerase's grip on the DNA template (rho-independent termination), causing the polymerase and finished mRNA to release.", "src": "assignment", "wrongExp": {"0": "Exon removal describes SPLICING, a separate eukaryotic process -- not what a hairpin loop does.", "2": "A hairpin loop signals the END of transcription, not the beginning.", "3": "This isn't related to hairpin loops, and only the template strand is transcribed."}}, {"id": "a9_39", "ch": 9, "type": "fill", "q": "A segment of DNA encoding a protein or an RNA molecule is a ________.", "exp": "A gene is a specific DNA sequence coding for a protein or functional RNA molecule -- a chromosome is the larger structure containing many genes.", "src": "assignment", "answers": ["gene", "a gene", "genes"]}, {"id": "a9_40", "ch": 9, "type": "mc", "q": "Which term describes the physical expression of the genes present, which can change depending on which genes are turned 'on'?", "opts": ["Chromosome", "Phenotype", "Genotype", "Plasmid"], "correct": 1, "exp": "Phenotype is the expressed, observable trait -- genotype is the underlying genetic makeup, whether expressed or not.", "src": "assignment", "wrongExp": {"0": "A chromosome is a physical DNA structure, not an expressed trait.", "2": "Genotype is the underlying genetic makeup, whether expressed or not -- phenotype is what's actually expressed.", "3": "A plasmid is a physical DNA structure, not an expressed trait."}}, {"id": "a9_41", "ch": 9, "type": "mc", "q": "Which nitrogenous base is NOT present in RNA?", "opts": ["Adenine", "Cytosine", "Guanine", "Thymine", "Uracil"], "correct": 3, "exp": "RNA uses uracil in place of thymine; thymine is exclusive to DNA.", "src": "assignment", "wrongExp": {"0": "Adenine IS present in RNA -- not the exception.", "1": "Cytosine IS present in RNA -- not the exception.", "2": "Guanine IS present in RNA -- not the exception.", "4": "Uracil IS present in RNA (replacing thymine) -- not the exception."}}, {"id": "a9_42", "ch": 9, "type": "tf", "q": "Both DNA and RNA are usually double-stranded molecules.", "correct": false, "exp": "False -- DNA is normally double-stranded, but RNA is normally single-stranded (though it can fold back on itself into shapes, like tRNA's cloverleaf).", "src": "assignment", "wrongExp": "Only DNA is normally double-stranded -- RNA is normally single-stranded, though it can fold into shapes like tRNA's cloverleaf."}, {"id": "a9_43", "ch": 9, "type": "fill", "q": "The bond that links adjacent amino acids together during translation is called a ________ bond.", "exp": "Peptide bonds link adjacent amino acids during translation; hydrogen bonds hold DNA base pairs, and glycosidic bonds connect sugars.", "src": "assignment", "answers": ["peptide", "a peptide"]}, {"id": "a9_44", "ch": 9, "type": "tf", "q": "If you know the sequence of nucleotides in mRNA, you can deduce the DNA sequence it was transcribed from.", "correct": true, "exp": "True -- since mRNA is built by direct complementary base-pairing with the DNA template (U instead of T), you can work backward from mRNA to DNA.", "src": "assignment", "wrongExp": "Because mRNA is built by direct complementary base-pairing with the DNA template, you really can work backward to the DNA sequence."}, {"id": "a9_45", "ch": 9, "type": "mc", "q": "Which of the following depicts the direction genetic information flows?", "opts": ["Protein -> DNA -> RNA", "DNA -> RNA -> protein", "RNA -> protein -> DNA", "RNA -> DNA -> protein"], "correct": 1, "exp": "This is the Central Dogma of molecular biology: DNA to RNA to protein (RNA viruses/retroviruses are the only exceptions that can reverse part of this flow).", "src": "assignment", "wrongExp": {"0": "Proteins never convert back into DNA or RNA information -- genetic information doesn't flow this direction.", "2": "This scrambles the real order -- DNA comes first, not last.", "3": "This describes reverse transcription, which only happens in retroviruses -- not the general flow."}}, {"id": "a9_46", "ch": 9, "type": "tf", "q": "Replication, transcription, and translation all take place in the bacterial cytoplasm.", "correct": true, "exp": "True -- with no nucleus to separate them, all three processes happen in the same cytoplasmic space in bacteria.", "src": "assignment", "wrongExp": "With no nucleus to separate them, bacteria really do carry out all three processes in the same cytoplasmic space."}, {"id": "a9_47", "ch": 9, "type": "tf", "q": "Prokaryotes lack membrane-enclosed organelles.", "correct": true, "exp": "True -- bacteria and archaea have no nucleus or other membrane-bound organelles, unlike eukaryotic cells.", "src": "assignment", "wrongExp": "Prokaryotes really do lack a nucleus and all other membrane-bound organelles that eukaryotic cells have."}, {"id": "a9_48", "ch": 9, "type": "mc", "q": "Which of the following occurs in BOTH prokaryotes and eukaryotes?", "opts": ["Translation", "DNA replication", "Transcription", "All of these choices are correct"], "correct": 3, "exp": "Translation, replication, and transcription are all fundamental processes shared by every cellular life form -- what differs is HOW and WHERE each occurs, not whether it happens.", "src": "assignment", "wrongExp": {"0": "True, but incomplete alone -- DNA replication and transcription happen in both too.", "1": "True, but incomplete alone -- translation and transcription happen in both too.", "2": "True, but incomplete alone -- translation and DNA replication happen in both too."}}, {"id": "a9_49", "ch": 9, "type": "mc", "q": "Translation of mRNA into protein begins before transcription is complete in:", "opts": ["Neither prokaryotes nor eukaryotes", "Eukaryotes only", "Prokaryotes only", "Both prokaryotes and eukaryotes"], "correct": 2, "exp": "Because prokaryotes lack a nuclear membrane, ribosomes can begin translating an mRNA transcript while RNA polymerase is still transcribing further down the gene -- impossible in eukaryotes.", "src": "assignment", "wrongExp": {"0": "This DOES happen -- specifically in prokaryotes, since they lack a nuclear membrane separating the two processes.", "1": "Eukaryotes CAN'T do this -- their nuclear membrane keeps transcription and translation physically separated.", "3": "This is prokaryote-ONLY -- eukaryotes' nuclear membrane prevents translation from starting before transcription finishes."}}, {"id": "a9_50", "ch": 9, "type": "tf", "q": "In prokaryotes, the mRNA transcript encounters ribosomal parts immediately as it leaves the DNA.", "correct": true, "exp": "True -- this is exactly why prokaryotic transcription and translation can run simultaneously; ribosomes attach almost as soon as mRNA starts forming.", "src": "assignment", "wrongExp": "This really does happen in prokaryotes -- it's exactly why transcription and translation can run simultaneously there."}, {"id": "a9_51", "ch": 9, "type": "mc", "q": "In prokaryotes, which term describes a cluster of genes that perform related functions, regulated together?", "opts": ["Intron", "Transposon", "Exon", "Operon"], "correct": 3, "exp": "An operon bundles structural genes for a shared pathway under one regulatory region, so they're all switched on or off together.", "src": "assignment", "wrongExp": {"0": "An intron is a non-coding region WITHIN a single gene -- not a cluster of related genes.", "1": "A transposon is a mobile DNA element -- not a cluster of related genes.", "2": "An exon is a coding region WITHIN a single gene -- not a cluster of related genes."}}, {"id": "a9_52", "ch": 9, "type": "mc", "q": "Eukaryotic mRNA contains non-coding regions called:", "opts": ["Transcriptors", "Introns", "Transposons", "Exons"], "correct": 1, "exp": "Introns are the non-coding, intervening sequences in eukaryotic genes that get excised during splicing; exons are the coding regions that remain.", "src": "assignment", "wrongExp": {"0": "'Transcriptors' isn't a real genetics term used for this.", "2": "Transposons are mobile genetic elements -- unrelated to mRNA's non-coding regions.", "3": "Exons are the CODING regions that remain after splicing -- the opposite of what's being asked."}}, {"id": "a9_53", "ch": 9, "type": "mc", "q": "Introns are removed and exons are spliced together:", "opts": ["After translation", "Before translation", "Before transcription"], "correct": 1, "exp": "Splicing (via the spliceosome) happens after transcription produces the pre-mRNA, but before that mature mRNA leaves the nucleus for translation.", "src": "assignment", "wrongExp": {"0": "Splicing happens BEFORE translation, not after -- the mature mRNA must be ready before ribosomes can read it.", "2": "Splicing happens AFTER transcription produces the pre-mRNA, not before transcription starts."}}, {"id": "a9_54", "ch": 9, "type": "tf", "q": "Eukaryotic mRNA usually specifies multiple proteins.", "correct": false, "exp": "False -- eukaryotic mRNA is monocistronic (codes for just one protein); it's bacterial mRNA that's often polycistronic (codes for several in series).", "src": "assignment", "wrongExp": "Eukaryotic mRNA is monocistronic -- it codes for just one protein; it's bacterial mRNA that's often polycistronic."}, {"id": "a9_55", "ch": 9, "type": "tf", "q": "Only eukaryotic mRNA is processed (spliced) prior to translation.", "correct": true, "exp": "True -- only eukaryotic pre-mRNA undergoes intron removal/splicing; prokaryotic mRNA, lacking introns, needs no such processing.", "src": "assignment", "wrongExp": "Only eukaryotic mRNA has introns to remove -- prokaryotic mRNA, lacking introns, doesn't need this processing step."}, {"id": "a9_56", "ch": 9, "type": "tf", "q": "Translation of eukaryotic mRNA can occur in the nucleus after exons are spliced together.", "correct": false, "exp": "False -- splicing happens in the nucleus, but translation always occurs in the cytoplasm (or at the ER); mature mRNA must exit the nucleus first.", "src": "assignment", "wrongExp": "Translation always happens in the cytoplasm/ER, even though splicing happens in the nucleus -- mature mRNA must exit first."}, {"id": "a9_57", "ch": 9, "type": "tf", "q": "Translation occurs on ribosomes only in prokaryotes.", "correct": false, "exp": "False -- ribosomes are universal machinery for translation in both prokaryotes and eukaryotes; only the ribosome's size/type (70S vs. 80S) and location differ.", "src": "assignment", "wrongExp": "Ribosomes are universal machinery -- translation happens on ribosomes in BOTH prokaryotes and eukaryotes, just different sizes."}, {"id": "a9_58", "ch": 9, "type": "mc", "q": "How do the processes of transcription and translation differ between prokaryotes and eukaryotes?", "opts": ["Prokaryotes transcribe DNA in the nucleus", "Eukaryotes transcribe DNA in the cytoplasm", "Eukaryotes translate DNA in the nucleus", "Prokaryotic mRNA must be processed by removing introns prior to translation", "Prokaryotes transcribe and translate simultaneously"], "correct": 4, "exp": "The key, well-supported difference is that prokaryotes (no nuclear membrane) can transcribe and translate simultaneously, which eukaryotes cannot do.", "src": "assignment", "wrongExp": {"0": "Prokaryotes have no nucleus at all -- they can't transcribe DNA 'in' one.", "1": "Eukaryotic transcription happens in the NUCLEUS, not the cytoplasm.", "2": "Translation works on mRNA, not DNA directly, and happens in the cytoplasm, not the nucleus.", "3": "Removing introns before translation is a EUKARYOTIC feature -- prokaryotic genes generally lack introns."}}, {"id": "a9_59", "ch": 9, "type": "mc", "q": "One advantage of having genetic control mechanisms (like operons) is that:", "opts": ["Enzymes are only produced when they are needed", "The chance of mutations during RNA synthesis is reduced", "Too many sections of the DNA molecule are not used at the same time", "Free nucleotides are not used up too rapidly"], "correct": 0, "exp": "Gene regulation ensures enzymes are made only when their products are actually required, preventing the cell from wasting energy and materials on unneeded synthesis.", "src": "assignment", "wrongExp": {"1": "Genetic control mechanisms don't affect mutation rate during RNA synthesis -- that's a different issue.", "2": "This describes DNA usage timing, not the actual stated advantage.", "3": "Nucleotide usage isn't the stated advantage -- avoiding wasted enzyme production is."}}, {"id": "a9_60", "ch": 9, "type": "mc", "q": "A mechanism that blocks transcription will:", "opts": ["Block the production of mRNA", "Block mRNA from binding to ribosomes", "Block passage of mRNA out of the nucleus", "Block ribosomes from producing protein"], "correct": 0, "exp": "Transcription is, by definition, what produces mRNA -- if it's blocked, RNA polymerase never makes mRNA in the first place. Blocking ribosome binding or nuclear export would instead interfere with translation, a separate downstream step.", "src": "assignment", "wrongExp": {"1": "Blocking mRNA-ribosome binding would interfere with TRANSLATION, a separate downstream step.", "2": "Blocking nuclear export is a eukaryotic transport issue, not transcription itself.", "3": "Blocking ribosomes from making protein describes interference with TRANSLATION, not transcription."}}, {"id": "a9_61", "ch": 9, "type": "mc", "q": "When a repressor binds to the operator site on DNA, it:", "opts": ["Blocks RNA polymerase and mRNA synthesis", "Prevents the binding of the substrate to the operator site", "Causes the operator site to form a hairpin loop with the structural locus", "Links adjacent thymines and alters DNA folding"], "correct": 0, "exp": "A repressor physically occupying the operator blocks RNA polymerase from transcribing the structural genes, so no mRNA is made.", "src": "assignment", "wrongExp": {"1": "This is backwards -- the SUBSTRATE binds the repressor PROTEIN, not the operator site.", "2": "The repressor physically blocks RNA polymerase's access -- it doesn't form a hairpin loop with the structural locus.", "3": "Linking adjacent thymines describes UV-induced thymine dimers (a mutation mechanism), unrelated to repressor function."}}, {"id": "a9_62", "ch": 9, "type": "mc", "q": "Repressible operons, such as the arg operon, are usually:", "opts": ["In the off mode", "In the on mode", "Inactivated by low levels of nutrients", "Activated by high levels of nutrients"], "correct": 1, "exp": "Repressible operons are normally ON and are switched OFF by a corepressor (like arginine or tryptophan) once that end-product builds up -- the opposite pattern from inducible operons like lac.", "terms": ["repressible operon"], "src": "assignment", "wrongExp": {"0": "This describes an INDUCIBLE operon (like lac) -- repressible operons default to ON instead.", "2": "This is backwards -- it's HIGH levels of the end-product that inactivate (shut off) a repressible operon.", "3": "This is also backwards -- high product levels REPRESS the operon, they don't activate it."}}, {"id": "a9_63", "ch": 9, "type": "mc", "q": "In some positive-control pathways, in the absence of an inducer (e.g., arabinose):", "opts": ["The activator protein can't bind DNA, and RNA polymerase can't bind the promoter site", "The activator protein can't compete with the repressor for the operator site", "Formation of polyribosome complexes is blocked", "The activator protein can't bind DNA, and RNA polymerase can't bind the operator site"], "correct": 0, "exp": "In positive-control systems like the ara operon, an activator protein must bind DNA to help recruit RNA polymerase to the promoter; without the inducer, the activator can't bind, so RNA polymerase can't effectively engage the promoter.", "src": "assignment", "wrongExp": {"1": "This isn't how positive-control activator systems work -- the activator and repressor don't compete for the same site.", "2": "This concerns translation, not the transcriptional regulation being described.", "3": "The activator helps RNA polymerase bind the PROMOTER, not the operator -- that detail is swapped here."}}, {"id": "a9_64", "ch": 9, "type": "mc", "q": "When a ribosome reaches one of three stop codons, it halts protein synthesis and releases the finished polypeptide chain. These three codons are known as:", "opts": ["Stop codons (nonsense codons)", "Start codons", "Silent codons", "Anticodons"], "correct": 0, "exp": "The three stop (nonsense) codons -- UAA, UAG, UGA -- have no corresponding tRNA; reaching one triggers a release factor that frees the finished protein from the ribosome.", "src": "assignment", "wrongExp": {"1": "Start codons (like AUG) signal where translation BEGINS -- the opposite of what's described here.", "2": "'Silent codon' isn't a real term -- silent refers to a type of mutation.", "3": "Anticodons are on tRNA and pair with mRNA codons -- they aren't what halts protein synthesis."}}, {"id": "a9_65", "ch": 9, "type": "tf", "q": "Depending on where it occurs, a missense mutation can create a nonfunctional protein, produce a protein with altered function, or have no significant impact on protein function at all.", "correct": true, "exp": "True -- this is a key exam trap, since a missense mutation can go any of these three ways depending on how critical the substituted amino acid is to the protein's structure.", "src": "assignment", "wrongExp": "This variability really is the key exam trap -- a missense mutation's effect depends on how critical the substituted amino acid is."}, {"id": "a9_66", "ch": 9, "type": "mc", "q": "Direct transfer of DNA from a donor cell to a recipient cell via physical contact is called:", "opts": ["Transformation", "Transduction", "Conjugation"], "correct": 2, "exp": "Conjugation requires direct cell-to-cell contact through a sex pilus to transfer DNA (usually a plasmid).", "src": "assignment", "wrongExp": {"0": "Transformation is uptake of free DNA from the environment -- no direct cell contact involved.", "1": "Transduction uses a bacteriophage as the vector -- no direct cell contact involved."}}, {"id": "a9_67", "ch": 9, "type": "mc", "q": "Uptake of free DNA from the surrounding environment by a competent bacterial cell is called:", "opts": ["Transformation", "Transduction", "Conjugation"], "correct": 0, "exp": "Transformation involves a competent cell absorbing loose DNA fragments released into its environment -- no direct contact or viral vector needed.", "src": "assignment", "wrongExp": {"1": "Transduction uses a bacteriophage as the vector to deliver DNA -- not direct environmental uptake.", "2": "Conjugation requires direct cell-to-cell contact via a pilus -- not free DNA from the environment."}}, {"id": "a9_68", "ch": 9, "type": "mc", "q": "Transfer of DNA between bacteria using a bacteriophage as the vector is called:", "opts": ["Transformation", "Transduction", "Conjugation"], "correct": 1, "exp": "Transduction uses a bacteriophage that accidentally packages host DNA and delivers it to a new bacterial cell during infection.", "src": "assignment", "wrongExp": {"0": "Transformation is uptake of free DNA from the environment -- no phage vector involved.", "2": "Conjugation requires direct cell-to-cell contact via a pilus -- it doesn't use a phage as a vector."}}, {"id": "q_c9_01", "ch": 9, "type": "mc", "q": "During translation, a new tRNA enters the ribosome at the ________ site, while the tRNA being discharged exits via the ________ site.", "opts": ["A site; E site", "P site; A site", "E site; P site", "A site; P site"], "correct": 0, "exp": "A new tRNA enters at the A (aminoacyl) site; the tRNA being released exits via the E (exit) site, after shifting through the P (peptidyl) site.", "terms": ["translation"], "src": "quiz1", "wrongExp": {"1": "This reverses which site is for entering vs. exiting -- the new tRNA enters at A, the discharged one exits at E.", "2": "This also reverses the sites -- entry is at A, exit is at E.", "3": "The discharged tRNA exits via the E site, not the P site."}}, {"id": "q_c9_02", "ch": 9, "type": "tf", "q": "The peptide bond formed during translation is created by a condensation reaction linking the amino acids on two adjacent tRNAs.", "correct": true, "exp": "True -- this condensation reaction (per Process Figure 9.18) joins the growing polypeptide to the newly arrived amino acid, releasing a water molecule.", "terms": ["translation"], "src": "quiz1", "wrongExp": "This condensation reaction really is how the peptide bond forms -- joining the growing chain to the newly arrived amino acid and releasing water."}, {"id": "q_c9_03", "ch": 9, "type": "mc", "q": "Which term is defined as the sum total of genetic material in a cell?", "opts": ["Genetics", "Heredity", "Genome", "Phenotype"], "correct": 2, "exp": "Genome is the sum total of all genetic material (DNA) in a cell. Genetics is the study of heredity; heredity is trait transmission; phenotype is expressed traits.", "src": "quiz1", "wrongExp": {"0": "Genetics is the STUDY of heredity -- not the genetic material itself.", "1": "Heredity is the transmission of traits to offspring -- a process, not the material itself.", "3": "Phenotype is the observable expression of genes -- not the genetic material itself."}}, {"id": "q_c9_04", "ch": 9, "type": "tf", "q": "DNA is the blueprint that indicates which kinds of proteins to make and how to make them.", "correct": true, "exp": "True -- the order of triplets along the DNA strand directs a protein's amino acid sequence, which determines its shape and function.", "src": "quiz1", "wrongExp": "DNA really does function this way -- its triplet sequence directs which proteins get made and how."}, {"id": "q_c9_05", "ch": 9, "type": "tf", "q": "The lac operon is normally in an off mode and does not initiate enzyme synthesis when the appropriate substrate is absent.", "correct": true, "exp": "True -- the lac operon is inducible: normally OFF, and only switched ON by an inducer (lactose) when the substrate is actually present.", "src": "quiz1", "wrongExp": "The lac operon really is inducible -- normally OFF, and only activated once its inducer (lactose) is present."}, {"id": "q_c9_06", "ch": 9, "type": "mc", "q": "Population changes, and thus evolution, result from variations called genetic:", "opts": ["Regulations", "Translations", "Mutations", "Operons"], "correct": 2, "exp": "Mutations are heritable DNA changes that create the variation populations need for evolution by natural selection.", "src": "quiz1", "wrongExp": {"0": "Regulations (like operons) turn genes on/off -- they don't alter the DNA sequence to create new variation.", "1": "Translation builds proteins from mRNA -- it isn't a source of heritable genetic variation.", "3": "Operons are structural/control units -- not themselves a source of new variation."}}, {"id": "q_c9_07", "ch": 9, "type": "tf", "q": "Transformation is a mode of genetic recombination in which a plasmid is transferred from a donor cell to a recipient cell via a direct connection.", "correct": false, "exp": "False -- that description is conjugation (direct cell-to-cell contact via a pilus). Transformation is uptake of free DNA fragments from the environment, with no direct connection involved.", "src": "quiz1", "wrongExp": "That description is actually CONJUGATION (direct contact via a pilus) -- transformation is uptake of free DNA, with no direct connection."}, {"id": "q_c9_08", "ch": 9, "type": "mc", "q": "Transcription is characterized by:", "opts": ["A messenger RNA molecule synthesized from the DNA molecule in the nucleus", "A transfer RNA molecule synthesized from the DNA molecule in the nucleus", "A ribosomal RNA molecule synthesized from the DNA molecule in the nucleus", "The blueprint of the RNA molecule used to bind amino acids together to form proteins", "The binding of enzymes to their substrates to produce products"], "correct": 0, "exp": "Transcription is most directly characterized by mRNA synthesis from a DNA template -- the molecule that carries the protein-coding message onward to translation.", "src": "quiz1", "wrongExp": {"1": "tRNA IS transcribed from DNA too, but transcription is most directly characterized by mRNA production.", "2": "rRNA IS transcribed from DNA too, but transcription is most directly characterized by mRNA production.", "3": "This describes translation (using RNA as a blueprint to bind amino acids), not transcription.", "4": "This is a generic description of enzyme catalysis, not specific to transcription."}}, {"id": "q_c9_09", "ch": 9, "type": "mc", "q": "Extra pieces of DNA found in bacteria are called:", "opts": ["Genomic fragments", "Gene fragments", "Chromosomes", "Plasmids", "Mitochondrial DNA"], "correct": 3, "exp": "Plasmids are small, circular, extrachromosomal DNA pieces in bacteria, separate from the main chromosome, often carrying advantageous genes like antibiotic resistance.", "src": "quiz1", "wrongExp": {"0": "'Genomic fragments' isn't the standard term used for these extra DNA pieces.", "1": "'Gene fragments' isn't the standard term used for these extra DNA pieces.", "2": "Bacteria typically have ONE main chromosome -- plasmids are extra, separate from it.", "4": "Mitochondrial DNA is extrachromosomal DNA found in eukaryotic mitochondria -- bacteria don't have mitochondria."}}, {"id": "q_c9_10", "ch": 9, "type": "mc", "q": "In eukaryotes, transcription occurs in the ________. In prokaryotes, transcription occurs in the ________.", "opts": ["Nucleus; cytoplasm", "Cytoplasm; nucleus", "Nucleus; nucleus", "Cytoplasm; cytoplasm"], "correct": 0, "exp": "Eukaryotes have a nuclear membrane confining transcription to the nucleus; prokaryotes have no nucleus, so transcription happens directly in the cytoplasm.", "src": "quiz1", "wrongExp": {"1": "This reverses the actual locations -- eukaryotes use the nucleus, prokaryotes use the cytoplasm, not the reverse.", "2": "Prokaryotes have no nucleus at all -- transcription can't occur there.", "3": "Eukaryotes DO have a nucleus, and transcription is confined to it -- not the cytoplasm."}}, {"id": "q_c6_01", "ch": 6, "type": "tf", "q": "The viral envelope is entirely formed from viral material.", "correct": false, "exp": "False -- the envelope is derived from the host cell's own membrane as the virus buds out; it's a hybrid, since host membrane proteins get replaced with viral spike proteins, but the lipid bilayer itself is host-derived.", "src": "quiz1", "wrongExp": "The envelope is actually a hybrid -- derived from the host's own membrane, just modified with viral spike proteins -- not entirely viral material."}, {"id": "q_c6_02", "ch": 6, "type": "mc", "q": "What is the correct sequence for bacteriophage multiplication, from first step to last?", "opts": ["Adsorption, Penetration, Synthesis, Assembly, Release", "Penetration, Adsorption, Synthesis, Assembly, Release", "Adsorption, Synthesis, Penetration, Assembly, Release", "Adsorption, Penetration, Assembly, Synthesis, Release"], "correct": 0, "exp": "Adsorption (attach) -> Penetration (inject DNA) -> Synthesis (replicate/make proteins) -> Assembly (package virions) -> Release (lyse host cell).", "src": "quiz1", "wrongExp": {"1": "Penetration can't come before adsorption -- the phage must attach before it can inject anything.", "2": "Synthesis can't happen before penetration -- the phage's genome has to get inside the cell first.", "3": "Assembly can't happen before synthesis -- new components must be made before they can be packaged."}}, {"id": "q_c6_03", "ch": 6, "type": "tf", "q": "Once a phage becomes lysogenic, it will remain lysogenic and never be lytic again.", "correct": false, "exp": "False -- a lysogenic (prophage) state isn't permanent. Triggers like UV light can induce the prophage to excise and re-enter the lytic cycle.", "terms": ["lysogeny"], "src": "quiz1", "wrongExp": "A lysogenic state isn't necessarily permanent -- triggers like UV light can induce the prophage to excise and re-enter the lytic cycle."}, {"id": "q_c6_04", "ch": 6, "type": "mc", "q": "Which of the following is NOT true of all viruses?", "opts": ["They possess a capsid composed of protein", "They are reliant on a host cell for their own reproduction", "They are free-living organisms", "They contain either DNA or RNA, never both"], "correct": 2, "exp": "Viruses are obligate intracellular parasites, not free-living -- they can't replicate or carry out metabolism outside a host cell. The other three statements are true of every virus.", "src": "quiz1", "wrongExp": {"0": "This IS true of all viruses -- they all have a protein capsid -- so it's not the exception.", "1": "This IS true of all viruses -- they all depend on a host cell to reproduce -- so it's not the exception.", "3": "This IS true of all viruses -- each carries either DNA or RNA, never both -- so it's not the exception."}}, {"id": "q_c6_05", "ch": 6, "type": "tf", "q": "All viruses possess a capsid composed of protein.", "correct": true, "exp": "True -- every virus has a protein capsid enclosing its genetic material, regardless of whether it also has an envelope.", "src": "quiz1", "wrongExp": "Every virus really does have a protein capsid enclosing its genetic material, whether or not it also has an envelope."}, {"id": "q_c6_06", "ch": 6, "type": "mc", "q": "Which of the following diseases is caused by a prion, not a virus?", "opts": ["Measles", "Mumps", "Creutzfeldt-Jakob disease", "Influenza"], "correct": 2, "exp": "CJD is a prion disease (a transmissible spongiform encephalopathy); measles, mumps, and influenza are all caused by RNA viruses, not prions.", "src": "quiz1", "wrongExp": {"0": "Measles is caused by a virus, not a prion.", "1": "Mumps is caused by a virus, not a prion.", "3": "Influenza is caused by a virus, not a prion."}}, {"id": "q_c6_07", "ch": 6, "type": "tf", "q": "Prions are resistant to routine sterilization techniques.", "correct": true, "exp": "True -- prions resist standard heat, chemical disinfection, and radiation sterilization, which is exactly what makes them so hard to decontaminate (e.g., on surgical instruments).", "src": "quiz1", "wrongExp": "Prions really are notoriously resistant to standard heat, chemical, and radiation sterilization -- which is exactly what makes them hard to decontaminate."}, {"id": "g9_01", "ch": 9, "type": "mc", "q": "In the lac operon, catabolite repression means that:", "exp": "Glucose, the preferred carbon source, keeps the lac operon repressed even when lactose is present -- mediated by CAP protein and cyclic AMP.", "src": "chapter", "opts": ["The operon is permanently shut off once lactose is depleted", "Glucose, the preferred carbon source, keeps the lac operon repressed even when lactose is present", "Glucose acts as the lac operon's inducer", "CAP protein directly binds lactose to repress the operon"], "correct": 1, "wrongExp": {"0": "Catabolite repression is about glucose's effect, not about lactose running out.", "2": "Lactose -- not glucose -- is the lac operon's inducer; glucose actually represses it when present.", "3": "CAP/cyclic AMP mediates catabolite repression, but CAP doesn't bind lactose directly -- glucose lowers cAMP, which is what reduces CAP's help."}, "terms": ["catabolite repression"]}, {"id": "g9_02", "ch": 9, "type": "tf", "q": "Catabolite repression is mediated by CAP protein and cyclic AMP.", "exp": "This is exactly how catabolite repression works -- when glucose is present, cyclic AMP levels drop, so CAP can't help activate the lac promoter, keeping the operon repressed even with lactose around.", "src": "chapter", "correct": true, "wrongExp": "This is literally the mechanism -- glucose presence lowers cyclic AMP, which weakens CAP's help at the promoter.", "terms": ["catabolite repression"]}, {"id": "g9_03", "ch": 9, "type": "mc", "q": "Full induction (maximum transcription) of the lac operon requires:", "exp": "Lactose must be present (to inactivate the repressor) AND glucose must be absent (so CAP/cAMP can maximize transcription) -- both conditions together.", "src": "chapter", "opts": ["Lactose present and glucose present", "Lactose present and glucose absent", "Glucose present and lactose absent", "Neither lactose nor glucose present"], "correct": 1, "wrongExp": {"0": "Glucose being present blocks FULL induction via catabolite repression, even with lactose around.", "2": "Without lactose, the repressor stays bound to the operator regardless of glucose -- the operon stays off.", "3": "Without lactose, the operon stays off entirely -- the inducer has to be present."}}, {"id": "g9_04", "ch": 9, "type": "mc", "q": "Generalized transduction packages ________ fragments of host DNA into the phage capsid, while specialized transduction transfers only the ________ host genes located next to a prophage's integration site.", "exp": "Generalized transduction packages RANDOM host DNA fragments during the lytic cycle; specialized transduction transfers a SPECIFIC region next to where a prophage was sitting, excised as it re-enters the lytic cycle.", "src": "chapter", "opts": ["Random; specific", "Specific; random", "Random; random", "Specific; specific"], "correct": 0, "wrongExp": {"1": "This is reversed -- generalized transduction is the RANDOM one; specialized is the SPECIFIC one.", "2": "Only generalized transduction is random -- specialized transduction is tied to one specific location.", "3": "Only specialized transduction is tied to one specific location -- generalized transduction packages random fragments."}}, {"id": "g9_05", "ch": 9, "type": "tf", "q": "Generalized transduction occurs during a phage's lytic cycle, while specialized transduction occurs as a prophage transitions from the lysogenic cycle back into the lytic cycle.", "exp": "This is exactly the distinction: generalized transduction packages random DNA during an active lytic infection; specialized transduction excises a specific nearby region when a dormant prophage re-enters the lytic cycle.", "src": "chapter", "correct": true, "wrongExp": "This IS the real distinction between the two -- one happens during an active lytic infection, the other during the lysogenic-to-lytic switch."}, {"id": "g9_06", "ch": 9, "type": "mc", "q": "An Hfr (High-Frequency Recombination) cell forms when:", "exp": "The F factor plasmid integrates into the donor cell's own chromosome, after which conjugation can transfer chromosomal genes (not just the plasmid) into the recipient.", "src": "chapter", "opts": ["A bacteriophage integrates its genome into the host chromosome", "The F factor plasmid integrates into the donor cell's chromosome", "A transposon excises itself from the chromosome", "Free DNA is taken up from a lysed cell"], "correct": 1, "wrongExp": {"0": "That describes a prophage (lysogeny), not an Hfr cell.", "2": "Transposon excision is unrelated to the F factor/conjugation system.", "3": "That describes transformation, not conjugation/Hfr formation."}, "terms": ["Hfr cell"]}, {"id": "g9_07", "ch": 9, "type": "mc", "q": "Noncoding RNA sequences within an mRNA transcript that change shape upon binding a small ligand (like an amino acid), hiding the ribosome-binding site to shut off translation, are called:", "exp": "Riboswitches are noncoding mRNA sequences that bind ligands (e.g., lysine) and change shape to directly regulate translation.", "src": "chapter", "opts": ["Introns", "Operons", "Riboswitches", "Plasmids"], "correct": 2, "wrongExp": {"0": "Introns are spliced-out noncoding regions removed before translation -- not ligand-sensing switches.", "1": "Operons are DNA-level transcription-control units, not RNA elements controlling translation directly.", "3": "Plasmids are separate circular DNA molecules -- unrelated to mRNA-level translation control."}, "terms": ["riboswitch"]}, {"id": "g9_08", "ch": 9, "type": "mc", "q": "MicroRNA (miRNA), antisense RNA, and small interfering RNA (siRNA) all regulate gene expression by:", "exp": "All three bind mRNA transcripts to cause their degradation or block their translation -- a collection of mechanisms called RNA interference (RNAi).", "src": "chapter", "opts": ["Replicating the host's DNA faster", "Binding mRNA transcripts to cause their degradation or block their translation", "Acting as the ribosome's structural core", "Serving as the template for transcription"], "correct": 1, "wrongExp": {"0": "These RNAs have nothing to do with DNA replication speed.", "2": "rRNA -- not these regulatory RNAs -- forms the ribosome's structural core.", "3": "DNA is the transcription template -- these RNAs act AFTER transcription, on the mRNA product."}, "terms": ["RNA interference"]}, {"id": "g9_09", "ch": 9, "type": "tf", "q": "RNA interference (RNAi) is the collective term for how miRNA, antisense RNA, and siRNA silence gene expression by targeting mRNA.", "exp": "RNAi is exactly this umbrella term -- these regulatory RNAs all work by binding mRNA to trigger its degradation or block its translation.", "src": "chapter", "correct": true, "wrongExp": "RNAi IS the umbrella term for exactly this -- miRNA, antisense RNA, and siRNA all silencing genes by targeting mRNA.", "terms": ["RNA interference"]}, {"id": "g9_10", "ch": 9, "type": "mc", "q": "Which molecule is considered the fundamental (smallest) unit of heredity?", "exp": "Genes -- not chromosomes -- are generally considered the fundamental unit of heredity; a chromosome is a larger structure made of many genes packaged together.", "src": "chapter", "opts": ["Chromosome", "Genome", "Gene", "Nucleotide"], "correct": 2, "wrongExp": {"0": "A chromosome is a larger structure made of many genes packaged together -- not the smallest unit.", "1": "The genome is the sum of ALL genetic material -- the largest-scale term, not the smallest unit.", "3": "A nucleotide is a single chemical building block of DNA -- smaller than a gene, but a lone nucleotide carries no heritable trait by itself."}}, {"id": "g9_11", "ch": 9, "type": "tf", "q": "A chromosome is a larger structure composed of many genes packaged together, rather than being itself the basic unit of heredity.", "exp": "Correct -- genes, not chromosomes, are the fundamental unit of heredity; a chromosome is simply how many genes get packaged together.", "src": "chapter", "correct": true, "wrongExp": "Genes are the true smallest unit of heredity -- a chromosome is just the larger package many genes are bundled into."}, {"id": "g9_12", "ch": 9, "type": "mc", "q": "Per the textbook's own worked example, DNA Triplet 1 reads GAC (coding strand) / CTG (template strand). What is the corresponding mRNA codon?", "exp": "The textbook's own answer key pairs Triplet 1 (GAC/CTG) with mRNA Codon 1 = CUG.", "src": "chapter", "opts": ["GAC", "CUG", "CTG", "CAG"], "correct": 1, "wrongExp": {"0": "This just repeats the DNA coding strand -- mRNA uses U instead of T.", "2": "This uses T (thymine) -- mRNA is RNA, so it uses U (uracil) instead.", "3": "Not the base-paired sequence the textbook pairs with this triplet."}, "terms": ["start codon"]}, {"id": "g9_13", "ch": 9, "type": "mc", "q": "Per the textbook's own worked example, DNA Triplet 2 reads TAT (coding strand) / ATA (template strand). What is the corresponding mRNA codon?", "exp": "The textbook's own answer key pairs Triplet 2 (TAT/ATA) with mRNA Codon 2 = AUA.", "src": "chapter", "opts": ["TAT", "ATA", "AUA", "UAU"], "correct": 2, "wrongExp": {"0": "This repeats the DNA coding strand with T -- mRNA replaces T with U.", "1": "This is just the DNA template strand's own letters -- not yet converted to RNA.", "3": "Not the letter order the textbook pairs with this triplet."}}, {"id": "g9_14", "ch": 9, "type": "mc", "q": "Using the textbook's Table 9.4 sentence analogy -- wild type: THE BIG BAD CAT ATE THE FAT RED BUG -- which mutation type produced: THE BIG MAD CAT ATE THE FAT RED BUG?", "exp": "Table 9.4 labels this exact change (BAD -> MAD, one word swapped for another) as a missense mutation.", "src": "chapter", "opts": ["Missense", "Nonsense", "Insertion", "Deletion", "Silent"], "correct": 0, "wrongExp": {"1": "A nonsense mutation would cut the message short with a stop signal -- here the sentence continues normally, just with one word swapped.", "2": "An insertion would shift every letter grouping after the change -- here only one word changed, nothing shifted.", "3": "A deletion would shift every letter grouping after the change and shorten the sentence -- here only one word changed.", "4": "A silent change wouldn't alter the sentence at all -- here one meaningful word was swapped for another."}, "terms": ["frameshift mutation"]}, {"id": "g9_15", "ch": 9, "type": "mc", "q": "Using the textbook's Table 9.4 sentence analogy -- wild type: THE BIG BAD CAT ATE THE FAT RED BUG -- which mutation type produced: THE BIG ADC ATA TET HEF ATR EDB UG?", "exp": "Table 9.4 labels this change -- one letter shorter than wild-type, shifting every group after the missing letter -- as a deletion.", "src": "chapter", "opts": ["Deletion", "Insertion", "Missense", "Nonsense"], "correct": 0, "wrongExp": {"1": "An insertion would make the sentence one letter LONGER overall -- this version is one letter SHORTER, which is the deletion pattern.", "2": "Missense swaps one word for another meaningful one -- here the letters have shifted position entirely, not just swapped.", "3": "Nonsense cuts the message short with a stop -- here the message continues, just shifted."}}, {"id": "g9_16", "ch": 9, "type": "tf", "q": "In the textbook's Table 9.4 sentence analogy, the wild-type (nonmutated) sequence is \"THE BIG BAD CAT ATE THE FAT RED BUG.\"", "exp": "This is the exact wild-type sentence the textbook uses as its baseline for illustrating each mutation type -- worth memorizing exactly, since a similar but different exam sentence can otherwise cause mix-ups.", "src": "chapter", "correct": true, "wrongExp": "This IS the textbook's exact baseline sentence -- it's the one worth memorizing precisely, since a lookalike sentence elsewhere could otherwise cause confusion."}, {"id": "lm61", "ch": 6, "type": "mc", "q": "When a virus enters a lysogenic phase, it means:", "exp": "Lysogeny means the viral DNA (prophage) has integrated into the host chromosome and stays dormant/latent -- the host cell carries on normally.", "src": "lastminute", "opts": ["The virus is starting biosynthesis of its nucleic acid", "The number of viruses in the host is decreasing as the immune system becomes effective", "The virus is integrated into the DNA of the host cell and is latent", "The virus will remain in circulation and not continue infecting its host", "The virus is bursting through the host cell membrane"], "correct": 2, "wrongExp": {"0": "Active biosynthesis describes the LYTIC cycle, not the dormant lysogenic state.", "1": "Lysogeny isn't about immune clearance -- it's about the virus going dormant inside the host's genome.", "3": "This doesn't describe lysogeny -- lysogeny is about integration and dormancy, not circulation.", "4": "Bursting through the membrane describes RELEASE in an active (lytic) infection -- the opposite of dormant lysogeny."}, "terms": ["lysogeny"]}, {"id": "lm44", "ch": 6, "type": "mc", "q": "All of the following are characteristics of viruses except:", "exp": "Viruses have no metabolism of their own -- they're entirely dependent on hijacking the host cell's machinery for everything.", "src": "lastminute", "opts": ["Genes", "Ultramicroscopic size", "Unique shapes", "Metabolism", "Ability to infect host cells"], "correct": 3, "wrongExp": {"0": "Viruses DO carry a minimal set of genes -- a real characteristic, not the exception.", "1": "Viruses ARE ultramicroscopic (20-400 nm) -- a real characteristic, not the exception.", "2": "Viruses DO have distinctive shapes -- a real characteristic, not the exception.", "4": "Infecting host cells is the defining viral characteristic -- not the exception."}}, {"id": "lm29", "ch": 9, "type": "mc", "q": "A bacteriophage transfers a random DNA segment of the previous host to the current host. This is an example of:", "exp": "Generalized transduction packages random fragments of host DNA into the phage capsid -- virtually any gene can be transferred this way.", "src": "lastminute", "opts": ["Creation of an Hfr cell", "Specialized transduction", "Conjugation", "Generalized transduction"], "correct": 3, "wrongExp": {"0": "An Hfr cell is a product of conjugation, not transduction.", "1": "Specialized transduction transfers a SPECIFIC, fixed segment of host DNA -- not a random one.", "2": "Conjugation requires direct cell contact via a pilus, not a phage vector."}}, {"id": "lm62", "ch": 6, "type": "mc", "q": "All of the following are characteristics of viruses except:", "exp": "The space inside the capsid holds the nucleic acid (and sometimes a few enzymes/matrix proteins) -- a dry genetic structure, not a fluid-filled space.", "src": "lastminute", "opts": ["They can cause fatal diseases", "They have a viscous fluid inside their capsids", "They can be crystallized", "They often have a geometric capsid", "They can cause mild diseases"], "correct": 1, "wrongExp": {"0": "Viruses CAN cause fatal diseases (rabies, HIV, Ebola) -- true, not the exception.", "2": "Viruses CAN be crystallized -- true, not the exception.", "3": "Capsids ARE geometric (helical or icosahedral) -- true, not the exception.", "4": "Viruses CAN cause mild diseases (like the common cold) -- true, not the exception."}}, {"id": "lm64", "ch": 6, "type": "tf", "q": "Spikes are glycoproteins of the viral capsid.", "exp": "Spikes are glycoproteins of the viral ENVELOPE, not the capsid -- naked (non-enveloped) viruses have a capsid but no envelope, and no spikes at all.", "src": "lastminute", "correct": false, "wrongExp": "Spikes sit on the ENVELOPE, not the capsid -- that's why naked (envelope-free) viruses have no spikes at all."}, {"id": "lm51", "ch": 6, "type": "mc", "q": "The correct sequence of events in viral multiplication is:", "exp": "The virus must attach (adsorption) and enter (penetration) before it can replicate, assemble, mature, and finally be released.", "src": "lastminute", "opts": ["Replication, penetration, maturation, assembly, adsorption, release", "Penetration, replication, maturation, adsorption, assembly, release", "Adsorption, penetration, replication, assembly, maturation, release", "Assembly, maturation, replication, release, penetration, adsorption", "Adsorption, release, maturation, replication, assembly, penetration"], "correct": 2, "wrongExp": {"0": "This order is scrambled -- adsorption and penetration must come first.", "1": "This order is scrambled -- adsorption must come before penetration.", "3": "This order is scrambled -- adsorption and penetration must come first, release must come last.", "4": "This order is scrambled -- release has to come after assembly and maturation, not before."}}, {"id": "lm47", "ch": 6, "type": "mc", "q": "Host cells of viruses include:", "exp": "Viruses parasitize animals, plants/fungi, bacteria, and protists (which include protozoa and algae) -- all of these groups.", "src": "lastminute", "opts": ["Protozoa and algae", "Plants and fungi", "All of these choices are correct", "Human and other animals", "Bacteria"], "correct": 2, "wrongExp": {"0": "True, but incomplete -- viruses infect ALL of these groups.", "1": "True, but incomplete -- viruses infect ALL of these groups.", "3": "True, but incomplete -- viruses infect ALL of these groups.", "4": "True, but incomplete -- viruses infect ALL of these groups."}}, {"id": "lm19", "ch": 9, "type": "mc", "q": "In gene regulation, which enzyme below is blocked from initiating transcription by a repressor protein?", "exp": "A repressor sitting on the operator physically blocks RNA polymerase, the enzyme responsible for transcription.", "src": "lastminute", "opts": ["mRNA", "DNA polymerase III", "rRNA", "DNA polymerase I", "RNA polymerase"], "correct": 4, "wrongExp": {"0": "mRNA is a product, not an enzyme -- it can't be 'blocked from initiating' anything.", "1": "DNA polymerase III functions in DNA replication, not transcription.", "2": "rRNA is a product, not an enzyme involved in transcription initiation.", "3": "DNA polymerase I functions in DNA replication/repair, not transcription."}}, {"id": "lm39", "ch": 9, "type": "mc", "q": "What cell structure is responsible for protein synthesis?", "exp": "The ribosome is where mRNA, tRNA, and amino acids come together to assemble a finished protein.", "src": "lastminute", "opts": ["DNA", "Golgi body", "Lysosome", "Ribosome"], "correct": 3, "wrongExp": {"0": "DNA stores the genetic code, but doesn't itself assemble proteins.", "1": "The Golgi body modifies and packages proteins AFTER they're made -- it doesn't synthesize them.", "2": "The lysosome digests materials -- it plays no role in building proteins."}}, {"id": "lm22", "ch": 9, "type": "mc", "q": "The most damaging type of mutation is a:", "exp": "Insertion/deletion frameshifts alter every amino acid downstream of the mutation, making them nearly always nonfunctional -- more consistently damaging than the others.", "src": "lastminute", "opts": ["Back mutation", "Silent mutation", "All of the choices are equally damaging", "Missense mutation", "Frameshift mutation"], "correct": 4, "wrongExp": {"0": "A back-mutation reverses damage, restoring the original sequence -- it undoes harm rather than causing it.", "1": "By definition, a silent mutation has no effect on the protein at all.", "2": "These aren't equally damaging -- frameshifts scramble everything downstream, while missense varies and silent has no effect.", "3": "Missense mutations are variable -- sometimes harmless, sometimes damaging -- not as consistently severe as a frameshift."}}, {"id": "lm10", "ch": 9, "type": "mc", "q": "RNA molecules differ from DNA molecules because only RNA:", "exp": "RNA is single-stranded, uses uracil instead of thymine, and uses ribose instead of deoxyribose -- all three differences hold at once.", "src": "lastminute", "opts": ["Is typically one strand of nucleotides", "Does not have thymine", "Has uracil", "All of the choices are correct", "Has ribose"], "correct": 3, "wrongExp": {"0": "True of RNA, but incomplete -- RNA also differs by base type and sugar type.", "1": "True, but incomplete -- RNA is also single-stranded and uses ribose.", "2": "True, but incomplete -- RNA is also single-stranded and uses ribose.", "4": "True, but incomplete -- RNA is also single-stranded and uses uracil."}}, {"id": "lm36", "ch": 9, "type": "tf", "q": "Repressible operons are normally turned on in the cell.", "exp": "Repressible operons (like arg or trp) are normally ON by default -- they only get turned OFF once their end-product builds up and acts as a corepressor.", "src": "lastminute", "correct": true, "wrongExp": "Repressible operons default to ON -- it's INDUCIBLE operons (like lac) that default to OFF. Easy to mix up which system starts in which state."}, {"id": "lm34", "ch": 9, "type": "tf", "q": "Introns have no detectable functions.", "exp": "Alternative splicing depends directly on introns and lets different protein versions be produced from a single gene -- a real functional role, not 'no detectable function.'", "src": "lastminute", "correct": false, "wrongExp": "Alternative splicing (which depends on introns) can produce different protein versions from one gene -- that's a real, detectable function."}, {"id": "lm45", "ch": 6, "type": "mc", "q": "When used in a description of viruses, the term replication includes:", "exp": "'Replication' covers copying the genome (DNA or RNA, depending on virus type) AND producing full new virus particles -- all together.", "src": "lastminute", "opts": ["The copying of the genomic RNA in an RNA virus", "The production of multiple copies of a virus by a host cell", "All of these choices are correct", "The copying of the viral DNA in a DNA virus"], "correct": 2, "wrongExp": {"0": "True, but incomplete -- 'replication' covers all of these together.", "1": "True, but incomplete -- 'replication' covers all of these together.", "3": "True, but incomplete -- 'replication' covers all of these together."}}, {"id": "lm04", "ch": 9, "type": "mc", "q": "The DNA of microorganisms is made up of subunits called:", "exp": "Nucleotides (phosphate + sugar + nitrogenous base) are DNA's building-block subunits.", "src": "lastminute", "opts": ["mRNA", "Amino acids", "Histones", "Polymerases", "Nucleotides"], "correct": 4, "wrongExp": {"0": "mRNA is a transcription product, not a DNA building block.", "1": "Amino acids are the subunits of proteins, not DNA.", "2": "Histones are proteins DNA wraps around for packaging -- not part of the DNA strand itself.", "3": "Polymerases are enzymes that build DNA/RNA -- not subunits of DNA."}}, {"id": "lm35", "ch": 9, "type": "tf", "q": "Lactose is a corepressor in the lac operon.", "exp": "Lactose is an inducer, not a corepressor -- it binds the repressor to turn transcription ON. A corepressor does the opposite, helping a repressor shut transcription OFF (as arginine does in the arg operon).", "src": "lastminute", "correct": false, "wrongExp": "Lactose is an INDUCER (turns the operon ON), not a corepressor (which would help turn an operon OFF, like arginine does in the arg operon)."}, {"id": "lm43", "ch": 6, "type": "mc", "q": "Viruses have the ability to infect the following cell types.", "exp": "Viruses parasitize all types of cells -- bacteria, protists, fungi, animals, and plants -- each with its own narrow host range within that group.", "src": "lastminute", "opts": ["Plants", "Bacteria", "All of these choices are correct", "Protists", "Fungi"], "correct": 2, "wrongExp": {"0": "True, but incomplete -- viruses infect ALL of these groups.", "1": "True, but incomplete -- viruses infect ALL of these groups.", "3": "True, but incomplete -- viruses infect ALL of these groups.", "4": "True, but incomplete -- viruses infect ALL of these groups."}}, {"id": "lm31", "ch": 9, "type": "mc", "q": "Which of the following additions have been made to principles of the central dogma of biology?", "exp": "RNA was later found to do more than just relay the message -- riboswitches, miRNA, siRNA, and antisense RNA all let RNA help REGULATE gene expression, an addition beyond the original DNA-to-RNA-to-protein flow.", "src": "lastminute", "opts": ["Protein information can be converted into DNA information", "All of the choices are correct", "DNA information cannot be converted into RNA information", "DNA codes for proteins", "RNA can be used to regulate gene function"], "correct": 4, "wrongExp": {"0": "Proteins never convert back into nucleic acid information -- this contradicts biology rather than extending it.", "1": "Not all of these are true -- two of the other options directly contradict known biology.", "2": "False -- DNA to RNA (transcription) is a well-established, foundational step, not something that 'cannot' happen.", "3": "'DNA codes for proteins' IS the original central dogma principle itself, not a later addition to it."}, "terms": ["central dogma"]}, {"id": "lm08", "ch": 9, "type": "mc", "q": "Groups of three consecutive bases along the DNA of a gene have the code for one:", "exp": "DNA triplets (and their mRNA codon equivalents) are read in groups of three, each specifying one amino acid.", "src": "lastminute", "opts": ["Protein", "Purine", "Nucleotide", "Amino acid"], "correct": 3, "wrongExp": {"0": "A whole protein needs MANY triplets strung together -- one triplet specifies only one amino acid.", "1": "A purine is a category of nitrogenous base (adenine/guanine) -- one base, not a group of three.", "2": "A nucleotide is a single subunit, not a three-base group."}}, {"id": "lm46", "ch": 6, "type": "mc", "q": "All of the following pertain to virus envelopes except they:", "exp": "The envelope wraps AROUND the outside of the whole capsid -- the nucleic acid sits inside the capsid, and the envelope is external to it, not sandwiched between the two.", "src": "lastminute", "opts": ["Help the virus particle attach to host cells", "Are located between the capsid and nucleic acid", "Contain special virus proteins", "Are formed by the virus utilizing parts of the host cell membrane", "Are found primarily on animal viruses"], "correct": 1, "wrongExp": {"0": "This IS true -- envelope spikes help attach to host receptors -- not the exception.", "2": "This IS true -- envelopes carry viral spike proteins -- not the exception.", "3": "This IS true -- the envelope is modified host membrane -- not the exception.", "4": "This IS true -- enveloped viruses are predominantly animal viruses -- not the exception."}}, {"id": "lm02", "ch": 9, "type": "mc", "q": "Which term best describes all the genetic material of a cell?", "exp": "Genome is defined as the sum total of all genetic material (DNA) in a cell.", "src": "lastminute", "opts": ["Proteome", "Chromosome", "Genome", "Plasmid", "Prophage"], "correct": 2, "wrongExp": {"0": "Proteome refers to all the proteins a cell makes, not its genetic material.", "1": "A chromosome is just one discrete DNA structure -- the genome is the sum of ALL genetic material, which can span multiple structures.", "3": "A plasmid is extra, nonessential DNA -- only part of a cell's total genetic material, not all of it.", "4": "A prophage is a small piece of integrated viral genome -- not the whole cell's genetic material."}}, {"id": "lm03", "ch": 9, "type": "mc", "q": "What term best describes a specific segment of DNA that codes for production of a single functional product?", "exp": "A gene is a specific DNA sequence that codes for a protein or functional RNA molecule.", "src": "lastminute", "opts": ["Operator", "Codon", "Exon", "Gene", "Intron"], "correct": 3, "wrongExp": {"0": "An operator is a regulatory DNA sequence controlling transcription -- it doesn't itself code for a product.", "1": "A codon is just a 3-base unit specifying one amino acid -- far smaller than a whole coding segment.", "2": "An exon is the expressed portion WITHIN a gene, not the complete functional unit itself.", "4": "An intron is a non-coding region removed before translation -- it doesn't code for anything."}}, {"id": "lm37", "ch": 9, "type": "mc", "q": "Short interfering RNAs affect gene expression in eukaryotes by:", "exp": "siRNA (along with miRNA and antisense RNA) binds mRNA transcripts to cause degradation or block translation -- RNA interference (RNAi).", "src": "lastminute", "opts": ["Blocking replication of certain genes", "Binding to ribosomes, preventing the two subunits from joining", "Blocking transcription of certain genes", "Binding to mRNAs and preventing translation"], "correct": 3, "wrongExp": {"0": "siRNA acts on mRNA (post-transcriptionally), not on DNA replication.", "1": "siRNA targets the mRNA message itself, not ribosome assembly.", "2": "siRNA acts AFTER transcription, on the mRNA transcript -- not by blocking transcription itself."}, "terms": ["RNA interference"]}, {"id": "lm58", "ch": 6, "type": "mc", "q": "All of the following are correct about treating viral diseases except:", "exp": "Antibiotics target bacterial structures/processes that viruses simply don't have -- they're completely ineffective against viral infections.", "src": "lastminute", "opts": ["Many antiviral drugs block viral replication", "Interferons show potential for treating and preventing viral infections", "Viruses are killed by the same antibiotics that kill bacteria", "Many antiviral drugs cause severe side effects", "All of these choices are correct"], "correct": 2, "wrongExp": {"0": "This IS true (that's how most antivirals work) -- not the exception.", "1": "This IS true (interferon is a naturally occurring antiviral agent) -- not the exception.", "3": "This IS true -- many antivirals cause side effects since they target host-cell functions -- not the exception.", "4": "Not all of these are correct -- the antibiotics statement is false, so 'all of these' can't be right."}}, {"id": "lm66", "ch": 6, "type": "tf", "q": "Viral infections are easier to treat with drugs than bacterial infections.", "exp": "Because viruses replicate using the host's own cellular machinery, it's hard to target the virus without also harming host cells -- making antivirals generally less precise (and more side-effect-prone) than antibiotics.", "src": "lastminute", "correct": false, "wrongExp": "It's the opposite -- since viruses hijack host-cell machinery, drugs that target them often harm host cells too, making viral infections generally HARDER to treat with drugs than bacterial ones."}, {"id": "lm05", "ch": 9, "type": "mc", "q": "Each nucleotide is composed of:", "exp": "A nucleotide monomer always has exactly one of each component -- one phosphate group, one nitrogenous base, one pentose sugar.", "src": "lastminute", "opts": ["Two phosphates, one nitrogenous base, one sugar", "One phosphate, two nitrogenous bases, one sugar", "One phosphate, one nitrogenous base, one sugar", "Two phosphates, one nitrogenous base, two sugars", "One phosphate, one nitrogenous base, two sugars"], "correct": 2, "wrongExp": {"0": "A nucleotide has only ONE phosphate, not two.", "1": "A nucleotide has only ONE nitrogenous base, not two.", "3": "A nucleotide has only one phosphate and one sugar, not two of each.", "4": "A nucleotide has only ONE sugar, not two."}}, {"id": "lm15", "ch": 9, "type": "mc", "q": "A sequence of bases within a gene that will be transcribed, but removed from the transcript prior to translation, is a/an:", "exp": "Introns are intragenic regions that are transcribed into pre-mRNA but spliced OUT before the mature mRNA is translated.", "src": "lastminute", "opts": ["Operon", "Promoter", "Operator", "Exon", "Intron"], "correct": 4, "wrongExp": {"0": "An operon is a whole regulatory+gene unit -- not a spliced-out transcript segment.", "1": "A promoter is a regulatory region controlling where transcription starts -- it isn't transcribed and removed.", "2": "An operator is a regulatory sequence controlling an operon -- it isn't transcribed and removed.", "3": "Exons are the coding regions that are KEPT and joined together -- the opposite of what's described."}}, {"id": "lm41", "ch": 6, "type": "mc", "q": "Viral cultivation is used for:", "exp": "Viral cultivation serves all of these purposes at once: diagnosis, vaccine prep, producing research quantities, studying the life cycle, and observing host-cell effects.", "src": "lastminute", "opts": ["Diagnosis of viral infections", "Studying the viral life cycle within host cells", "All of these choices are correct", "Preparation of vaccines", "Producing adequate numbers of viruses for research purposes", "Observing the effects of viral infection on host cells"], "correct": 2, "wrongExp": {"0": "True, but incomplete on its own -- cultivation serves ALL of these purposes together.", "1": "True, but incomplete on its own -- cultivation serves ALL of these purposes together.", "3": "True, but incomplete on its own -- cultivation serves ALL of these purposes together.", "4": "True, but incomplete on its own -- cultivation serves ALL of these purposes together.", "5": "True, but incomplete on its own -- cultivation serves ALL of these purposes together."}}, {"id": "lm25", "ch": 9, "type": "mc", "q": "Which mutations cause a frameshift?", "exp": "Insertion and deletion of 1-2 bases shift the reading frame, altering every amino acid downstream.", "src": "lastminute", "opts": ["Missense and nonsense", "Nonsense and deletion", "Insertion and nonsense", "Missense and insertion", "Deletion and insertion"], "correct": 4, "wrongExp": {"0": "Missense and nonsense are both substitution mutations -- they don't add or remove bases, so no frameshift.", "1": "Nonsense is a substitution, not an addition/deletion of bases -- it doesn't shift the frame.", "2": "Nonsense is a substitution, not an addition/deletion of bases -- it doesn't shift the frame.", "3": "Missense is a substitution, not an addition/deletion of bases -- it doesn't shift the frame."}}, {"id": "lm16", "ch": 9, "type": "mc", "q": "Which is incorrect about inducible operons?", "exp": "Inducible operons (like lac) are normally OFF, turned ON by their substrate, and typically run catabolic pathways. Being shut off by a buildup of END PRODUCT describes a REPRESSIBLE operon instead -- so that statement is the incorrect one about inducible operons.", "src": "lastminute", "opts": ["Are turned on by the substrate of the enzyme", "Include the lac operon", "Are normally turned off", "Have genes turned off by a buildup of end product", "Often encode enzymes for catabolic pathways"], "correct": 3, "wrongExp": {"0": "This IS correctly true of inducible operons -- not the exception being asked for.", "1": "The lac operon IS a textbook inducible operon -- this statement is correct, not the exception.", "2": "Inducible operons ARE normally off by default -- this statement is correct, not the exception.", "4": "Inducible operons DO typically encode catabolic enzymes -- this statement is correct, not the exception."}}, {"id": "lm33", "ch": 9, "type": "tf", "q": "The smallest unit of heredity is a chromosome.", "exp": "Genes, not chromosomes, are considered the fundamental unit of heredity -- a chromosome is a larger structure made up of many genes packaged together.", "src": "lastminute", "correct": false, "wrongExp": "Genes -- not chromosomes -- are the true smallest unit of heredity; a chromosome is a much larger structure built from many genes."}, {"id": "lm23", "ch": 9, "type": "mc", "q": "Using the textbook's mutation sentence analogy -- wild type: THE BIG BAD CAT ATE THE FAT RED BUG -- which mutation type produced: THE BIG BAB DCA TAT ETH EFA TRE DBU G?", "exp": "An extra letter shifts every group of three letters after it -- the classic frameshift-by-insertion pattern (Table 9.4).", "src": "lastminute", "opts": ["Missense", "Silent", "Nonsense", "Insertion", "Deletion"], "correct": 3, "wrongExp": {"0": "Missense swaps one word/codon for another meaningful one -- here, letters have shifted position entirely, not just swapped.", "1": "A silent change would leave the sentence completely unchanged -- this one is scrambled.", "2": "Nonsense cuts the message short with a stop -- here the message continues, just shifted.", "4": "A deletion makes the sentence shorter overall -- this version is the same length as wild-type plus one inserted letter."}, "terms": ["frameshift mutation"]}, {"id": "lm52", "ch": 6, "type": "mc", "q": "The event that occurs in bacteriophage multiplication that does not occur in animal virus replication is:", "exp": "Phages inject ONLY their nucleic acid through a tail tube, leaving the capsid outside -- animal viruses instead bring the whole virion in via fusion or endocytosis.", "src": "lastminute", "opts": ["Assembly of nucleocapsids", "Adsorption to the host cells", "Host cell synthesis of viral enzymes and capsid proteins", "Replication of viral nucleic acid", "Injection of the viral nucleic acid into the host cell"], "corr
