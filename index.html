<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIO 207 -- Exam I Practice</title>
<style>
:root{
  --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --card:#ffffff; --border:#ddd;
  --accent:#2563eb; --accent-fg:#ffffff; --good:#15803d; --good-bg:#dcfce7;
  --bad:#b91c1c; --bad-bg:#fee2e2; --chip:#eef2ff; --warn:#b45309; --warn-bg:#fef3c7;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --fg:#f0f0f0; --muted:#a0a0a0; --card:#1e1e1e; --border:#333;
    --accent:#60a5fa; --accent-fg:#0b1220; --good:#4ade80; --good-bg:#0f2e1a;
    --bad:#f87171; --bad-bg:#3a1414; --chip:#1f2540; --warn:#fbbf24; --warn-bg:#3a2e0f;
  }
  html{ color-scheme: dark; }
}
:root[data-theme="dark"]{
  --bg:#121212; --fg:#f0f0f0; --muted:#a0a0a0; --card:#1e1e1e; --border:#333;
  --accent:#60a5fa; --accent-fg:#0b1220; --good:#4ade80; --good-bg:#0f2e1a;
  --bad:#f87171; --bad-bg:#3a1414; --chip:#1f2540; --warn:#fbbf24; --warn-bg:#3a2e0f;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color: transparent;
}
#app{ max-width:580px; margin:0 auto; padding:16px 16px 48px; position:relative; }
.topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.topbar .brand{ font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
.tutorial-dots{ display:flex; gap:6px; justify-content:center; margin-top:14px; }
.tutorial-dot{ width:7px; height:7px; border-radius:50%; background:var(--border); }
.tutorial-dot.active{ background:var(--accent); }
h1{ font-size:20px; font-weight:600; margin:4px 0 2px; }
h2{ font-size:16px; font-weight:600; margin:0 0 10px; }
.muted{ color:var(--muted); font-size:13px; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{
  display:block; width:100%; text-align:left; background:var(--card); color:var(--fg);
  border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;
  font-size:15px; margin-bottom:10px; cursor:pointer;
}
.btn:active{ transform:scale(0.99); }
.btn-primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; text-align:center; }
.btn-primary:disabled{ opacity:0.5; }
.btn-ghost{ background:transparent; }
.btn-sm{ display:inline-block; width:auto; padding:8px 12px; font-size:13px; margin:0 6px 6px 0; }
.chip{ display:inline-block; background:var(--chip); color:var(--accent); font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; margin-right:6px; margin-bottom:6px; cursor:pointer; border:none; }
.chip.tag-warn{ background:var(--warn-bg); color:var(--warn); }
.statgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:10px 0; }
.stat{ background:var(--chip); border-radius:var(--radius); padding:12px; }
.stat .num{ font-size:22px; font-weight:600; }
.stat .lab{ font-size:12px; color:var(--muted); }
.barwrap{ background:var(--border); border-radius:6px; height:10px; overflow:hidden; margin-top:6px;}
.bar{ height:100%; background:var(--accent); transition:width .3s; }
.heatbar{ height:16px; border-radius:6px; }
.progresstop{ font-size:13px; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.qtext{ font-size:16px; line-height:1.5; margin-bottom:10px; }
.opt{ display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; font-size:15px; cursor:pointer; }
.opt.selected{ border-color:var(--accent); border-width:2px; }
.opt.correct{ border-color:var(--good); background:var(--good-bg); border-width:2px; }
.opt.incorrect{ border-color:var(--bad); background:var(--bad-bg); border-width:2px; }
input[type=text],input[type=number]{
  width:100%; padding:12px 14px; font-size:15px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); color:var(--fg);
}
select{
  width:100%; padding:10px 12px; font-size:14px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); color:var(--fg); margin-top:4px;
}
.matchrow{ margin-bottom:12px; }
.matchrow .mleft{ font-size:14px; margin-bottom:4px; }
.feedback{ border-radius:var(--radius); padding:12px 14px; margin-top:10px; font-size:14px; }
.feedback.good{ background:var(--good-bg); color:var(--good); }
.feedback.bad{ background:var(--bad-bg); color:var(--bad); }
.feedback.warn{ background:var(--warn-bg); color:var(--warn); font-weight:600; }
.err{ color:var(--bad); font-size:13px; margin-top:6px; }
.footerbtn{ position:sticky; bottom:0; background:var(--bg); padding:10px 0 4px; }
.small{ font-size:12px; color:var(--muted); margin-top:4px; }
a{ color:var(--accent); }
.iconbtn{ background:none; border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; color:var(--fg); cursor:pointer; }
.timerbar{ height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:10px; }
.timerfill{ height:100%; background:var(--warn); transition:width .2s linear; }
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal-box{ background:var(--card); border-radius:var(--radius); padding:20px; max-width:440px; width:100%; max-height:80vh; overflow-y:auto; }
.modal-box svg{ width:100%; height:auto; color:var(--fg); }
.confband{ display:flex; gap:8px; margin:10px 0; }
.confbtn{ flex:1; padding:10px 6px; font-size:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--fg); cursor:pointer; text-align:center; }
.confbtn.selected{ border-color:var(--accent); border-width:2px; background:var(--chip); }
svg.diagram{ width:100%; height:auto; color:var(--fg); cursor:zoom-in; }
.hero-card{ background:linear-gradient(135deg,var(--accent),#7c3aed); border-radius:var(--radius); padding:16px; color:#fff; margin-bottom:12px; cursor:pointer; box-shadow:0 8px 20px rgba(37,99,235,.25); border:none; width:100%; text-align:left; display:flex; align-items:center; gap:12px; }
.hero-card-urgent{ background:linear-gradient(135deg,#dc2626,#ea580c); box-shadow:0 8px 20px rgba(220,38,38,.3); }
.hero-icon{ font-size:26px; flex-shrink:0; }
.hero-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; opacity:.85; }
.hero-title{ font-size:17px; font-weight:700; margin-top:2px; }
.hero-sub{ font-size:12.5px; opacity:.85; margin-top:2px; }
.hero-chev{ font-size:20px; opacity:.85; flex-shrink:0; }
.alert-card{ border-radius:var(--radius); padding:16px; margin-bottom:12px; border-width:1px; border-style:solid; }
.alert-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.alert-title{ font-weight:600; font-size:14px; flex:1; }
.alert-count{ font-size:12px; font-weight:600; }
.alert-chip{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; margin:0 6px 6px 0; display:inline-block; }
.alert-msg{ font-size:13px; margin:6px 0 10px; }
.modecard{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px; cursor:pointer; text-align:left; width:100%; }
.modecard-icon{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.modecard-body{ flex:1; min-width:0; }
.modecard-title{ font-weight:600; font-size:14.5px; }
.modecard-desc{ font-size:12px; color:var(--muted); margin-top:1px; }
.modecard-chev{ color:var(--muted); font-size:18px; flex-shrink:0; }
.hue-emerald{ background:rgba(16,185,129,.15); color:#10b981; }
.hue-amber{ background:rgba(245,158,11,.15); color:#f59e0b; }
.hue-cyan{ background:rgba(6,182,212,.15); color:#06b6d4; }
.hue-rose{ background:rgba(244,63,94,.15); color:#f43f5e; }
.hue-violet{ background:rgba(124,58,237,.15); color:#7c3aed; }
.hue-slate{ background:rgba(100,116,139,.15); color:#64748b; }
.tiptext{ font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
.confetti-piece{ position:fixed; top:-10px; width:8px; height:8px; z-index:100; pointer-events:none; }
textarea.plan-out{ width:100%; min-height:220px; font-size:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--fg); padding:12px; font-family:inherit; }
</style>
</head>
<body>
<div id="app"></div>
<div id="confetti-root"></div>
<script>
// ======================= DATA =======================
var QUESTIONS = [{"id": "c1_17", "ch": 1, "type": "mc", "q": "Which of the following is the correctly written scientific (binomial) name?", "opts": ["Escherichia coli", "escherichia coli", "Escherichia Coli", "ESCHERICHIA COLI"], "correct": 0, "exp": "Genus is capitalized, species is lowercase, and the whole name is italicized (or underlined if handwritten).", "src": "quiz1"}, {"id": "c7_18", "ch": 7, "type": "tf", "q": "Microbial growth refers only to an increase in the number of cells in a population.", "correct": false, "exp": "False -- growth has two aspects: (1) an individual cell synthesizing components and increasing in size, and (2) the population's cell number increasing.", "src": "quiz2"}, {"id": "c8_23", "ch": 8, "type": "tf", "q": "The Krebs cycle provides a significant means to synthesize a small amount of ATP in the absence of oxygen and also to generate pyruvic acid, an essential intermediary metabolite.", "correct": false, "exp": "False -- that description is glycolysis, not the Krebs cycle. Glycolysis makes pyruvic acid, which then enters the Krebs cycle.", "src": "quiz2"}, {"id": "c8_24", "ch": 8, "type": "tf", "q": "The Krebs cycle allows the acetyl groups from the breakdown (beta oxidation) of certain fats to enter the pathway and be used as an energy source.", "correct": true, "exp": "True -- fatty acid breakdown feeds acetyl-CoA into the Krebs cycle.", "src": "quiz2"}, {"id": "c8_25", "ch": 8, "type": "mc", "q": "Protons (H+) released during electron transport:", "opts": ["Act as coenzymes", "Are passed along the electron transport chain along with the electrons", "Are the terminal electron acceptors", "Are pumped across the membrane, creating the proton motive force"], "correct": 3, "exp": "Protons are pumped across the membrane (not carried along with the electrons) to build the proton motive force.", "src": "quiz2"}, {"id": "c8_26", "ch": 8, "type": "mc", "q": "In aerobic respiration, oxygen acts as:", "opts": ["A carrier of electrons, passing them down the chain", "A reducing agent", "The terminal electron acceptor", "A coenzyme"], "correct": 2, "exp": "O2 is the final electron acceptor in aerobic respiration, forming H2O.", "src": "quiz2"}, {"id": "c1_34", "ch": 1, "type": "mc", "q": "Which of the following is NOT a eukaryotic microbe studied in microbiology?", "opts": ["Protozoa", "Fungi", "Parasitic worms (helminths)", "Viruses"], "correct": 3, "exp": "Viruses are acellular — no nucleus, no ribosomes, no organelles — so they can't be classified as prokaryotic or eukaryotic at all.", "src": "assignment"}, {"id": "c1_36", "ch": 1, "type": "mc", "q": "Which explains why archaeons are extremophiles?", "opts": ["One archaeon can live in both hot and cold temperatures", "They are ancient, primitive organisms that retained characteristics of the first cells, which evolved under Earth's far more extreme early conditions", "They cause extremely severe disease", "They represent the extremes in size of all bacteria"], "correct": 1, "exp": "Archaea are thought to have kept traits from the earliest cells on a hot, oxygen-free early Earth, which is why many still thrive in hot springs, salty lakes, and oxygen-free environments today. They aren't known to cause disease, and 'extremophile' is about environment, not size.", "src": "assignment"}, {"id": "c1_37", "ch": 1, "type": "mc", "q": "A subglacial lake buried under 800m of ice supports microbial life even though photosynthesis is completely inhibited by the total lack of light. Which other habitat would likely cause the same inhibition?", "opts": ["The surface of the ocean", "A swimming pool", "The large intestine", "The surface of a leaf"], "correct": 2, "exp": "The large intestine is permanently dark, just like a lake buried deep under ice — no light reaches either place, so photosynthesis can't happen. The other options all get plenty of light.", "src": "assignment"}, {"id": "c1_38", "ch": 1, "type": "mc", "q": "Researchers sterilize their drilling equipment with UV light and hydrogen peroxide before sampling an isolated subglacial lake. If this step were skipped, it would most likely result in:", "opts": ["Scientists being unable to access the lake", "The drill hole freezing shut", "Terrestrial microbes contaminating the lake", "Scientists becoming ill from exposure"], "correct": 2, "exp": "UV light and hydrogen peroxide are decontamination tools meant to keep surface microbes from being introduced into a lake that's been isolated for possibly millions of years — that's their whole purpose.", "src": "assignment"}, {"id": "c1_39", "ch": 1, "type": "mc", "q": "Researchers identified over 4,000 microbial species in an environmental water sample without culturing each one individually, by directly analyzing the sample for:", "opts": ["DNA", "Carbohydrates", "Lipids", "Proteins"], "correct": 0, "exp": "This technique is called metagenomics — extracting and sequencing DNA directly from an environmental sample to catalog species diversity, without needing to grow each organism first.", "src": "assignment"}, {"id": "c1_40", "ch": 1, "type": "mc", "q": "Microbes living in a frozen, sunless lake under ice and microbes living in a hot, oily tar pit seem to have what in common?", "opts": ["Adaptation to similar temperatures", "The ability to photosynthesize", "The capacity to use substances in their environment as an energy source", "The ability to cause disease in humans"], "correct": 2, "exp": "These two environments are about as different in temperature as possible. What unites the microbes is metabolic flexibility — one group gets energy from minerals/chemicals in cold water, the other metabolizes oil. Neither photosynthesizes (no light in either spot), and neither is linked to human disease.", "src": "assignment"}, {"id": "c1_41", "ch": 1, "type": "tf", "q": "Some diseases, including some cancers, once thought to be noninfectious are now known to involve microbial infection.", "correct": true, "exp": "True — H. pylori was once dismissed as unrelated to stomach ulcers (blamed on stress/diet) but is now known to cause most of them, and is linked to gastric cancer. HPV is similarly established as a cause of cervical cancer.", "src": "assignment"}, {"id": "c1_44", "ch": 1, "type": "mc", "q": "Which of these is a confirmed example of microbes' role in the earth's ecosystem?", "opts": ["Photosynthetic microbes capture energy from organic compounds", "Microbes produce greenhouse gases, such as carbon dioxide and methane, which help trap heat in the atmosphere", "Microbes make up the structural building blocks of every higher organism's body", "None of the above"], "correct": 1, "exp": "Methanogens (Archaea) and other microbes are major natural producers of CO2 and methane through fermentation and anaerobic respiration. The first option gets photosynthesis backwards (it captures energy from light, not organic compounds) — that's a repeated trap.", "src": "assignment"}, {"id": "c4_32", "ch": 4, "type": "mc", "q": "Stains combined with light microscopy allow the visualization in bacteria of:", "opts": ["Cell size, shape, arrangement, and possibly a few cell structures", "DNA, RNA, and a defined nucleus", "Ribosomes and proteins", "Viruses infecting cells"], "correct": 0, "exp": "Light microscopy's resolution isn't sufficient to visualize DNA/RNA/nucleus detail, ribosomes, or viruses (those need electron microscopy) — and bacteria don't have a defined nucleus anyway.", "src": "assignment"}, {"id": "c4_33", "ch": 4, "type": "mc", "q": "Which is the primary stain in the acid-fast staining procedure?", "opts": ["Carbolfuchsin", "Crystal violet", "Safranin", "Methylene blue"], "correct": 0, "exp": "Carbolfuchsin is soluble in the waxy, lipoidal mycolic acid of mycobacterial cell walls, letting it penetrate where crystal violet or methylene blue can't. Crystal violet is the Gram stain's primary stain; methylene blue is acid-fast's counterstain.", "terms": ["acid-fast"], "src": "assignment"}, {"id": "c4_34", "ch": 4, "type": "mc", "q": "Which of the following microbes CANNOT be reliably seen with Gram stain?", "opts": ["Bacillus megaterium", "Mycobacterium tuberculosis", "Staphylococcus epidermidis", "E. coli"], "correct": 1, "exp": "M. tuberculosis's cell wall is loaded with waxy mycolic acid, which blocks the water-soluble Gram stain reagents. The other three have typical peptidoglycan-based walls and stain normally.", "terms": ["acid-fast"], "src": "assignment"}, {"id": "c4_35", "ch": 4, "type": "mc", "q": "Gram staining:", "opts": ["Allows the identification of bacteria", "Allows the classification of microbes into prokaryotes and eukaryotes", "Allows the differentiation of bacteria into gram positive and gram negative", "Allows detailed analysis of internal bacterial cell structure"], "correct": 2, "exp": "This is a classic trap set. 'Identification' is too strong — Gram stain narrows things down but doesn't identify a species on its own. It only applies to bacteria (prokaryotes), says nothing about prokaryote/eukaryote classification, and light microscopy can't resolve internal cell detail. Its real scope is exactly this: sorting bacteria into gram-positive vs. gram-negative.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "c4_36", "ch": 4, "type": "mc", "q": "The basis for differential Gram staining is:", "opts": ["Archaea vs. bacterial cell wall", "Prokaryotic vs. eukaryotic cell structure", "Differential cell wall structure between different groups of bacteria", "Aerobic vs. fermentative bacteria"], "correct": 2, "exp": "Specifically, it's the thickness/cross-linking of the peptidoglycan layer. Gram staining isn't about archaea (many lack peptidoglycan entirely), isn't about prokaryote/eukaryote structure, and doesn't sort by metabolism.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "c4_37", "ch": 4, "type": "mc", "q": "Mycobacterium species (like M. tuberculosis and M. abscessus) belong to which bacterial phylum?", "opts": ["Firmicutes", "Proteobacteria", "Actinobacteria", "Spirochetes"], "correct": 2, "exp": "Actinobacteria (also called Actinomycetota) are gram-positive, high-G+C bacteria. Other notable members include Streptomyces (makes many antibiotics) and Corynebacterium diphtheriae.", "src": "assignment"}, {"id": "c4_38", "ch": 4, "type": "mc", "q": "MRSA (methicillin-resistant Staphylococcus aureus) resists penicillin-type antibiotics mainly because it has:", "opts": ["An efflux pump that exports the antibiotic", "A mutated protein (PBP2a, from the mecA gene) that these antibiotics can't bind", "An extra-thick outer lipid membrane", "A capsule that physically blocks drug entry"], "correct": 1, "exp": "The mecA gene produces PBP2a, an altered penicillin-binding protein involved in cell wall synthesis that penicillin-type (beta-lactam) antibiotics can't effectively bind, letting the bacterium keep building its wall despite the drug.", "src": "assignment"}, {"id": "c4_39", "ch": 4, "type": "mc", "q": "When all the flagella on a bacterial cell rotate counterclockwise, the cell is propelled forward in a movement called a ______; when the flagella reverse direction, the cell stops and reorients in an action called a ______.", "opts": ["propulsion; reversal", "propulsion; run", "tumble; run", "run; tumble"], "correct": 3, "exp": "Counterclockwise rotation bundles the flagella together for a smooth 'run'; clockwise rotation makes the bundle fly apart, causing a random 'tumble' that points the cell in a new direction.", "src": "assignment"}, {"id": "c4_40", "ch": 4, "type": "mc", "q": "Which of the following is NOT found within the bacterial cytoplasm?", "opts": ["Chromosome (nucleoid)", "Ribosomes", "Water", "Fimbriae"], "correct": 3, "exp": "Fimbriae are external appendages on the cell surface, not cytoplasmic contents. The chromosome sits in the nucleoid region, and ribosomes float freely — both within the cytoplasm, which is mostly water.", "src": "assignment"}, {"id": "c4_42", "ch": 4, "type": "tf", "q": "Boiling water is hot enough to destroy bacterial endospores.", "correct": false, "exp": "False — endospores resist boiling. Steam under pressure (like in an autoclave, ~121°C) is needed to destroy them, which is why pressure canning matters for food safety (e.g., preventing botulism).", "terms": ["endospore"], "src": "assignment"}, {"id": "c4_43", "ch": 4, "type": "mc", "q": "Which of the following has historically been the first division in a system of bacterial taxonomy?", "opts": ["Gram-positive versus gram-negative cells", "Cocci versus bacilli", "Endospore formers versus non-endospore formers", "Pathogen versus non-pathogen", "Aerobe versus anaerobe"], "correct": 0, "exp": "Bacteria were historically first split by cell wall type, as shown by the Gram stain, because it's such a fundamental difference and easy to test. Shape, endospore formation, pathogenicity, and oxygen needs are used too, but as smaller, later divisions.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "c4_44", "ch": 4, "type": "mc", "q": "Why must fresh cells be used when performing a Gram stain?", "opts": ["Fresh cells do not smell as badly as older cells", "Old cells may not Gram stain properly", "As cells age, they won't stick to the slide", "All of these choices are correct"], "correct": 1, "exp": "As cells age, their cell walls start to break down, so gram-positive cells can lose the purple stain and falsely appear pink, giving a wrong result.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "c4_45", "ch": 4, "type": "mc", "q": "When ethanol (the decolorizer) is applied correctly during a Gram stain, gram-positive cells appear ______ and gram-negative cells appear ______ (before the counterstain is added).", "opts": ["purple; pink/red", "purple; colorless", "colorless; purple"], "correct": 1, "exp": "Right after the ethanol step, gram-positive cells keep their purple color, but gram-negative cells lose it and become colorless — they only turn pink/red once safranin is applied afterward. 'Purple; pink/red' describes the final result, not this intermediate step.", "terms": ["Gram stain"], "src": "assignment"}, {"id": "c5_20", "ch": 5, "type": "mc", "q": "Which of the following is found in essentially ALL eukaryotic cells (unlike chloroplasts or cell walls, which are only in certain groups)?", "opts": ["Cytoskeleton", "Chloroplast", "Cell wall", "None of these"], "correct": 0, "exp": "The cytoskeleton (microtubules, actin filaments, intermediate filaments) is essential for shape, organelle movement, and pulling chromosomes apart during mitosis — needed by any eukaryote that divides. Cell walls (fungi/algae/plants only) and chloroplasts (photosynthetic eukaryotes only) are not universal.", "src": "assignment"}, {"id": "c5_21", "ch": 5, "type": "mc", "q": "Choose the pair that correctly completes this sentence: the cell ______ is found in fungi and algae to provide structure and support, while the cell ______ is found in ALL eukaryotic cells, is composed of phospholipids, proteins, and sterols, and separates the cell's interior from the environment.", "opts": ["membrane; glycocalyx", "membrane; wall", "wall; membrane", "wall; glycocalyx"], "correct": 2, "exp": "The cell wall (chitin in fungi, cellulose in algae) provides structure/support but isn't universal. The cell membrane is universal in eukaryotes and contains sterols (cholesterol in animal cells, ergosterol in fungal cells) that stabilize it — ergosterol is also the target of many antifungal drugs.", "src": "assignment"}, {"id": "c5_22", "ch": 5, "type": "tf", "q": "The nucleus is surrounded by a single membrane.", "correct": false, "exp": "False — the nuclear envelope is a double membrane (two lipid bilayers). The outer membrane is continuous with the endoplasmic reticulum. Mitochondria and chloroplasts also share this double-membrane feature.", "src": "assignment"}, {"id": "c5_23", "ch": 5, "type": "tf", "q": "The nucleolus is itself a complete, functioning ribosome.", "correct": false, "exp": "False — the nucleolus makes ribosomal RNA and ribosomal subunits, but those subunits are exported through the nuclear pores and only join into a complete, working ribosome in the cytoplasm or on the rough ER. In eukaryotes, transcription happens in the nucleus and translation happens in the cytoplasm.", "src": "assignment"}, {"id": "c5_25", "ch": 5, "type": "mc", "q": "Choose the answer that describes the function of the Golgi apparatus.", "opts": ["It synthesizes, stores, and transports lipids", "It adds lipids and sugars to proteins and then packages these proteins for transport to their final destination", "It synthesizes, stores, and transports proteins", "It produces the energy needed to fuel the cell", "It stores the DNA of the cell and produces RNA from the DNA"], "correct": 1, "exp": "The Golgi works like a shipping center: it modifies proteins arriving from the rough ER (adding sugars/lipids) and packages them for their final destination. It doesn't make proteins (that's rough ER) or make lipids (that's smooth ER).", "src": "assignment"}, {"id": "c5_26", "ch": 5, "type": "mc", "q": "Eukaryotes that are not plants, animals, or fungi make up a diverse catch-all group known as:", "opts": ["Monerans", "Yeasts", "Protists", "Archaeons"], "correct": 2, "exp": "Protists are grouped by exclusion — any eukaryote that isn't a plant, animal, or fungus lands here (algae, protozoa). Monerans and archaeons are prokaryotes, so they aren't eukaryotes at all; yeasts are unicellular fungi, which the question excludes.", "src": "assignment"}, {"id": "c5_27", "ch": 5, "type": "mc", "q": "Which statement about fungi is TRUE?", "opts": ["Fungi are autotrophic saprobes", "Unicellular fungi are prokaryotic, while multicellular fungi are eukaryotic", "Most fungi obtain nutrients from decaying matter, but some fungi can be parasites of living hosts", "Fungi ingest food the way animals do"], "correct": 2, "exp": "'Autotrophic saprobe' is a contradiction (saprobes feed on dead matter, making them heterotrophs). Being unicellular doesn't make an organism prokaryotic — all fungi, including single-celled yeasts, are eukaryotic. Fungi absorb nutrients; they don't ingest food like animals.", "src": "assignment"}, {"id": "c5_28", "ch": 5, "type": "tf", "q": "A pseudohypha is the same thing as a fungus switching between hyphae and yeast forms (dimorphism).", "correct": false, "exp": "False — a pseudohypha is a chain of yeast cells (like Candida albicans) that bud but stay attached end-to-end, just looking hypha-like. Dimorphism means an organism can take on two separate, full forms (mold and yeast) depending on conditions — a different concept.", "terms": ["dimorphism"], "src": "assignment"}, {"id": "c5_29", "ch": 5, "type": "mc", "q": "Choose the statement that describes the primary medical threat due to algae.", "opts": ["Algae grow in lakes and ponds, using up oxygen and suffocating fish", "Algae are used for food additives", "Algae contain endotoxin in their cell wall, which causes a form of shock in humans", "Marine algae produce toxins which accumulate in seafood and can cause severe food poisoning", "Algae cause infection in human and animal tissues"], "correct": 3, "exp": "During a harmful algal bloom, dinoflagellates (like Karenia brevis, which causes Gulf Coast red tides) produce toxins that build up in filter-feeding shellfish, sickening people who eat them. Endotoxin belongs to gram-negative bacteria, not algae; algal infections are extremely rare; and fish suffocation is an indirect, ecological effect of decomposer bacteria, not a direct human health threat. This is an intoxication, not an infection.", "src": "assignment"}, {"id": "c5_30", "ch": 5, "type": "mc", "q": "Which is a TRUE characteristic of protozoa?", "opts": ["They have a thick cell wall that protects them from dying", "They can move using flagella, pseudopodia, or cilia", "They are typically photoautotrophs", "They lack any locomotor structures"], "correct": 1, "exp": "Protozoa are grouped mainly by how they move: flagellates, amoebas (pseudopodia), and ciliates. They have NO cell wall (a key feature separating them from fungi/algae) and are heterotrophs, not photoautotrophs.", "src": "assignment"}, {"id": "c5_32", "ch": 5, "type": "mc", "q": "In electron micrographs, portions of the endoplasmic reticulum appear rough on the edges. This is because:", "opts": ["Some regions of the ER are covered with ribosomes", "Eukaryotic membranes include sterols to increase their strength", "Rough regions of the ER are constantly secreting toxic waste products", "Those areas of the ER have been recently synthesized and haven't had a chance to smooth out yet"], "correct": 0, "exp": "Ribosomes attached to the outer surface of rough ER create the 'rough,' sandpaper-like appearance. Smooth ER, by definition, has no ribosomes attached.", "src": "assignment"}, {"id": "c5_33", "ch": 5, "type": "mc", "q": "Which organelle does NOT contain its own DNA?", "opts": ["Mitochondria", "Chloroplast", "Nucleus", "Golgi apparatus"], "correct": 3, "exp": "The nucleus, mitochondria, and chloroplasts all contain DNA. Mitochondria and chloroplasts have their own small, circular DNA — strong evidence for endosymbiotic theory. The Golgi, part of the endomembrane system, formed from folds of the cell's own membrane and never had its own genome.", "terms": ["endosymbiotic theory"], "src": "assignment"}, {"id": "c5_34", "ch": 5, "type": "mc", "q": "Eukaryotic ribosomes are the site of:", "opts": ["Protein synthesis", "Protein degradation", "Protein folding", "Protein glycosylation"], "correct": 0, "exp": "Ribosomes carry out translation, building a polypeptide chain from mRNA's code. Folding mostly happens in the rough ER, glycosylation in the ER and Golgi, and degradation in proteasomes/lysosomes.", "src": "assignment"}, {"id": "c5_35", "ch": 5, "type": "tf", "q": "Protists are broadly divided into two general groups based on whether the organism is capable of photosynthesis.", "correct": true, "exp": "True — algae (photosynthetic) and protozoa (heterotrophic) are the two traditional divisions. This is a practical split, not a true evolutionary grouping: Euglena is a mixotroph that blurs the line, since it photosynthesizes but can also feed heterotrophically in the dark.", "src": "assignment"}, {"id": "c5_36", "ch": 5, "type": "mc", "q": "Which of these statements about fungi's importance to ecology, agriculture, commerce, and medicine is FALSE?", "opts": ["Fungi synthesize antibiotics (e.g., penicillin) that inhibit bacterial growth", "Fungi can be pathogenic to field crops and can rot food during transport", "Fungi form associations (mycorrhizae) with plant roots to help them take up water and nutrients", "The photosynthetic activity of fungi provides energy that makes its way up the food chain"], "correct": 3, "exp": "Fungi have no chloroplasts and cannot photosynthesize — they're decomposers, not primary producers. The other three are all real, well-documented roles fungi play.", "src": "assignment"}, {"id": "c7_26", "ch": 7, "type": "mc", "q": "Mesophiles can survive in brackish water and inside the human body. Their temperature preference is best described as:", "opts": ["Extreme cold, below 0°C", "Moderate, roughly 20–45°C with an optimum near human body temperature", "Extreme heat, above 80°C", "Highly variable, with no defined range"], "correct": 1, "exp": "Mesophiles are 'middle-loving' organisms with an optimum around 37°C — this fits both brackish water (moderate temps) and the human body.", "src": "assignment"}, {"id": "c7_28", "ch": 7, "type": "mc", "q": "Select the factor that ALL microbes require, regardless of their other preferences:", "opts": ["Ultraviolet radiation", "Neutral pH", "Alkaline pH", "Warm temperatures", "Source of bioelements"], "correct": 4, "exp": "pH, temperature, and oxygen needs vary enormously between species, but every microbe needs basic elements (carbon, nitrogen, hydrogen, oxygen, phosphorus, sulfur, etc.) to build cell parts and get energy. UV radiation is actually harmful to most microbes.", "terms": ["bioelements"], "src": "assignment"}, {"id": "c7_29", "ch": 7, "type": "mc", "q": "Nutrient molecules that contain the basic framework of carbon and hydrogen are called ______ nutrients.", "opts": ["Micro", "Organic", "Trace", "Inorganic"], "correct": 1, "exp": "Organic nutrients are built around a carbon-hydrogen backbone (carbohydrates, proteins, lipids, nucleic acids). Inorganic nutrients — water, metal ions, salts — lack that framework.", "src": "assignment"}, {"id": "c7_30", "ch": 7, "type": "tf", "q": "Purple and green sulfur bacteria get their energy from oxygenic photosynthesis.", "correct": false, "exp": "False — they perform anoxygenic photosynthesis. Instead of splitting water (like plants and cyanobacteria), they use hydrogen sulfide or other sulfur compounds as an electron donor, so no oxygen is released; sulfur granules are produced instead.", "src": "assignment"}, {"id": "c7_31", "ch": 7, "type": "tf", "q": "The majority of heterotrophic microorganisms are chemoheterotrophs, deriving both energy and carbon from organic compounds.", "correct": true, "exp": "True — most bacteria, fungi, and protozoa get both their energy and their carbon source from breaking down organic compounds, the same basic strategy humans use.", "src": "assignment"}, {"id": "c7_32", "ch": 7, "type": "tf", "q": "A true aerobe lacks the metabolic enzyme systems for using oxygen gas in respiration.", "correct": false, "exp": "False — this actually describes an obligate anaerobe. A true aerobe has the enzyme systems (catalase, superoxide dismutase) needed to use oxygen and detoxify its byproducts, and needs that oxygen to survive.", "src": "assignment"}, {"id": "c7_33", "ch": 7, "type": "mc", "q": "Obligate ______ live at low pH extremes and sometimes maintain the low pH by releasing strong acid.", "opts": ["Osmophiles", "Alkalinophiles", "Acidophiles", "Halophiles"], "correct": 2, "exp": "Obligate acidophiles need a low (acidic) pH to grow, and some (like Thiobacillus, which oxidizes sulfur into sulfuric acid) even help maintain that acidity themselves.", "src": "assignment"}, {"id": "c7_34", "ch": 7, "type": "mc", "q": "The general term used to denote a situation in which two organisms live together in a close partnership required by one or both members is:", "opts": ["Mutualism", "Symbiosis", "Synergy", "Antibiosis"], "correct": 1, "exp": "Symbiosis is the umbrella term for any close, long-term relationship between two species where at least one depends on it. Mutualism (both benefit), commensalism (one benefits, other unaffected), and parasitism (one benefits, other harmed) are all specific types of symbiosis — not synonyms for it.", "src": "assignment"}, {"id": "c7_35", "ch": 7, "type": "mc", "q": "Which best completes this sentence: ______ metabolize organic matter from dead organisms, while ______ require a live host.", "opts": ["Symbiotic microbes; saprobes", "Autotrophs; heterotrophs", "Saprobes; symbiotic microbes", "Chemoheterotrophs; photoheterotrophs"], "correct": 2, "exp": "Saprobes (decomposers) break down dead organic matter. Symbiotic microbes live in close relationship with a living host, whether that relationship is mutualistic, commensal, or parasitic.", "src": "assignment"}, {"id": "c7_36", "ch": 7, "type": "mc", "q": "Organisms referred to as obligate halophiles require at least a 9% salt concentration to grow, whereas ______ halophiles can adapt to a wide range of solute concentrations.", "opts": ["Osmotolerant", "Facultative", "Alkalinophile", "Acidophile"], "correct": 1, "exp": "This follows the same obligate-vs-facultative pattern as aerobes/anaerobes: obligate halophiles absolutely need high salt; facultative halophiles are flexible and can grow across a wide range of salt concentrations.", "src": "assignment"}, {"id": "c7_38", "ch": 7, "type": "mc", "q": "Which of the following is NOT one of the six core elements (CHNOPS) found in lipids, nucleic acids, and proteins?", "opts": ["Carbon", "Nitrogen", "Potassium", "Sulfur"], "correct": 2, "exp": "CHNOPS = Carbon, Hydrogen, Nitrogen, Oxygen, Phosphorus, Sulfur. Potassium (along with calcium and iron) is still an important bioelement for the cell, but it isn't part of the core building blocks of these macromolecules.", "terms": ["bioelements"], "src": "assignment"}, {"id": "c7_40", "ch": 7, "type": "tf", "q": "The direct cell count involves counting the number of cells in a sample microscopically.", "correct": true, "exp": "True — a direct microscopic count (e.g., using a Petroff-Hausser chamber) counts all visible cells, living and dead, unlike a viable plate count.", "src": "assignment"}, {"id": "c7_41", "ch": 7, "type": "mc", "q": "Lactobacilli are part of the natural microbiota found in the human vagina. They feed off glucose the host produces and ferment it to lactic acid, lowering vaginal pH to a level other, more harmful bacteria can't tolerate. This relationship is best described as:", "opts": ["Mutualism", "Parasitism", "Commensalism", "Amensalism", "Syntrophy"], "correct": 0, "exp": "Both sides benefit: Lactobacilli get a nutrient source, and the host is protected from pathogens by the lowered pH. That mutual benefit is what makes this mutualism rather than one-sided commensalism.", "src": "assignment"}, {"id": "c8_31", "ch": 8, "type": "mc", "q": "Ribozymes, unlike typical protein enzymes, are catalysts made of:", "opts": ["Protein", "Carbohydrate", "RNA", "Lipid"], "correct": 2, "exp": "Ribozymes are one of the few exceptions to 'enzymes are proteins' — they're catalytic RNA molecules. Decker's questions often test this distinction directly.", "src": "assignment"}, {"id": "c8_32", "ch": 8, "type": "tf", "q": "Gut fermentation (auto-brewery) syndrome can only be caused by yeast, never bacteria.", "correct": false, "exp": "False — yeast (Saccharomyces, Candida) are the most common cause, but certain bacteria, like some Klebsiella pneumoniae strains, can also ferment sugar into alcohol in the gut.", "src": "assignment"}, {"id": "c8_33", "ch": 8, "type": "mc", "q": "Which of the following is NOT a goal of fermentation?", "opts": ["To recycle NADH back to NAD+ for continued glycolysis", "To release a small amount of ATP", "To produce between 2–38 ATPs per glucose", "To oxidize glucose in the absence of oxygen"], "correct": 2, "exp": "Fermentation only nets a small, fixed amount (2 ATP) — the 2–38 range describes aerobic respiration's much larger and more variable yield, not fermentation alone.", "src": "assignment"}, {"id": "c8_34", "ch": 8, "type": "mc", "q": "Which of these products is NOT made via microbial fermentation?", "opts": ["Alcoholic beverages", "High fructose corn syrup", "Bread", "Dairy products", "Vinegars"], "correct": 1, "exp": "HFCS is made by enzymatically converting corn starch into sugar, not through microbial fermentation — unlike alcohol, bread (yeast CO2), dairy (lactic acid bacteria), and vinegar (acetic acid bacteria).", "src": "assignment"}, {"id": "c8_35", "ch": 8, "type": "tf", "q": "Lactic acid fermentation only occurs in human muscle cells.", "correct": false, "exp": "False — lactic acid fermentation also happens in many bacteria, including the ones used to make yogurt and cheese.", "src": "assignment"}, {"id": "c8_37", "ch": 8, "type": "tf", "q": "Vitamin deficiencies can prevent a complete holoenzyme from forming, because the key components of many coenzymes are vitamins.", "correct": true, "exp": "True — many vitamins are coenzyme precursors (niacin → NAD+, riboflavin → FAD). Without the vitamin, the coenzyme can't form, so the apoenzyme can't combine with it into the active holoenzyme.", "terms": ["enzyme vocab"], "src": "assignment"}, {"id": "c8_38", "ch": 8, "type": "mc", "q": "What form of enzyme inhibition occurs when the inhibitor molecule competes with the substrate for the binding site?", "opts": ["Repressive", "Noncompetitive", "Competitive", "Constitutive"], "correct": 2, "exp": "Competitive inhibitors resemble the substrate and compete for the same active site; adding more substrate can outcompete the inhibitor and restore activity.", "src": "assignment"}, {"id": "c8_39", "ch": 8, "type": "mc", "q": "ATP (adenosine triphosphate) is made up of a 5-carbon ribose sugar, adenine, and:", "opts": ["A chain of two phosphate groups", "A chain of three phosphate groups", "Guanine", "A chain of four phosphate groups"], "correct": 1, "exp": "ATP = Adenosine TriPhosphate — 'tri' tells you it's three phosphate groups, not two. Guanine is a different base, found in GTP, not ATP.", "src": "assignment"}, {"id": "c8_40", "ch": 8, "type": "mc", "q": "Which of the following is NOT one of the three core stages of aerobic respiration?", "opts": ["Glycolysis", "Krebs cycle", "Electron transport chain", "Beta oxidation"], "correct": 3, "exp": "Aerobic respiration = glycolysis + Krebs cycle + electron transport chain. Beta oxidation (fat breakdown) can feed acetyl-CoA into the Krebs cycle, but it isn't one of the three core stages; it's a separate feeder pathway.", "src": "assignment"}, {"id": "c8_41", "ch": 8, "type": "mc", "q": "Which concept describes the active transport of protons across a membrane to build the proton motive force that drives ATP synthesis?", "opts": ["Glycolysis", "Phosphorylation", "Chemiosmosis", "Photosynthesis"], "correct": 2, "exp": "Chemiosmosis is the process of pumping H+ across a membrane during electron transport to build the proton gradient, which then drives ATP synthase to generate ATP.", "terms": ["chemiosmosis"], "src": "assignment"}, {"id": "c8_42", "ch": 8, "type": "mc", "q": "Assuming a ratio of 3 ATP per NADH and 2 ATP per FADH2, the theoretical net ATP production during PROKARYOTIC aerobic respiration is:", "opts": ["36", "38", "2", "40"], "correct": 1, "exp": "Using this ratio, aerobic respiration nets a theoretical maximum of 38 ATP per glucose. This same maximum applies to eukaryotic cells too -- there is no prokaryote/eukaryote distinction in this theoretical max.", "terms": ["ATP yield"], "src": "assignment"}, {"id": "c8_43", "ch": 8, "type": "tf", "q": "All anaerobic pathways (fermentation and anaerobic respiration) produce less ATP than aerobic respiration.", "correct": true, "exp": "True — fermentation skips the electron transport chain entirely (netting only 2 ATP), and anaerobic respiration uses final electron acceptors (like nitrate or sulfate) that are less efficient than oxygen, so both fall short of aerobic respiration's ATP yield.", "src": "assignment"}, {"id": "c8_44", "ch": 8, "type": "mc", "q": "Where does the CO2 released during the Krebs cycle's reactions go?", "opts": ["It diffuses out of the cell", "It donates electrons to the electron transport chain for ATP production", "It catalyzes a glycolytic reaction", "It enters a fermentation pathway to form ATP"], "correct": 0, "exp": "CO2 is just a waste byproduct of decarboxylation in the Krebs cycle — it doesn't participate further in the pathway, it just diffuses out as a gas.", "src": "assignment"}, {"id": "c8_45", "ch": 8, "type": "mc", "q": "For each glucose molecule that enters glycolysis, how many times does the Krebs cycle turn?", "opts": ["Two", "One", "Six", "Three"], "correct": 0, "exp": "Glucose splits into two pyruvate molecules during glycolysis, and each pyruvate is converted into one acetyl-CoA that enters the Krebs cycle — so the cycle turns twice per glucose.", "src": "assignment"}, {"id": "c8_46", "ch": 8, "type": "tf", "q": "In both prokaryotes and eukaryotes, the Krebs cycle takes place in the mitochondria.", "correct": false, "exp": "False — this is only true for eukaryotes. Prokaryotes don't have mitochondria at all, so their Krebs cycle (and glycolysis) takes place right in the cytoplasm instead.", "src": "assignment"}, {"id": "c8_47", "ch": 8, "type": "mc", "q": "For one turn of the Krebs cycle, how many NADH are produced?", "opts": ["Depends on if the process is aerobic or anaerobic", "Three", "Two", "Six"], "correct": 1, "exp": "One turn of the Krebs cycle produces three NADH (plus one FADH2 and one ATP via substrate-level phosphorylation).", "src": "assignment"}, {"id": "c8_48", "ch": 8, "type": "mc", "q": "In feedback inhibition, the inhibitor of a biochemical pathway is typically:", "opts": ["The substrate of the enzyme inhibited", "The product of the enzyme inhibited", "A substance produced toward the middle of the pathway", "The final product of the biochemical pathway", "A product of another biochemical pathway"], "correct": 3, "exp": "Once enough of a pathway's end product has accumulated, that final product loops back and inhibits an enzyme earlier in the pathway (usually the first committed step), preventing the cell from wasting resources overproducing something it already has enough of.", "src": "assignment"}, {"id": "c8_49", "ch": 8, "type": "tf", "q": "Whenever a molecule is oxidized, another molecule must be reduced.", "correct": true, "exp": "True — oxidation and reduction always occur together as a pair (redox reactions). When one molecule loses electrons (is oxidized), another molecule must gain them (is reduced).", "src": "assignment"}, {"id": "c8_50", "ch": 8, "type": "mc", "q": "The function of the enzyme ATP synthase is to:", "opts": ["Accept a proton from inside the cell membrane as it accepts electrons", "Utilize the energy of the proton motive force to convert ADP to ATP", "Produce reduced coenzymes like NADH", "Transfer hydrogen to the electron transport chain", "Shuttle electrons from NADH to a terminal electron acceptor"], "correct": 1, "exp": "As protons flow back across the membrane through ATP synthase, down the gradient built by the electron transport chain, that energy is harnessed to phosphorylate ADP into ATP.", "terms": ["proton motive force"], "src": "assignment"}, {"id": "c8_53", "ch": 8, "type": "mc", "q": "Protons (H+) received from NADH, during electron transport:", "opts": ["Act as coenzymes", "Are passed along the electron transport chain along with the electrons", "Are the terminal electron acceptors", "Are pumped outside the cell"], "correct": 3, "exp": "The energy released as electrons move through the chain's carrier proteins is used to actively pump protons across the membrane to the outside of the cell, building the proton motive force — they aren't simply carried along with the electrons.", "terms": ["proton motive force"], "src": "assignment"}, {"id": "c8_54", "ch": 8, "type": "mc", "q": "Aerobic respiration and fermentation are similar in that they both:", "opts": ["Begin with the process of glycolysis and produce ATP and CO2", "Begin with the process of glycolysis and produce ATP and O2", "Begin with the process of the Krebs cycle and produce ATP and CO2", "Begin with the process of the Krebs cycle and produce ATP and O2", "Begin with the process of phosphorylation and produce ATP and O2"], "correct": 0, "exp": "Both pathways start with glycolysis and net ATP. Oxygen is never a product of either pathway — that rules out every option mentioning O2 as a product.", "src": "assignment"}, {"id": "lm_01", "ch": 7, "type": "tf", "q": "Bacteria have an average generation time of 24 hours.", "correct": false, "exp": "False -- most bacteria have generation times of 20 minutes to a few hours under good conditions; 24 hours is unusually slow (true for a few species like M. tuberculosis, but not the average).", "src": "lastminute"}, {"id": "lm_02", "ch": 7, "type": "mc", "q": "The term heterotroph refers to an organism that:", "opts": ["Does not need a carbon source", "Gets energy by oxidizing organic compounds", "Must obtain organic compounds for its carbon needs", "Gets energy from sunlight", "Uses CO2 for its carbon source"], "correct": 2, "exp": "Heterotroph is defined by CARBON SOURCE (must get organic carbon from the environment), not by energy source -- that's a separate axis (photo-/chemo-). A chemoheterotroph oxidizes organic compounds for energy too, but the definition itself is about carbon, which is why 'oxidizing organic compounds' isn't the best answer.", "src": "lastminute"}, {"id": "lm_03", "ch": 7, "type": "mc", "q": "An organism that can exist in both oxygen and oxygen-free environments is a(n):", "opts": ["Facultative anaerobe", "Aerobe", "Obligate aerobe", "Microaerophile"], "correct": 0, "exp": "Facultative anaerobes can switch metabolism to survive with or without oxygen.", "src": "lastminute"}, {"id": "lm_04", "ch": 7, "type": "mc", "q": "The term obligate refers to:", "opts": ["Existing in a very narrow niche", "Using light for energy production", "The ability to exist in a wide range of conditions", "Using oxygen for metabolism", "Using chemicals for energy production"], "correct": 0, "exp": "'Obligate' means required/restricted -- a narrow, fixed requirement (the opposite of 'facultative,' which means flexible).", "src": "lastminute"}, {"id": "lm_05", "ch": 7, "type": "mc", "q": "An organism with a temperature growth range of 45°C–60°C would be called a:", "opts": ["Thermophile", "Psychrophile", "Extremophile", "Thermogenic", "Facultative psychrophile"], "correct": 0, "exp": "45–60°C is the thermophile range (hot-loving). 'Extremophile' is too generic/broad to be the best specific answer here.", "src": "lastminute"}, {"id": "lm_06", "ch": 7, "type": "tf", "q": "The degree of turbidity (cloudiness) in a broth culture correlates to the amount of cell growth.", "correct": true, "exp": "True -- more cells scatter more light, so turbidity (measured by a spectrophotometer as optical density) is a quick, standard proxy for population size.", "src": "lastminute"}, {"id": "lm_07", "ch": 7, "type": "mc", "q": "The term facultative refers to:", "opts": ["Using light for energy production", "Using chemicals for energy production", "Using oxygen for metabolism", "Existing in a very narrow niche", "The ability to exist in a wide range of conditions"], "correct": 4, "exp": "'Facultative' means flexible/adaptable -- the organism CAN use a condition but doesn't strictly require it (the opposite of 'obligate').", "src": "lastminute"}, {"id": "lm_09", "ch": 7, "type": "tf", "q": "The time for a freshly inoculated agar culture to develop visible colonies is principally governed by generation time.", "correct": false, "exp": "False -- there's usually a lag phase first (cells adjusting, not yet dividing) before generation time even starts to apply, so lag phase -- not generation time alone -- is what principally governs how long visible colonies take to appear.", "src": "lastminute"}, {"id": "lm_10", "ch": 7, "type": "mc", "q": "In the viable plate count method, each ______ represents one ______ from the sample.", "opts": ["Cell, cell", "Colony, cell", "Species, colony", "Generation, cell"], "correct": 1, "exp": "Each visible colony on the plate is assumed to have grown from a single original cell (or CFU, colony-forming unit) in the sample.", "src": "lastminute"}, {"id": "lm_12", "ch": 7, "type": "mc", "q": "Freshwater bacteria suddenly moved into seawater would:", "opts": ["Now be in an isotonic solution", "Gain water as a result", "Shrivel as a result, now being in a hypertonic solution", "Now be in a hypotonic solution"], "correct": 2, "exp": "Seawater has a much higher solute concentration than the bacteria's cytoplasm, making it hypertonic to the cell -- water leaves the cell by osmosis, causing it to shrivel (plasmolyze).", "src": "lastminute"}, {"id": "lm_13", "ch": 7, "type": "mc", "q": "A new bacterial species is found in an acid pool, and it cannot be cultured in a pH 7 (neutral) medium. It would correctly be classified as a(n):", "opts": ["Facultative acidophile", "Obligate acidophile", "Facultative alkalinophile", "Obligate alkalinophile"], "correct": 1, "exp": "It REQUIRES low pH and fails to grow at neutral pH -- that strict requirement makes it an obligate (not facultative) acidophile.", "src": "lastminute"}, {"id": "lm_14", "ch": 7, "type": "mc", "q": "An organism that cannot grow without oxygen is a(n):", "opts": ["Obligate anaerobe", "Anaerobe", "Obligate aerobe", "Facultative anaerobe", "Microaerophile"], "correct": 2, "exp": "'Cannot grow WITHOUT oxygen' means oxygen is required -- that's the definition of an obligate (true) aerobe.", "src": "lastminute"}, {"id": "lm_15", "ch": 7, "type": "mc", "q": "A microbe shows no growth at 37°C or 50°C, but abundant growth at refrigeration temperature. This organism is a:", "opts": ["Halophile", "Psychrophile", "Anaerobe", "Mesophile"], "correct": 1, "exp": "Thriving specifically at refrigeration temperatures while failing at human-body and higher temperatures is the signature of a psychrophile (cold-loving organism).", "src": "lastminute"}, {"id": "lm_19", "ch": 8, "type": "mc", "q": "Substrate-level phosphorylation occurs in both:", "opts": ["Krebs cycle and electron transport chain", "Glycolysis and Krebs cycle", "All of these choices are correct", "Photosynthesis and glycolysis", "Glycolysis and electron transport chain"], "correct": 1, "exp": "Substrate-level phosphorylation (direct phosphate transfer to ADP) happens in glycolysis and the Krebs cycle. The electron transport chain makes ATP a different way -- via oxidative phosphorylation/chemiosmosis, not substrate-level phosphorylation.", "src": "lastminute"}, {"id": "lm_20", "ch": 8, "type": "mc", "q": "Which would produce the most ATP?", "opts": ["E. coli growing in sealed (anaerobic) glucose broth for 48 hours", "E. coli growing in well-aerated (aerobic) glucose broth for 48 hours", "Both cultures produce the same amount of ATP", "This prediction cannot be made from the information provided"], "correct": 1, "exp": "With oxygen available, E. coli can run full aerobic respiration (~30-38 ATP/glucose) instead of being limited to fermentation (~2 ATP/glucose) in the sealed, oxygen-free broth.", "src": "lastminute"}, {"id": "lm_21", "ch": 8, "type": "mc", "q": "Molecules A and B are similar in shape and size, and both compete to bond with the same enzyme. What process is being observed?", "opts": ["Active inhibition", "Competitive inhibition", "Allosteric inhibition", "Noncompetitive inhibition"], "correct": 1, "exp": "A look-alike molecule competing for the same binding site (the active site) is the definition of competitive inhibition.", "src": "lastminute"}, {"id": "lm_22", "ch": 8, "type": "mc", "q": "Which component of an enzyme binds to the substrate?", "opts": ["Substrate attachment site", "Allosteric site", "Induced fit site", "Active site"], "correct": 3, "exp": "The active site is where the substrate binds and the reaction is catalyzed. The allosteric site is a separate regulatory site (used in feedback inhibition), not where the substrate itself binds.", "src": "lastminute"}, {"id": "lm_23", "ch": 8, "type": "mc", "q": "What kind of enzymes are produced only when their specific substrate is present?", "opts": ["Constitutive enzymes", "Endoenzymes", "Induced enzymes", "Exoenzymes", "Conjugated enzymes"], "correct": 2, "exp": "Induced enzymes are only synthesized in response to their substrate being available -- an efficient, on-demand strategy (unlike constitutive enzymes, which are always made).", "src": "lastminute"}, {"id": "lm_24", "ch": 8, "type": "mc", "q": "In bacterial cells and eukaryotic microbes, the maximum theoretical ATP yield from complete glucose oxidation is:", "opts": ["38 ATP", "36 ATP", "24 ATP", "2 ATP", "30 ATP"], "correct": 0, "exp": "38 ATP is the theoretical maximum for complete glucose oxidation, in both bacterial and eukaryotic cells -- no prokaryote/eukaryote distinction is drawn here.", "terms": ["ATP yield"], "src": "lastminute"}, {"id": "lm_26", "ch": 8, "type": "mc", "q": "Enzymes that are always present in a cell, regardless of how much substrate is around, are called:", "opts": ["Regulated enzymes", "Endoenzymes", "Axoenzymes", "Apoenzymes", "Constitutive enzymes"], "correct": 4, "exp": "Constitutive enzymes are made continuously at a steady rate -- the opposite of induced enzymes, which only appear when their substrate shows up.", "src": "lastminute"}, {"id": "lm_27", "ch": 8, "type": "mc", "q": "What metabolic process is shared between human muscle cells and bacterial cells when both are deprived of oxygen?", "opts": ["The electron transport chain", "Alcohol fermentation", "Mixed acid fermentation", "Lactic acid fermentation"], "correct": 3, "exp": "Human muscle cells and many bacteria (like the ones used to make yogurt) both fall back on lactic acid fermentation when oxygen runs out. Alcohol and mixed-acid fermentation are specific to certain microbes, not humans.", "src": "lastminute"}, {"id": "lm_28", "ch": 8, "type": "mc", "q": "Negative feedback inhibition is best described as:", "opts": ["Product binding to DNA, blocking enzyme transcription", "Substrate binding to DNA, blocking enzyme transcription", "Substrate binding to an enzyme's noncompetitive (allosteric) site", "Product binding to an enzyme's noncompetitive (allosteric) site"], "correct": 3, "exp": "The pathway's own end PRODUCT loops back and binds an allosteric (noncompetitive) site on an earlier enzyme, shutting the pathway down once enough product has accumulated -- it acts directly on the enzyme, not on DNA/transcription.", "src": "lastminute"}, {"id": "lm_29", "ch": 8, "type": "mc", "q": "Glycolysis:", "opts": ["Uses 2 ATP, produces 2 ATP, and is aerobic", "Uses 2 ATP, produces 4 ATP, and is aerobic", "Uses 2 ATP, produces 2 ATP, and is anaerobic", "Uses 2 ATP, produces 4 ATP, and is anaerobic"], "correct": 3, "exp": "Glycolysis spends 2 ATP to start and makes 4 (gross) via substrate-level phosphorylation, netting 2 -- and it doesn't require oxygen at all (that's why fermentation, which has no oxygen step, can still run on glycolysis alone).", "src": "lastminute"}, {"id": "lm_31", "ch": 8, "type": "mc", "q": "What is the final electron acceptor during aerobic respiration?", "opts": ["Oxygen", "Nitrate", "FAD", "Cytochrome c", "Pyruvic acid"], "correct": 0, "exp": "Oxygen is the terminal electron acceptor at the end of the electron transport chain in aerobic respiration, combining with electrons and protons to form water.", "src": "lastminute"}, {"id": "lm_32", "ch": 8, "type": "mc", "q": "The term referring to all of the chemical reactions occurring within a cell is:", "opts": ["Redox reactions", "Phosphorylation", "Metabolism", "Catabolism", "Cellular respiration"], "correct": 2, "exp": "Metabolism is the umbrella term for every chemical reaction in the cell, including both catabolism (breaking down) and anabolism (building up).", "src": "lastminute"}, {"id": "lm_33", "ch": 8, "type": "mc", "q": "Enzymes that are secreted by a cell to catalyze reactions (like hydrolysis) OUTSIDE the cell are called:", "opts": ["Constitutive enzymes", "Exoenzymes", "Apoenzymes", "Regulated enzymes", "Endoenzymes"], "correct": 1, "exp": "Exoenzymes are exported out of the cell to break down large molecules in the environment (e.g., a fungus secreting cellulase); endoenzymes work inside the cell.", "src": "lastminute"}, {"id": "lm_34", "ch": 8, "type": "mc", "q": "All of the following pertain to glycolysis EXCEPT:", "opts": ["Occurs during fermentation", "Occurs without oxygen", "Ends with the formation of pyruvic acid", "Degrades glucose all the way to CO2 and H2O", "Involves the reduction of NAD to NADH"], "correct": 3, "exp": "Glycolysis only breaks glucose down to pyruvic acid -- it never produces CO2 or H2O. Full breakdown to CO2 and H2O requires the Krebs cycle and electron transport chain afterward.", "src": "lastminute"}, {"id": "lm_35", "ch": 8, "type": "mc", "q": "Which of the following is FALSE regarding anaerobic respiration?", "opts": ["It involves glycolysis", "It generates some ATP", "It uses the same final electron acceptor as aerobic respiration", "It utilizes an electron transport system"], "correct": 2, "exp": "This is the false statement -- anaerobic respiration still uses an electron transport chain, but with a DIFFERENT final electron acceptor (like nitrate or sulfate) instead of oxygen, which is what aerobic respiration uses.", "src": "lastminute"}, {"id": "lm_36", "ch": 1, "type": "mc", "q": "Disease-causing microorganisms are called:", "opts": ["Decomposers", "Prokaryotes", "Pathogens", "Eukaryotes", "Fermenters"], "correct": 2, "exp": "Pathogen is the general term for any disease-causing organism, regardless of whether it's prokaryotic or eukaryotic.", "src": "lastminute"}, {"id": "lm_37", "ch": 1, "type": "mc", "q": "The study of evolutionary relationships among organisms is called:", "opts": ["Biotechnology", "Genetics", "Recombinant DNA", "Phylogeny", "Taxonomy"], "correct": 3, "exp": "Phylogeny specifically studies evolutionary relatedness/lineage. Taxonomy is the broader classification system that increasingly uses phylogeny as its basis -- but phylogeny itself is the study of relatedness.", "terms": ["taxonomy"], "src": "lastminute"}, {"id": "lm_38", "ch": 5, "type": "mc", "q": "A single-celled eukaryote without a cell wall belongs to which kingdom?", "opts": ["Bacteria", "Protista", "Fungi", "Animalia", "Plantae"], "correct": 1, "exp": "Protista is the catch-all kingdom for eukaryotes that aren't plants, animals, or fungi -- including cell-wall-free protozoa. Fungi, by contrast, do have a cell wall.", "src": "lastminute"}, {"id": "lm_39", "ch": 1, "type": "mc", "q": "All microorganisms are best defined as organisms that:", "opts": ["Cause human disease", "Lack a cell nucleus", "Are infectious particles", "Are too small to be seen with the unaided eye", "Can only be found growing in laboratories"], "correct": 3, "exp": "The defining trait of a microorganism is simply being too small to see without magnification -- most microbes are harmless or beneficial, and many (like most protozoa and fungi) DO have a nucleus.", "src": "lastminute"}, {"id": "lm_40", "ch": 1, "type": "mc", "q": "Which activity is an example of biotechnology?", "opts": ["Bacteria in soil secrete an antibiotic to kill competitors", "A microbiologist uses a microscope to study bacteria", "Humans use yeast to make beer and wine", "Mycobacterium tuberculosis causes tuberculosis in the lungs", "Public health officials monitor diseases in a community"], "correct": 2, "exp": "Biotechnology is any human use of organisms/their products to make a useful product -- brewing with yeast is one of the oldest examples. The others are natural microbial behavior, basic research, pathogenesis, and epidemiology, not biotechnology.", "src": "lastminute"}, {"id": "lm_41", "ch": 5, "type": "mc", "q": "In Whittaker's taxonomic system, which kingdom includes protozoans and algae?", "opts": ["Mycetae", "Protista", "Bacteria", "Animalia", "Plantae"], "correct": 1, "exp": "Whittaker's five-kingdom system groups protozoans and algae together in Kingdom Protista.", "src": "lastminute"}, {"id": "lm_42", "ch": 4, "type": "mc", "q": "All of the following are correct about prokaryotes EXCEPT:", "opts": ["They are smaller than eukaryotes", "They lack a nucleus", "They are less complex than eukaryotes", "They have organelles", "They are found nearly everywhere"], "correct": 3, "exp": "Prokaryotes lack membrane-bound organelles -- that's one of their defining features, distinguishing them from eukaryotes.", "src": "lastminute"}, {"id": "lm_43", "ch": 1, "type": "tf", "q": "Within the Woese-Fox three-domain system, the three domains are Bacteria, Protista, and Eukarya.", "correct": false, "exp": "False -- the three domains are Bacteria, Archaea, and Eukarya. Protista is a eukaryotic KINGDOM (within Domain Eukarya), not one of the three domains itself.", "src": "lastminute"}, {"id": "lm_44", "ch": 1, "type": "mc", "q": "When humans deliberately manipulate the genes of microorganisms, the process is called:", "opts": ["Bioremediation", "Genetic engineering", "Epidemiology", "Immunology", "Taxonomy"], "correct": 1, "exp": "Genetic engineering (recombinant DNA technology) is the deliberate alteration of an organism's genes.", "src": "lastminute"}, {"id": "lm_45", "ch": 4, "type": "mc", "q": "Peptidoglycan is a unique macromolecule that composes the bacterial:", "opts": ["Slime layers", "Capsules", "Inclusions", "Cell membranes", "Cell walls"], "correct": 4, "exp": "Peptidoglycan is the structural backbone of the bacterial cell wall -- not the membrane, capsule, slime layer, or internal inclusions.", "src": "lastminute"}, {"id": "lm_46", "ch": 4, "type": "mc", "q": "Which term is NOT used to describe bacterial cell SHAPES?", "opts": ["Tetrad", "Coccus", "Rod", "Spirochete", "Vibrio"], "correct": 0, "exp": "Tetrad describes an ARRANGEMENT (four cells grouped in a square), not an individual cell shape. Coccus, rod, spirochete, and vibrio are all shape terms.", "src": "lastminute"}, {"id": "lm_47", "ch": 4, "type": "mc", "q": "All bacterial cells have:", "opts": ["Flagella", "Endospores", "Fimbriae", "Capsules", "A chromosome"], "correct": 4, "exp": "Every bacterial cell has a chromosome (its essential DNA). Flagella, endospores, fimbriae, and capsules are all present only in some species.", "src": "lastminute"}, {"id": "lm_48", "ch": 4, "type": "mc", "q": "The function of bacterial endospores is:", "opts": ["For reproduction and growth", "To provide sites for photosynthesis", "For protection of genetic material during harsh conditions", "The storage of excess cell materials", "To convert gaseous nitrogen into a usable form for plants"], "correct": 2, "exp": "Endospores are a dormant survival structure that protects the cell's DNA through extreme heat, drying, radiation, and chemicals -- not a means of reproduction.", "src": "lastminute"}, {"id": "lm_49", "ch": 4, "type": "mc", "q": "Short, numerous, bristle-like appendages used for adhering to surfaces are called:", "opts": ["Fimbriae", "Sex pili", "Cilia", "Flagella", "Periplasmic flagella (axial filaments)"], "correct": 0, "exp": "Fimbriae are the short, numerous attachment structures. Pili are longer and used for conjugation; cilia are eukaryotic; axial filaments are specific to spirochete motility.", "src": "lastminute"}, {"id": "lm_50", "ch": 4, "type": "mc", "q": "Endospores are:", "opts": ["Resistant to destruction by radiation", "All of these choices are correct", "Living structures", "Metabolically inactive", "Resistant to heat and chemical destruction"], "correct": 1, "exp": "All of these are true at once: endospores remain alive (viable, capable of germinating) while being metabolically inactive (dormant), and are highly resistant to heat, chemicals, and radiation.", "src": "lastminute"}, {"id": "lm_51", "ch": 4, "type": "mc", "q": "A bacterial cell exhibiting chemotaxis probably has:", "opts": ["Metachromatic granules", "Fimbriae", "Capsules", "Flagella", "Mesosomes"], "correct": 3, "exp": "Chemotaxis (movement toward/away from a chemical) requires flagella for directed movement -- the other structures listed don't provide motility.", "src": "lastminute"}, {"id": "lm_52", "ch": 4, "type": "tf", "q": "The term diplococci refers to an irregular cluster of spherical bacterial cells.", "correct": false, "exp": "False -- diplococci means cocci arranged in PAIRS. An irregular cluster describes staphylococci instead.", "src": "lastminute"}, {"id": "lm_53", "ch": 4, "type": "tf", "q": "Rod-shaped cells that stain pink with the Gram stain have cell walls that contain endotoxin.", "correct": true, "exp": "True -- pink/red after Gram staining means gram-negative, and gram-negative cell walls contain LPS (lipopolysaccharide), which is itself the endotoxin.", "src": "lastminute"}, {"id": "lm_54", "ch": 4, "type": "mc", "q": "The term referring to the presence of flagella distributed all over the entire cell surface is:", "opts": ["Peritrichous", "Monotrichous", "Lophotrichous", "Atrichous", "Amphitrichous"], "correct": 0, "exp": "Peritrichous = flagella all around the cell. Mono = one; lopho = a tuft at one point; amphi = both ends; atrichous = no flagella at all.", "src": "lastminute"}, {"id": "lm_55", "ch": 5, "type": "mc", "q": "Which of the following is found in eukaryotic cells but NOT in prokaryotic cells?", "opts": ["Nucleus", "Mitochondria", "Endoplasmic reticulum", "Lysosomes", "All of the choices are correct"], "correct": 4, "exp": "All four -- nucleus, mitochondria, ER, and lysosomes -- are membrane-bound organelles found only in eukaryotic cells.", "src": "lastminute"}, {"id": "lm_56", "ch": 5, "type": "mc", "q": "Which eukaryotic organelle most closely resembles a bacterial cell?", "opts": ["Nucleus", "Golgi apparatus", "Mitochondria", "Lysosome", "Ribosome"], "correct": 2, "exp": "Mitochondria have their own circular DNA, their own ribosomes, and a double membrane -- strong evidence, per endosymbiotic theory, that they originated from engulfed aerobic bacteria.", "terms": ["endosymbiotic theory"], "src": "lastminute"}, {"id": "lm_57", "ch": 5, "type": "mc", "q": "The smooth endoplasmic reticulum functions mainly in the synthesis of:", "opts": ["Glycogen", "Proteins", "Glucose", "Nucleic acids", "Lipids"], "correct": 4, "exp": "Smooth ER (no ribosomes attached) specializes in lipid synthesis, detoxification, and calcium storage. Protein synthesis is the rough ER's job.", "src": "lastminute"}, {"id": "lm_58", "ch": 5, "type": "mc", "q": "Which organelle is involved in the intracellular digestion of food particles?", "opts": ["Golgi apparatus", "Lysosome", "Mitochondria", "Transitional vesicle", "Smooth endoplasmic reticulum"], "correct": 1, "exp": "Lysosomes contain digestive enzymes that break down food particles, worn-out organelles, and debris brought in by the cell.", "src": "lastminute"}, {"id": "lm_59", "ch": 4, "type": "mc", "q": "Which of the following is present in viruses?", "opts": ["Mitochondria", "Flagella", "Pigments", "Endoplasmic reticulum", "None of the choices are correct"], "correct": 4, "exp": "Viruses are acellular -- they have no organelles, no flagella, no pigments, nothing. They're just genetic material in a protein coat (sometimes with an envelope).", "src": "lastminute"}, {"id": "c1_01", "ch": 1, "type": "mc", "q": "Which of the following is not considered a microorganism?", "opts": ["Archaean", "Bacterium", "Protozoan", "Mushroom"], "correct": 3, "exp": "A mushroom is a multicellular fungus visible without magnification -- not a microorganism.", "src": "chapter"}, {"id": "c1_03", "ch": 1, "type": "mc", "q": "Which process involves the deliberate alteration of an organism's genetic material?", "opts": ["Bioremediation", "Biotechnology", "Decomposition", "Recombinant DNA"], "correct": 3, "exp": "Recombinant DNA technology deliberately alters genetic material; biotechnology is the broader application category.", "src": "chapter"}, {"id": "c1_04", "ch": 1, "type": "mc", "q": "A prominent difference between prokaryotic and eukaryotic cells is the", "opts": ["Larger size of prokaryotes", "Lack of pigmentation in eukaryotes", "Presence of a nucleus in eukaryotes", "Presence of a cell wall in prokaryotes"], "correct": 2, "exp": "Eukaryotes have a true, membrane-bound nucleus; prokaryotes do not.", "src": "chapter"}, {"id": "c1_07", "ch": 1, "type": "mc", "q": "A hypothesis can be defined as", "opts": ["A belief based on knowledge", "Knowledge based on belief", "A scientific explanation that is subject to testing", "A theory that has been thoroughly tested"], "correct": 2, "exp": "A hypothesis is a tentative, testable explanation.", "src": "chapter"}, {"id": "c1_08", "ch": 1, "type": "mc", "q": "Which early microbiologist was most responsible for developing standard microbiology laboratory techniques?", "opts": ["Ignaz Semmelweis", "Robert Koch", "Carl von Linne", "John Tyndall"], "correct": 1, "exp": "Robert Koch developed pure culture technique and his postulates -- don’t confuse with Pasteur (germ theory, pasteurization, spontaneous generation).", "src": "chapter"}, {"id": "c1_09", "ch": 1, "type": "mc", "q": "Which scientist is most responsible for finally laying the theory of spontaneous generation to rest?", "opts": ["Joseph Lister", "Robert Koch", "Francesco Redi", "Louis Pasteur"], "correct": 3, "exp": "Pasteur’s swan-neck flask experiments disproved spontaneous generation.", "src": "chapter"}, {"id": "c1_10", "ch": 1, "type": "mc", "q": "When a hypothesis has been thoroughly supported by long-term study and data, it is considered", "opts": ["A law", "A speculation", "A theory", "Proved"], "correct": 2, "exp": "A well-supported, peer-reviewed hypothesis becomes a theory -- not an absolute ‘law’ or ‘proof.’", "src": "chapter"}, {"id": "c1_33", "ch": 1, "type": "mc", "q": "A nurse explains a zoonosis to a patient. What is the best description?", "opts": ["Any viral disease", "Any disease treatable with antibiotics", "A disease typically found in animals that can infect humans", "A disease caused by a eukaryotic parasite"], "correct": 2, "exp": "Zoonosis = animal-origin disease transmissible to humans.", "src": "chapter"}, {"id": "c4_03", "ch": 4, "type": "mc", "q": "Which of the following is not found in all bacterial cells?", "opts": ["Cell membrane", "A nucleoid", "Ribosomes", "Cytoskeleton"], "correct": 3, "exp": "Not all bacteria have a cytoskeleton; membrane, nucleoid, and ribosomes are universal.", "src": "chapter"}, {"id": "c4_04", "ch": 4, "type": "mc", "q": "The major locomotor structures in bacteria are", "opts": ["Flagella", "Pili", "Fimbriae", "Cilia"], "correct": 0, "exp": "Flagella provide bacterial motility; pili/fimbriae are for attachment/exchange, cilia are eukaryotic.", "src": "chapter"}, {"id": "c4_05", "ch": 4, "type": "mc", "q": "Pili are appendages in ______ bacteria that serve as a means of ______.", "opts": ["gram-positive, genetic exchange", "gram-positive, attachment", "gram-negative, genetic exchange", "gram-negative, protection"], "correct": 2, "exp": "Pili occur on gram-negative cells and mediate conjugation (genetic exchange).", "src": "chapter"}, {"id": "c4_06", "ch": 4, "type": "mc", "q": "An example of a glycocalyx is", "opts": ["A capsule", "Pili", "Outer membrane", "A cell wall"], "correct": 0, "exp": "A capsule is a well-organized, tightly bound glycocalyx.", "src": "chapter"}, {"id": "c4_08", "ch": 4, "type": "mc", "q": "Which of the following is present in both gram-positive and gram-negative cell walls?", "opts": ["An outer membrane", "Peptidoglycan", "Teichoic acid", "Lipopolysaccharides"], "correct": 1, "exp": "Both have peptidoglycan; only gram-negative has LPS/outer membrane, only gram-positive has teichoic acid.", "src": "chapter"}, {"id": "c4_10", "ch": 4, "type": "mc", "q": "Which of the following prokaryotes lacks cell walls?", "opts": ["Rickettsias", "Mycoplasmas", "Mycobacterium", "Archaea"], "correct": 1, "exp": "Mycoplasmas naturally lack a cell wall and rely on sterols in their membrane for strength.", "src": "chapter"}, {"id": "c4_11", "ch": 4, "type": "mc", "q": "The LPS layer in gram-negative cell walls releases ______ that cause ______.", "opts": ["enzymes, pain", "endotoxins, fever", "teichoic acid, inflammation", "phosphates, lysis"], "correct": 1, "exp": "Lipopolysaccharide (LPS) is itself an endotoxin that triggers fever/inflammation.", "src": "chapter"}, {"id": "c4_12", "ch": 4, "type": "mc", "q": "Bacterial endospores function in", "opts": ["Reproduction", "Survival", "Protein synthesis", "Storage"], "correct": 1, "exp": "Endospores are dormant survival structures, not a means of reproduction.", "src": "chapter"}, {"id": "c4_17", "ch": 4, "type": "mc", "q": "Which stain is used to distinguish differences between the cell walls of medically important bacteria?", "opts": ["Simple stain", "Acridine orange stain", "Gram stain", "Negative stain"], "correct": 2, "exp": "The Gram stain differentiates based on cell wall/envelope structure.", "src": "chapter"}, {"id": "c4_18", "ch": 4, "type": "mc", "q": "The first living cells on earth would most likely resemble which of these?", "opts": ["A cyanobacterium", "An endospore former", "A gram-positive cell", "An archaeon"], "correct": 3, "exp": "Archaea are thought to most resemble the earliest cells, adapted to harsh early-earth conditions.", "src": "chapter"}, {"id": "c4_29", "ch": 4, "type": "mc", "q": "What is the difference between a bacterial capsule and a slime layer?", "opts": ["A capsule is loosely attached while a slime layer is tightly bound to the cell", "A capsule is composed primarily of proteins while a slime layer is made of DNA", "A capsule is more tightly bound to the cell, and more organized, than a slime layer", "There is no difference -- the two terms refer to the same structure"], "correct": 2, "exp": "Capsule = tightly bound, organized; slime layer = loosely attached.", "src": "chapter"}, {"id": "c5_02", "ch": 5, "type": "mc", "q": "Features of the nuclear envelope include", "opts": ["Ribosomes", "A double membrane structure", "Pores that allow communication with the cytoplasm", "b and c"], "correct": 3, "exp": "The nuclear envelope is a double membrane with pores -- both b and c.", "src": "chapter"}, {"id": "c5_03", "ch": 5, "type": "mc", "q": "The cell wall is usually found in which eukaryotes?", "opts": ["Fungi", "Algae", "Protozoa", "a and b"], "correct": 3, "exp": "Fungi and algae have cell walls; protozoa and animal cells do not -- cell walls are NOT universal in eukaryotes.", "src": "chapter"}, {"id": "c5_04", "ch": 5, "type": "mc", "q": "What is embedded in rough endoplasmic reticulum?", "opts": ["Ribosomes", "Golgi apparatus", "Chromatin", "Vesicles"], "correct": 0, "exp": "Ribosomes studding the ER make it “rough.”", "src": "chapter"}, {"id": "c5_06", "ch": 5, "type": "mc", "q": "In general, fungi derive nutrients through", "opts": ["Photosynthesis", "Engulfing bacteria", "Digesting organic substrates", "Parasitism"], "correct": 2, "exp": "Fungi are heterotrophic saprobes/parasites that secrete enzymes to digest organic
