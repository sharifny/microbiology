two"], "exp": "Net ATP from glycolysis = 2 (gross 4 minus the 2 invested).", "terms": ["ATP yield"]}, {"id": "c8_28", "ch": 8, "type": "mc", "q": "An enzyme consisting only of the protein portion, without its required cofactor, is called a(n):", "opts": ["Holoenzyme", "Apoenzyme", "Coenzyme", "Exoenzyme"], "correct": 1, "exp": "Apoenzyme = protein-only, inactive without its cofactor.", "terms": ["enzyme vocab"]}, {"id": "c8_29", "ch": 8, "type": "mc", "q": "The complete, active enzyme -- apoenzyme plus its cofactor -- is called a(n):", "opts": ["Holoenzyme", "Apoenzyme", "Coenzyme", "Endoenzyme"], "correct": 0, "exp": "Holoenzyme = apoenzyme + cofactor/coenzyme = the fully functional enzyme.", "terms": ["enzyme vocab"]}, {"id": "c8_30", "ch": 8, "type": "mc", "q": "An enzyme that functions inside the cell, as opposed to being secreted, is called a(n):", "opts": ["Exoenzyme", "Endoenzyme", "Coenzyme", "Apoenzyme"], "correct": 1, "exp": "Endoenzyme = functions intracellularly; exoenzyme = secreted to act outside the cell.", "terms": ["enzyme vocab"]}, {"id": "d8_01", "ch": 8, "type": "discuss", "q": "Indicate whether O2, ATP, NADPH, and glucose are produced during the light-dependent or light-independent reactions.", "model": "Light-dependent: O2, ATP, NADPH. Light-independent (Calvin cycle): glucose (using the ATP/NADPH supplied by the light reactions)."}, {"id": "d8_02", "ch": 8, "type": "discuss", "q": "During which reactions are water and CO2 consumed, and what's the outcome?", "model": "Water is consumed (split) in the light-dependent reactions, releasing O2, electrons, and H+. CO2 is consumed in the light-independent (Calvin cycle) reactions, ultimately forming glucose."}, {"id": "d8_03", "ch": 8, "type": "discuss", "q": "What are the functions of chlorophyll and the photosystems?", "model": "Chlorophyll absorbs light energy; photosystems (I and II) use that captured energy to excite and pass electrons along, driving ATP and NADPH production."}, {"id": "d8_04", "ch": 8, "type": "discuss", "q": "What are the fates of ATP and NADPH in the Calvin cycle?", "model": "Both are consumed as energy/reducing power to fix CO2 into organic carbon (glucose), regenerating ADP and NADP+ for the light reactions."}, {"id": "d8_05", "ch": 8, "type": "discuss", "q": "Compare oxygenic with anoxygenic photosynthesis.", "model": "Oxygenic (plants, algae, cyanobacteria) splits water, releasing O2. Anoxygenic (green/purple sulfur bacteria) uses electron donors like H2S instead of water, so no O2 is produced."}, {"id": "d8_06", "ch": 8, "type": "discuss", "q": "Name the general enzyme type that: (a) converts citrate to isocitrate (b) reduces pyruvic acid to lactic acid (c) reduces nitrate to nitrite.", "model": "(a) Isomerase. (b) Lactate dehydrogenase (a reductase/dehydrogenase). (c) Nitrate reductase."}, {"id": "d8_07", "ch": 8, "type": "discuss", "q": "Explain what's unique about ATP synthase's action.", "model": "It's a molecular turbine -- protons flowing down their gradient through it physically spin a rotor component, mechanically driving ATP synthesis from ADP + Pi (chemiosmosis)."}, {"id": "d8_08", "ch": 8, "type": "discuss", "q": "Compare the general equation for aerobic metabolism with its summary -- verify totals and where reactions occur.", "model": "Overall: glucose + O2 -> CO2 + H2O + ATP. Glycolysis occurs in the cytoplasm, the Krebs cycle in the mitochondrial matrix, and the electron transport chain on the inner mitochondrial membrane."}, {"id": "d8_09", "ch": 8, "type": "discuss", "q": "Describe four requirements for fermentation to occur.", "model": "An organic substrate (e.g., glucose), glycolysis enzymes, an organic final electron acceptor (e.g., pyruvate or its derivative), and anaerobic (or O2-independent) conditions, mainly to regenerate NAD+."}, {"id": "d8_10", "ch": 8, "type": "discuss", "q": "Is fermentation catabolic or anabolic? Explain.", "model": "Catabolic -- it breaks down glucose to release a small amount of ATP, without building larger molecules."}, {"id": "d8_11", "ch": 8, "type": "discuss", "q": "Name three electron carriers and their essential vitamins; explain their role.", "model": "NAD+ (niacin/B3), FAD (riboflavin/B2), coenzyme A (pantothenic acid/B5) -- they shuttle electrons/hydrogens between reactions, linking catabolic energy release to ATP production."}, {"id": "d8_12", "ch": 8, "type": "discuss", "q": "Explain similarities/differences between anaerobic respiration and fermentation.", "model": "Both occur without O2 and regenerate NAD+. But anaerobic respiration still uses an electron transport chain (with a non-oxygen final acceptor like nitrate/sulfate) and yields much more ATP; fermentation has no ETC and yields only the small net ATP from glycolysis."}, {"id": "d8_13", "ch": 8, "type": "discuss", "q": "Diagram the energetics of a reaction with and without an enzyme.", "model": "Both start/end at the same reactant/product energy levels, but the catalyzed reaction has a much lower activation-energy peak -- enzymes speed up the reaction without changing its overall energy change."}, {"id": "d8_14", "ch": 8, "type": "discuss", "q": "Explain the ‘biochemical circle of life’ between phototrophs and heterotrophs.", "model": "Phototrophs capture light energy to build organic molecules and release O2; heterotrophs consume those organic molecules and O2, releasing CO2 and H2O back to the phototrophs -- a continuous cycle."}, {"id": "d8_15", "ch": 8, "type": "discuss", "q": "How can some microbes survive and grow in the presence of cyanide?", "model": "They may use alternative, cyanide-insensitive terminal oxidases in their electron transport chain, bypassing the cytochrome complex that cyanide normally blocks."}, {"id": "d8_16", "ch": 8, "type": "discuss", "q": "What are the advantages of staging metabolic pathways in specific membranes/organelles rather than free in the cytoplasm?", "model": "Compartmentalization concentrates enzymes/substrates for efficiency, allows ion gradients (like the proton motive force) to be established and used, and separates competing reactions."}, {"id": "d8_17", "ch": 8, "type": "discuss", "q": "Two allosteric enzymes regulate glycolysis (phosphoglucoisomerase, pyruvate kinase) -- what might regulate them?", "model": "Typically downstream products/energy signals -- e.g., high ATP or citrate levels inhibiting early glycolytic enzymes (feedback inhibition), while ADP/AMP can activate them when energy is low."}, {"id": "d8_18", "ch": 8, "type": "discuss", "q": "Beer brewing needs early aerobic yeast metabolism, yet anaerobic conditions are needed to make alcohol -- why?", "model": "Yeast initially grows and reproduces rapidly using aerobic respiration (building up biomass); only once oxygen is depleted does fermentation take over to produce ethanol."}, {"id": "d8_19", "ch": 8, "type": "discuss", "q": "What pH would you expect in the mitochondrial matrix vs. intermembrane space, and the chloroplast stroma vs. thylakoid lumen? Why?", "model": "The intermembrane space and thylakoid lumen are more acidic (proton-rich) due to pumped H+ accumulation; the matrix and stroma are comparatively more basic, since protons are pumped out of/into those compartments to form the gradient."}, {"id": "d8_20", "ch": 8, "type": "discuss", "q": "Where do ATP molecules collect after being made by ATP synthase in the mitochondrion/chloroplast, and what's the advantage?", "model": "In the mitochondrial matrix and the chloroplast stroma, respectively -- right where the cell's biosynthetic reactions that need ATP are occurring."}, {"id": "d8_21", "ch": 8, "type": "discuss", "q": "Explain the relationship between enzyme sensitivity and microbial environmental adaptations.", "model": "Microbes' enzymes are finely tuned (in structure/stability) to function optimally at the temperature, pH, and salinity of their native environment -- exactly why extremophiles have differently adapted enzymes than mesophiles."}, {"id": "d8_22", "ch": 8, "type": "discuss", "q": "Why wouldn't antibiotics work as therapy for botulism?", "model": "Botulism is caused by a preformed toxin; killing the bacteria with antibiotics doesn't neutralize toxin already present, so antitoxin, not antibiotics, is the needed treatment."}, {"id": "g1", "ch": 4, "type": "diagram", "q": "Label the numbered parts of this generalized bacterial cell (outer to inner, plus the appendage).", "svg": "<svg viewBox=\"0 0 400 260\" xmlns=\"http://www.w3.org/2000/svg\"><ellipse cx=\"200\" cy=\"140\" rx=\"170\" ry=\"95\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-dasharray=\"4 3\"/><ellipse cx=\"200\" cy=\"140\" rx=\"150\" ry=\"80\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3\"/><ellipse cx=\"200\" cy=\"140\" rx=\"135\" ry=\"68\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><ellipse cx=\"170\" cy=\"150\" rx=\"38\" ry=\"18\" fill=\"currentColor\" opacity=\"0.25\"/><line x1=\"30\" y1=\"140\" x2=\"-20\" y2=\"140\" stroke=\"currentColor\" stroke-width=\"3\"/><path d=\"M -20 140 Q -40 120 -55 140 Q -40 160 -20 140\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"200\" y=\"30\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">1</text><text x=\"200\" y=\"55\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">2</text><text x=\"200\" y=\"78\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">3</text><text x=\"170\" y=\"153\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">4</text><text x=\"60\" y=\"130\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">5</text></svg>", "items": ["1 (outermost dashed layer)", "2 (middle solid layer)", "3 (inner solid layer)", "4 (shaded oval inside)", "5 (external whip-like structure)"], "rights": ["Glycocalyx (capsule/slime layer)", "Cell wall", "Cell membrane", "Nucleoid (DNA region)", "Flagellum"], "exp": "Outer to inner: glycocalyx, cell wall, cell membrane, with the nucleoid inside the cytoplasm and the flagellum projecting externally."}, {"id": "g2", "ch": 4, "type": "diagram", "q": "Put the Gram stain reagents in the correct order (Step 1 through Step 4).", "svg": "<svg viewBox=\"0 0 420 160\" xmlns=\"http://www.w3.org/2000/svg\"><g font-size=\"12\" fill=\"currentColor\"><rect x=\"10\" y=\"40\" width=\"80\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"50\" y=\"30\" text-anchor=\"middle\">Step 1</text><text x=\"50\" y=\"110\" text-anchor=\"middle\">?</text><rect x=\"110\" y=\"40\" width=\"80\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"150\" y=\"30\" text-anchor=\"middle\">Step 2</text><text x=\"150\" y=\"110\" text-anchor=\"middle\">?</text><rect x=\"210\" y=\"40\" width=\"80\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"250\" y=\"30\" text-anchor=\"middle\">Step 3</text><text x=\"250\" y=\"110\" text-anchor=\"middle\">?</text><rect x=\"310\" y=\"40\" width=\"80\" height=\"50\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\"/><text x=\"350\" y=\"30\" text-anchor=\"middle\">Step 4</text><text x=\"350\" y=\"110\" text-anchor=\"middle\">?</text></g></svg>", "items": ["Step 1", "Step 2", "Step 3", "Step 4"], "rights": ["Crystal violet (primary stain)", "Iodine (mordant)", "Decolorizer (alcohol/acetone)", "Safranin (counterstain)"], "exp": "Mnemonic: “Come In And Stain” -- Crystal violet, Iodine, Alcohol, Safranin. Decolorization (step 3) is the highest-risk step."}]

var GLOSSARY = {"Archaea": "A domain of single-celled prokaryotes, molecularly closer to Eukarya than to Bacteria; includes extremophiles and methanogens.", "taxonomy": "The science of classification. Ranks run Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species (mnemonic: Dear King Philip Came Over For Good Soup).", "Gram stain": "A differential stain (crystal violet, iodine, decolorizer, safranin -- 'Come In And Stain') that separates bacteria into gram-positive (purple) and gram-negative (pink) based on cell wall structure.", "acid-fast": "A stain used for bacteria with waxy, mycolic-acid-rich walls (e.g., Mycobacterium) that resist the Gram stain.", "bioelements": "Elements essential to life. Mnemonic: C HOPKINS CaFe Na Cl Mgood = Carbon, Hydrogen, Oxygen, Phosphorus, Potassium, Iodine, Nitrogen, Sulfur, Calcium, Iron, Sodium, Chlorine, Magnesium.", "enzyme vocab": "Apoenzyme (protein only) + cofactor = Holoenzyme (the active whole). Coenzyme = an organic cofactor. Endoenzyme acts inside the cell; exoenzyme is secreted to act outside it.", "ATP yield": "Glycolysis nets 2 ATP (4 made, 2 spent). The Krebs cycle makes 2 ATP via substrate-level phosphorylation. The ~34-38 ATP theoretical total comes mostly from the electron transport chain.", "biogenesis": "The principle that life arises only from preexisting life -- Pasteur's conclusion, opposing abiogenesis (spontaneous generation).", "zoonosis": "A disease that is native to animals but can be transmitted to humans.", "binomial nomenclature": "The two-part naming system (Genus species, italicized, genus capitalized) used for scientific names.", "peptidoglycan": "The mesh-like polymer (sugars + amino acids) that gives bacterial cell walls their strength; thick in gram-positive cells, thin in gram-negative.", "endospore": "A tough, dormant, heat/chemical-resistant survival structure formed by some bacteria (e.g., Bacillus, Clostridium) under stress; not a reproductive structure.", "glycocalyx": "The outermost coating of a cell (capsule or slime layer), made of polysaccharides/proteins.", "capsule": "A well-organized, tightly bound glycocalyx layer that helps bacteria evade the host immune system.", "flagella": "Whip-like appendages used for bacterial motility; arrangements include monotrichous, lophotrichous, amphitrichous, and peritrichous.", "pili": "Long, tubular appendages on gram-negative bacteria used for conjugation (genetic exchange).", "fimbriae": "Short, bristle-like appendages used for attachment to surfaces or other cells.", "endosymbiotic theory": "The idea that mitochondria and chloroplasts originated from engulfed bacteria (aerobic bacteria and cyanobacteria, respectively), based on their own circular DNA, 70S ribosomes, and double membranes.", "trophozoite": "The active, feeding/motile stage of a protozoan (as opposed to the dormant cyst stage).", "cyst": "A dormant, resistant stage formed by protozoa for survival and transmission between hosts.", "dimorphism": "A single species capable of two distinct growth forms (e.g., hyphae and budding yeast), seen in some pathogenic fungi.", "osmosis": "The diffusion of water across a membrane toward the side with higher solute concentration (hypertonic side).", "hypertonic": "A solution with a higher solute concentration than the cell -- water leaves the cell, which can shrink (plasmolysis).", "active transport": "Movement of a substance across a membrane against its concentration gradient, requiring ATP.", "quorum sensing": "A bacterial communication system where accumulating signal molecules, once reaching a threshold tied to population density, trigger coordinated gene expression (e.g., in biofilms).", "biofilm": "A structured, surface-attached community of microbes encased in a self-produced extracellular matrix.", "generation time": "The time required for a microbial population to double (one round of binary fission).", "growth curve": "The four phases of population growth: lag, exponential (log), stationary, and death.", "glycolysis": "The first stage of respiration/fermentation; splits glucose into two pyruvate molecules, netting 2 ATP, in the cytoplasm.", "Krebs cycle": "The second stage of aerobic respiration (in the mitochondrial matrix); processes acetyl-CoA, releasing CO2 and generating electron carriers (NADH, FADH2) plus 2 ATP.", "electron transport chain": "A series of membrane protein complexes that pass electrons and pump protons, building the proton motive force used by ATP synthase to generate most of the cell's ATP.", "proton motive force": "The electrochemical gradient of protons (H+) across a membrane, generated by the electron transport chain and used to drive ATP synthase.", "fermentation": "Anaerobic breakdown of glucose via glycolysis only (no electron transport chain), netting just 2 ATP, used to regenerate NAD+."}

var CHAPTERS = [1,4,5,7,8];

// ======================= PERSISTENCE =======================
var STORE_KEY = "bio207_progress_v2";
var SETTINGS_KEY = "bio207_settings_v2";
var dbNS = null, dbReady = false;

function loadProgress(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return {};
}
function saveProgress(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(progress)); }catch(e){} }

function loadSettings(){
  try{
    var raw = localStorage.getItem(SETTINGS_KEY);
    if(raw) return JSON.parse(raw);
  }catch(e){}
  return { sound:true, tts:false, theme:"auto", seenTutorial:false };
}
function saveSettings(){ try{ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }catch(e){} }

function applyTheme(){
  try{
    var r = document.documentElement;
    if(settings.theme==="light"){ r.setAttribute("data-theme","light"); }
    else if(settings.theme==="dark"){ r.setAttribute("data-theme","dark"); }
    else { r.removeAttribute("data-theme"); }
  }catch(e){}
}
function cycleTheme(){
  var order = ["auto","light","dark"];
  var i = order.indexOf(settings.theme);
  settings.theme = order[(i+1)%order.length];
  saveSettings(); applyTheme(); render();
}
function themeIcon(){
  if(settings.theme==="light") return "\u2600\ufe0f Light";
  if(settings.theme==="dark") return "\ud83c\udf19 Dark";
  return "\ud83c\udf13 Auto";
}

var progress = loadProgress();
var settings = loadSettings();
applyTheme();
var streak = (function(){ try{ return parseInt(localStorage.getItem("bio207_streak_v2")||"0",10); }catch(e){ return 0; } })();
function saveStreak(){ try{ localStorage.setItem("bio207_streak_v2", String(streak)); }catch(e){} }

  try{
    if(typeof claude === "undefined" || !claude.use) return;
    claude.use("db").then(function(ns){ dbNS = ns; dbReady = !!ns; if(ns) pushSummary(); }).catch(function(){});
  }catch(e){}
}
initRuntime();

function syncQuestionDoc(q, rec){
  if(!dbNS) return;

    }).catch(function(){});
  }catch(e){}
}

// ======================= STATS / DIAGNOSTICS =======================
function computeStats(){
  var ids = Object.keys(progress);
  var totalAnswered=0, totalCorrect=0;
  var byCh = {}; CHAPTERS.forEach(function(c){ byCh[c]={a:0,c:0,qTotal:0}; });
  QUESTIONS.forEach(function(q){ if(byCh[q.ch]) byCh[q.ch].qTotal++; });
  var flagged = [];
  ids.forEach(function(id){
    var rec = progress[id]; if(!rec) return;
    var answered = (rec.correctCount||0)+(rec.wrongCount||0);
    totalAnswered += answered; totalCorrect += (rec.correctCount||0);
    var q = QUESTIONS.find(function(x){return x.id===id;});
    if(q && byCh[q.ch]){ byCh[q.ch].a += answered; byCh[q.ch].c += (rec.correctCount||0); }
    if(rec.flag) flagged.push(id);
  });
  return {
    totalAnswered:totalAnswered, totalCorrect:totalCorrect,
    accuracy: totalAnswered? Math.round(100*totalCorrect/totalAnswered):0,
    byChapter: byCh, flaggedIds: flagged, flaggedCount: flagged.length,
    totalQuestions: QUESTIONS.length, updatedAt: Date.now()
  };
}
function heatColor(acc, answered){
  if(answered===0) return "var(--border)";
  if(acc>=85) return "var(--good)";
  if(acc>=65) return "#84cc16";
  if(acc>=45) return "var(--warn)";
  return "var(--bad)";
}
function classifyAttempt(rec, correct, confidence){
  if(correct) return confidence==="high" ? "solid" : "fragile";
  if(confidence==="high") return "overconfident";
  if((rec.wrongCount||0) >= 1){
    return (rec.correctCount||0) > 0 ? "slipped" : "recurring";
  }
  return "new_gap";
}
var DIAG_LABEL = {
  solid:"Solid -- confident and correct.",
  fragile:"Fragile -- right, but you weren't sure. Worth a second look.",
  overconfident:"Overconfident -- you were sure, but it's wrong. These are the most dangerous gaps for exam day.",
  slipped:"Slipped -- you had this before and missed it now. Knowledge may be destabilizing; revisit the concept.",
  recurring:"Recurring miss -- you've missed this one more than once. High priority to review.",
  new_gap:"New gap -- first miss, totally normal. Now it's flagged for review."
};

function recordAnswer(q, isCorrect, confidence){
  var rec = progress[q.id] || {box:1, correctCount:0, wrongCount:0, lastSeen:0, flag:false};
  var cls = classifyAttempt(rec, isCorrect, confidence);
  rec.lastSeen = Date.now();
  rec.lastClass = cls;
  if(isCorrect){
    rec.correctCount = (rec.correctCount||0)+1;
    rec.box = Math.min((rec.box||1)+1, 4);
    rec.flag = (cls==="fragile");
    streak++;
  } else {
    rec.wrongCount = (rec.wrongCount||0)+1;
    rec.box = 1;
    rec.flag = true;
    streak = 0;
  }
  saveStreak();
  progress[q.id] = rec;
  saveProgress();
  syncQuestionDoc(q, rec);
  pushSummary();
  if(settings.sound){ isCorrect ? playCorrectChime() : playWrongTone(); }
  if(isCorrect && streak>0 && streak%5===0){ triggerConfetti(); }
  return cls;
}

var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ var AC = window.AudioContext||window.webkitAudioContext; audioCtx = new AC(); }catch(e){}
  }
  return audioCtx;
}
function playTone(freq, start, dur, vol){
  try{
    var ctx = getAudioCtx(); if(!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.type = "sine";
    o.connect(g); g.connect(ctx.destination);
    var t0 = ctx.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol||0.15, t0+0.02);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}
function playCorrectChime(){ playTone(523.25,0,0.12); playTone(783.99,0.1,0.16); }
function playWrongTone(){ playTone(180,0,0.25,0.12); }

function triggerConfetti(){
  var root = document.getElementById("confetti-root");
  var colors = ["#2563eb","#15803d","#f59e0b","#db2777","#7c3aed"];
  for(var i=0;i<24;i++){
    var p = document.createElement("div");
    p.className="confetti-piece";
    p.style.left = (Math.random()*100)+"vw";
    p.style.background = colors[i%colors.length];
    p.style.borderRadius = (Math.random()>0.5?"50%":"2px");

        if(el.animate){
          el.animate([
            { transform: el.style.transform, top:"-10px", opacity:1 },
            { transform: "translate("+dx+"px, 100vh) rotate(720deg)", opacity:0.9 }
          ], { duration: dur, easing:"cubic-bezier(.2,.6,.6,1)" });

}

// ======================= SESSION LOGIC =======================
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function boxOf(id){ return (progress[id]&&progress[id].box)||1; }

function buildSession(filterFn, count){
  var pool = QUESTIONS.filter(filterFn);
  var weighted = [];
  pool.forEach(function(q){
    var w = Math.max(5-boxOf(q.id),1);
    for(var i=0;i<w;i++) weighted.push(q);
  });
  shuffle(weighted);
  var seen={}, queue=[];
  for(var i=0;i<weighted.length;i++){
    var q=weighted[i];
    if(!seen[q.id]){ seen[q.id]=true; queue.push(q); if(queue.length>=count) break; }
  }
  if(queue.length < Math.min(count, pool.length)){
    pool.forEach(function(q){ if(!seen[q.id]){ seen[q.id]=true; queue.push(q); } });
  }
  return queue;
}

  var html = "";
  html += "<div class=\"progresstop\"><span>"+session.mode+(session.speed?" \u26a1":"")+"</span><span>Question "+(session.idx+1)+" / "+session.queue.length+"</span></div>";
  if(session.speed){ html += "<div class=\"timerbar\"><div class=\"timerfill\" id=\"timerFill\" style=\"width:100%;\"></div></div>"; }

  html += "<div class=\"card\">";
  html += "<span class=\"chip\">Ch "+q.ch+"</span>";
  html += "<button class=\"iconbtn\" style=\"float:right;\" onclick=\"speak(QUESTIONS.find(function(x){return x.id==='"+q.id+"';}).q)\">\ud83d\udd0a Read aloud</button>";
  html += "<div class=\"qtext\" style=\"margin-top:10px;clear:both;\">"+escapeHtml(q.q)+"</div>";

  if(q.terms && q.terms.length){
    q.terms.forEach(function(t){ html += "<button class=\"chip\" onclick=\"openGlossary('"+t.replace(/'/g,"\\'")+"')\">\u2139 "+t+"</button>"; });
  }

  if(q.type==="diagram"){
    html += "<div onclick=\"openZoom('"+q.id+"')\">"+q.svg.replace("<svg ","<svg class=\\\"diagram\\\" ")+"</div><div class=\"small\">Tap the diagram to zoom.</div>";
  }

  if(q.type==="mc"){
    q.opts.forEach(function(opt,i){
      var cls="opt";
      if(current.checked){ if(i===q.correct) cls+=" correct"; else if(i===current.selectedOpt) cls+=" incorrect"; }
      else if(i===current.selectedOpt) cls+=" selected";
      html += "<div class=\""+cls+"\" onclick=\"selectOpt("+i+")\">"+optLetter(i)+". "+escapeHtml(opt)+"</div>";
    });
  } else if(q.type==="tf"){
    [true,false].forEach(function(val){
      var label = val?"True":"False"; var cls="opt";
      if(current.checked){ if(val===q.correct) cls+=" correct"; else if(val===current.tfSelected) cls+=" incorrect"; }
      else if(val===current.tfSelected) cls+=" selected";
      html += "<div class=\""+cls+"\" onclick=\"selectTf("+val+")\">"+label+"</div>";
    });
  } else if(q.type==="fill"){
    html += "<input type=\"text\" id=\"fillInput\" placeholder=\"Type your answer\" value=\""+(current.fillVal||"").replace(/\"/g,"")+"\" oninput=\"current.fillVal=this.value\" "+(current.checked?"disabled":"")+">";
    if(current.checked){ html += "<div class=\"feedback "+(current.wasCorrect?"good":"bad")+"\">"+(current.wasCorrect?"Correct.":"Correct answer: "+q.answers[0])+"</div>"; }
    if(current.err) html += "<div class=\"err\">Enter an answer first.</div>";
  } else if(q.type==="match" || q.type==="diagram"){
    if(!current.matchSel) current.matchSel = new Array(q.items.length).fill("");
    var pool = shuffle(Array.from(new Set(q.rights)));
    q.items.forEach(function(item,i){
      html += "<div class=\"matchrow\"><div class=\"mleft\">"+(i+1)+". "+escapeHtml(item)+"</div>";
      html += "<select onchange=\"current.matchSel["+i+"]=this.value\" "+(current.checked?"disabled":"")+"><option value=\"\">(choose)</option>";
      pool.forEach(function(opt){
        html += "<option "+(current.matchSel[i]===opt?"selected":"")+" value=\""+opt.replace(/\"/g,"")+"\">"+escapeHtml(opt)+"</option>";
      });
      html += "</select>";
      if(current.checked){
        var ok = current.matchSel[i]===q.rights[i];
        html += "<div class=\"small\" style=\"color:"+(ok?"var(--good)":"var(--bad)")+";margin-top:4px;\">"+(ok?"Correct":"Correct: "+q.rights[i])+"</div>";
      }
      html += "</div>";
    });
    if(current.err) html += "<div class=\"err\">Answer every row first.</div>";
  } else if(q.type==="discuss"){
    if(!current.revealedDiscuss){
      html += "<button class=\"btn\" onclick=\"current.revealedDiscuss=true;render();\">Show model answer</button>";
    } else {
      html += "<div class=\"feedback good\" style=\"margin-bottom:10px;\">"+escapeHtml(q.model)+"</div>";
      if(!current.checked){
        html += "<p class=\"small\">How did you do, honestly?</p>";
        html += "<div class=\"row\"><button class=\"btn btn-sm\" onclick=\"discussResult(true)\">I got the gist</button><button class=\"btn btn-sm\" onclick=\"discussResult(false)\">I need to review this</button></div>";
      }
    }
  }

  if(q.type!=="discuss"){
    if(!current.checked){
      html += "<div class=\"confband\">";
      ["low","med","high"].forEach(function(c){
        var label = c==="low"?"Not sure":c==="med"?"Somewhat sure":"Confident";
        html += "<div class=\"confbtn "+(current.confidence===c?"selected":"")+"\" onclick=\"current.confidence='"+c+"';render();\">"+label+"</div>";
      });
      html += "</div>";
    }
  }

  if(current.checked){
    html += "<div class=\"feedback "+(current.wasCorrect?"good":"bad")+"\" style=\"margin-top:12px;\">"+(current.wasCorrect?"\u2713 Correct. ":"\u2717 Not quite. ")+escapeHtml(q.exp||"")+"</div>";
    if(current.cls){ html += "<div class=\"feedback warn\">"+DIAG_LABEL[current.cls]+"</div>"; }
  }
  html += "</div>";

  html += "<div class=\"footerbtn\">";
  if(q.type==="discuss"){
    if(current.checked){ html += "<button class=\"btn btn-primary\" onclick=\"nextQuestion()\">"+(session.idx+1<session.queue.length?"Next question":"See results")+"</button>"; }
  } else if(!current.checked){
    html += "<button class=\"btn btn-primary\" onclick=\"checkAnswer()\">Check answer</button>";
  } else {
    html += "<button class=\"btn btn-primary\" onclick=\"nextQuestion()\">"+(session.idx+1<session.queue.length?"Next question":"See results")+"</button>";
  }
  html += "</div>";
  return html;
}

function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function selectOpt(i){ if(current.checked) return; current.selectedOpt=i; current.err=false; render(); }
function selectTf(v){ if(current.checked) return; current.tfSelected=v; current.err=false; render(); }

function discussResult(gotIt){
  var q = session.queue[session.idx];
  var rec = progress[q.id] || {box:1,correctCount:0,wrongCount:0,lastSeen:0,flag:false};
  var cls = classifyAttempt(rec, gotIt, "med");
  current.checked = true; current.wasCorrect = gotIt; current.cls = cls;
  if(gotIt) session.correct++;
  recordAnswer(q, gotIt, "med");
  render();
}

function checkAnswer(timedOut){
  var q = session.queue[session.idx];
  if(!timedOut && !current.confidence){ current.err=true; render(); return; }
  var conf = current.confidence || "low";
  var isCorrect = false;
  if(q.type==="mc"){
    if(current.selectedOpt===null){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = current.selectedOpt===q.correct;
  } else if(q.type==="tf"){
    if(current.tfSelected===null){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = current.tfSelected===q.correct;
  } else if(q.type==="fill"){
    var val=(current.fillVal||"").trim();
    if(!val){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = q.answers.some(function(a){return a.toLowerCase()===val.toLowerCase();});
  } else if(q.type==="match" || q.type==="diagram"){
    if(!current.matchSel || current.matchSel.some(function(v){return !v;})){
      if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; }
    } else {
      isCorrect = q.items.every(function(it,i){ return current.matchSel[i]===q.rights[i]; });
    }
  }
  clearInterval(session.timer);
  current.checked=true; current.wasCorrect=isCorrect; current.err=false;
  if(isCorrect) session.correct++;
  current.cls = recordAnswer(q, isCorrect, conf);
  render();
}

function nextQuestion(){
  session.idx++;
  resetCurrent();
  if(session.idx >= session.queue.length){ clearInterval(session.timer); view="done"; }
  render();
  if(session.speed && session.idx < session.queue.length && view==="quiz") armTimer();
}

function renderDone(){
  var html = "<h1>Session complete</h1><div class=\"card\"><div class=\"statgrid\">";
  html += "<div class=\"stat\"><div class=\"num\">"+session.correct+" / "+session.queue.length+"</div><div class=\"lab\">this session</div></div>";
  var s = computeStats();
  html += "<div class=\"stat\"><div class=\"num\">"+s.accuracy+"%</div><div class=\"lab\">overall accuracy</div></div>";
  html += "</div></div>";
  html += "<button class=\"btn btn-primary\" onclick=\"go('home')\">Back to home</button>";
  return html;
}

// ======================= MODALS: GLOSSARY POPOVER + IMAGE ZOOM + TUTORIAL =======================
function openGlossary(term){ modal = {type:"glossary", term:term}; render(); }
function openZoom(qid){ var q=QUESTIONS.find(function(x){return x.id===qid;}); modal={type:"zoom", svg:q.svg}; render(); }
function closeModal(){
  var wasTutorial = modal && modal.type==="tutorial";
  modal=null;
  if(wasTutorial){ settings.seenTutorial=true; saveSettings(); }
  render();
}

var TUTORIAL_STEPS = [
  "Welcome! This app has 248 practice questions across Chapters 1, 4, 5, 7, and 8 -- multiple choice, true/false, fill-in, matching, labeling diagrams, and discussion review.",
  "After each answer, rate your confidence. It's not just right/wrong -- being confident and wrong gets flagged as your highest-priority gap.",
  "Check Weak Areas anytime for a color-coded heat-map by chapter, plus exactly which questions keep tripping you up.",
  "Use the Study Plan Builder to turn your days-until-exam and available hours into a session-by-session plan.",
  "Everything saves automatically on this device. Export a backup file anytime from Settings, or download your missed questions as text.",
  "Tip: tap the theme icon (top-right) to cycle Auto/Light/Dark, and use arrow keys + Enter to answer hands-free."
];
function openTutorial(){ modal = {type:"tutorial", step:0}; render(); }
function replayTutorial(){ openTutorial(); }
function tutorialNext(){
  if(modal.step < TUTORIAL_STEPS.length-1){ modal.step++; render(); }
  else { closeModal(); }
}
function tutorialPrev(){ if(modal.step>0){ modal.step--; render(); } }

function renderModal(){
  var old = document.getElementById("modalRoot");
  if(old) old.remove();
  var div = document.createElement("div");
  div.id = "modalRoot";
  div.className = "modal-overlay";
  div.onclick = function(e){ if(e.target===div && modal.type!=="tutorial") closeModal(); };
  var box = document.createElement("div");
  box.className = "modal-box";
  if(modal.type==="glossary"){
    box.innerHTML = "<h2>"+modal.term+"</h2><p>"+(GLOSSARY[modal.term]||"No definition found.")+"</p><button class=\"btn btn-primary\" onclick=\"closeModal()\">Close</button>";
  } else if(modal.type==="zoom"){
    box.innerHTML = modal.svg.replace("<svg ","<svg style=\\\"width:100%;height:auto;\\\" ") + "<button class=\"btn btn-primary\" style=\"margin-top:10px;\" onclick=\"closeModal()\">Close</button>";
  } else if(modal.type==="tutorial"){
    var i = modal.step;
    var dots = "<div class=\"tutorial-dots\">"+TUTORIAL_STEPS.map(function(_,idx){ return "<div class=\"tutorial-dot"+(idx===i?" active":"")+"\"></div>"; }).join("")+"</div>";
    var nav = "<div class=\"row\" style=\"margin-top:14px;\">";
    if(i>0) nav += "<button class=\"iconbtn\" onclick=\"tutorialPrev()\">Back</button>";
    nav += "<button class=\"btn btn-primary\" style=\"flex:1;margin-bottom:0;\" onclick=\"tutorialNext()\">"+(i<TUTORIAL_STEPS.length-1?"Next":"Let's go")+"</button>";
    nav += "<button class=\"iconbtn\" onclick=\"closeModal()\">Skip</button>";
    nav += "</div>";
    box.innerHTML = "<h2>Quick tour ("+(i+1)+"/"+TUTORIAL_STEPS.length+")</h2><p>"+TUTORIAL_STEPS[i]+"</p>"+dots+nav;
  }
  div.appendChild(box);
  document.body.appendChild(div);
}

// ======================= KEYBOARD SHORTCUTS =======================
function handleKey(e){
  if(modal){
    if(e.key==="Escape"){ closeModal(); return; }
    if(modal.type==="tutorial"){
      if(e.key==="ArrowRight"||e.key==="Enter"){ tutorialNext(); e.preventDefault(); }
      else if(e.key==="ArrowLeft"){ tutorialPrev(); e.preventDefault(); }
    }
    return;
  }
  if(view!=="quiz") return;
  var q = session.queue[session.idx]; if(!q) return;
  var tag = (e.target && e.target.tagName) || "";
  var inField = (tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA");

  if(q.type==="discuss"){
    if(!current.revealedDiscuss){
      if(e.key==="Enter"){ current.revealedDiscuss=true; render(); e.preventDefault(); }
    } else if(!current.checked){
      if(e.key==="y"||e.key==="Y"||e.key==="1"){ discussResult(true); e.preventDefault(); }
      else if(e.key==="n"||e.key==="N"||e.key==="2"){ discussResult(false); e.preventDefault(); }
    } else if(e.key==="Enter"||e.key===" "){ nextQuestion(); e.preventDefault(); }
    return;
  }

  if(current.checked){
    if(e.key==="Enter"||e.key===" "){ nextQuestion(); e.preventDefault(); }
    return;
  }

  if(q.type==="mc" && !inField){
    var n = parseInt(e.key,10);
    if(!isNaN(n) && n>=1 && n<=q.opts.length){ selectOpt(n-1); e.preventDefault(); return; }
    var letterIdx = "abcdefgh".indexOf((e.key||"").toLowerCase());
    if(letterIdx>=0 && letterIdx<q.opts.length){ selectOpt(letterIdx); e.preventDefault(); return; }
  }
  if(q.type==="tf" && !inField){
    if(e.key==="t"||e.key==="T"){ selectTf(true); e.preventDefault(); return; }
    if(e.key==="f"||e.key==="F"){ selectTf(false); e.preventDefault(); return; }
  }
  if(q.type==="mc"||q.type==="tf"){
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      var order=["low","med","high"];
      var idx = order.indexOf(current.confidence);
      if(idx===-1) idx = e.key==="ArrowRight" ? -1 : order.length;
      idx = e.key==="ArrowRight" ? Math.min(order.length-1, idx+1) : Math.max(0, idx-1);
      current.confidence = order[idx];
      render(); e.preventDefault(); return;
    }
  }
  if(e.key==="Enter"){ checkAnswer(); e.preventDefault(); }
}
try{ document.addEventListener("keydown", handleKey); }catch(e){}

// ======================= SWIPE GESTURES =======================
var touchStartX=null, touchStartY=null;
function onTouchStart(e){
  if(!e.touches || !e.touches.length) return;
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}
function onTouchEnd(e){
  if(touchStartX===null) return;
  var t = (e.changedTouches && e.changedTouches[0]) || null;
  var endX = t ? t.clientX : touchStartX;
  var endY = t ? t.clientY : touchStartY;
  var dx = endX-touchStartX, dy = endY-touchStartY;
  touchStartX=null; touchStartY=null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
    if(view==="quiz" && current.checked && !modal){ nextQuestion(); }
  }
}
try{
  document.addEventListener("touchstart", onTouchStart, {passive:true});
  document.addEventListener("touchend", onTouchEnd, {passive:true});
}catch(e){}

render();
</script>
