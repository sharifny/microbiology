<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIO 207 -- Exam II Practice</title>
<style>
:root{
  --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --card:#ffffff; --border:#ddd;
  --accent:#2563eb; --accent-fg:#ffffff; --good:#15803d; --good-bg:#dcfce7;
  --bad:#b91c1c; --bad-bg:#fee2e2; --chip:#eef2ff; --warn:#b45309; --warn-bg:#fef3c7;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --fg:#f0f0f0; --muted:#a0a0a0; --card:#1e1e1e; --border:#333;
    --accent:#60a5fa; --accent-fg:#0b1220; --good:#4ade80; --good-bg:#0f2e1a;
    --bad:#f87171; --bad-bg:#3a1414; --chip:#1f2540; --warn:#fbbf24; --warn-bg:#3a2e0f;
  }
  html{ color-scheme: dark; }
}
:root[data-theme="dark"]{
  --bg:#121212; --fg:#f0f0f0; --muted:#a0a0a0; --card:#1e1e1e; --border:#333;
  --accent:#60a5fa; --accent-fg:#0b1220; --good:#4ade80; --good-bg:#0f2e1a;
  --bad:#f87171; --bad-bg:#3a1414; --chip:#1f2540; --warn:#fbbf24; --warn-bg:#3a2e0f;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color: transparent;
}
#app{ max-width:580px; margin:0 auto; padding:16px 16px 48px; position:relative; }
.topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.topbar .brand{ font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
.tutorial-dots{ display:flex; gap:6px; justify-content:center; margin-top:14px; }
.tutorial-dot{ width:7px; height:7px; border-radius:50%; background:var(--border); }
.tutorial-dot.active{ background:var(--accent); }
h1{ font-size:20px; font-weight:600; margin:4px 0 2px; }
h2{ font-size:16px; font-weight:600; margin:0 0 10px; }
.muted{ color:var(--muted); font-size:13px; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{
  display:block; width:100%; text-align:left; background:var(--card); color:var(--fg);
  border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;
  font-size:15px; margin-bottom:10px; cursor:pointer;
}
.btn:active{ transform:scale(0.99); }
.btn-primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; text-align:center; }
.btn-primary:disabled{ opacity:0.5; }
.btn-ghost{ background:transparent; }
.btn-sm{ display:inline-block; width:auto; padding:8px 12px; font-size:13px; margin:0 6px 6px 0; }
.chip{ display:inline-block; background:var(--chip); color:var(--accent); font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; margin-right:6px; margin-bottom:6px; cursor:pointer; border:none; }
.chip.tag-warn{ background:var(--warn-bg); color:var(--warn); }
.statgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:10px 0; }
.stat{ background:var(--chip); border-radius:var(--radius); padding:12px; }
.stat .num{ font-size:22px; font-weight:600; }
.stat .lab{ font-size:12px; color:var(--muted); }
.barwrap{ background:var(--border); border-radius:6px; height:10px; overflow:hidden; margin-top:6px;}
.bar{ height:100%; background:var(--accent); transition:width .3s; }
.heatbar{ height:16px; border-radius:6px; }
.progresstop{ font-size:13px; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.qtext{ font-size:16px; line-height:1.5; margin-bottom:10px; }
.opt{ display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; font-size:15px; cursor:pointer; }
.opt.selected{ border-color:var(--accent); border-width:2px; }
.opt.correct{ border-color:var(--good); background:var(--good-bg); border-width:2px; }
.opt.incorrect{ border-color:var(--bad); background:var(--bad-bg); border-width:2px; }
input[type=text],input[type=number]{
  width:100%; padding:12px 14px; font-size:15px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); color:var(--fg);
}
select{
  width:100%; padding:10px 12px; font-size:14px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); color:var(--fg); margin-top:4px;
}
.matchrow{ margin-bottom:12px; }
.matchrow .mleft{ font-size:14px; margin-bottom:4px; }
.feedback{ border-radius:var(--radius); padding:12px 14px; margin-top:10px; font-size:14px; }
.feedback.good{ background:var(--good-bg); color:var(--good); }
.feedback.bad{ background:var(--bad-bg); color:var(--bad); }
.feedback.warn{ background:var(--warn-bg); color:var(--warn); font-weight:600; }
.err{ color:var(--bad); font-size:13px; margin-top:6px; }
.footerbtn{ position:sticky; bottom:0; background:var(--bg); padding:10px 0 4px; }
.small{ font-size:12px; color:var(--muted); margin-top:4px; }
a{ color:var(--accent); }
.iconbtn{ background:none; border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; color:var(--fg); cursor:pointer; }
.timerbar{ height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:10px; }
.timerfill{ height:100%; background:var(--warn); transition:width .2s linear; }
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal-box{ background:var(--card); border-radius:var(--radius); padding:20px; max-width:440px; width:100%; max-height:80vh; overflow-y:auto; }
.modal-box svg{ width:100%; height:auto; color:var(--fg); }
.confband{ display:flex; gap:8px; margin:10px 0; }
.confbtn{ flex:1; padding:10px 6px; font-size:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--fg); cursor:pointer; text-align:center; }
.confbtn.selected{ border-color:var(--accent); border-width:2px; background:var(--chip); }
svg.diagram{ width:100%; height:auto; color:var(--fg); cursor:zoom-in; }
.hero-card{ background:linear-gradient(135deg,var(--accent),#7c3aed); border-radius:var(--radius); padding:16px; color:#fff; margin-bottom:12px; cursor:pointer; box-shadow:0 8px 20px rgba(37,99,235,.25); border:none; width:100%; text-align:left; display:flex; align-items:center; gap:12px; }
.hero-card-urgent{ background:linear-gradient(135deg,#dc2626,#ea580c); box-shadow:0 8px 20px rgba(220,38,38,.3); }
.hero-icon{ font-size:26px; flex-shrink:0; }
.hero-label{ font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.03em; opacity:.85; }
.hero-title{ font-size:17px; font-weight:700; margin-top:2px; }
.hero-sub{ font-size:12.5px; opacity:.85; margin-top:2px; }
.hero-chev{ font-size:20px; opacity:.85; flex-shrink:0; }
.alert-card{ border-radius:var(--radius); padding:16px; margin-bottom:12px; border-width:1px; border-style:solid; }
.alert-head{ display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.alert-title{ font-weight:600; font-size:14px; flex:1; }
.alert-count{ font-size:12px; font-weight:600; }
.alert-chip{ font-size:11px; font-weight:600; padding:3px 9px; border-radius:999px; margin:0 6px 6px 0; display:inline-block; }
.alert-msg{ font-size:13px; margin:6px 0 10px; }
.modecard{ display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:13px 14px; margin-bottom:10px; cursor:pointer; text-align:left; width:100%; }
.modecard-icon{ width:36px; height:36px; border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:17px; flex-shrink:0; }
.modecard-body{ flex:1; min-width:0; }
.modecard-title{ font-weight:600; font-size:14.5px; }
.modecard-desc{ font-size:12px; color:var(--muted); margin-top:1px; }
.modecard-chev{ color:var(--muted); font-size:18px; flex-shrink:0; }
.hue-emerald{ background:rgba(16,185,129,.15); color:#10b981; }
.hue-amber{ background:rgba(245,158,11,.15); color:#f59e0b; }
.hue-cyan{ background:rgba(6,182,212,.15); color:#06b6d4; }
.hue-rose{ background:rgba(244,63,94,.15); color:#f43f5e; }
.hue-violet{ background:rgba(124,58,237,.15); color:#7c3aed; }
.hue-slate{ background:rgba(100,116,139,.15); color:#64748b; }
.tiptext{ font-size:12.5px; color:var(--muted); line-height:1.5; margin-top:18px; padding-top:14px; border-top:1px solid var(--border); }
.confetti-piece{ position:fixed; top:-10px; width:8px; height:8px; z-index:100; pointer-events:none; }
textarea.plan-out{ width:100%; min-height:220px; font-size:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--fg); padding:12px; font-family:inherit; }
</style>
</head>
<body>
<div id="app"></div>
<div id="confetti-root"></div>
<script>
// ======================= DATA =======================
var QUESTIONS = [{"id": "c6_01", "ch": 6, "type": "mc", "q": "A virus is a tiny, infectious:", "opts": ["Cell", "Living thing", "Particle", "Nucleic acid"], "correct": 2, "exp": "Viruses are acellular infectious particles -- not cells, not independently 'living' things.", "src": "chapter", "wrongExp": {"0": "Viruses are acellular -- they have no cell structure at all, unlike bacteria or eukaryotic cells.", "1": "Viruses can't independently grow, metabolize, or reproduce on their own -- they're not considered 'living' in the traditional sense.", "3": "Nucleic acid is only part of a virus -- a virus also includes the surrounding protein capsid."}}, {"id": "c6_02", "ch": 6, "type": "mc", "q": "Viruses are known to infect:", "opts": ["Plants", "Bacteria", "Fungi", "All organisms"], "correct": 3, "exp": "Every kind of cellular life -- plants, animals, fungi, protists, and bacteria (via bacteriophages) -- can be infected by viruses.", "src": "chapter", "wrongExp": {"0": "True, but incomplete -- viruses also infect bacteria, fungi, and animals.", "1": "True, but incomplete -- viruses also infect plants, fungi, and animals.", "2": "True, but incomplete -- viruses also infect plants, bacteria, and animals."}}, {"id": "c6_03", "ch": 6, "type": "mc", "q": "The capsid is composed of protein subunits called:", "opts": ["Spikes", "Protomers", "Virions", "Capsomeres"], "correct": 3, "exp": "Capsomeres are the individual protein subunits that assemble into the capsid shell.", "src": "chapter", "wrongExp": {"0": "Spikes are glycoprotein projections on the envelope, not the protein subunits of the capsid.", "1": "'Protomer' isn't the term used for capsid subunits here -- 'capsomere' is.", "2": "A virion is the whole complete virus particle, not just a capsid subunit."}}, {"id": "c6_04", "ch": 6, "type": "mc", "q": "The envelope of an animal virus is derived from the ________ of its host cell.", "opts": ["Cell wall", "Membrane", "Glycocalyx", "Receptors"], "correct": 1, "exp": "The envelope buds off from the host's own membrane (plasma, nuclear, or ER), picking up viral spike proteins along the way.", "src": "chapter", "wrongExp": {"0": "Viruses don't use a host cell wall for their envelope -- enveloped viruses typically infect animal cells, which have no cell wall.", "2": "Glycocalyx is an outer bacterial coating, not what forms a viral envelope.", "3": "Receptors are host-cell surface molecules the virus binds to -- they don't become part of the envelope."}}, {"id": "c6_05", "ch": 6, "type": "mc", "q": "The nucleic acid of a virus is:", "opts": ["DNA only", "RNA only", "Both DNA and RNA", "Either DNA or RNA"], "correct": 3, "exp": "A virus carries only one type of nucleic acid -- DNA or RNA, never both at once.", "src": "chapter", "wrongExp": {"0": "Too narrow -- many viruses use RNA instead.", "1": "Too narrow -- many viruses use DNA instead.", "2": "A virus never carries both at once -- only one type, not a mix."}}, {"id": "c6_06", "ch": 6, "type": "mc", "q": "The general steps in a viral multiplication cycle are:", "opts": ["Adsorption, penetration, synthesis, assembly, and release", "Endocytosis, replication, assembly, and budding", "Adsorption, duplication, assembly, and lysis", "Endocytosis, penetration, replication, maturation, and exocytosis"], "correct": 0, "exp": "The five-stage general cycle -- adsorption, penetration, synthesis, assembly, release -- applies to both phages and animal viruses, even though the specific mechanisms of each stage differ.", "src": "chapter", "wrongExp": {"1": "This list omits synthesis and uses non-standard terms not matching the five standard stages.", "2": "This list skips synthesis and uses 'lysis' instead of the general 'release' stage.", "3": "This list uses nonstandard terms ('maturation,' 'exocytosis') and omits a correctly named synthesis stage."}}, {"id": "c6_07", "ch": 6, "type": "mc", "q": "A prophage is a/an ________ stage in the cycle of ________.", "opts": ["Latent, bacterial viruses", "Infective, RNA viruses", "Early, poxviruses", "Late, enveloped viruses"], "correct": 0, "exp": "A prophage is the dormant, integrated (latent) stage of a bacteriophage's lysogenic cycle.", "src": "chapter", "wrongExp": {"1": "A prophage isn't 'infective' -- it's dormant -- and this describes RNA viruses, not the defining feature of a prophage.", "2": "Prophage isn't specific to poxviruses -- it's a general bacteriophage (lysogenic cycle) term.", "3": "A prophage isn't a 'late' stage of enveloped viruses -- it's the dormant stage of bacteriophages specifically."}}, {"id": "c6_08", "ch": 6, "type": "mc", "q": "The nucleic acid of animal viruses enters the host cell through:", "opts": ["Injection", "Fusion", "Endocytosis", "b and c"], "correct": 3, "exp": "Unlike phages (which inject nucleic acid through a tail tube), animal viruses enter whole, via membrane fusion or endocytosis, then uncoat inside the cell.", "src": "chapter", "wrongExp": {"0": "Injection (through a tail tube) is how bacteriophages enter -- not how animal viruses typically enter.", "1": "Fusion is one correct route, but not the only one -- endocytosis is also used.", "2": "Endocytosis is one correct route, but not the only one -- fusion is also used."}}, {"id": "c6_09", "ch": 6, "type": "mc", "q": "In general, RNA viruses multiply in the cell ________, and DNA viruses multiply in the cell ________.", "opts": ["Nucleus, cytoplasm", "Cytoplasm, nucleus", "Vesicles, ribosomes", "Endoplasmic reticulum, nucleolus"], "correct": 1, "exp": "Most RNA viruses replicate in the cytoplasm; most DNA viruses replicate in the nucleus (where host DNA machinery is available) -- retroviruses are a notable exception.", "src": "chapter", "wrongExp": {"0": "This reverses the pairing -- RNA viruses generally multiply in the cytoplasm, DNA viruses in the nucleus, not the other way around.", "2": "Vesicles and ribosomes aren't the general locations described for RNA/DNA virus multiplication.", "3": "The ER and nucleolus aren't the general locations described for RNA/DNA virus multiplication."}}, {"id": "c6_10", "ch": 6, "type": "mc", "q": "Enveloped viruses carry surface receptors called:", "opts": ["Buds", "Spikes", "Fibers", "Sheaths"], "correct": 1, "exp": "Spikes (glycoproteins) studding the envelope bind specifically to host cell receptors and determine host range.", "src": "chapter", "wrongExp": {"0": "'Buds' describes the process of enveloped virus release, not a surface receptor structure.", "2": "'Fibers' refers to bacteriophage tail fibers, not envelope receptors on animal viruses.", "3": "'Sheaths' are part of a bacteriophage's tail structure, not envelope receptors."}}, {"id": "c6_11", "ch": 6, "type": "mc", "q": "Viruses that persist in the cell and cause recurrent disease are considered:", "opts": ["Oncogenic", "Cytopathic", "Latent", "Resistant"], "correct": 2, "exp": "Latent viruses (like herpesviruses) remain dormant for long periods and periodically reactivate to cause recurrent symptoms.", "src": "chapter", "wrongExp": {"0": "Oncogenic describes cancer-causing viruses -- a different property from persistence/recurrence.", "1": "Cytopathic describes viruses that visibly damage/kill host cells -- the opposite of quietly persisting.", "3": "'Resistant' isn't the term used for a virus that persists and recurs -- 'latent' is."}}, {"id": "c6_12", "ch": 6, "type": "mc", "q": "Viruses cannot be cultivated in:", "opts": ["Cell culture", "Bird embryos", "Live mammals", "Blood agar"], "correct": 3, "exp": "Blood agar is an inert nutrient medium -- viruses are obligate intracellular parasites and require living host cells/tissue, not an agar plate.", "src": "chapter", "wrongExp": {"0": "Cell culture IS a valid cultivation method -- not the exception.", "1": "Bird embryos ARE a valid cultivation method -- not the exception.", "2": "Live mammals ARE a valid cultivation method -- not the exception."}}, {"id": "c6_13", "ch": 6, "type": "fill", "q": "Clear patches in cell cultures that indicate sites of virus infection are called ________.", "exp": "Plaques are clear zones where the virus has lysed/killed the cells in a confluent monolayer -- the viral equivalent of a bacterial colony count.", "src": "chapter", "answers": ["plaque", "plaques", "a plaque"]}, {"id": "c6_14", "ch": 6, "type": "mc", "q": "Which of these is NOT a general pattern of virus morphology?", "opts": ["Enveloped, helical", "Naked, icosahedral", "Enveloped, icosahedral", "Complex, helical"], "correct": 3, "exp": "Complex viruses (like T4 phage) have their own distinct, non-helical/non-icosahedral architecture -- 'complex, helical' isn't a recognized morphology category.", "src": "chapter", "wrongExp": {"0": "Enveloped, helical IS a real viral morphology pattern (e.g., influenza) -- not the exception.", "1": "Naked, icosahedral IS a real viral morphology pattern (e.g., poliovirus) -- not the exception.", "2": "Enveloped, icosahedral IS a real viral morphology pattern (e.g., herpesvirus) -- not the exception."}}, {"id": "c6_15", "ch": 6, "type": "mc", "q": "Which of these is true of prions?", "opts": ["They are small RNA viruses", "They replicate in the nucleus", "They lack protein", "They cause death of brain cells"], "correct": 3, "exp": "Prions are infectious proteins (not RNA viruses, and they don't 'replicate' or lack protein) that cause fatal, progressive destruction of nerve cells in spongiform encephalopathies.", "src": "chapter", "wrongExp": {"0": "Prions aren't viruses at all, and they have no RNA -- they're pure protein.", "1": "Prions don't 'replicate' in the normal sense -- they convert existing normal protein into the misfolded form.", "2": "Prions ARE made of protein -- that's literally all they are; they lack nucleic acid, not protein."}}, {"id": "c6_16", "ch": 6, "type": "mc", "q": "Phages infect:", "opts": ["Bacterial cells", "Viruses", "Human cells", "Any type of cell"], "correct": 0, "exp": "Bacteriophages are viruses specific to bacteria -- their narrow host range is exactly what makes phage therapy selectively harmless to human cells.", "src": "chapter", "wrongExp": {"1": "Phages infect bacteria, not other viruses -- viruses don't have cells of their own to parasitize.", "2": "Phages have a narrow host range limited to bacteria -- they don't infect human cells.", "3": "Phages are highly host-specific to bacteria, not 'any type of cell.'"}}, {"id": "c6_17", "ch": 6, "type": "mc", "q": "What most likely happened after a patient was cured of an illness by phage therapy?", "opts": ["He was prescribed antiviral medication to inactivate the phage", "The phage disappeared from his body", "The phage infected the patient's cells", "He was prescribed antibiotics to prevent further phage replication"], "correct": 1, "exp": "Once the target bacteria are cleared, the phage has no host left to replicate in and is naturally cleared from the body -- phages don't infect human cells.", "src": "chapter", "wrongExp": {"0": "Phages aren't inactivated by antiviral medication -- they simply have no more bacterial hosts left to replicate in.", "2": "Phages don't infect human cells -- their host range is limited to bacteria.", "3": "Antibiotics target bacteria, not phages -- and phages naturally clear once their bacterial target is gone."}}, {"id": "c6_18", "ch": 6, "type": "mc", "q": "Which of the following is a component of a virus?", "opts": ["Cell wall", "Ribosome", "Capsid", "Nucleus"], "correct": 2, "exp": "Viruses are acellular -- no cell wall, no ribosomes, no nucleus. The capsid (protein coat) is their defining structural component.", "src": "chapter", "wrongExp": {"0": "Viruses have no cell wall -- they're acellular.", "1": "Viruses have no ribosomes of their own -- they rely entirely on the host's.", "3": "Viruses have no nucleus -- they aren't cells at all."}}, {"id": "c6_19", "ch": 6, "type": "mc", "q": "Which is the earliest step in the replication cycle of hepatitis B virus?", "opts": ["Release", "Assembly", "Adsorption", "Penetration"], "correct": 2, "exp": "Adsorption (attachment to the host cell) is always the first step in any viral replication cycle, before penetration can occur.", "src": "chapter", "wrongExp": {"0": "Release is the LAST step of the cycle, not the earliest.", "1": "Assembly happens well after the virus has already entered and begun replicating.", "3": "Penetration happens right after adsorption -- attachment must come first."}}, {"id": "c9_01", "ch": 9, "type": "mc", "q": "What is the fundamental unit of heredity?", "opts": ["Chromosome", "Gene", "Codon", "Intron"], "correct": 1, "exp": "A gene is the basic unit of heredity -- a specific DNA sequence coding for a protein or functional RNA.", "src": "chapter", "wrongExp": {"0": "A chromosome is a larger structure made of many genes packaged together -- not itself the basic unit.", "2": "A codon is just a 3-base unit specifying one amino acid -- far smaller than a gene.", "3": "An intron is a non-coding region within a gene -- it doesn't itself function as a unit of heredity."}}, {"id": "c9_02", "ch": 9, "type": "mc", "q": "A nucleotide contains which of the following?", "opts": ["5-carbon sugar", "Nitrogenous base", "Phosphate", "b and c only", "All of these"], "correct": 4, "exp": "A nucleotide = a 5-carbon sugar + a phosphate group + a nitrogenous base, all three together.", "src": "chapter", "wrongExp": {"0": "True, but incomplete -- a nucleotide also needs a base and a phosphate.", "1": "True, but incomplete -- a nucleotide also needs a sugar and a phosphate.", "2": "True, but incomplete -- a nucleotide also needs a sugar.", "3": "True, but incomplete -- a nucleotide needs the sugar too, not just the base and phosphate."}}, {"id": "c9_03", "ch": 9, "type": "mc", "q": "The nitrogenous bases in DNA are bonded to the:", "opts": ["Phosphate", "Deoxyribose", "Ribose", "Hydrogen"], "correct": 1, "exp": "Each base attaches to the deoxyribose sugar of its nucleotide; the sugar in turn links to the phosphate to form the backbone.", "src": "chapter", "wrongExp": {"0": "The base attaches to the sugar, not directly to the phosphate.", "2": "Ribose is RNA's sugar -- DNA uses deoxyribose.", "3": "Hydrogen bonds connect base pairs across strands -- they don't attach a base to its own sugar."}}, {"id": "c9_04", "ch": 9, "type": "mc", "q": "DNA replication is considered semiconservative because the ________ strand will remain as half of the ________ molecule.", "opts": ["Antisense, DNA", "Template, final DNA", "Sense, mRNA", "Codon, anticodon"], "correct": 1, "exp": "Each new DNA double helix keeps one original template strand paired with one newly synthesized strand -- 'semi' (half) conserved.", "src": "chapter", "wrongExp": {"0": "'Antisense' isn't the standard term used here -- it's the template strand that's conserved.", "2": "'Sense, mRNA' confuses DNA replication with transcription -- this question is about DNA replication.", "3": "Codon and anticodon are translation terms, unrelated to DNA replication's semiconservative nature."}}, {"id": "c9_05", "ch": 9, "type": "mc", "q": "In DNA, adenine is the complementary base for ________, and cytosine is the complement for ________.", "opts": ["Guanine, thymine", "Uracil, guanine", "Thymine, guanine", "Thymine, uracil"], "correct": 2, "exp": "A pairs with T, and C pairs with G in DNA -- a classic base-pairing fact.", "src": "chapter", "wrongExp": {"0": "This reverses adenine's actual partner (thymine) with guanine's partner (cytosine).", "1": "Uracil pairs with adenine in RNA, not DNA -- and cytosine's partner is guanine, not uracil.", "3": "This reverses which base pairs with adenine and misstates cytosine's partner."}}, {"id": "c9_06", "ch": 9, "type": "mc", "q": "The base pairs are held together primarily by:", "opts": ["Covalent bonds", "Ionic bonds", "Hydrogen bonds", "Gyrases"], "correct": 2, "exp": "Hydrogen bonds hold complementary base pairs together (2 between A-T, 3 between G-C) -- weak enough to be unzipped for replication/transcription, but strong enough in number to stabilize the helix. Gyrase is an enzyme, not a bond type.", "src": "chapter", "wrongExp": {"0": "Covalent bonds hold the sugar-phosphate backbone together, not the base pairs between strands.", "1": "Ionic bonds aren't involved in base pairing at all.", "3": "Gyrase is an enzyme that relieves supercoiling -- not a type of bond."}}, {"id": "c9_07", "ch": 9, "type": "mc", "q": "Why must the lagging strand of DNA be replicated in short pieces?", "opts": ["Because space is limited", "Otherwise, the helix will become distorted", "The DNA polymerase can synthesize in only one direction", "To make proofreading of code easier"], "correct": 2, "exp": "DNA polymerase only synthesizes 5' to 3', so on the lagging strand (running the 'wrong' way relative to the replication fork) it must work in short, discontinuous Okazaki fragments.", "src": "chapter", "wrongExp": {"0": "Space isn't the limiting factor -- it's the chemistry of how DNA polymerase works.", "1": "Helix distortion isn't why lagging-strand synthesis is discontinuous -- directionality is.", "3": "Proofreading happens regardless of fragment length -- it isn't the reason for short pieces."}}, {"id": "c9_08", "ch": 9, "type": "mc", "q": "Messenger RNA is formed by ________ of a gene on the DNA template strand.", "opts": ["Transcription", "Replication", "Translation", "Transformation"], "correct": 0, "exp": "Transcription is the DNA-to-RNA copying process that produces mRNA from a gene's template strand.", "src": "chapter", "wrongExp": {"1": "Replication copies DNA into DNA, not into mRNA.", "2": "Translation converts mRNA into protein -- it comes AFTER mRNA is already made.", "3": "Transformation is a bacterial DNA-uptake process, unrelated to making mRNA."}}, {"id": "c9_09", "ch": 9, "type": "mc", "q": "Transfer RNA is the molecule that:", "opts": ["Contributes to the structure of ribosomes", "Adapts the genetic code to protein structure", "Transfers the DNA code to mRNA", "Provides the master code for amino acids"], "correct": 1, "exp": "tRNA physically 'adapts' the genetic code into protein by matching its anticodon to an mRNA codon while carrying the corresponding amino acid.", "src": "chapter", "wrongExp": {"0": "rRNA, not tRNA, contributes to the ribosome's structure.", "2": "mRNA, not tRNA, transfers the DNA code to the ribosome.", "3": "tRNA carries individual amino acids per codon -- it doesn't provide a 'master code' for all of them."}}, {"id": "c9_10", "ch": 9, "type": "mc", "q": "As a general rule, the first codon on a DNA template strand that signals the start for a protein is:", "opts": ["TAC", "AUG", "ATG", "UAC"], "correct": 0, "exp": "TAC on the DNA template strand transcribes to AUG on the mRNA (the start codon) -- don't confuse the DNA template triplet (TAC) with the mRNA start codon itself (AUG), a classic trap.", "terms": ["start codon"], "src": "chapter", "wrongExp": {"1": "AUG is the mRNA start codon -- but this question asks for the DNA template triplet, which is TAC.", "2": "ATG is the coding-strand sequence, not the template strand's triplet (TAC) being asked about.", "3": "UAC isn't a DNA sequence at all (U is for RNA)."}}, {"id": "c9_11", "ch": 9, "type": "mc", "q": "What components are involved in transcription?", "opts": ["Sigma factor", "RNA polymerase", "Promoter", "Only b and c", "All of these"], "correct": 4, "exp": "Transcription involves RNA polymerase binding the promoter, often with the help of a sigma factor (in prokaryotes) to recognize the correct start site -- all three play a role.", "src": "chapter", "wrongExp": {"0": "True, but incomplete -- RNA polymerase and the promoter matter too.", "1": "True, but incomplete -- the promoter and sigma factor matter too.", "2": "True, but incomplete -- RNA polymerase and sigma factor matter too.", "3": "This leaves out the sigma factor, which also plays a role in prokaryotic transcription."}}, {"id": "c9_12", "ch": 9, "type": "mc", "q": "The lac operon is usually in the ________ position and is activated by a/an ________ molecule.", "opts": ["On, repressor", "Off, inducer", "On, inducer", "Off, repressor"], "correct": 1, "exp": "The lac operon is an inducible operon: normally OFF, switched ON by an inducer (lactose/allolactose).", "src": "chapter", "wrongExp": {"0": "This reverses the lac operon's actual default state and regulator type.", "2": "The lac operon is normally OFF, not ON, by default.", "3": "It's turned ON by an inducer, not a repressor -- the repressor is what keeps it off."}}, {"id": "c9_13", "ch": 9, "type": "mc", "q": "For mutations to have an effect on populations of microbes, they must be:", "opts": ["Inheritable", "Permanent", "Beneficial", "a and b", "All of these"], "correct": 3, "exp": "A mutation must be both inheritable (passed to offspring) and permanent (a lasting DNA change) to affect a population over time -- it does NOT need to be beneficial; harmful and neutral mutations also persist and spread.", "src": "chapter", "wrongExp": {"0": "True, but incomplete alone -- it must ALSO be permanent to affect the population long-term.", "1": "True, but incomplete alone -- it must ALSO be inheritable to spread through the population.", "2": "Mutations do NOT need to be beneficial -- harmful and neutral mutations persist and spread too.", "4": "'All of these' incorrectly includes 'beneficial,' which isn't actually required."}}, {"id": "c9_14", "ch": 9, "type": "mc", "q": "Which of the following characteristics is NOT true of a plasmid?", "opts": ["It is a circular piece of DNA", "It is required for normal cell function", "It is found in bacteria", "It can be transferred from cell to cell"], "correct": 1, "exp": "Plasmids carry nonessential (though often advantageous) genes like antibiotic resistance -- a cell survives fine without one.", "src": "chapter", "wrongExp": {"0": "This IS true of plasmids -- most are circular DNA -- so it's not the exception.", "2": "This IS true -- plasmids are found in bacteria -- so it's not the exception.", "3": "This IS true -- plasmids can be transferred between cells -- so it's not the exception."}}, {"id": "c9_15", "ch": 9, "type": "mc", "q": "Which of these features is found in eukaryotes but NOT bacteria?", "opts": ["Polygene mRNAs", "Introns", "Stop codon", "AUG codon"], "correct": 1, "exp": "Introns (non-coding intervening sequences requiring splicing) are a eukaryotic gene feature; bacterial genes generally lack them. Polycistronic ('polygene') mRNA is actually a bacterial feature, and stop/start codons are universal.", "src": "chapter", "wrongExp": {"0": "Polycistronic ('polygene') mRNA is actually a BACTERIAL feature -- this is backwards.", "2": "Stop codons are universal to both prokaryotes and eukaryotes.", "3": "The AUG start codon is universal to both prokaryotes and eukaryotes."}}, {"id": "c9_16", "ch": 9, "type": "mc", "q": "Which of the following is present in prokaryotes but NOT eukaryotes?", "opts": ["Exons", "Polyribosomes", "Spliceosomes", "Simultaneous transcription and translation"], "correct": 3, "exp": "With no nuclear membrane separating the two processes, prokaryotes can translate an mRNA while it's still being transcribed -- impossible in eukaryotes, where transcription (nucleus) and translation (cytoplasm) are physically separated.", "src": "chapter", "wrongExp": {"0": "Exons are a eukaryotic gene feature -- not found distinctly in prokaryotes this way.", "1": "Polyribosomes occur in both prokaryotes and eukaryotes -- not unique to prokaryotes.", "2": "Spliceosomes are eukaryotic machinery for removing introns -- prokaryotes don't have them at all."}}, {"id": "c9_17", "ch": 9, "type": "mc", "q": "The enzymes responsible for the movement of the vanA transposon are:", "opts": ["Transposase and polymerase", "Replicase and resolvase", "Transposase and resolvase", "Transposase and replicase"], "correct": 2, "exp": "Transposase cuts/pastes the transposon into a new site, and resolvase helps resolve the DNA intermediate structure created during that process.", "src": "chapter", "wrongExp": {"0": "Polymerase isn't one of the two key transposon-movement enzymes -- resolvase is.", "1": "Replicase isn't one of the two key transposon-movement enzymes -- transposase is.", "3": "Replicase isn't involved -- resolvase is the second enzyme, alongside transposase."}}, {"id": "c9_18", "ch": 9, "type": "mc", "q": "With regard to the vanA operon, vancomycin acts as a(n):", "opts": ["Promoter", "Repressor", "Inducer", "Operator"], "correct": 2, "exp": "Exposure to vancomycin itself triggers (induces) expression of the vanA resistance operon's genes.", "src": "chapter", "wrongExp": {"0": "A promoter is a DNA region, not something vancomycin itself acts as.", "1": "Vancomycin triggers (induces) expression -- a repressor would instead block it.", "3": "An operator is a DNA sequence, not a role vancomycin itself plays."}}, {"id": "c9_19", "ch": 9, "type": "mc", "q": "Which base will pair with uracil in RNA?", "opts": ["Adenine", "Guanine", "Thymine", "Cytosine"], "correct": 0, "exp": "Uracil takes thymine's place in RNA and still pairs with adenine, just as thymine does in DNA.", "src": "chapter", "wrongExp": {"1": "Guanine pairs with cytosine, not uracil.", "2": "Thymine doesn't appear in RNA at all -- uracil replaces it.", "3": "Cytosine pairs with guanine, not uracil."}}, {"id": "c9_20", "ch": 9, "type": "mc", "q": "What cell structure is responsible for protein synthesis?", "opts": ["Golgi body", "Lysosome", "DNA", "Ribosome"], "correct": 3, "exp": "Ribosomes (rRNA + protein) are the physical site where translation -- the actual assembly of proteins -- takes place.", "src": "chapter", "wrongExp": {"0": "The Golgi body modifies/packages proteins AFTER synthesis -- it doesn't build them.", "1": "The lysosome digests materials -- it plays no role in making proteins.", "2": "DNA stores the genetic code but doesn't itself assemble proteins."}}, {"id": "a6_01", "ch": 6, "type": "fill", "q": "Together, the capsid and the nucleic acid of a virus are referred to as the ________.", "exp": "The capsid (protein shell) plus the enclosed nucleic acid together make up the nucleocapsid; a virus with only this (no outer membrane) is a naked virus.", "src": "assignment", "answers": ["nucleocapsid"]}, {"id": "a6_02", "ch": 6, "type": "mc", "q": "Which of the following is NOT used to classify a virus into a particular family?", "opts": ["Capsid structure (type of capsid)", "Presence or absence of an envelope", "Genetic makeup (nucleic acid type)", "Type of infection it causes"], "correct": 3, "exp": "Classification criteria include capsid type, envelope presence, nucleic acid strand number/type, overall size, and host-cell area of multiplication -- type of infection caused is not one of the listed criteria.", "src": "assignment", "wrongExp": {"0": "This IS a real classification criterion -- not the exception.", "1": "This IS a real classification criterion -- not the exception.", "2": "This IS a real classification criterion -- not the exception."}}, {"id": "a6_03", "ch": 6, "type": "tf", "q": "Presence or absence of a capsid is a criterion used to classify viruses into families.", "correct": false, "exp": "False -- essentially all viruses have a capsid, so this isn't a useful classification criterion; capsid *structure/type* is used, not its mere presence.", "src": "assignment", "wrongExp": "Nearly every virus has SOME capsid -- so presence/absence of one isn't useful for distinguishing families; capsid TYPE/structure is what's actually used."}, {"id": "a6_04", "ch": 6, "type": "tf", "q": "The viral-host relationship is extremely important for pathogenicity, mode of transmission, the immune response, and the human measures used to control viral infections.", "correct": true, "exp": "True -- the specific virus-host interaction shapes how disease develops, how it spreads, how the immune system reacts, and which control measures (vaccines, antivirals) actually work.", "src": "assignment", "wrongExp": "This relationship really is central to all of these outcomes -- pathogenicity, transmission, immune response, and control measures all hinge on the virus-host interaction."}, {"id": "a6_05", "ch": 6, "type": "tf", "q": "Viral nucleic acid enters the host cell and uses the host cell's replication and synthesis machinery to produce new nucleic acid molecules, capsid proteins, spikes, and viral enzymes.", "correct": true, "exp": "True -- once inside, viral nucleic acid redirects the host's own machinery to manufacture all the components needed for new virus particles.", "src": "assignment", "wrongExp": "This is exactly what happens -- once inside, viral nucleic acid redirects the host's own machinery to build everything the virus needs."}, {"id": "a6_06", "ch": 6, "type": "mc", "q": "Which term is associated with the release of nonenveloped or complex viruses from the host cell?", "opts": ["Phagocytosis", "Exocytosis", "Endocytosis", "Budding", "Lysis"], "correct": 4, "exp": "Nonenveloped and complex viruses are released by rupturing (lysing) the host cell; enveloped viruses, by contrast, bud/exocytose out gradually.", "src": "assignment", "wrongExp": {"0": "Phagocytosis is how some host cells engulf things -- not how a virus exits.", "1": "Exocytosis/budding is how ENVELOPED viruses are released, not nonenveloped/complex ones.", "2": "Endocytosis is a mode of viral ENTRY, not release.", "3": "Budding is how enveloped viruses exit -- nonenveloped/complex viruses instead lyse the cell."}}, {"id": "a6_07", "ch": 6, "type": "mc", "q": "Which of the following does NOT represent an event in bacteriophage multiplication?", "opts": ["Synthesis and assembly occur in the cytoplasm", "Precise attachment to the host cell", "Uncoating of the nucleic acid in cytoplasm", "Release from the host cell by cell lysis", "Destruction of the cell is immediate when released"], "correct": 2, "exp": "Phages inject their nucleic acid directly through a rigid tail tube -- there's no whole-virus engulfment, so there's no separate 'uncoating' step the way animal viruses have.", "src": "assignment", "wrongExp": {"0": "This IS a real event in phage multiplication -- not the exception.", "1": "This IS a real event (adsorption) in phage multiplication -- not the exception.", "3": "This IS a real event (release) in phage multiplication -- not the exception.", "4": "This IS true of phage release -- not the exception."}}, {"id": "a6_08", "ch": 6, "type": "mc", "q": "Which of the following is NOT a primary purpose of viral cultivation?", "opts": ["To isolate and identify viruses in clinical specimens", "To observe viral morphology on a solid medium", "To research viral structure, multiplication, genetics, and effects on host cells", "To prepare viruses for vaccines"], "correct": 1, "exp": "Viruses can't be grown on an inert solid medium like agar -- they require living host cells, so 'observing morphology on a solid medium' isn't a real purpose of viral cultivation.", "src": "assignment", "wrongExp": {"0": "This IS a real purpose of viral cultivation -- not the exception.", "2": "This IS a real purpose of viral cultivation -- not the exception.", "3": "This IS a real purpose of viral cultivation -- not the exception."}}, {"id": "a6_09", "ch": 6, "type": "mc", "q": "Which viral culture method is described as a specific cell line available for viruses with a very narrow host range?", "opts": ["Cell culture", "Bird embryos", "Live animals", "Blood agar"], "correct": 0, "exp": "A specific, standing cell line can be maintained for viruses that only infect a narrow range of host cells.", "src": "assignment", "wrongExp": {"1": "Bird embryos are a self-contained unit, not specifically tied to a narrow-host-range cell line.", "2": "Live animals let you observe whole-organism effects -- not the narrow-host-range cell-line method.", "3": "Blood agar doesn't support viral cultivation at all."}}, {"id": "a6_10", "ch": 6, "type": "mc", "q": "Which viral culture method is an intact, self-contained unit with its own sterile environment and nourishment?", "opts": ["Cell culture", "Bird embryos", "Live animals", "Tissue scrapings"], "correct": 1, "exp": "An incubating bird egg is a self-supporting sterile unit, complete with its own nourishment -- ideal for cultivating certain viruses (e.g., influenza).", "src": "assignment", "wrongExp": {"0": "Cell culture uses lab-grown cell lines, not a self-contained natural unit like an egg.", "2": "Live animals aren't a 'self-contained unit' in this sense -- they're whole living organisms used for inoculation.", "3": "Tissue scrapings aren't a recognized viral culture method."}}, {"id": "a6_11", "ch": 6, "type": "mc", "q": "Which viral culture method allows viral effects on the whole organism to be observed?", "opts": ["Cell culture", "Bird embryos", "Live animal inoculation", "Blood agar"], "correct": 2, "exp": "Only a live animal host lets researchers observe systemic effects of infection across an entire living organism, not just isolated cells.", "src": "assignment", "wrongExp": {"0": "Cell culture only shows effects on isolated cells, not a whole organism.", "1": "Bird embryos show effects within the egg, not a full living organism's systemic response.", "3": "Blood agar doesn't support viral cultivation at all."}}, {"id": "a6_12", "ch": 6, "type": "tf", "q": "Most viral infections result in the death of the host.", "correct": false, "exp": "False -- most viral infections (like the common cold) are mild and non-lethal; only a subset, like rabies, HIV, and Ebola, carry very high mortality rates.", "src": "assignment", "wrongExp": "Most viral infections are mild (like the common cold) -- only a minority, like rabies, HIV, and Ebola, have high mortality rates."}, {"id": "a6_13", "ch": 6, "type": "tf", "q": "The use of antibiotics is an effective treatment for viral infections.", "correct": false, "exp": "False -- antibiotics target bacterial structures/processes (like cell walls or bacterial ribosomes) that viruses don't have, so they're useless against viral infections.", "src": "assignment", "wrongExp": "Antibiotics target bacterial-specific structures (like cell walls) that viruses simply don't have, so they're ineffective against viral infections."}, {"id": "a6_14", "ch": 6, "type": "mc", "q": "The only active biological agents lacking any nucleic acid (DNA or RNA) are:", "opts": ["Satellite viruses", "Viroids", "Virions", "Prions"], "correct": 3, "exp": "Prions are infectious proteins with no genetic material at all -- unlike viroids (naked RNA) or satellite viruses (which have nucleic acid but need a helper virus).", "src": "assignment", "wrongExp": {"0": "Satellite viruses DO have nucleic acid -- they just need a helper virus to replicate.", "1": "Viroids ARE nucleic acid (naked RNA) -- just without a protein coat.", "2": "Virions are complete virus particles, which DO contain nucleic acid."}}, {"id": "a6_15", "ch": 6, "type": "mc", "q": "The first event to occur during the release of enveloped viruses is when:", "opts": ["The inside of the host cell membrane becomes coated with capsid", "Viral spike proteins are inserted into the host cell membrane", "The inside of the host cell membrane becomes coated with viral matrix protein", "The viral capsid becomes enclosed by cell membrane"], "correct": 1, "exp": "Per the budding sequence: spike proteins insert into the host membrane FIRST, then matrix protein coats the inside of that patch, and finally the nucleocapsid extrudes through it.", "src": "assignment", "wrongExp": {"0": "The capsid doesn't coat the membrane's inside -- matrix protein does, and only after spikes are already inserted.", "2": "Matrix protein coating happens SECOND, after spike proteins are already inserted.", "3": "Capsid enclosure by membrane happens LAST, after spikes and matrix protein are already in place."}}, {"id": "a6_16", "ch": 6, "type": "mc", "q": "During budding of an enveloped virus, the viral capsid:", "opts": ["Surrounds the viral matrix protein", "Becomes completely enclosed by the region of the membrane into which the spikes and matrix protein are embedded", "Is dissolved", "Engulfs the viral spikes"], "correct": 1, "exp": "The nucleocapsid extrudes through the already-modified patch of host membrane (spikes + matrix protein), becoming wrapped in it as its new envelope.", "src": "assignment", "wrongExp": {"0": "This reverses the actual relationship -- the membrane (with matrix protein) ends up surrounding the capsid, not the other way around.", "2": "The capsid isn't dissolved -- it becomes wrapped by the modified membrane patch.", "3": "The capsid doesn't engulf the spikes -- the capsid is what gets enclosed by the spike-containing membrane."}}, {"id": "a6_17", "ch": 6, "type": "mc", "q": "Enveloped viruses are usually released from the host cell by:", "opts": ["Phagocytosis", "Endocytosis", "Budding", "Lysis of the host cell"], "correct": 2, "exp": "Enveloped viruses bud/exocytose out of the cell, allowing gradual release without necessarily destroying the host cell outright.", "src": "assignment", "wrongExp": {"0": "Phagocytosis is how certain host cells engulf particles -- not how a virus exits.", "1": "Endocytosis is a mode of viral ENTRY, not release.", "3": "Lysis is how NONENVELOPED/complex viruses are released -- enveloped viruses typically bud out instead."}}, {"id": "a6_18", "ch": 6, "type": "tf", "q": "A portion of the viral envelope comes from the cell membrane of the host cell.", "correct": true, "exp": "True -- the envelope is a piece of the host's own membrane, picked up during budding, though it's modified to carry viral spike proteins.", "src": "assignment", "wrongExp": "The envelope really is a piece of the host's own membrane, picked up as the virus buds out -- just modified to carry viral spike proteins."}, {"id": "a6_19", "ch": 6, "type": "mc", "q": "In the lytic cycle of phage replication:", "opts": ["Phage genes exist as prophage", "Phage nucleic acid is replicated and phage genes are expressed, making new phage protein and lysing the host cell", "Phage DNA remains inside the protein coat", "Phage genes integrate into the host cell genome and are not expressed"], "correct": 1, "exp": "The lytic cycle actively replicates phage nucleic acid, expresses phage genes, assembles new virions, and lyses the host -- the other options all describe the dormant lysogenic cycle instead.", "src": "assignment", "wrongExp": {"0": "Prophage existence describes the dormant LYSOGENIC cycle, not the active lytic cycle.", "2": "DNA staying inside the protein coat describes a quiescent state -- not the active lytic cycle.", "3": "Genome integration with no expression describes the LYSOGENIC cycle -- the opposite of the active lytic cycle."}}, {"id": "a6_20", "ch": 6, "type": "mc", "q": "A prophage is:", "opts": ["Phage DNA integrated into the host cell genome", "Phage protein left outside the bacterium", "Toxic to the host bacterial cell", "Phage DNA being actively expressed"], "correct": 0, "exp": "A prophage is dormant viral DNA inserted into the host chromosome -- not actively expressed, not toxic, replicated passively along with the host's own DNA.", "terms": ["lysogeny"], "src": "assignment", "wrongExp": {"1": "A prophage is DNA integrated into the chromosome, not phage protein left outside the cell.", "2": "A prophage is dormant and NOT toxic to its host while in this state.", "3": "A prophage is specifically NOT actively expressed -- it's integrated and silent until induction."}}, {"id": "a6_21", "ch": 6, "type": "mc", "q": "Which of the following can cause a phage in the lysogenic stage to revert to the lytic stage?", "opts": ["A competing phage", "Darkness", "An electrical charge", "Ultraviolet light", "Lack of nutrients"], "correct": 3, "exp": "UV light (and other DNA-damaging stressors) can trigger lysogenic induction, causing the prophage to excise and re-enter the lytic cycle.", "terms": ["lysogeny"], "src": "assignment", "wrongExp": {"0": "A competing phage isn't the trigger described for lysogenic induction.", "1": "Darkness isn't a known trigger for lysogenic induction.", "2": "An electrical charge isn't a recognized trigger for lysogenic induction.", "4": "Lack of nutrients isn't the specific trigger described -- DNA-damaging agents like UV light are."}}, {"id": "a6_22", "ch": 6, "type": "tf", "q": "In the lysogenic stage of phage replication, the host cell is lysed.", "correct": false, "exp": "False -- in the lysogenic stage, the prophage lies dormant and the host cell continues growing and dividing normally; lysis only happens if the prophage is induced into the lytic cycle.", "terms": ["lysogeny"], "src": "assignment", "wrongExp": "In the lysogenic stage the host cell is NOT harmed -- the prophage lies dormant and the cell keeps growing normally; lysis only happens after induction."}, {"id": "a6_23", "ch": 6, "type": "mc", "q": "Retroviruses have:", "opts": ["Two copies of single-stranded DNA", "Two copies of single-stranded RNA", "One copy of single-stranded RNA", "One copy of double-stranded RNA"], "correct": 1, "exp": "Retroviruses (like HIV) are diploid RNA viruses, carrying two identical copies of single-stranded RNA plus reverse transcriptase to convert that RNA into DNA.", "src": "assignment", "wrongExp": {"0": "Retroviruses carry RNA, not DNA, as their genome.", "2": "Retroviruses are diploid -- they carry TWO copies, not one.", "3": "Retroviruses' genome is single-stranded RNA, not double-stranded."}}, {"id": "a6_24", "ch": 6, "type": "tf", "q": "If a virus is present as a provirus in the host cell, it remains latent and never produces new virus.", "correct": false, "exp": "False -- a provirus typically stays dormant/latent, but it is not necessarily permanent; it can later be reactivated to direct production of new virus, making 'never' too absolute.", "src": "assignment", "wrongExp": "A provirus can be reactivated later to produce new virus -- 'never' is too absolute, since dormancy isn't necessarily permanent."}, {"id": "a6_25", "ch": 6, "type": "mc", "q": "The stage of T4 phage replication that involves protein fibers on the phage attaching to receptors on the bacterial cell wall is the:", "opts": ["Lysis stage", "Penetration stage", "Transcription stage", "Assembly stage", "Attachment stage"], "correct": 4, "exp": "This is adsorption/attachment -- the phage's tail fibers make precise contact with specific receptor sites on the bacterial surface.", "src": "assignment", "wrongExp": {"0": "Lysis is the final release step, not attachment.", "1": "Penetration (DNA injection) happens AFTER attachment, not during it.", "2": "Transcription/synthesis happens well after attachment.", "3": "Assembly happens near the end of the cycle, long after attachment."}}, {"id": "a6_26", "ch": 6, "type": "mc", "q": "The stage of T4 phage replication that involves injection of phage DNA is the:", "opts": ["Assembly stage", "Attachment stage", "Penetration stage", "Lysis stage", "Transcription stage"], "correct": 2, "exp": "Penetration is the step where phage DNA is injected through a rigid tail tube into the host, while the empty capsid stays outside.", "src": "assignment", "wrongExp": {"0": "Assembly happens later, after the genome has already been replicated.", "1": "Attachment is the step BEFORE DNA injection, not the injection itself.", "3": "Lysis is the final release step, unrelated to DNA injection.", "4": "Transcription/synthesis happens after DNA has already been injected."}}, {"id": "a6_27", "ch": 6, "type": "mc", "q": "The stage of T4 phage replication that involves copying phage DNA and synthesizing phage proteins is the:", "opts": ["Penetration stage", "Attachment stage", "Assembly stage", "Lysis stage", "Transcription stage"], "correct": 4, "exp": "This 'transcription' (synthesis) stage redirects the host's machinery to replicate phage DNA and manufacture new phage proteins, occurring after penetration and before assembly.", "src": "assignment", "wrongExp": {"0": "Penetration (DNA injection) happens BEFORE copying/synthesis, not during it.", "1": "Attachment happens first, well before DNA copying and protein synthesis.", "2": "Assembly happens AFTER DNA copying and protein synthesis are complete.", "3": "Lysis is the final release step, unrelated to copying DNA or making proteins."}}, {"id": "a6_28", "ch": 6, "type": "tf", "q": "The enzyme lysozyme is used by T4 phages to enter and exit the host cell.", "correct": true, "exp": "True -- a lysozyme-like domain in the phage's tail locally digests peptidoglycan to let DNA in at entry, and phage-encoded lysozyme (endolysin) degrades the wall from within to trigger lysis at release.", "src": "assignment", "wrongExp": "Lysozyme really does play a role at both ends -- helping the phage breach the wall at entry, and breaking the wall down for release at the end."}, {"id": "a6_29", "ch": 6, "type": "tf", "q": "During the transcription stage, the phage DNA merges with the host DNA.", "correct": false, "exp": "False -- during the lytic cycle's transcription/synthesis stage, phage DNA is replicated and expressed independently; merging with the host chromosome only happens in the lysogenic cycle, forming a prophage.", "src": "assignment", "wrongExp": "Phage DNA stays independent during the lytic cycle's synthesis stage -- merging with host DNA only happens in the separate lysogenic cycle."}, {"id": "a6_30", "ch": 6, "type": "mc", "q": "In the attachment step of phage replication:", "opts": ["Attachment is nonspecific", "Protein fibers in the phage tail attach to specific receptors on the bacterial cell wall", "Phage DNA exits the protein coat and attaches to receptors on the bacterium", "Carbohydrate receptors in the phage tail attach to specific receptors on the bacterial cell wall"], "correct": 1, "exp": "Phage attachment is highly specific -- protein tail fibers bind particular receptor molecules on the bacterial surface, which is why phages generally have a narrow host range.", "src": "assignment", "wrongExp": {"0": "Attachment is actually highly SPECIFIC, not nonspecific -- tail fibers match particular receptors.", "2": "Phage DNA isn't released at this stage -- DNA injection happens next, during penetration.", "3": "Phage tail fibers are protein, not carbohydrate."}}, {"id": "a6_31", "ch": 6, "type": "mc", "q": "In phage replication:", "opts": ["Only the phage protein enters the bacterial cell", "Multiple phage particles enter the same host bacterial cell at the same time", "The whole phage particle enters the cell and the protein outer coat is removed", "Only the phage nucleic acid enters the bacterial cell"], "correct": 3, "exp": "Unlike animal viruses, phages inject only their nucleic acid through a tail tube -- the capsid stays attached outside the cell.", "src": "assignment", "wrongExp": {"0": "It's the opposite -- only the phage's NUCLEIC ACID enters; the protein capsid stays outside.", "1": "Multiple phages CAN attach, but each one still only injects its nucleic acid.", "2": "Phages don't enter whole -- only their nucleic acid is injected, leaving the capsid attached outside."}}, {"id": "a6_32", "ch": 6, "type": "mc", "q": "What is the correct order of the stages of phage replication: Attachment, Penetration, Transcription/replication, Assembly, Release?", "opts": ["Release, Attachment, Transcription/replication, Assembly, Penetration", "Attachment, Penetration, Transcription/replication, Assembly, Release", "Attachment, Penetration, Assembly, Transcription/replication, Release", "Penetration, Attachment, Assembly, Transcription/replication, Release"], "correct": 1, "exp": "The standard lytic sequence: Attachment (adsorption) -> Penetration -> Transcription/replication (synthesis) -> Assembly -> Release.", "src": "assignment", "wrongExp": {"0": "This scrambles the order -- release can't come before attachment, penetration, and assembly.", "2": "This swaps assembly and transcription/replication -- the genome must be replicated before new particles can be assembled.", "3": "This starts with penetration before attachment -- but the phage must attach first."}}, {"id": "a6_33", "ch": 6, "type": "tf", "q": "Viral lysozyme digests the host cell wall, releasing the newly made phage and lysing the host cell in the release step.", "correct": true, "exp": "True -- phage-encoded lysozyme degrades the peptidoglycan from within, weakening the wall to the point of rupture and releasing progeny phages.", "src": "assignment", "wrongExp": "This is exactly how release works -- phage lysozyme breaks down the cell wall from within, rupturing the cell and freeing the new phages."}, {"id": "a6_34", "ch": 6, "type": "mc", "q": "Every virus particle contains:", "opts": ["Either DNA or RNA", "DNA", "Ribosomes", "DNA and RNA"], "correct": 0, "exp": "Viruses contain either DNA or RNA as their genetic material, never both, and they have no ribosomes of their own.", "src": "assignment", "wrongExp": {"1": "Too narrow -- many viruses use RNA instead of DNA.", "2": "Viruses have no ribosomes of their own -- they rely entirely on the host's.", "3": "A virus never carries both DNA and RNA at once -- just one or the other."}}, {"id": "a6_35", "ch": 6, "type": "mc", "q": "Viral capsids are composed of:", "opts": ["Nucleic acids", "Carbohydrates", "Protein", "Lipids"], "correct": 2, "exp": "The capsid is built from protein subunits (capsomeres), not nucleic acid, carbohydrate, or lipid.", "src": "assignment", "wrongExp": {"0": "Nucleic acid is what the capsid ENCLOSES, not what it's made of.", "1": "Carbohydrates aren't the capsid's building block -- protein subunits (capsomeres) are.", "3": "Lipids make up the ENVELOPE (when present), not the capsid."}}, {"id": "a6_36", "ch": 6, "type": "mc", "q": "When present, the viral envelope is composed mainly of:", "opts": ["Protein", "Nucleic acid", "Lipids", "Carbohydrates"], "correct": 2, "exp": "The envelope is derived from the host's lipid bilayer membrane, though it's studded with viral glycoprotein spikes.", "src": "assignment", "wrongExp": {"0": "Protein forms the capsid and envelope spikes -- but the envelope's bulk is lipid, from the host membrane.", "1": "Nucleic acid is enclosed inside the capsid -- not what the envelope is made of.", "3": "Carbohydrates aren't the main envelope component -- lipid is."}}, {"id": "a6_37", "ch": 6, "type": "tf", "q": "Almost immediately upon entry, the viral nucleic acid alters the genetic expression of the host cell.", "correct": true, "exp": "True -- once inside, viral nucleic acid quickly redirects the host's gene expression to begin synthesizing the building blocks for new virus particles.", "src": "assignment", "wrongExp": "This really does happen almost immediately -- viral nucleic acid quickly redirects host gene expression toward making new viral components."}, {"id": "a6_38", "ch": 6, "type": "mc", "q": "Viral spikes:", "opts": ["Attach specifically to host cell receptors", "Attach nonspecifically to host cell receptors", "Are present in all viruses", "Are made of lipids"], "correct": 0, "exp": "Spikes (glycoproteins) bind specifically to particular host receptor molecules -- this specificity determines a virus's host range. Not all viruses are enveloped, so not all have spikes.", "src": "assignment", "wrongExp": {"1": "Spikes bind SPECIFIC receptors -- that specificity determines a virus's host range.", "2": "Only enveloped viruses have spikes -- naked viruses don't have an envelope to put spikes on.", "3": "Spikes are glycoproteins, not lipids."}}, {"id": "a6_39", "ch": 6, "type": "mc", "q": "In viral entry by endocytosis:", "opts": ["The host cell's plasma membrane surrounds only the viral nucleic acid and forms a vesicle", "Viral spikes fuse with the host cell's plasma membrane to form a vesicle", "The host cell's plasma membrane surrounds only the viral protein coat and forms a vesicle", "The host cell's plasma membrane surrounds the whole virion and forms a vesicle"], "correct": 3, "exp": "In endocytosis, the entire virus particle (enveloped or naked) is engulfed into a vesicle/endosome; uncoating happens afterward, inside the cell.", "src": "assignment", "wrongExp": {"0": "In endocytosis, the WHOLE virion is engulfed, not just the nucleic acid.", "1": "Spike-membrane fusion describes direct membrane fusion entry, not endocytosis.", "2": "In endocytosis, the WHOLE virion is engulfed, not just the protein coat."}}, {"id": "a6_40", "ch": 6, "type": "tf", "q": "Both enveloped and naked viruses can enter a cell by endocytosis.", "correct": true, "exp": "True -- endocytosis is used by enveloped viruses (like herpesviruses) and naked viruses (like poliovirus) alike.", "src": "assignment", "wrongExp": "Both types really can enter this way -- enveloped viruses like herpesviruses and naked viruses like poliovirus both use endocytosis."}, {"id": "a6_41", "ch": 6, "type": "tf", "q": "A naked virus can fuse directly with the host cell membrane.", "correct": false, "exp": "False -- naked viruses lack an envelope (no lipid membrane), so they can't fuse with the host membrane; only enveloped viruses enter that way. Naked viruses rely on endocytosis instead.", "src": "assignment", "wrongExp": "A naked virus has no envelope to fuse with anything -- only enveloped viruses can enter via membrane fusion."}, {"id": "a6_42", "ch": 6, "type": "mc", "q": "What happens once a virus has entered a host cell and uncoated?", "opts": ["The virus will kill the cell", "A new envelope will surround the nucleic acid", "The synthesis of new virions will occur", "The genetic material of the virus will disintegrate"], "correct": 2, "exp": "Once uncoated, viral nucleic acid takes over the host's machinery to direct synthesis of new viral components, leading to assembly and release.", "src": "assignment", "wrongExp": {"0": "Not all infections immediately kill the cell -- some are persistent or latent instead.", "1": "A new envelope isn't immediately formed around the bare nucleic acid -- that happens much later, during release.", "3": "The genetic material doesn't disintegrate -- it takes over the cell's machinery."}}, {"id": "a6_43", "ch": 6, "type": "tf", "q": "Viruses can be grown on culture media like bacteria.", "correct": false, "exp": "False -- viruses are obligate intracellular parasites and need living host cells; they cannot grow on inert nutrient media the way bacteria can.", "src": "assignment", "wrongExp": "Viruses can't grow on any nutrient medium -- they're obligate intracellular parasites and need living host cells specifically."}, {"id": "a6_44", "ch": 6, "type": "tf", "q": "Animal viruses always kill the cells they infect.", "correct": false, "exp": "False -- not all infections are lethal; some viruses cause persistent, latent, or chronic infections, and some even transform cells rather than killing them.", "src": "assignment", "wrongExp": "Not every infection is lethal -- some viruses cause persistent, latent, or chronic infections without killing the host cell outright."}, {"id": "a6_45", "ch": 6, "type": "mc", "q": "An envelope is acquired during which step of the viral life cycle?", "opts": ["Adsorption", "Release", "Synthesis", "Penetration"], "correct": 1, "exp": "The envelope is acquired as the nucleocapsid buds through the host membrane during release -- that membrane patch becomes the envelope.", "src": "assignment", "wrongExp": {"0": "Adsorption is just the initial attachment step -- far too early for envelope acquisition.", "2": "Synthesis is about making new viral components, not acquiring an envelope.", "3": "Penetration is about viral entry -- envelope acquisition happens much later, during release."}}, {"id": "a6_46", "ch": 6, "type": "tf", "q": "All viruses leave a cell by exocytosis.", "correct": false, "exp": "False -- only enveloped viruses leave by budding/exocytosis; nonenveloped and complex viruses are released by cell lysis instead.", "src": "assignment", "wrongExp": "Only ENVELOPED viruses leave by budding/exocytosis -- nonenveloped and complex viruses are released by lysing the cell instead."}, {"id": "a6_47", "ch": 6, "type": "mc", "q": "Which step is present in bacteriophage multiplication but NOT in multiplication of an animal virus?", "opts": ["Viral genetic material is injected into the host cell", "The viral genome is replicated by the host cell", "Assembly of new viral particles occurs in the cytoplasm", "New viruses exit the cell by budding from the cell membrane", "New viral particles are released from the host cell by lysis"], "correct": 0, "exp": "Phages uniquely inject their nucleic acid through a tail tube; animal viruses instead enter whole (via fusion or endocytosis) and uncoat afterward.", "src": "assignment", "wrongExp": {"1": "Genome replication happens in BOTH phage and animal virus cycles -- not unique to phages.", "2": "Assembly happens in both groups -- not unique to phages.", "3": "Budding is actually how ENVELOPED ANIMAL viruses exit -- phages don't bud.", "4": "Lysis-based release happens in both phages and some animal viruses -- not unique to phages."}}, {"id": "a6_48", "ch": 6, "type": "fill", "q": "Fully formed, extracellular virus particles capable of establishing infection in a new host are called ________.", "exp": "A virion is a complete, extracellular, infectious virus particle -- the final product of a successful multiplication cycle.", "src": "assignment", "answers": ["virion", "virions", "a virion"]}, {"id": "a6_49", "ch": 6, "type": "mc", "q": "During replication of an enveloped animal virus, 'vesicle membrane and viral envelope fuse, releasing capsid into the host cytoplasm' describes which stage?", "opts": ["Adsorption", "Penetration", "Uncoating", "Assembly", "Release"], "correct": 2, "exp": "This fusion-and-release-of-capsid step is uncoating -- freeing the nucleocapsid into the cytoplasm so its genome can take over.", "src": "assignment", "wrongExp": {"0": "Adsorption is the initial attachment step, long before the capsid is released into the cytoplasm.", "1": "Penetration is the vesicle-engulfment step itself -- release of the capsid happens right after, during uncoating.", "3": "Assembly happens much later, after new components have been synthesized.", "4": "Release is the final budding-out step, not the freeing of the capsid into the cytoplasm."}}, {"id": "a6_50", "ch": 6, "type": "mc", "q": "During replication of an enveloped animal virus, 'viral nucleic acid encased in capsid, viral proteins inserted into the host cell membrane' describes which stage?", "opts": ["Adsorption", "Penetration", "Synthesis", "Assembly", "Release"], "correct": 3, "exp": "This packaging of nucleic acid into capsid alongside membrane-embedded viral proteins is the assembly stage, immediately preceding release.", "src": "assignment", "wrongExp": {"0": "Adsorption is just the initial attachment step, long before packaging occurs.", "1": "Penetration is about entry into the cell, not packaging new particles.", "2": "Synthesis is about making the components -- packaging them happens afterward, during assembly.", "4": "Release is the final budding-out step, which happens AFTER assembly is complete."}}, {"id": "a9_01", "ch": 9, "type": "mc", "q": "In eukaryotic cells, which cellular structure is composed of a neatly packaged DNA molecule?", "opts": ["Gene", "Genome", "Genotype", "Chromosome", "Histone"], "correct": 3, "exp": "A chromosome is a discrete structure of neatly packaged DNA; a gene is a sub-unit within it, the genome is the sum total of all DNA, and genotype is the overall genetic makeup (a concept, not a structure).", "src": "assignment", "wrongExp": {"0": "A gene is a sub-unit WITHIN a chromosome, not the whole packaged structure.", "1": "The genome is the sum of ALL genetic material -- a broader concept, not one discrete structure.", "2": "Genotype is an organism's overall genetic makeup -- a concept, not a physical structure.", "4": "A histone is a protein DNA wraps around -- part of packaging, but not the DNA structure itself."}}, {"id": "a9_02", "ch": 9, "type": "mc", "q": "Which of the following is NOT part of a DNA nucleotide?", "opts": ["Deoxyribose sugar", "Phosphate group", "Nitrogenous base", "Ribose sugar"], "correct": 3, "exp": "A DNA nucleotide = phosphate + deoxyribose sugar + nitrogenous base. Ribose sugar belongs to RNA, not DNA -- that's the 'deoxy' distinction.", "src": "assignment", "wrongExp": {"0": "Deoxyribose IS part of a DNA nucleotide -- not the exception.", "1": "The phosphate group IS part of a DNA nucleotide -- not the exception.", "2": "The nitrogenous base IS part of a DNA nucleotide -- not the exception."}}, {"id": "a9_03", "ch": 9, "type": "tf", "q": "The base pairs in DNA are held together by ionic bonds.", "correct": false, "exp": "False -- base pairs are held by hydrogen bonds (2 between A-T, 3 between G-C); the sugar-phosphate backbone itself uses covalent bonds.", "src": "assignment", "wrongExp": "Hydrogen bonds -- not ionic bonds -- hold DNA base pairs together; covalent bonds hold the backbone."}, {"id": "a9_04", "ch": 9, "type": "mc", "q": "Which of the following is NOT a nitrogen base found in DNA?", "opts": ["Adenine", "Cytosine", "Guanine", "Thymine", "Uracil"], "correct": 4, "exp": "Uracil is found in RNA, not DNA -- in DNA, thymine fills that role as adenine's complementary partner.", "src": "assignment", "wrongExp": {"0": "Adenine IS one of DNA's four bases -- not the exception.", "1": "Cytosine IS one of DNA's four bases -- not the exception.", "2": "Guanine IS one of DNA's four bases -- not the exception.", "3": "Thymine IS one of DNA's four bases -- not the exception."}}, {"id": "a9_05", "ch": 9, "type": "tf", "q": "Codons are found on tRNA, and anticodons are found on mRNA.", "correct": false, "exp": "False -- this is reversed. Codons are on mRNA; anticodons (which pair with codons) are on tRNA.", "src": "assignment", "wrongExp": "This is reversed -- codons are on mRNA, and anticodons (which pair with them) are on tRNA."}, {"id": "a9_06", "ch": 9, "type": "mc", "q": "Which of the following is NOT directly needed for translation to occur?", "opts": ["mRNA", "tRNA", "rRNA", "DNA", "Amino acids"], "correct": 3, "exp": "Translation needs mRNA (the message), tRNA (brings amino acids), rRNA (forms the ribosome), and amino acids themselves -- DNA already did its job earlier, during transcription.", "src": "assignment", "wrongExp": {"0": "mRNA IS directly needed (it carries the message) -- not the exception.", "1": "tRNA IS directly needed (it brings the amino acids) -- not the exception.", "2": "rRNA IS directly needed (it forms the ribosome) -- not the exception.", "4": "Amino acids ARE directly needed (they're the building blocks) -- not the exception."}}, {"id": "a9_07", "ch": 9, "type": "mc", "q": "Compared to eukaryotic mRNA, bacterial (prokaryotic) mRNA is typically:", "opts": ["Monocistronic (codes for one protein)", "Polycistronic (codes for several proteins in series)", "Spliced to remove introns before translation", "Transcribed inside a nucleus"], "correct": 1, "exp": "Bacterial mRNAs are often polycistronic, carrying information from several genes in series; eukaryotic mRNA is monocistronic (one protein per transcript).", "src": "assignment", "wrongExp": {"0": "Monocistronic is actually the EUKARYOTIC pattern -- bacterial mRNA is typically polycistronic instead.", "2": "Intron splicing is a eukaryotic feature -- bacterial genes generally lack introns.", "3": "Bacteria have no nucleus -- transcription happens directly in the cytoplasm."}}, {"id": "a9_08", "ch": 9, "type": "tf", "q": "Prokaryotic mRNA must be processed by excising introns before translation takes place.", "correct": false, "exp": "False -- intron excision (splicing) is a eukaryotic feature; prokaryotic genes generally lack introns, so no splicing step is needed.", "src": "assignment", "wrongExp": "Intron splicing is a eukaryotic feature -- prokaryotic genes generally lack introns, so no splicing step is needed."}, {"id": "a9_09", "ch": 9, "type": "fill", "q": "A stretch of bacterial DNA containing one or more structural genes plus a regulatory operator is called a(n) ________.", "exp": "An operon bundles structural genes with a shared operator/regulatory region. A transposon is a mobile DNA element, a promoter is just the RNA-polymerase binding site, and a repressor is a protein, not a DNA segment.", "src": "assignment", "answers": ["operon", "an operon"]}, {"id": "a9_10", "ch": 9, "type": "mc", "q": "A random change in DNA arising from errors in replication, with no known cause, is called a:", "opts": ["Spontaneous mutation", "Induced mutation", "Substitution mutation", "Frameshift mutation"], "correct": 0, "exp": "Spontaneous mutations arise from natural replication errors with no identifiable external cause.", "src": "assignment", "wrongExp": {"1": "Induced mutations come from a KNOWN mutagen -- this one has 'no known cause.'", "2": "Substitution describes WHAT changes, not the cause (random vs. triggered).", "3": "Frameshift describes WHAT changes, not the cause."}}, {"id": "a9_11", "ch": 9, "type": "mc", "q": "A mutation resulting from exposure to a physical or chemical mutagen is a(n):", "opts": ["Spontaneous mutation", "Induced mutation", "Substitution mutation", "Frameshift mutation"], "correct": 1, "exp": "Induced mutations are caused by known mutagens -- physical (like UV/radiation) or chemical agents that damage DNA.", "src": "assignment", "wrongExp": {"0": "Spontaneous mutations have NO known cause -- this one is specifically caused by a mutagen.", "2": "Substitution describes the TYPE of change, not that it was caused by a mutagen.", "3": "Frameshift describes the TYPE of change, not that it was caused by a mutagen."}}, {"id": "a9_12", "ch": 9, "type": "mc", "q": "Changing a single base in the DNA code, which may place a different amino acid into the protein, is called a:", "opts": ["Spontaneous mutation", "Induced mutation", "Substitution mutation", "Frameshift mutation"], "correct": 2, "exp": "A substitution mutation swaps one base for another -- this can cause a missense (different amino acid), nonsense (stop codon), or silent (no change) effect.", "src": "assignment", "wrongExp": {"0": "Spontaneous describes the CAUSE (unknown), not this specific type of change.", "1": "Induced describes the CAUSE (a mutagen), not this specific type of change.", "3": "Frameshift involves ADDING or REMOVING bases, not just changing one base in place."}}, {"id": "a9_13", "ch": 9, "type": "mc", "q": "Addition or deletion of bases that changes the reading of mRNA codons downstream is called a:", "opts": ["Spontaneous mutation", "Induced mutation", "Substitution mutation", "Frameshift mutation"], "correct": 3, "exp": "Frameshift mutations insert or delete bases, shifting the reading frame and scrambling every codon that follows.", "src": "assignment", "wrongExp": {"0": "Spontaneous describes the CAUSE, not this specific type of change.", "1": "Induced describes the CAUSE, not this specific type of change.", "2": "Substitution swaps one base for another -- it doesn't add or remove bases, so no frameshift."}}, {"id": "a9_14", "ch": 9, "type": "mc", "q": "When one bacterium donates DNA to another bacterium, producing a recombinant strain, this is known as:", "opts": ["Transposition", "Sexual reproduction", "Horizontal gene transfer", "Vertical gene transfer"], "correct": 2, "exp": "DNA moving between two existing bacteria (rather than parent-to-offspring) is horizontal gene transfer -- via conjugation, transformation, or transduction.", "src": "assignment", "wrongExp": {"0": "Transposition is a gene JUMPING within a genome -- not DNA moving between two separate bacteria.", "1": "Bacteria don't reproduce sexually -- this describes gamete fusion in eukaryotes.", "3": "Vertical gene transfer is parent-to-offspring transmission, not transfer between two existing cells."}}, {"id": "a9_15", "ch": 9, "type": "mc", "q": "The acceptance by a bacterial cell of small, free DNA fragments from the surrounding environment is termed:", "opts": ["Transposition", "Conjugation", "Transduction", "Transformation"], "correct": 3, "exp": "Transformation is a competent cell taking up loose DNA fragments released into its environment -- no direct cell contact or viral vector needed.", "src": "assignment", "wrongExp": {"0": "Transposition is a gene moving WITHIN a genome -- not DNA taken up from outside the cell.", "1": "Conjugation requires direct cell-to-cell contact -- not free DNA from the environment.", "2": "Transduction uses a bacteriophage as the vector -- not direct uptake of free DNA."}}, {"id": "a9_16", "ch": 9, "type": "tf", "q": "All viruses require the use of host cell ribosomes and host cell tRNA to translate viral mRNA into viral proteins.", "correct": true, "exp": "True -- viruses lack their own protein-synthesis machinery entirely, so every virus type depends on hijacking the host's ribosomes and tRNAs to make viral proteins.", "src": "assignment", "wrongExp": "Viruses have no ribosomes or tRNA of their own at all -- every virus type must borrow the host's to make its proteins."}, {"id": "a9_17", "ch": 9, "type": "mc", "q": "Which of the following best describes transcription?", "opts": ["DNA -> DNA", "DNA -> RNA", "DNA -> protein", "RNA -> DNA", "RNA -> protein"], "correct": 1, "exp": "Transcription synthesizes RNA (mRNA) using a DNA template -- DNA to RNA.", "src": "assignment", "wrongExp": {"0": "DNA to DNA describes replication, not transcription.", "2": "DNA to protein skips a step -- that would require transcription AND translation combined.", "3": "RNA to DNA describes reverse transcription, used only by retroviruses.", "4": "RNA to protein describes translation, which comes AFTER transcription."}}, {"id": "a9_18", "ch": 9, "type": "tf", "q": "A structural gene encodes the information for a specific protein.", "correct": true, "exp": "True -- struct
