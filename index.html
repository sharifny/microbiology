ect": 4, "wrongExp": {"0": "Assembly happens in both phage and animal virus cycles -- not unique to phages.", "1": "Both phages and animal viruses adsorb to their host cells -- not unique to phages.", "2": "Both groups redirect the host to synthesize viral components -- not unique to phages.", "3": "Both groups replicate their nucleic acid -- not unique to phages."}}, {"id": "lm50", "ch": 6, "type": "mc", "q": "Which of these structures are used by bacteriophages to attach to the host cell wall?", "exp": "Tail fibers make the precise contact with specific receptors on the bacterial surface that lets a phage attach.", "src": "lastminute", "opts": ["Nucleic acid", "Sheath", "Tail fibers", "Capsid head"], "correct": 2, "wrongExp": {"0": "Nucleic acid is what gets injected into the cell -- it plays no role in attachment.", "1": "The sheath contracts to drive the tail tube through the wall during penetration -- attachment is the tail fibers' job.", "3": "The capsid head holds the phage's nucleic acid -- it doesn't attach to the host cell."}}, {"id": "lm09", "ch": 9, "type": "mc", "q": "The RNA molecules that carry amino acids to the ribosomes during protein synthesis are called:", "exp": "tRNA's defined function is carrying amino acids to the ribosome during translation.", "src": "lastminute", "opts": ["Ribozymes", "Primer RNA", "Messenger RNA", "Ribosomal RNA", "Transfer RNA"], "correct": 4, "wrongExp": {"0": "Ribozymes are catalytic RNA molecules -- they don't carry amino acids.", "1": "Primer RNA starts off DNA replication -- unrelated to carrying amino acids.", "2": "Messenger RNA carries the genetic code to the ribosome -- it doesn't carry amino acids itself.", "3": "Ribosomal RNA forms the ribosome's own structure -- it doesn't ferry amino acids to it."}}, {"id": "lm60", "ch": 6, "type": "mc", "q": "Which of the following parts of a virus is/are not always present?", "exp": "Every virus has a protein capsid (made of capsomeres) around its nucleic acid -- but only SOME viruses (enveloped ones) also have an envelope.", "src": "lastminute", "opts": ["Capsomeres", "Nucleic acid", "None of these choices are correct", "Capsid", "Envelope"], "correct": 4, "wrongExp": {"0": "Capsomeres (the capsid's subunits) are present in every virus -- universal.", "1": "Every virus has nucleic acid (DNA or RNA) -- universal.", "2": "Something IS sometimes missing -- the envelope.", "3": "Every virus has a protein capsid -- universal."}}, {"id": "lm49", "ch": 6, "type": "mc", "q": "Which of the following is correct about viruses?", "exp": "Nearly all viruses (20-400 nm) are far too small to see with a light microscope -- they weren't directly seen until the electron microscope.", "src": "lastminute", "opts": ["Viruses are eukaryotic", "Viruses contain 70S ribosomes", "Viruses undergo binary fission", "Most viruses cannot be seen with a light microscope", "Viruses are prokaryotic"], "correct": 3, "wrongExp": {"0": "Viruses aren't cells at all -- they fall outside all three domains of life.", "1": "Viruses have no ribosomes of their own -- they hijack the host's entirely.", "2": "Viruses don't reproduce by binary fission -- they're assembled piece by piece inside a host cell.", "4": "Viruses aren't cells at all -- they fall outside all three domains of life."}}, {"id": "lm17", "ch": 9, "type": "mc", "q": "Synthesis of an inducible enzyme requires:", "exp": "The inducer (substrate) binds the repressor, causing a shape change that frees the operator -- letting RNA polymerase transcribe the structural genes.", "src": "lastminute", "opts": ["Corepressor and repressor bound to operator", "Repressor alone bound to operator", "Substrate bound to promoter", "Substrate bound to repressor"], "correct": 3, "wrongExp": {"0": "That describes a REPRESSIBLE operon being shut OFF -- the opposite mechanism.", "1": "Repressor alone on the operator blocks RNA polymerase -- that's the OFF state, not what triggers synthesis.", "2": "The substrate (inducer) binds the repressor PROTEIN, not the promoter directly."}}, {"id": "lm68", "ch": 6, "type": "fill", "q": "Viruses that specifically infect bacteria are called ________.", "exp": "The chapter introduces this term directly: a virus that infects bacteria is a bacteriophage (often shortened to 'phage').", "src": "lastminute", "answers": ["bacteriophage", "bacteriophages", "phage", "phages", "a bacteriophage", "a phage"]}, {"id": "lm13", "ch": 9, "type": "mc", "q": "If a codon for alanine is GCA, what is the anticodon?", "exp": "Pairing G-C, C-G, A-U gives CGU. (Grounded directly in the textbook's own worked example: DNA Triplet 3 = GCA/CGT pairs with mRNA Codon 3 = CGU.)", "src": "lastminute", "opts": ["ACG", "GCA", "UGC", "CGU", "CGT"], "correct": 3, "wrongExp": {"0": "Not the correctly base-paired, correctly-ordered complementary sequence.", "1": "This just repeats the original sequence -- it isn't complementary to anything.", "2": "Not the correctly-ordered complementary sequence for GCA.", "4": "This uses T (thymine), but an anticodon is on tRNA, which is RNA and uses U (uracil) instead."}}, {"id": "lm06", "ch": 9, "type": "mc", "q": "Which bonds hold base pairs in DNA together?", "exp": "Hydrogen bonds hold complementary base pairs together -- weak enough to unzip for replication/transcription, unlike the strong covalent backbone.", "src": "lastminute", "opts": ["Peptide", "Polar covalent", "Sulfhydryl", "Hydrogen", "Nonpolar covalent"], "correct": 3, "wrongExp": {"0": "Peptide bonds link amino acids in proteins, not DNA bases.", "1": "Covalent bonds hold the sugar-phosphate BACKBONE together, not the base pairs between strands.", "2": "Sulfhydryl is a functional group, not a bond type relevant to base pairing.", "4": "Covalent bonds hold the backbone together -- base pairs use weaker hydrogen bonds so strands can be unzipped."}}, {"id": "lm27", "ch": 9, "type": "mc", "q": "Which of the following is not a type of bacterial DNA recombination?", "exp": "The three recognized types are conjugation, transformation, and transduction. Induction refers to activating a prophage or an inducible operon -- not a DNA-transfer mechanism.", "src": "lastminute", "opts": ["Conjugation", "Transduction", "Induction", "Transformation"], "correct": 2, "wrongExp": {"0": "Conjugation (direct contact via pilus) IS a recognized recombination mechanism.", "1": "Transduction (via a phage vector) IS a recognized recombination mechanism.", "3": "Transformation (uptake of free DNA) IS a recognized recombination mechanism."}}, {"id": "lm40", "ch": 9, "type": "mc", "q": "Which of the following require physical contact between two bacterial cells for DNA transfer?", "exp": "Conjugation alone requires a direct sex-pilus connection; transformation uses free DNA from solution and transduction uses a phage vector -- neither needs cell contact.", "src": "lastminute", "opts": ["Transformation and conjugation", "Transduction", "Transformation", "Conjugation", "Transduction and conjugation"], "correct": 3, "wrongExp": {"0": "Transformation doesn't need contact -- it's uptake of free DNA. Only conjugation requires direct contact.", "1": "Transduction uses a bacteriophage as the DNA vector -- no direct cell-to-cell contact needed.", "2": "Transformation is uptake of free DNA from the environment -- no cell contact involved.", "4": "Transduction doesn't need contact (it uses a phage vector) -- only conjugation does."}}, {"id": "lm67", "ch": 6, "type": "tf", "q": "The International Committee on Taxonomy of Viruses has determined that there are only three orders of viruses.", "exp": "There are far more than three recognized virus families/orders -- the textbook alone lists numerous distinct virus families (Reoviridae, Orthomyxoviridae, Paramyxoviridae, Rhabdoviridae, Retroviridae, and more).", "src": "lastminute", "correct": false, "wrongExp": "This is a memorization trap -- there are far more than three virus orders/families recognized; the textbook alone names many distinct families."}, {"id": "lm65", "ch": 6, "type": "tf", "q": "Prophages can be activated into viral replication and enter the lytic cycle.", "exp": "This is exactly what induction means -- a dormant prophage can be activated (e.g., by UV light) to excise itself and resume active replication through the lytic cycle.", "src": "lastminute", "correct": true, "wrongExp": "This is literally what 'induction' means -- a dormant prophage CAN be triggered back into the active lytic cycle.", "terms": ["lysogeny"]}, {"id": "lm26", "ch": 9, "type": "mc", "q": "What type of mutation alters the base, but not the amino acid being coded for?", "exp": "Silent mutations change a base but not the amino acid, thanks to codon degeneracy (e.g., ACU/ACC/ACG/ACA all code for threonine).", "src": "lastminute", "opts": ["Nonsense", "Point", "Missense", "Back", "Silent"], "correct": 4, "wrongExp": {"0": "Nonsense mutations create a stop codon -- they definitely change what's being coded.", "1": "Point mutation is the broad category this falls under -- not specific enough.", "2": "Missense mutations DO change the amino acid -- the opposite of what's described.", "3": "A back-mutation reverses a prior mutation -- unrelated to codon degeneracy."}}, {"id": "lm28", "ch": 9, "type": "mc", "q": "The transfer of DNA fragments from a dead cell to a live, competent recipient cell that results in a changed recipient cell is:", "exp": "Transformation is uptake of free DNA (released from a dead/lysed donor) by a competent recipient cell.", "src": "lastminute", "opts": ["Mitosis", "Transduction", "Transmission", "Conjugation", "Transformation"], "correct": 4, "wrongExp": {"0": "Mitosis is eukaryotic cell division -- unrelated to bacterial gene transfer.", "1": "Transduction uses a bacteriophage as the DNA vector, not free DNA from a dead cell.", "2": "'Transmission' isn't a recognized bacterial recombination mechanism.", "3": "Conjugation requires direct cell-to-cell contact via a pilus -- not free DNA from a dead cell."}}, {"id": "lm54", "ch": 6, "type": "mc", "q": "Which of the following will not support viral cultivation?", "exp": "Blood agar is a nutrient medium for growing bacteria -- viruses are obligate intracellular parasites and cannot grow on any agar; they need living host cells.", "src": "lastminute", "opts": ["Continuous cell cultures", "Embryonated bird eggs", "Primary cell cultures", "Blood agar cultures", "Live lab animals"], "correct": 3, "wrongExp": {"0": "Continuous cell lines ARE a legitimate way to culture viruses -- not the exception.", "1": "Embryonated eggs ARE a legitimate way to culture viruses -- not the exception.", "2": "Primary cell cultures ARE a legitimate way to culture viruses -- not the exception.", "4": "Live animal inoculation IS a legitimate way to culture viruses -- not the exception."}}, {"id": "lm53", "ch": 6, "type": "mc", "q": "Viruses acquire envelopes around their nucleocapsids during:", "exp": "Spike/matrix proteins get inserted into the host membrane during assembly, but the nucleocapsid actually picks up its finished envelope when it buds THROUGH that membrane during release.", "src": "lastminute", "opts": ["Penetration", "Adsorption", "Replication", "Assembly", "Release"], "correct": 4, "wrongExp": {"0": "Penetration is about viral entry, long before any new particles exist to envelope.", "1": "Adsorption is the very first attachment step -- far too early for envelope acquisition.", "2": "Replication is about copying the genome, not packaging the finished particle.", "3": "Spike/matrix proteins are inserted into the membrane during assembly, but the envelope itself is acquired when the nucleocapsid buds through that membrane -- which happens during release."}}, {"id": "lm20", "ch": 9, "type": "mc", "q": "A mutation that changes a normal codon to a stop codon is called a:", "exp": "A nonsense mutation specifically changes a codon into a stop codon, causing premature termination of protein synthesis.", "src": "lastminute", "opts": ["Silent mutation", "Point mutation", "Back mutation", "Missense mutation", "Nonsense mutation"], "correct": 4, "wrongExp": {"0": "A silent mutation changes a base but NOT the amino acid at all -- the opposite of creating a stop.", "1": "Point mutation is the broad category (single-base changes in general) -- not specific to a stop-codon change.", "2": "A back-mutation reverses an earlier mutation -- unrelated to creating a stop codon.", "3": "A missense mutation changes a codon to a DIFFERENT amino acid, not a stop signal."}}, {"id": "lm42", "ch": 6, "type": "mc", "q": "Classification of viruses into families involves determining all the following characteristics except:", "exp": "Family placement uses capsid type, nucleic acid strand number/type, envelope presence, size, and site of multiplication -- not biochemical reactions (viruses have no metabolism of their own).", "src": "lastminute", "opts": ["Type of capsid", "Nucleic acid strand number", "Presence of an envelope", "Type of nucleic acid", "Biochemical reactions"], "correct": 4, "wrongExp": {"0": "This IS one of the real classification criteria -- not the exception.", "1": "This IS one of the real classification criteria -- not the exception.", "2": "This IS one of the real classification criteria -- not the exception.", "3": "This IS one of the real classification criteria -- not the exception."}}, {"id": "lm21", "ch": 9, "type": "mc", "q": "The repressor protein of a repressible operon can only bind to the operator after it interacts with:", "exp": "In a repressible operon (like arg or trp), the end-product acts as a corepressor, binding the repressor and activating it to bind the operator and shut transcription off.", "src": "lastminute", "opts": ["A coenzyme", "The reactant", "A cofactor", "The substrate", "The product"], "correct": 4, "wrongExp": {"0": "A coenzyme is an organic cofactor for an enzyme reaction -- unrelated to repressor activation here.", "1": "'Reactant' isn't the term used -- the pathway's end PRODUCT is what activates the repressor.", "2": "Cofactors assist enzymes -- this isn't how a repressible operon's repressor gets activated.", "3": "Substrate binding the repressor is how an INDUCIBLE operon (like lac) turns ON -- a repressible operon works the opposite way."}}, {"id": "lm11", "ch": 9, "type": "mc", "q": "All of the following pertain to transcription except:", "exp": "Transcription uses RNA polymerase, a promoter, and a DNA template, and happens before translation -- but it occurs in the nucleus, not on a ribosome in the cytoplasm (that's translation).", "src": "lastminute", "opts": ["Requires a promoter", "Requires RNA polymerase", "Occurs on a ribosome in the cytoplasm", "Requires a template DNA strand", "Occurs before translation"], "correct": 2, "wrongExp": {"0": "This IS true of transcription -- so it's not the exception.", "1": "This IS true of transcription -- so it's not the exception.", "3": "This IS true of transcription -- so it's not the exception.", "4": "This IS true -- transcription always happens before translation -- so it's not the exception."}}, {"id": "lm70", "ch": 6, "type": "mc", "q": "Viruses cannot multiply unless it invades a host cell; therefore, they are considered:", "exp": "'Obligate' means the virus has no alternative but to live this way -- it absolutely requires a host cell for all metabolic/replicative needs.", "src": "lastminute", "opts": ["Automatic intracellular parasites", "Non-intracellular parasites", "True intracellular parasites", "Obligate intracellular parasites"], "correct": 3, "wrongExp": {"0": "'Automatic intracellular parasite' isn't the standard term used here.", "1": "This is backwards -- viruses absolutely require a host cell's interior.", "2": "'True intracellular parasite' isn't the specific standard term -- 'obligate' is the precise word."}}, {"id": "lm59", "ch": 6, "type": "mc", "q": "Viruses that consist of only a nucleocapsid are considered:", "exp": "A virus with just a nucleocapsid (no extra envelope) is called a naked virus.", "src": "lastminute", "opts": ["Complex viruses", "Incomplete viruses", "Viroids", "Naked viruses", "Simple viruses"], "correct": 3, "wrongExp": {"0": "Complex viruses (poxviruses, phages) have MORE structure than a simple nucleocapsid.", "1": "'Incomplete virus' isn't the term -- a nucleocapsid-only virus is fully complete, just envelope-free.", "2": "Viroids are a totally different infectious agent -- naked RNA with no capsid at all.", "4": "'Simple virus' isn't the specific term -- 'naked' is standard for an envelope-free virus."}}, {"id": "lm32", "ch": 9, "type": "mc", "q": "Which base will pair with uracil in RNA?", "exp": "Uracil takes thymine's place in RNA and still pairs with adenine, just as thymine does in DNA.", "src": "lastminute", "opts": ["Cytosine", "Thymine", "Guanine", "Adenine"], "correct": 3, "wrongExp": {"0": "Cytosine pairs with guanine, not uracil.", "1": "Thymine doesn't appear in RNA at all -- uracil takes its place.", "2": "Guanine pairs with cytosine, not uracil."}}, {"id": "lm14", "ch": 9, "type": "mc", "q": "The following pertain to ribosomes during protein synthesis except:", "exp": "Codons are a feature of mRNA, not rRNA -- rRNA just forms the ribosome's structural/catalytic body. The other four statements are all true of ribosomes.", "src": "lastminute", "opts": ["They use their large subunit to supply enzymes for peptide bonding", "They contain codons within their rRNA molecules", "They participate only in translation", "They bind to the 5' end of mRNA by their small subunit", "They shift toward the 3' end of the mRNA strand from one codon to the next"], "correct": 1, "wrongExp": {"0": "This IS true -- the large subunit's ribozyme catalyzes peptide bonds -- so it's not the exception.", "2": "This IS true -- ribosomes function only in translation, not transcription -- so it's not the exception.", "3": "This IS true -- the small subunit does bind mRNA's 5' end -- so it's not the exception.", "4": "This IS true -- translocation moves the ribosome toward the 3' end -- so it's not the exception."}}, {"id": "lm69", "ch": 6, "type": "mc", "q": "Which of the following viral types enter animal cells via fusion with the animal cell membrane?", "exp": "Membrane fusion entry requires an envelope to fuse with the host membrane -- so it only happens in enveloped viruses.", "src": "lastminute", "opts": ["All of these choices are correct", "Naked viruses", "Enveloped viruses", "Nonenveloped viruses"], "correct": 2, "wrongExp": {"0": "Not all viruses can fuse -- only enveloped ones have a membrane to fuse with the host's.", "1": "Naked viruses have no envelope to fuse with anything -- they enter only by endocytosis.", "3": "Nonenveloped is just another term for naked -- no envelope means no membrane fusion."}}, {"id": "lm57", "ch": 6, "type": "mc", "q": "Noncellular infectious protein particles are called:", "exp": "Prions are the only biologically active agent that lacks any nucleic acid at all -- purely infectious protein.", "src": "lastminute", "opts": ["Viroids", "Spikes", "Oncogenic viruses", "Phages", "Prions"], "correct": 4, "wrongExp": {"0": "Viroids are noncellular too, but they're infectious RNA, not protein.", "1": "Spikes are just a structural feature on viral envelopes -- not infectious particles themselves.", "2": "Oncogenic viruses are cancer-causing viruses -- still viruses with nucleic acid, not pure protein.", "3": "Phages are viruses that infect bacteria -- they have nucleic acid, unlike prions."}}, {"id": "lm30", "ch": 9, "type": "mc", "q": "Genes that jump from one location to another in the genome are:", "exp": "Transposons are mobile genetic elements that can shift between chromosomal locations, plasmids, or bacteriophages.", "src": "lastminute", "opts": ["Operons", "Plasmids", "Repressors", "Transformers", "Transposons"], "correct": 4, "wrongExp": {"0": "Operons are stretches of DNA with structural genes + a regulatory region -- they don't relocate.", "1": "Plasmids are separate DNA elements transposons can move BETWEEN -- but plasmids themselves aren't the 'jumping' element.", "2": "Repressors are regulatory proteins, not mobile DNA segments.", "3": "'Transformers' isn't a genetics term used for this concept."}}, {"id": "lm56", "ch": 6, "type": "mc", "q": "Host range is limited by the:", "exp": "A virus can only invade a host cell if it exactly fits a specific host receptor molecule -- cells lacking compatible receptors resist adsorption entirely.", "src": "lastminute", "opts": ["Size of the host cell", "Type of nucleic acid in the virus", "Age of the host cell", "Type of host cell receptors on cell membrane", "All of these choices are correct"], "correct": 3, "wrongExp": {"0": "Host range isn't determined by cell size -- it's about receptor compatibility.", "1": "The virus's own nucleic acid type doesn't determine which host receptors it can bind.", "2": "Host cell age isn't the limiting factor -- receptor compatibility is.", "4": "Only receptor compatibility is identified as the limiting factor -- not these other options."}}, {"id": "lm01", "ch": 9, "type": "mc", "q": "Eukaryotic chromosomes differ from bacterial chromosomes because only eukaryotes have:", "exp": "Eukaryotic chromosomes differ from bacterial ones in multiple ways at once: wound around histone proteins, located in a nucleus, several to many per cell, and linear rather than circular -- since all four are individually true, 'all of the choices' is correct.", "src": "lastminute", "opts": ["Chromosomes located within a nucleus", "Several to many chromosomes", "All of the choices are correct", "Histone proteins", "Elongated, linear (not circular) chromosomes"], "correct": 2, "wrongExp": {"0": "True of eukaryotes, but not the only correct statement -- several differences hold at once.", "1": "True of eukaryotes, but not the only correct statement -- several differences hold at once.", "3": "True of eukaryotes, but not the only correct statement -- several differences hold at once.", "4": "True of eukaryotes, but not the only correct statement -- several differences hold at once."}}, {"id": "lm12", "ch": 9, "type": "mc", "q": "What molecule is synthesized as a copy from the DNA template strand of a structural gene?", "exp": "mRNA is defined as a transcribed version of a structural gene, synthesized by copying the DNA template strand.", "src": "lastminute", "opts": ["Ribozymes", "Transfer RNA", "Ribosomal RNA", "Primer RNA", "Messenger RNA"], "correct": 4, "wrongExp": {"0": "Ribozymes are catalytic RNA -- not the direct transcript of a structural gene.", "1": "tRNA carries amino acids -- it's not the direct copy of a structural gene's sequence.", "2": "rRNA forms the ribosome's structure -- not what's meant by a 'copy of a structural gene.'", "3": "Primer RNA initiates DNA replication -- unrelated to transcribing a structural gene."}}, {"id": "lm48", "ch": 6, "type": "mc", "q": "Helical and icosahedral are terms used to describe the shapes of a virus:", "exp": "The shape and arrangement of capsomeres produces one of two capsid types: helical or icosahedral.", "src": "lastminute", "opts": ["Envelope", "Spike", "Core", "Capsomere", "Capsid"], "correct": 4, "wrongExp": {"0": "The envelope is an external lipid covering -- its shape isn't described this way.", "1": "Spikes are projections on the envelope, not a shape category themselves.", "2": "The core is the inner nucleic-acid region -- helical/icosahedral describe the protein shell around it.", "3": "Capsomeres are the individual subunits -- their arrangement produces the capsid's overall shape, but the terms describe the whole capsid."}}, {"id": "lm55", "ch": 6, "type": "fill", "q": "In general, most DNA viruses multiply in the host cell's ________, while most RNA viruses multiply in the host cell's ________. (Type both, separated by a comma -- e.g. \"nucleus, cytoplasm\")", "exp": "DNA viruses (except poxviruses) replicate and assemble in the host nucleus function computeStats(){
  var ids = Object.keys(progress);
  var totalAnswered=0, totalCorrect=0;
  var byCh = {}; CHAPTERS.forEach(function(c){ byCh[c]={a:0,c:0,qTotal:0}; });
  QUESTIONS.forEach(function(q){ if(byCh[q.ch]) byCh[q.ch].qTotal++; });
  var flagged = [];
  ids.forEach(function(id){
    var rec = progress[id]; if(!rec) return;
    var answered = (rec.correctCount||0)+(rec.wrongCount||0);
    totalAnswered += answered; totalCorrect += (rec.correctCount||0);
    var q = QUESTIONS.find(function(x){return x.id===id;});
    if(q && byCh[q.ch]){ byCh[q.ch].a += answered; byCh[q.ch].c += (rec.correctCount||0); }
    if(rec.flag) flagged.push(id);
  });
  return {
    totalAnswered:totalAnswered, totalCorrect:totalCorrect,
    accuracy: totalAnswered? Math.round(100*totalCorrect/totalAnswered):0,
    byChapter: byCh, flaggedIds: flagged, flaggedCount: flagged.length,
    totalQuestions: QUESTIONS.length, updatedAt: Date.now()
  };
}
function heatColor(acc, answered){
  if(answered===0) return "var(--border)";
  if(acc>=85) return "var(--good)";
  if(acc>=65) return "#84cc16";
  if(acc>=45) return "var(--warn)";
  return "var(--bad)";
}
function classifyAttempt(rec, correct, confidence){
  if(correct) return confidence==="high" ? "solid" : "fragile";
  if(confidence==="high") return "overconfident";
  if((rec.wrongCount||0) >= 1){
    return (rec.correctCount||0) > 0 ? "slipped" : "recurring";
  }
  return "new_gap";
}
var DIAG_LABEL = {
  solid:"Solid -- confident and correct.",
  fragile:"Fragile -- right, but you weren't sure. Worth a second look.",
  overconfident:"Overconfident -- you were sure, but it's wrong. These are the most dangerous gaps for exam day.",
  slipped:"Slipped -- you had this before and missed it now. Knowledge may be destabilizing; revisit the concept.",
  recurring:"Recurring miss -- you've missed this one more than once. High priority to review.",
  new_gap:"New gap -- first miss, totally normal. Now it's flagged for review."
};

function recordAnswer(q, isCorrect, confidence){
  var rec = progress[q.id] || {box:1, correctCount:0, wrongCount:0, lastSeen:0, flag:false};
  var cls = classifyAttempt(rec, isCorrect, confidence);
  rec.lastSeen = Date.now();
  rec.lastClass = cls;
  if(isCorrect){
    rec.correctCount = (rec.correctCount||0)+1;
    rec.box = Math.min((rec.box||1)+1, 4);
    rec.flag = (cls==="fragile");
    streak++;
  } else {
    rec.wrongCount = (rec.wrongCount||0)+1;
    rec.box = 1;
    rec.flag = true;
    streak = 0;
  }
  saveStreak();
  progress[q.id] = rec;
  saveProgress();
  syncQuestionDoc(q, rec);
  pushSummary();
  if(settings.sound){ isCorrect ? playCorrectChime() : playWrongTone(); }
  if(isCorrect && streak>0 && streak%5===0){ triggerConfetti(); }
  return cls;
}

var audioCtx = null;
function getAudioCtx(){
  if(!audioCtx){
    try{ var AC = window.AudioContext||window.webkitAudioContext; audioCtx = new AC(); }catch(e){}
  }
  return audioCtx;
}
function playTone(freq, start, dur, vol){
  try{
    var ctx = getAudioCtx(); if(!ctx) return;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.frequency.value = freq; o.type = "sine";
    o.connect(g); g.connect(ctx.destination);
    var t0 = ctx.currentTime + start;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol||0.15, t0+0.02);
    g.gain.linearRampToValueAtTime(0, t0+dur);
    o.start(t0); o.stop(t0+dur+0.02);
  }catch(e){}
}

function triggerConfetti(){
  var root = document.getElementById("confetti-root");
  var colors = ["#2563eb","#15803d","#f59e0b","#db2777","#7c3aed"];
  for(var i=0;i<24;i++){
    var p = document.createElement("div");
    p.className="confetti-piece";
    p.style.left = (Math.random()*100)+"vw";
    p.style.background = colors[i%colors.length];
    p.style.borderRadius = (Math.random()>0.5?"50%":"2px");
    p.style.transform = "rotate("+Math.floor(Math.random()*360)+"deg)";
    root.appendChild(p);
    (function(el){
      var dur = 1200+Math.random()*900;
      var dx = (Math.random()-0.5)*160;
      try{
        if(el.animate){
          el.animate([
            { transform: el.style.transform, top:"-10px", opacity:1 },
            { transform: "translate("+dx+"px, 100vh) rotate(720deg)", opacity:0.9 }
          ], { duration: dur, easing:"cubic-bezier(.2,.6,.6,1)" });
        } else {
          el.style.transition = "top "+dur+"ms linear, opacity "+dur+"ms linear";
          setTimeout(function(){ try{ el.style.top="100vh"; el.style.opacity="0.2"; }catch(e){} }, 10);
        }
      }catch(e){}
      setTimeout(function(){ try{ el.remove(); }catch(e){} }, dur+50);
    })(p);
  }
}

// ======================= SESSION LOGIC =======================
function shuffle(arr){
  for(var i=arr.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=arr[i]; arr[i]=arr[j]; arr[j]=t; }
  return arr;
}
function boxOf(id){ return (progress[id]&&progress[id].box)||1; }
function isQuizLike(q){ return true; }

function weightedUniqueQueue(pool, cap){
  var weighted = [];
  pool.forEach(function(q){
    var w = Math.max(5-boxOf(q.id),1);
    for(var i=0;i<w;i++) weighted.push(q);
  });
  shuffle(weighted);
  var seen={}, queue=[];
  for(var i=0;i<weighted.length;i++){
    var q=weighted[i];
    if(!seen[q.id]){ seen[q.id]=true; queue.push(q); if(cap && queue.length>=cap) break; }
  }
  if((!cap || queue.length<cap) && queue.length < pool.length){
    pool.forEach(function(q){ if(!seen[q.id]){ seen[q.id]=true; queue.push(q); } });
  }
  return queue;
}

function buildSession(filterFn, count){
  var pool = QUESTIONS.filter(filterFn);
  return weightedUniqueQueue(pool, count).slice(0, count);
}

// Pulls roughly evenly from every chapter in the filtered pool (round-robin),
// so a chapter with more questions (e.g. after new additions) doesn't crowd
// out the others in Mixed practice / Speed round -- each still weighted
// toward whatever that chapter's own missed questions are (Leitner boxes).
function buildBalancedSession(filterFn, count){
  var pool = QUESTIONS.filter(filterFn);
  var byChapter = {};
  CHAPTERS.forEach(function(ch){ byChapter[ch] = weightedUniqueQueue(pool.filter(function(q){return q.ch===ch;})); });
  var order = shuffle(CHAPTERS.slice());
  var queue = [], idx = {}; order.forEach(function(ch){ idx[ch]=0; });
  var remaining = true;
  while(queue.length < count && remaining){
    remaining = false;
    for(var i=0;i<order.length;i++){
      var ch = order[i];
      if(idx[ch] < byChapter[ch].length){
        queue.push(byChapter[ch][idx[ch]]); idx[ch]++;
        remaining = true;
        if(queue.length>=count) break;
      }
    }
  }
  return queue;
}

// Samples `count` questions distributed across chapters by EXAM_WEIGHTS (the
// confirmed real exam's chapter ratio) using the largest-remainder method for
// whole-number allocation, then fills each chapter's share with weightedUniqueQueue
// (so missed questions still surface more often). If a chapter's own pool can't
// cover its target share, the shortfall is backfilled from the rest of the pool.
// Used by Mixed practice and the Exam Simulator -- the weighting itself is never
// displayed in the UI, only used internally to pick questions.
function buildWeightedSession(filterFn, count){
  var pool = QUESTIONS.filter(filterFn);
  var chs = CHAPTERS.slice();
  var raw = chs.map(function(ch){ return count*(EXAM_WEIGHTS[ch]||0); });
  var counts = raw.map(Math.floor);
  var used = counts.reduce(function(a,b){return a+b;},0);
  var leftover = count - used;
  var fracOrder = chs.map(function(ch,i){ return {i:i, frac: raw[i]-counts[i]}; })
    .sort(function(a,b){ return b.frac-a.frac; });
  for(var k=0; k<leftover; k++){ counts[fracOrder[k % fracOrder.length].i]++; }

  var queue = [], seen = {};
  chs.forEach(function(ch,i){
    var chPool = pool.filter(function(q){return q.ch===ch;});
    var chQueue = weightedUniqueQueue(chPool, counts[i]).slice(0, counts[i]);
    chQueue.forEach(function(q){ if(!seen[q.id]){ seen[q.id]=true; queue.push(q); } });
  });
  if(queue.length < count){
    var rest = pool.filter(function(q){ return !seen[q.id]; });
    var extra = weightedUniqueQueue(rest, count-queue.length).slice(0, count-queue.length);
    extra.forEach(function(q){ if(!seen[q.id]){ seen[q.id]=true; queue.push(q); } });
  }
  return shuffle(queue).slice(0, count);
}

function go(v){ view=v; stopSpeak(); render(); window.scrollTo(0,0); }

function resetCurrent(){
  current = { selectedOpt:null, tfSelected:null, fillVal:"", matchSel:null, confidence:null, checked:false, wasCorrect:false, err:false, cls:null };
}

function startSession(filterFn, count, modeLabel, speedMode){
  session = { queue:buildSession(filterFn,count), idx:0, correct:0, mode:modeLabel, speed:!!speedMode, timer:null, timeLeft:0, budget:0, fixedBudget:0 };
  resetCurrent();
  go("quiz");
  if(session.speed) armTimer();
}
function startSessionBalanced(filterFn, count, modeLabel, speedMode){
  session = { queue:buildBalancedSession(filterFn,count), idx:0, correct:0, mode:modeLabel, speed:!!speedMode, timer:null, timeLeft:0, budget:0, fixedBudget:0 };
  resetCurrent();
  go("quiz");
  if(session.speed) armTimer();
}
// Weighted sampling: distributes `count` across chapters using EXAM_WEIGHTS (the
// confirmed real exam's chapter ratio), then fills each chapter's share using the
// existing Leitner-box weighting (weightedUniqueQueue) so missed questions still
// surface more often within each chapter. Used by Mixed practice and Exam Simulator.
// fixedBudget (seconds), when set, overrides SPEED_BUDGET so every question in the
// session gets the same amount of time -- used by Exam Simulator to match the real
// exam's constant ~1.33 min/question pace, regardless of session length.
function startSessionWeighted(filterFn, count, modeLabel, speedMode, fixedBudget){
  session = { queue:buildWeightedSession(filterFn,count), idx:0, correct:0, mode:modeLabel, speed:!!speedMode, timer:null, timeLeft:0, budget:0, fixedBudget:fixedBudget||0 };
  resetCurrent();
  go("quiz");
  if(session.speed) armTimer();
}

function armTimer(){
  clearInterval(session.timer);
  var q = session.queue[session.idx]; if(!q) return;
  session.budget = session.fixedBudget || (SPEED_BUDGET[q.type]||20);
  session.timeLeft = session.budget;
  session.timer = setInterval(function(){
    session.timeLeft -= 0.2;
    if(session.timeLeft<=0){ clearInterval(session.timer); if(!current.checked) checkAnswer(true); }
    renderTimerOnly();
  }, 200);
}
function renderTimerOnly(){
  var el = document.getElementById("timerFill");
  if(el){ el.style.width = Math.max(0,(100*session.timeLeft/session.budget))+"%"; }
}

// Holds the 70 confirmed real Exam II questions ("Ch 6 + 9 Q's Set B"), shuffled into
// random order. The cutoff below is a fixed instant (not a recomputed "today"), set to
// 11:59:59 PM US Eastern on Nov 9, 2026. Nov 9, 2026 is during EST (UTC-5), so that
// instant is Nov 10, 2026 04:59:59 UTC.
var LAST_MINUTE_CUTOFF = Date.UTC(2026,10,10,4,59,59);
function lastMinuteActive(){
  return Date.now() < LAST_MINUTE_CUTOFF && QUESTIONS.some(function(q){return q.src==="lastminute";});
}

  return "<button class=\"modecard\" onclick=\""+onclick+"\"><div class=\"modecard-icon hue-"+hue+"\">"+icon+"</div><div class=\"modecard-body\"><div class=\"modecard-title\">"+title+"</div><div class=\"modecard-desc\">"+desc+"</div></div><div class=\"modecard-chev\">\u203a</div></button>";
}

function renderWeak(){
  var s = computeStats();
  var html = "<h1>Weak areas</h1>";
  html += "<div class=\"card\">";
  CHAPTERS.forEach(function(ch){
    var c = s.byChapter[ch];
    var acc = c.a? Math.round(100*c.c/c.a):0;
    html += "<div style=\"margin-bottom:10px;\"><div class=\"progresstop\"><span>Chapter "+ch+"</span><span>"+(c.a? acc+"% ("+c.a+" answered)":"not started")+"</span></div><div class=\"barwrap heatbar\"><div class=\"bar heatbar\" style=\"width:"+(c.a?Math.max(acc,4):4)+"%; background:"+heatColor(acc,c.a)+";\"></div></div></div>";
  });
  html += "</div>";

  var flagged = s.flaggedIds.map(function(id){ return QUESTIONS.find(function(q){return q.id===id;}); }).filter(function(q){ return q && isQuizLike(q); });
  html += "<p class=\"small\" style=\"margin:-4px 0 10px;\">Quiz-format questions only -- short-answer misses are tracked separately in that review mode.</p>";
  var byClass = {overconfident:[], recurring:[], slipped:[], fragile:[]};
  flagged.forEach(function(q){ var c = progress[q.id].lastClass; if(byClass[c]) byClass[c].push(q); });

  function section(title, list, cls){
    if(!list.length) return "";
    var h = "<div class=\"card\"><h2>"+title+" ("+list.length+")</h2><p class=\"muted\" style=\"margin-top:-6px;\">"+DIAG_LABEL[cls]+"</p>";
    list.slice(0,8).forEach(function(q){ h += "<div class=\"small\" style=\"margin:6px 0;padding:8px;background:var(--chip);border-radius:8px;\">Ch"+q.ch+": "+q.q.slice(0,90)+(q.q.length>90?"...":"")+"</div>"; });
    h += "</div>";
    return h;
  }
  html += section("Overconfident misses", byClass.overconfident, "overconfident");
  html += section("Recurring misses", byClass.recurring, "recurring");
  html += section("Slipped (knew it before)", byClass.slipped, "slipped");
  html += section("Fragile (right, but unsure)", byClass.fragile, "fragile");

  if(flagged.length){
    html += "<button class=\"btn btn-primary\" onclick=\"startSession(function(q){var r=progress[q.id]; return r&&r.flag&&isQuizLike(q);}, 20, 'Weak-area review')\">Practice all flagged ("+flagged.length+")</button>";
  } else {
    html += "<p class=\"muted\">Nothing flagged yet -- keep practicing and anything shaky will show up here.</p>";
  }
  html += "<button class=\"btn btn-ghost\" onclick=\"go('home')\">Back</button>";
  return html;
}

  html += "</select>";
  html += "<div style=\"height:14px;\"></div><button class=\"btn btn-primary\" onclick=\"renderPlanOutput()\">Build my plan</button>";
  html += "</div><div id=\"planOut\"></div>";
  html += "<button class=\"btn btn-ghost\" onclick=\"go('home')\">Back</button>";

function renderPlanOutput(){
  var s = computeStats();
  var order = CHAPTERS.slice().sort(function(a,b){
    var ca=s.byChapter[a], cb=s.byChapter[b];
    var accA = ca.a? ca.c/ca.a : -1, accB = cb.a? cb.c/cb.a : -1;
    return accA-accB;
  });
  var totalMinutes = studyPlanForm.hours*60;
  var perSession = Math.min(studyPlanForm.sessionLen, totalMinutes/studyPlanForm.days);
  var sessions = Math.max(1, Math.round(totalMinutes/perSession));
  var qPerMin = 1.3;
  var lines = [];
  lines.push("BIO 207 Exam II -- "+studyPlanForm.days+"-day study plan ("+studyPlanForm.hours+" total hours, ~"+Math.round(perSession)+" min/session)");
  lines.push("");
  for(var i=0;i<sessions;i++){
    var ch = order[i % order.length];
    var qCount = Math.max(8, Math.round(perSession*qPerMin));
    lines.push("Session "+(i+1)+" (~"+Math.round(perSession)+" min): Chapter "+ch+" -- weakest area first. Target ~"+qCount+" questions (mixed practice weighted to misses), then 5 min reviewing the Weak Areas screen.");
  }
  lines.push("");
  lines.push("Final session before the exam: Mixed practice across both chapters + full Weak Areas review.");
  var txt = lines.join("\n");
  var el = document.getElementById("planOut");
  el.innerHTML = "<div class=\"card\"><h2>Your plan</h2><textarea class=\"plan-out\" readonly>"+txt.replace(/</g,"&lt;")+"</textarea><div class=\"row\" style=\"margin-top:10px;\"><button class=\"iconbtn\" onclick=\"copyText(document.querySelector('.plan-out').value)\">Copy</button><button class=\"iconbtn\" onclick=\"downloadText('bio207_study_plan.txt', document.querySelector('.plan-out').value)\">Download</button></div></div>";
}

function copyText(t){ try{ navigator.clipboard.writeText(t); alert("Copied."); }catch(e){ alert("Could not copy automatically -- select and copy manually."); } }
function downloadText(filename, text){
  try{
    var blob = new Blob([text], {type:"text/plain"});
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a"); a.href=url; a.download=filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 2000);
  }catch(e){ alert("Download failed in this browser."); }
}
function missedAsText(){
  var s = computeStats();
  var ids = s.flaggedIds;
  var lines = ["BIO 207 -- Missed / flagged questions ("+ids.length+")",""];
  CHAPTERS.forEach(function(ch){
    var qs = ids.map(function(id){return QUESTIONS.find(function(q){return q.id===id;});}).filter(function(q){return q&&q.ch===ch;});
    if(!qs.length) return;
    lines.push("=== Chapter "+ch+" ===");
    qs.forEach(function(q){
      lines.push("Q: "+q.q);
      if(q.type==="mc") lines.push("A: "+q.opts[q.correct]);
      else if(q.type==="tf") lines.push("A: "+(q.correct?"True":"False"));
      else if(q.type==="fill") lines.push("A: "+q.answers[0]);
      else if(q.type==="match"||q.type==="diagram") lines.push("A: "+q.items.map(function(it,i){return it+" -> "+q.rights[i];}).join("; "));
      lines.push("Why: "+(q.exp||""));
      lines.push("");
    });
  });
  return lines.join("\n");
}
function copyMissed(){ copyText(missedAsText()); }
function downloadMissed(){ downloadText("bio207_missed_questions.txt", missedAsText()); }
function fullBankAsText(){
  var lines = ["BIO 207 -- Full practice question bank ("+QUESTIONS.length+" questions)",""];
  CHAPTERS.forEach(function(ch){
    lines.push("=== Chapter "+ch+" ===");
    QUESTIONS.filter(function(q){return q.ch===ch;}).forEach(function(q){
      lines.push("Q: "+q.q);
      if(q.type==="mc") lines.push("A: "+q.opts[q.correct]);
      else if(q.type==="tf") lines.push("A: "+(q.correct?"True":"False"));
      else if(q.type==="fill") lines.push("A: "+q.answers[0]);
      else if(q.type==="match"||q.type==="diagram") lines.push("A: "+q.items.map(function(it,i){return it+" -> "+q.rights[i];}).join("; "));
      if(q.exp) lines.push("Why: "+q.exp);
      lines.push("");
    });
  });
  return lines.join("\n");
}
function downloadFullBank(){ downloadText("bio207_full_question_bank.txt", fullBankAsText()); }

function exportProgress(){
  var payload = { app:"bio207-exam1", exportedAt:new Date().toISOString(), progress:progress, settings:settings, streak:streak };
  downloadText("bio207_progress_backup.json", JSON.stringify(payload, null, 2));
}
function importProgress(evt){
  var file = evt.target.files && evt.target.files[0];
  if(!file) return;
  var reader = new FileReader();
  reader.onload = function(){
    try{
      var data = JSON.parse(reader.result);
      if(data && data.progress){
        progress = data.progress; saveProgress();
        if(data.settings){ settings = data.settings; saveSettings(); }
        if(typeof data.streak==="number"){ streak = data.streak; saveStreak(); }
        alert("Progress imported.");
        go("home");
      } else { alert("That file doesn't look like a BIO 207 progress backup."); }
    }catch(e){ alert("Couldn't read that file."); }
  };
  reader.readAsText(file);
}
function resetProgress(){
  if(!confirm("Reset all saved progress on this device? This can't be undone.")) return;
  progress = {}; streak = 0; saveProgress(); saveStreak(); pushSummary(); go("home");
}

// ======================= RENDER: GLOSSARY =======================
function renderGlossary(){
  var html = "<h1>Glossary</h1><div class=\"card\">";
  Object.keys(GLOSSARY).sort().forEach(function(term){
    html += "<div style=\"margin-bottom:12px;\"><div style=\"font-weight:600;font-size:14px;\">"+term+"</div><div class=\"small\">"+GLOSSARY[term]+"</div></div>";
  });
  html += "</div><button class=\"btn btn-ghost\" onclick=\"go('home')\">Back</button>";
  return html;
}

// ======================= RENDER: DRIVING MODE =======================
function drivingModeText(filterFn, scopeLabel){
  var qs = QUESTIONS.filter(filterFn);
  var lines = [];
  lines.push("HOW TO USE THIS FILE");
  lines.push("Paste everything below into a NEW chat with any AI assistant (ChatGPT, Claude, Gemini, Copilot, etc.) before you start driving.");
  lines.push("Ask it to quiz you on these questions one at a time, in random order, since you can't read while driving but can have a spoken conversation.");
  lines.push("It should ask a question, wait for your spoken answer, tell you right away if you're right with a brief explanation, then move on to the next one. Prioritize whichever ones you get wrong -- ask to see those again later in the drive.");
  lines.push("");
  lines.push("BIO 207 -- "+scopeLabel+" ("+qs.length+" questions)");
  lines.push("");
  qs.forEach(function(q){
    lines.push("Q: "+q.q);
    if(q.type==="mc") lines.push("A: "+q.opts[q.correct]);
    else if(q.type==="tf") lines.push("A: "+(q.correct?"True":"False"));
    else if(q.type==="fill") lines.push("A: "+q.answers[0]);
    else if(q.type==="match"||q.type==="diagram") lines.push("A: "+q.items.map(function(it,i){return it+" -> "+q.rights[i];}).join("; "));
    if(q.exp) lines.push("Why: "+q.exp);
    lines.push("");
  });
  return lines.join("\n");
}
function renderDriving(){
  var s = computeStats();
  var html = "<h1>Driving mode</h1>";
  html += "<div class=\"card\"><p class=\"small\">This isn't an in-app quiz -- the app needs taps to work, which isn't safe to do while driving, even with questions read aloud. Instead, this builds a plain-text file meant for a spoken conversation: pick a scope, copy or download it, and paste it into a new chat with any AI before you start driving.</p></div>";
  html += "<div class=\"card\"><h2>Pick a scope</h2>";
  html += "<button class=\"btn\" onclick=\"buildDrivingOutput(function(q){return true;}, 'All chapters')\">All chapters ("+QUESTIONS.length+" questions)</button>";
  html += "<button class=\"btn\" onclick=\"buildDrivingOutput(function(q){var r=progress[q.id]; return r&&r.flag;}, 'My weak areas only')\">My weak areas only ("+s.flaggedCount+" questions)</button>";
  CHAPTERS.forEach(function(ch){
    var n = QUESTIONS.filter(function(q){return q.ch===ch;}).length;
    html += "<button class=\"btn\" onclick=\"buildDrivingOutput(function(q){return q.ch==="+ch+";}, 'Chapter "+ch+"')\">Chapter "+ch+" only ("+n+" questions)</button>";
  });
  html += "</div><div id=\"drivingOut\"></div>";
  html += "<button class=\"btn btn-ghost\" onclick=\"go('home')\">Back</button>";
  return html;
}
function buildDrivingOutput(filterFn, label){
  var txt = drivingModeText(filterFn, label);
  var el = document.getElementById("drivingOut");
  if(!el) return;
  el.innerHTML = "<div class=\"card\"><h2>"+label+"</h2><textarea class=\"plan-out\" readonly>"+txt.replace(/</g,"&lt;")+"</textarea><div class=\"row\" style=\"margin-top:10px;\"><button class=\"iconbtn\" onclick=\"copyText(document.querySelector('.plan-out').value)\">Copy</button><button class=\"iconbtn\" onclick=\"downloadText('bio207_driving_mode.txt', document.querySelector('.plan-out').value)\">Download</button></div></div>";
}

// ======================= RENDER: QUIZ =======================
function optLetter(i){ return String.fromCharCode(97+i); }

function renderQuiz(){
  if(session.idx >= session.queue.length){ clearInterval(session.timer); return renderDone(); }
  var q = session.queue[session.idx];
  var html = "";
  html += "<div class=\"progresstop\"><span><button class=\"iconbtn\" style=\"padding:3px 8px;margin-right:8px;\" onclick=\"exitSession()\">\u2039 Exit</button>"+session.mode+(session.speed?" \u26a1":"")+"</span><span>Question "+(session.idx+1)+" / "+session.queue.length+"</span></div>";
  if(session.speed){ html += "<div class=\"timerbar\"><div class=\"timerfill\" id=\"timerFill\" style=\"width:100%;\"></div></div>"; }

  html += "<div class=\"card\">";
  html += "<span class=\"chip\">Ch "+q.ch+"</span>";
  if(q.src==="quiz1") html += "<span class=\"chip tag-warn\">Quiz 1</span>";
  else if(q.src==="quiz2") html += "<span class=\"chip tag-warn\">Quiz 2</span>";
  else if(q.src==="chapter") html += "<span class=\"chip\">End of chapter</span>";
  else if(q.src==="assignment") html += "<span class=\"chip\">Assignment</span>";
  else if(q.src==="lastminute") html += "<span class=\"chip tag-warn\">Last-Minute</span>";
  html += "<button class=\"iconbtn\" style=\"float:right;\" onclick=\"speakQuestion(QUESTIONS.find(function(x){return x.id==='"+q.id+"';}))\">\ud83d\udd0a Read aloud</button>";
  html += "<div class=\"qtext\" style=\"margin-top:10px;clear:both;\">"+escapeHtml(q.q)+"</div>";

  if(q.terms && q.terms.length){
    q.terms.forEach(function(t){ html += "<button class=\"chip\" onclick=\"openGlossary('"+t.replace(/'/g,"\\'")+"')\">\u2139 "+t+"</button>"; });
  }

  if(q.type==="diagram"){
    html += "<div onclick=\"openZoom('"+q.id+"')\">"+q.svg.replace("<svg ","<svg class=\\\"diagram\\\" ")+"</div><div class=\"small\">Tap the diagram to zoom.</div>";
  }

  if(q.type==="mc"){
    q.opts.forEach(function(opt,i){
      var cls="opt";
      if(current.checked){ if(i===q.correct) cls+=" correct"; else if(i===current.selectedOpt) cls+=" incorrect"; }
      else if(i===current.selectedOpt) cls+=" selected";
      html += "<div class=\""+cls+"\" onclick=\"selectOpt("+i+")\">"+optLetter(i)+". "+escapeHtml(opt)+"</div>";
    });
  } else if(q.type==="tf"){
    [true,false].forEach(function(val){
      var label = val?"True":"False"; var cls="opt";
      if(current.checked){ if(val===q.correct) cls+=" correct"; else if(val===current.tfSelected) cls+=" incorrect"; }
      else if(val===current.tfSelected) cls+=" selected";
      html += "<div class=\""+cls+"\" onclick=\"selectTf("+val+")\">"+label+"</div>";
    });
  } else if(q.type==="fill"){
    html += "<input type=\"text\" id=\"fillInput\" placeholder=\"Type your answer\" value=\""+(current.fillVal||"").replace(/\"/g,"")+"\" oninput=\"current.fillVal=this.value\" "+(current.checked?"disabled":"")+">";
    if(current.checked){ html += "<div class=\"feedback "+(current.wasCorrect?"good":"bad")+"\">"+(current.wasCorrect?"Correct.":"Correct answer: "+q.answers[0])+"</div>"; }
    if(current.err) html += "<div class=\"err\">Enter an answer first.</div>";
  } else if(q.type==="match" || q.type==="diagram"){
    if(!current.matchSel) current.matchSel = new Array(q.items.length).fill("");
    var pool = shuffle(Array.from(new Set(q.rights)));
    q.items.forEach(function(item,i){
      html += "<div class=\"matchrow\"><div class=\"mleft\">"+(i+1)+". "+escapeHtml(item)+"</div>";
      html += "<select onchange=\"current.matchSel["+i+"]=this.value\" "+(current.checked?"disabled":"")+"><option value=\"\">(choose)</option>";
      pool.forEach(function(opt){
        html += "<option "+(current.matchSel[i]===opt?"selected":"")+" value=\""+opt.replace(/\"/g,"")+"\">"+escapeHtml(opt)+"</option>";
      });
      html += "</select>";
      if(current.checked){
        var ok = current.matchSel[i]===q.rights[i];
        html += "<div class=\"small\" style=\"color:"+(ok?"var(--good)":"var(--bad)")+";margin-top:4px;\">"+(ok?"Correct":"Correct: "+q.rights[i])+"</div>";
      }
      html += "</div>";
    });
    if(current.err) html += "<div class=\"err\">Answer every row first.</div>";
  }

  if(!current.checked){
    html += "<div class=\"confband\">";
    ["low","med","high"].forEach(function(c){
      var label = c==="low"?"Not sure":c==="med"?"Somewhat sure":"Confident";
      html += "<div class=\"confbtn "+(current.confidence===c?"selected":"")+"\" onclick=\"current.confidence='"+c+"';render();\">"+label+"</div>";
    });
    html += "</div>";
  }

  if(current.checked){
    var specificNote = "";
    if(!current.wasCorrect && q.wrongExp){
      if(q.type==="mc" && current.selectedOpt!==null && q.wrongExp[current.selectedOpt]){ specificNote = q.wrongExp[current.selectedOpt]; }
      else if(q.type==="tf" && typeof q.wrongExp==="string"){ specificNote = q.wrongExp; }
    }
    html += "<div class=\"feedback "+(current.wasCorrect?"good":"bad")+"\" style=\"margin-top:12px;\">"+(current.wasCorrect?"\u2713 Correct. ":"\u2717 Not quite. ")+(specificNote?escapeHtml(specificNote)+" ":"")+escapeHtml(q.exp||"")+"</div>";
    if(current.cls){ html += "<div class=\"feedback warn\">"+DIAG_LABEL[current.cls]+"</div>"; }
    var isFlagged = !!manualFlags[q.id];
    html += "<button class=\"btn btn-sm\" style=\"margin-top:4px;\" onclick=\"toggleManualFlag('"+q.id+"')\">"+(isFlagged?"\ud83d\udd16 Flagged for review (tap to unflag)":"\ud83d\udd16 Flag for review")+"</button>";
  }
  html += "</div>";

  html += "<div class=\"footerbtn\">";
  if(!current.checked){
    html += "<button class=\"btn btn-primary\" onclick=\"checkAnswer()\">Check answer</button>";
  } else {
    html += "<button class=\"btn btn-primary\" onclick=\"nextQuestion()\">"+(session.idx+1<session.queue.length?"Next question":"See results")+"</button>";
  }
  html += "</div>";
  return html;
}

function escapeHtml(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function selectOpt(i){ if(current.checked) return; current.selectedOpt=i; current.err=false; render(); }
function selectTf(v){ if(current.checked) return; current.tfSelected=v; current.err=false; render(); }

function checkAnswer(timedOut){
  var q = session.queue[session.idx];
  if(!timedOut && !current.confidence){ current.err=true; render(); return; }
  var conf = current.confidence || "low";
  var isCorrect = false;
  if(q.type==="mc"){
    if(current.selectedOpt===null){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = current.selectedOpt===q.correct;
  } else if(q.type==="tf"){
    if(current.tfSelected===null){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = current.tfSelected===q.correct;
  } else if(q.type==="fill"){
    var val=(current.fillVal||"").trim();
    if(!val){ if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; } }
    else isCorrect = q.answers.some(function(a){return a.toLowerCase()===val.toLowerCase();});
  } else if(q.type==="match" || q.type==="diagram"){
    if(!current.matchSel || current.matchSel.some(function(v){return !v;})){
      if(timedOut){ isCorrect=false; } else { current.err=true; render(); return; }
    } else {
      isCorrect = q.items.every(function(it,i){ return current.matchSel[i]===q.rights[i]; });
    }
  }
  clearInterval(session.timer);
  current.checked=true; current.wasCorrect=isCorrect; current.err=false;
  if(isCorrect) session.correct++;
  current.cls = recordAnswer(q, isCorrect, conf);
  render();
}

function exitSession(){ clearInterval(session.timer); go("home"); }

function nextQuestion(){
  session.idx++;
  resetCurrent();
  if(session.idx >= session.queue.length){ clearInterval(session.timer); view="done"; }
  render();
  if(session.speed && session.idx < session.queue.length && view==="quiz") armTimer();
}

function renderDone(){
  var html = "<h1>Session complete</h1><div class=\"card\"><div class=\"statgrid\">";
  html += "<div class=\"stat\"><div class=\"num\">"+session.correct+" / "+session.queue.length+"</div><div class=\"lab\">this session</div></div>";
  var s = computeStats();
  html += "<div class=\"stat\"><div class=\"num\">"+s.accuracy+"%</div><div class=\"lab\">overall accuracy</div></div>";
  html += "</div></div>";
  html += "<button class=\"btn btn-primary\" onclick=\"go('home')\">Back to home</button>";
  return html;
}

// ======================= MODALS: GLOSSARY POPOVER + IMAGE ZOOM + TUTORIAL =======================
function openGlossary(term){ modal = {type:"glossary", term:term}; render(); }
function openZoom(qid){ var q=QUESTIONS.find(function(x){return x.id===qid;}); modal={type:"zoom", svg:q.svg}; render(); }
function closeModal(){
  var wasTutorial = modal && modal.type==="tutorial";
  modal=null;
  if(wasTutorial){ settings.seenTutorial=true; saveSettings(); }
  render();
}

var TUTORIAL_STEPS = [
  "Welcome! This app has "+QUESTIONS.length+" practice questions across Chapters 6 and 9 -- multiple choice and true/false only, matching Exam I's confirmed format.",
  "The Exam Simulator samples questions weighted like Exam II's confirmed chapter balance, and times you at the same pace as Exam I -- pick Quick check, Half exam, or the Full exam replica.",
  "After each answer, rate your confidence. It's not just right/wrong -- being confident and wrong gets flagged as your highest-priority gap.",
  "Check Weak Areas anytime for a color-coded heat-map by chapter, plus exactly which questions keep tripping you up. You can also manually flag any question for later, right or wrong, from its result screen.",
  "Use the Study Plan Builder to turn your days-until-exam and available hours into a session-by-session plan.",
  "Everything saves automatically on this device. Export a backup file anytime from Settings, or download your missed questions as text.",
  "Tip: tap the theme icon (top-right) to cycle Auto/Light/Dark, and use arrow keys + Enter to answer hands-free."
];
function openTutorial(){ modal = {type:"tutorial", step:0}; render(); }
function replayTutorial(){ openTutorial(); }
function tutorialNext(){
  if(modal.step < TUTORIAL_STEPS.length-1){ modal.step++; render(); }
  else { closeModal(); }
}
function tutorialPrev(){ if(modal.step>0){ modal.step--; render(); } }

function renderModal(){
  var old = document.getElementById("modalRoot");
  if(old) old.remove();
  var div = document.createElement("div");
  div.id = "modalRoot";
  div.className = "modal-overlay";
  div.onclick = function(e){ if(e.target===div && modal.type!=="tutorial") closeModal(); };
  var box = document.createElement("div");
  box.className = "modal-box";
  if(modal.type==="glossary"){
    box.innerHTML = "<h2>"+modal.term+"</h2><p>"+(GLOSSARY[modal.term]||"No definition found.")+"</p><button class=\"btn btn-primary\" onclick=\"closeModal()\">Close</button>";
  } else if(modal.type==="zoom"){
    box.innerHTML = modal.svg.replace("<svg ","<svg style=\\\"width:100%;height:auto;\\\" ") + "<button class=\"btn btn-primary\" style=\"margin-top:10px;\" onclick=\"closeModal()\">Close</button>";
  } else if(modal.type==="tutorial"){
    var i = modal.step;
    var dots = "<div class=\"tutorial-dots\">"+TUTORIAL_STEPS.map(function(_,idx){ return "<div class=\"tutorial-dot"+(idx===i?" active":"")+"\"></div>"; }).join("")+"</div>";
    var nav = "<div class=\"row\" style=\"margin-top:14px;\">";
    if(i>0) nav += "<button class=\"iconbtn\" onclick=\"tutorialPrev()\">Back</button>";
    nav += "<button class=\"btn btn-primary\" style=\"flex:1;margin-bottom:0;\" onclick=\"tutorialNext()\">"+(i<TUTORIAL_STEPS.length-1?"Next":"Let's go")+"</button>";
    nav += "<button class=\"iconbtn\" onclick=\"closeModal()\">Skip</button>";
    nav += "</div>";
    box.innerHTML = "<h2>Quick tour ("+(i+1)+"/"+TUTORIAL_STEPS.length+")</h2><p>"+TUTORIAL_STEPS[i]+"</p>"+dots+nav;
  }
  div.appendChild(box);
  document.body.appendChild(div);
}

// ======================= KEYBOARD SHORTCUTS =======================
function handleKey(e){
  if(modal){
    if(e.key==="Escape"){ closeModal(); return; }
    if(modal.type==="tutorial"){
      if(e.key==="ArrowRight"||e.key==="Enter"){ tutorialNext(); e.preventDefault(); }
      else if(e.key==="ArrowLeft"){ tutorialPrev(); e.preventDefault(); }
    }
    return;
  }
  if(view!=="quiz") return;
  var q = session.queue[session.idx]; if(!q) return;
  var tag = (e.target && e.target.tagName) || "";
  var inField = (tag==="INPUT"||tag==="SELECT"||tag==="TEXTAREA");

  if(current.checked){
    if(e.key==="Enter"||e.key===" "){ nextQuestion(); e.preventDefault(); }
    return;
  }

  if(q.type==="mc" && !inField){
    var n = parseInt(e.key,10);
    if(!isNaN(n) && n>=1 && n<=q.opts.length){ selectOpt(n-1); e.preventDefault(); return; }
    var letterIdx = "abcdefgh".indexOf((e.key||"").toLowerCase());
    if(letterIdx>=0 && letterIdx<q.opts.length){ selectOpt(letterIdx); e.preventDefault(); return; }
  }
  if(q.type==="tf" && !inField){
    if(e.key==="t"||e.key==="T"){ selectTf(true); e.preventDefault(); return; }
    if(e.key==="f"||e.key==="F"){ selectTf(false); e.preventDefault(); return; }
  }
  if(q.type==="mc"||q.type==="tf"){
    if(e.key==="ArrowLeft"||e.key==="ArrowRight"){
      var order=["low","med","high"];
      var idx = order.indexOf(current.confidence);
      if(idx===-1) idx = e.key==="ArrowRight" ? -1 : order.length;
      idx = e.key==="ArrowRight" ? Math.min(order.length-1, idx+1) : Math.max(0, idx-1);
      current.confidence = order[idx];
      render(); e.preventDefault(); return;
    }
  }
  if(e.key==="Enter"){ checkAnswer(); e.preventDefault(); }
}
try{ document.addEventListener("keydown", handleKey); }catch(e){}

// ======================= SWIPE GESTURES =======================
var touchStartX=null, touchStartY=null;
function onTouchStart(e){
  if(!e.touches || !e.touches.length) return;
  touchStartX = e.touches[0].clientX; touchStartY = e.touches[0].clientY;
}
function onTouchEnd(e){
  if(touchStartX===null) return;
  var t = (e.changedTouches && e.changedTouches[0]) || null;
  var endX = t ? t.clientX : touchStartX;
  var endY = t ? t.clientY : touchStartY;
  var dx = endX-touchStartX, dy = endY-touchStartY;
  touchStartX=null; touchStartY=null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.5){
    if(view==="quiz" && current.checked && !modal){ nextQuestion(); }
  }
}
try{
  document.addEventListener("touchstart", onTouchStart, {passive:true});
  document.addEventListener("touchend", onTouchEnd, {passive:true});
}catch(e){}

render();
</script>
