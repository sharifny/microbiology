<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BIO 207 -- Exam I Practice</title>
<style>
:root{
  --bg:#fafafa; --fg:#1a1a1a; --muted:#666; --card:#ffffff; --border:#ddd;
  --accent:#2563eb; --accent-fg:#ffffff; --good:#15803d; --good-bg:#dcfce7;
  --bad:#b91c1c; --bad-bg:#fee2e2; --chip:#eef2ff; --warn:#b45309; --warn-bg:#fef3c7;
  --radius:12px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#121212; --fg:#f0f0f0; --muted:#a0a0a0; --card:#1e1e1e; --border:#333;
    --accent:#60a5fa; --accent-fg:#0b1220; --good:#4ade80; --good-bg:#0f2e1a;
    --bad:#f87171; --bad-bg:#3a1414; --chip:#1f2540; --warn:#fbbf24; --warn-bg:#3a2e0f;
  }
  html{ color-scheme: dark; }
}
:root[data-theme="dark"]{
  --bg:#121212; --fg:#f0f0f0; --muted:#a0a0a0; --card:#1e1e1e; --border:#333;
  --accent:#60a5fa; --accent-fg:#0b1220; --good:#4ade80; --good-bg:#0f2e1a;
  --bad:#f87171; --bad-bg:#3a1414; --chip:#1f2540; --warn:#fbbf24; --warn-bg:#3a2e0f;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0; background:var(--bg); color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  -webkit-tap-highlight-color: transparent;
}
#app{ max-width:580px; margin:0 auto; padding:16px 16px 48px; position:relative; }
.topbar{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
.topbar .brand{ font-size:12px; color:var(--muted); font-weight:600; letter-spacing:.02em; }
.tutorial-dots{ display:flex; gap:6px; justify-content:center; margin-top:14px; }
.tutorial-dot{ width:7px; height:7px; border-radius:50%; background:var(--border); }
.tutorial-dot.active{ background:var(--accent); }
h1{ font-size:20px; font-weight:600; margin:4px 0 2px; }
h2{ font-size:16px; font-weight:600; margin:0 0 10px; }
.muted{ color:var(--muted); font-size:13px; }
.card{ background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:16px; margin-bottom:12px; }
.row{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
.btn{
  display:block; width:100%; text-align:left; background:var(--card); color:var(--fg);
  border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px;
  font-size:15px; margin-bottom:10px; cursor:pointer;
}
.btn:active{ transform:scale(0.99); }
.btn-primary{ background:var(--accent); color:var(--accent-fg); border-color:var(--accent); font-weight:600; text-align:center; }
.btn-primary:disabled{ opacity:0.5; }
.btn-ghost{ background:transparent; }
.btn-sm{ display:inline-block; width:auto; padding:8px 12px; font-size:13px; margin:0 6px 6px 0; }
.chip{ display:inline-block; background:var(--chip); color:var(--accent); font-size:12px; font-weight:600; padding:4px 10px; border-radius:999px; margin-right:6px; margin-bottom:6px; cursor:pointer; border:none; }
.chip.tag-warn{ background:var(--warn-bg); color:var(--warn); }
.statgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin:10px 0; }
.stat{ background:var(--chip); border-radius:var(--radius); padding:12px; }
.stat .num{ font-size:22px; font-weight:600; }
.stat .lab{ font-size:12px; color:var(--muted); }
.barwrap{ background:var(--border); border-radius:6px; height:10px; overflow:hidden; margin-top:6px;}
.bar{ height:100%; background:var(--accent); transition:width .3s; }
.heatbar{ height:16px; border-radius:6px; }
.progresstop{ font-size:13px; color:var(--muted); margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; }
.qtext{ font-size:16px; line-height:1.5; margin-bottom:10px; }
.opt{ display:block; width:100%; text-align:left; background:var(--card); border:1px solid var(--border); border-radius:var(--radius); padding:12px 14px; margin-bottom:8px; font-size:15px; cursor:pointer; }
.opt.selected{ border-color:var(--accent); border-width:2px; }
.opt.correct{ border-color:var(--good); background:var(--good-bg); border-width:2px; }
.opt.incorrect{ border-color:var(--bad); background:var(--bad-bg); border-width:2px; }
input[type=text],input[type=number]{
  width:100%; padding:12px 14px; font-size:15px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); color:var(--fg);
}
select{
  width:100%; padding:10px 12px; font-size:14px; border-radius:var(--radius);
  border:1px solid var(--border); background:var(--card); color:var(--fg); margin-top:4px;
}
.matchrow{ margin-bottom:12px; }
.matchrow .mleft{ font-size:14px; margin-bottom:4px; }
.feedback{ border-radius:var(--radius); padding:12px 14px; margin-top:10px; font-size:14px; }
.feedback.good{ background:var(--good-bg); color:var(--good); }
.feedback.bad{ background:var(--bad-bg); color:var(--bad); }
.feedback.warn{ background:var(--warn-bg); color:var(--warn); font-weight:600; }
.err{ color:var(--bad); font-size:13px; margin-top:6px; }
.footerbtn{ position:sticky; bottom:0; background:var(--bg); padding:10px 0 4px; }
.small{ font-size:12px; color:var(--muted); margin-top:4px; }
a{ color:var(--accent); }
.iconbtn{ background:none; border:1px solid var(--border); border-radius:8px; padding:6px 10px; font-size:13px; color:var(--fg); cursor:pointer; }
.timerbar{ height:6px; background:var(--border); border-radius:4px; overflow:hidden; margin-bottom:10px; }
.timerfill{ height:100%; background:var(--warn); transition:width .2s linear; }
.modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,0.6); display:flex; align-items:center; justify-content:center; z-index:50; padding:20px; }
.modal-box{ background:var(--card); border-radius:var(--radius); padding:20px; max-width:440px; width:100%; max-height:80vh; overflow-y:auto; }
.modal-box svg{ width:100%; height:auto; color:var(--fg); }
.confband{ display:flex; gap:8px; margin:10px 0; }
.confbtn{ flex:1; padding:10px 6px; font-size:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--fg); cursor:pointer; text-align:center; }
.confbtn.selected{ border-color:var(--accent); border-width:2px; background:var(--chip); }
svg.diagram{ width:100%; height:auto; color:var(--fg); cursor:zoom-in; }
.confetti-piece{ position:fixed; top:-10px; width:8px; height:8px; z-index:100; pointer-events:none; }
textarea.plan-out{ width:100%; min-height:220px; font-size:13px; border-radius:var(--radius); border:1px solid var(--border); background:var(--card); color:var(--fg); padding:12px; font-family:inherit; }
</style>
</head>
<body>
<div id="app"></div>
<div id="confetti-root"></div>
<script>
// ======================= DATA =======================
var QUESTIONS = [{"id": "c1_01", "ch": 1, "type": "mc", "q": "Which of the following is not considered a microorganism?", "opts": ["Archaean", "Bacterium", "Protozoan", "Mushroom"], "correct": 3, "exp": "A mushroom is a multicellular fungus visible without magnification -- not a microorganism."}, {"id": "c1_02", "ch": 1, "type": "mc", "q": "An area of microbiology concerned with the occurrence of disease in human populations is", "opts": ["Immunology", "Parasitology", "Epidemiology", "Bioremediation"], "correct": 2, "exp": "Epidemiology studies disease spread in populations."}, {"id": "c1_03", "ch": 1, "type": "mc", "q": "Which process involves the deliberate alteration of an organism's genetic material?", "opts": ["Bioremediation", "Biotechnology", "Decomposition", "Recombinant DNA"], "correct": 3, "exp": "Recombinant DNA technology deliberately alters genetic material; biotechnology is the broader application category."}, {"id": "c1_04", "ch": 1, "type": "mc", "q": "A prominent difference between prokaryotic and eukaryotic cells is the", "opts": ["Larger size of prokaryotes", "Lack of pigmentation in eukaryotes", "Presence of a nucleus in eukaryotes", "Presence of a cell wall in prokaryotes"], "correct": 2, "exp": "Eukaryotes have a true, membrane-bound nucleus; prokaryotes do not."}, {"id": "c1_05", "ch": 1, "type": "mc", "q": "Which of the following parts was absent from Leeuwenhoek's microscopes?", "opts": ["Focusing screw", "Lens", "Specimen holder", "Condenser"], "correct": 3, "exp": "Leeuwenhoek's simple microscopes had a single lens, focusing screw, and specimen holder, but no condenser."}, {"id": "c1_06", "ch": 1, "type": "mc", "q": "Abiogenesis refers to the", "opts": ["Spontaneous generation of organisms from nonliving matter", "Development of life forms from preexisting life forms", "Development of aseptic technique", "Germ theory of disease"], "correct": 0, "exp": "Abiogenesis = spontaneous generation; biogenesis is the opposing, correct principle."}, {"id": "c1_07", "ch": 1, "type": "mc", "q": "A hypothesis can be defined as", "opts": ["A belief based on knowledge", "Knowledge based on belief", "A scientific explanation that is subject to testing", "A theory that has been thoroughly tested"], "correct": 2, "exp": "A hypothesis is a tentative, testable explanation."}, {"id": "c1_08", "ch": 1, "type": "mc", "q": "Which early microbiologist was most responsible for developing standard microbiology laboratory techniques?", "opts": ["Ignaz Semmelweis", "Robert Koch", "Carl von Linne", "John Tyndall"], "correct": 1, "exp": "Robert Koch developed pure culture technique and his postulates -- don’t confuse with Pasteur (germ theory, pasteurization, spontaneous generation)."}, {"id": "c1_09", "ch": 1, "type": "mc", "q": "Which scientist is most responsible for finally laying the theory of spontaneous generation to rest?", "opts": ["Joseph Lister", "Robert Koch", "Francesco Redi", "Louis Pasteur"], "correct": 3, "exp": "Pasteur’s swan-neck flask experiments disproved spontaneous generation."}, {"id": "c1_10", "ch": 1, "type": "mc", "q": "When a hypothesis has been thoroughly supported by long-term study and data, it is considered", "opts": ["A law", "A speculation", "A theory", "Proved"], "correct": 2, "exp": "A well-supported, peer-reviewed hypothesis becomes a theory -- not an absolute ‘law’ or ‘proof.’"}, {"id": "c1_11", "ch": 1, "type": "fill", "q": "Scientists formulate a ______, a tentative explanation to account for what they have observed or measured.", "answers": ["hypothesis"], "exp": "Hypothesis -- a testable, tentative explanation."}, {"id": "c1_12", "ch": 1, "type": "fill", "q": "Scientists then conduct ______ to determine the validity of their explanations.", "answers": ["experiments"], "exp": "Experiments test whether a hypothesis holds up."}, {"id": "c1_13", "ch": 1, "type": "fill", "q": "If an explanation is supported by numerous research studies that survive peer review over time, it can be moved to the level of a ______.", "answers": ["theory"], "exp": "A well-tested, peer-reviewed explanation becomes a theory."}, {"id": "c1_14", "ch": 1, "type": "fill", "q": "Some explanations of scientific phenomena are so well-tested that they move to the highest level of confidence and become a ______.", "answers": ["law"], "exp": "A law is the highest level of confidence in science."}, {"id": "c1_15", "ch": 1, "type": "match", "q": "Match each description to the correct group of microorganisms.", "items": ["Single-celled prokaryotes", "Single or multi-cellular eukaryotes that photosynthesize to obtain energy", "Multicellular eukaryotic organisms like parasitic worms", "Minute acellular particles that parasitize cells", "Molds and yeasts", "Unicellular eukaryotes often described as animal-like"], "rights": ["Bacteria", "Algae", "Helminths", "Viruses", "Fungi", "Protozoa"], "exp": "These are the major groups covered in 1.1: Bacteria, Algae, Helminths, Viruses, Fungi, Protozoa."}, {"id": "c1_16", "ch": 1, "type": "match", "q": "Match each clue to the correct taxonomic domain.", "items": ["Includes prokaryotes such as Staphylococcus aureus, with peptidoglycan cell walls", "Has the closest molecular (rRNA) relationship to the eukaryotic domain; includes methane-producers and extremophiles", "Includes humans, fungi, protozoa, and animals"], "rights": ["Domain Bacteria", "Domain Archaea", "Domain Eukarya"], "exp": "The Archaea-Eukarya molecular relationship is a frequently tested, counterintuitive fact -- commit it to memory.", "terms": ["Archaea"]}, {"id": "c1_17", "ch": 1, "type": "mc", "q": "Which of the following is the correctly written scientific (binomial) name?", "opts": ["Escherichia coli", "escherichia coli", "Escherichia Coli", "ESCHERICHIA COLI"], "correct": 0, "exp": "Genus is capitalized, species is lowercase, and the whole name is italicized (or underlined if handwritten)."}, {"id": "c1_18", "ch": 1, "type": "fill", "q": "A/an ______ disease is a new disease being reported in increasing numbers within a population.", "answers": ["emerging"], "exp": "Emerging = new to the population."}, {"id": "c1_19", "ch": 1, "type": "fill", "q": "A/an ______ disease is one which has existed in the past but is currently seeing increasing numbers of cases.", "answers": ["reemerging"], "exp": "Reemerging = was present before, now rising again."}, {"id": "c1_20", "ch": 1, "type": "fill", "q": "When positive cases of a disease have been detected on multiple continents, it is declared a ______.", "answers": ["pandemic"], "exp": "Pandemic = multi-continent spread (vs. epidemic = regional)."}, {"id": "c1_21", "ch": 1, "type": "fill", "q": "A disease acquired by humans from a particular animal is considered ______.", "answers": ["zoonotic"], "exp": "Zoonotic diseases jump from animals to humans."}, {"id": "c1_22", "ch": 1, "type": "fill", "q": "Pasteur's experiments helped replace the theory of spontaneous generation with the principle of ______ -- that life arises only from preexisting life.", "answers": ["biogenesis"], "exp": "Biogenesis is the opposite of abiogenesis/spontaneous generation."}, {"id": "c1_23", "ch": 1, "type": "mc", "q": "Van Leeuwenhoek's “animalcules,” observed with a simple microscope, are now recognized as:", "opts": ["Microorganisms", "Viruses only", "Parasitic worms", "Prions"], "correct": 0, "exp": "Animalcules was Leeuwenhoek's term for the microorganisms he observed."}, {"id": "c1_24", "ch": 1, "type": "fill", "q": "A disease native to animals that can be transmitted to humans is called a ______.", "answers": ["zoonosis", "zoonoses", "a zoonosis"], "exp": "Zoonosis = animal-to-human transmissible disease."}, {"id": "c1_25", "ch": 1, "type": "mc", "q": "The standard taxonomic ranks, from broadest to narrowest, are:", "opts": ["Kingdom, Domain, Phylum, Class, Order, Family, Genus, Species", "Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species", "Domain, Phylum, Kingdom, Class, Family, Order, Genus, Species", "Species, Genus, Family, Order, Class, Phylum, Kingdom, Domain (as broadest first)"], "correct": 1, "exp": "Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species -- “Dear King Philip Came Over For Good Soup.”", "terms": ["taxonomy"]}, {"id": "c1_26", "ch": 1, "type": "fill", "q": "In the late 1600s, ______ designed several simple microscopes to observe microbes.", "answers": ["van leeuwenhoek", "leeuwenhoek"], "exp": "Van Leeuwenhoek pioneered simple single-lens microscopes."}, {"id": "c1_27", "ch": 1, "type": "fill", "q": "______ was the first surgeon to introduce aseptic techniques into the operating room to reduce microbes and prevent infection.", "answers": ["lister", "joseph lister"], "exp": "Joseph Lister pioneered antiseptic surgery -- don't confuse with Semmelweis, who focused on handwashing in obstetrics."}, {"id": "c1_28", "ch": 1, "type": "fill", "q": "As a leading microbiologist during the Golden Age of microbiology, ______ disproved the theory of abiogenesis (spontaneous generation).", "answers": ["pasteur", "louis pasteur"], "exp": "Pasteur's swan-neck flask experiments were the final, decisive blow to spontaneous generation."}, {"id": "c1_29", "ch": 1, "type": "fill", "q": "Also during the Golden Age of microbiology, ______ established four proofs (postulates) that could be used to determine an organism's pathogenicity, and developed many lab techniques still used today.", "answers": ["koch", "robert koch"], "exp": "Koch's postulates and pure culture technique."}, {"id": "c1_30", "ch": 1, "type": "match", "q": "Match each clue to its taxonomic domain (fuller set).", "items": ["Includes fungi, protozoa, and animals", "Humans", "Domain with the closest relationship to the eukaryotic domain", "Gram-positive bacteria", "Extreme prokaryotes", "Includes prokaryotes such as Staphylococcus aureus", "Methane-producing prokaryotes"], "rights": ["Domain Eukarya", "Domain Eukarya", "Domain Archaea", "Domain Bacteria", "Domain Archaea", "Domain Bacteria", "Domain Archaea"], "exp": "Archaea: closest relation to Eukarya, extremophiles, methanogens. Bacteria: gram-positive bacteria, Staph aureus. Eukarya: humans, fungi/protozoa/animals.", "terms": ["Archaea"]}, {"id": "c1_31", "ch": 1, "type": "match", "q": "Match each statement to the correct cell type.", "items": ["Does not contain organelles but can replicate independently via binary fission", "Contains a nucleus and undergoes mitosis", "Does not contain ribosomes and cannot replicate independently", "Contains ribosomes and enzymes", "Contains nucleic acid"], "rights": ["Prokaryotic cells", "Eukaryotic cells", "Viruses", "Both eukaryotic and prokaryotic cells", "All three (prokaryotic cells, eukaryotic cells, and viruses)"], "exp": "Viruses lack ribosomes/organelles and can't replicate alone; both cell types share ribosomes; all three contain nucleic acid."}, {"id": "c1_32", "ch": 1, "type": "mc", "q": "Which trait is shared by BOTH prokaryotic and eukaryotic cells?", "opts": ["DNA and ribosomes", "A nucleus", "A Golgi body", "A cell wall (universally)"], "correct": 0, "exp": "DNA and ribosomes are universal; nucleus/Golgi are eukaryote-only, and cell walls are not universal to either domain."}, {"id": "c1_33", "ch": 1, "type": "mc", "q": "A nurse explains a zoonosis to a patient. What is the best description?", "opts": ["Any viral disease", "Any disease treatable with antibiotics", "A disease typically found in animals that can infect humans", "A disease caused by a eukaryotic parasite"], "correct": 2, "exp": "Zoonosis = animal-origin disease transmissible to humans."}, {"id": "d1_01", "ch": 1, "type": "discuss", "q": "Define ‘microorganism’ and outline the important contributions microbes make to Earth's ecosystems.", "model": "Microorganisms are living things too small to see unaided (bacteria, archaea, fungi, protozoa, algae, plus acellular viruses). They recycle nutrients through decomposition, anchor many food chains, fix nitrogen, and produce much of the planet's oxygen."}, {"id": "d1_02", "ch": 1, "type": "discuss", "q": "Describe five different ways humans exploit microorganisms for our benefit.", "model": "Food/beverage production (bread, cheese, yogurt, beer); antibiotic and drug production; bioremediation of pollutants; biotechnology/genetic engineering (insulin, vaccines); agriculture (nitrogen fixation, biopesticides)."}, {"id": "d1_03", "ch": 1, "type": "discuss", "q": "Identify the groups of microorganisms within the scope of microbiology, and the criteria for including them.", "model": "Bacteria, archaea, fungi, protozoa, algae, helminths, and viruses -- grouped by being microscopic (or, for helminths, by medical/parasitic relevance)."}, {"id": "d1_04", "ch": 1, "type": "discuss", "q": "Rank the microbial groups from smallest to largest.", "model": "Viruses < bacteria/archaea < protozoa/fungi/algae < helminths (visible as adults)."}, {"id": "d1_05", "ch": 1, "type": "discuss", "q": "Construct a table of microbial groups based on cell type.", "model": "Acellular: viruses. Prokaryotic: bacteria, archaea. Eukaryotic: fungi, protozoa, algae, helminths."}, {"id": "d1_06", "ch": 1, "type": "discuss", "q": "Explain: ‘Microorganisms -- we need to live with them because we can't live without them.’", "model": "Only a small fraction of microbes are pathogens; the vast majority are essential for digestion, nutrient cycling, oxygen production, and ecosystem balance."}, {"id": "d1_07", "ch": 1, "type": "discuss", "q": "Describe ways the beneficial qualities of microbes outweigh their role as infectious agents.", "model": "Decomposition, food production, drug synthesis, soil fertility, and symbiotic digestion (gut microbiota) all vastly outweigh the comparatively few pathogenic species."}, {"id": "d1_08", "ch": 1, "type": "discuss", "q": "What strategies are used to combat different infectious diseases?", "model": "Vaccines (prevention), antibiotics/antivirals/antifungals (treatment), sanitation/hygiene (transmission control), and quarantine/public health measures."}, {"id": "d1_09", "ch": 1, "type": "discuss", "q": "Distinguish emerging vs. reemerging infectious diseases, and the factors driving them.", "model": "Emerging = new to a population; reemerging = a previously-declining disease rising again. Drivers: global travel, climate change, antimicrobial resistance, deforestation, vaccine hesitancy."}, {"id": "d1_10", "ch": 1, "type": "discuss", "q": "Outline the most significant discoveries in microscopy, culture technique, and microbe control.", "model": "Leeuwenhoek's simple microscopes; Pasteur's swan-neck flasks disproving spontaneous generation; Koch's pure culture technique and postulates; Lister's antiseptic surgery; Tyndall's discovery of heat-resistant spores."}, {"id": "d1_11", "ch": 1, "type": "discuss", "q": "Differentiate a hypothesis from a theory. What does ‘only a theory’ really mean in science?", "model": "A hypothesis is a tentative, testable explanation; a theory is a hypothesis thoroughly supported by repeated, peer-reviewed testing. ‘Only a theory’ misunderstands that in science, theory signals high confidence, not a guess."}, {"id": "d1_12", "ch": 1, "type": "discuss", "q": "Is the germ theory of disease actually a law? Justify your answer.", "model": "No -- it remains a theory. ‘Law’ is reserved for an even stricter tier, and germ theory, while extremely well-supported, is explanatory rather than a strict mathematical law."}, {"id": "d1_13", "ch": 1, "type": "discuss", "q": "Why was abandoning spontaneous generation so significant?", "model": "It redirected science toward biogenesis and paved the way for germ theory, sanitation, and modern medicine."}, {"id": "d1_14", "ch": 1, "type": "discuss", "q": "Differentiate taxonomy, classification, and nomenclature.", "model": "Taxonomy = the science of classification; classification = arranging organisms into hierarchical groups; nomenclature = the naming system."}, {"id": "d1_15", "ch": 1, "type": "discuss", "q": "What is the basis for a phylogenetic classification system?", "model": "Evolutionary relationships/common ancestry, often inferred from molecular (rRNA) sequence similarity."}, {"id": "d1_16", "ch": 1, "type": "discuss", "q": "Explain binomial nomenclature and give the taxa order, most general to most specific.", "model": "Each organism gets a two-part italicized Latin name (Genus species, genus capitalized). Order: Domain, Kingdom, Phylum, Class, Order, Family, Genus, Species."}, {"id": "d1_17", "ch": 1, "type": "discuss", "q": "What are the benefits of using scientific names?", "model": "Universal and precise across languages, avoiding the ambiguity of common names that vary by region."}, {"id": "d1_18", "ch": 1, "type": "discuss", "q": "Define evolution.", "model": "Change in the heritable characteristics of populations across generations, driven by mutation, selection, drift, and gene flow."}, {"id": "d1_19", "ch": 1, "type": "discuss", "q": "How does evolution explain the diversity and adaptation of species? Give examples.", "model": "Natural selection favors environment-suited traits over time, producing huge adapted diversity -- e.g., extremophile archaea, antibiotic-resistant bacteria."}, {"id": "d1_20", "ch": 1, "type": "discuss", "q": "Looking at the tree of life, which kingdom(s) are humans most closely related to?", "model": "Animalia, within Domain Eukarya."}, {"id": "d1_21", "ch": 1, "type": "discuss", "q": "Archaea often live in extreme heat/salt/acidity similar to early Earth -- speculate on the origin of life.", "model": "Suggests early life may have arisen in similarly harsh conditions (e.g., hydrothermal vents), with archaea as an ancient lineage adapted to those primordial extremes."}, {"id": "d1_22", "ch": 1, "type": "discuss", "q": "Compare the domain system with the five-kingdom system. Does it change the prokaryote/eukaryote idea? What's the third cell type?", "model": "The three-domain system splits prokaryotes into Bacteria and Archaea (plus Eukarya), revealing Archaea as a distinct third cell type -- refining, not discarding, the prokaryote/eukaryote split."}, {"id": "d1_23", "ch": 1, "type": "discuss", "q": "What does it mean to say microbes are ubiquitous?", "model": "They are found virtually everywhere -- soil, water, air, extreme environments, and on/in other organisms."}, {"id": "d1_24", "ch": 1, "type": "discuss", "q": "What is meant by diversity with respect to organisms?", "model": "The wide variety of species, forms, and metabolic strategies found across life."}, {"id": "d1_25", "ch": 1, "type": "discuss", "q": "What events/discoveries/inventions were most significant in developing microbiology, and why?", "model": "The microscope (made microbes visible), disproof of spontaneous generation (established biogenesis), germ theory (linked microbes to disease), and aseptic/pure-culture technique (enabled controlled study)."}, {"id": "d1_26", "ch": 1, "type": "discuss", "q": "Explain how microbiologists use the scientific method to develop theories.", "model": "Observe, form a hypothesis, design and run controlled experiments, analyze data, refine or reject -- after repeated peer-reviewed confirmation, elevate to theory."}, {"id": "d1_27", "ch": 1, "type": "discuss", "q": "Explain how microbes are classified by evolutionary relationships, named, and identified.", "model": "Grouped via phylogenetic/molecular relatedness, given standard binomial Latin names, and identified using morphological, biochemical, and genetic criteria."}, {"id": "d1_28", "ch": 1, "type": "discuss", "q": "(a) What are sources of ‘new’ infectious diseases? (b) Comment on sensationalized media portrayal of infectious disease dangers.", "model": "(a) Zoonotic spillover, mutation, travel/urbanization, antimicrobial resistance. (b) Media can exaggerate rare risks or oversimplify outbreak dynamics, fueling fear disproportionate to actual risk."}, {"id": "d1_29", "ch": 1, "type": "discuss", "q": "What would the world be like with cures for all infectious disease and a way to destroy all microbes? What characteristics of microbes prevent this?", "model": "Impossible in practice: microbes reproduce/mutate far faster than we can counter them, exist in astronomical numbers, occupy unsterilizable niches, and many are essential to ecosystems and our own bodies."}, {"id": "d1_30", "ch": 1, "type": "discuss", "q": "Describe the scientific reasoning in experiments supporting vs. denying spontaneous generation.", "model": "Needham's flawed heating seemed to support it (inadequate sterilization); Spallanzani's sealed flasks challenged it; Pasteur's swan-neck flask isolated the variable (air without contamination) to conclusively disprove it."}, {"id": "d1_31", "ch": 1, "type": "discuss", "q": "Name the technical title for a microbiologist studying termite-gut protozoa, volcano bacteria, dog tapeworms, food-poisoning molds, emerging viruses, acid-swamp bacteria, and Paramecium classification.", "model": "A microbiologist, broadly -- spanning protozoology, extremophile/environmental microbiology, parasitology, mycology, and virology."}, {"id": "d1_32", "ch": 1, "type": "discuss", "q": "What is the ultimate way microbes will, as Pasteur said, have the ‘last word’?", "model": "All living things, including humans, are ultimately decomposed by microbes after death -- the final stage of the nutrient cycle."}, {"id": "d1_33", "ch": 1, "type": "discuss", "q": "Develop a hypothesis and test for the cause of stomach ulcers (infection/acid/genetics).", "model": "Historically resolved by Barry Marshall, who hypothesized H. pylori infection and proved it by drinking a bacterial culture himself, developing gastritis -- establishing infection as the cause."}, {"id": "d1_34", "ch": 1, "type": "discuss", "q": "Figure 1.10: Jenner inoculating a child against smallpox, with a cow and milkmaid in the background -- explain his reasoning.", "model": "Jenner noticed milkmaids who'd had cowpox seemed immune to smallpox, so he hypothesized deliberate cowpox exposure would protect against smallpox -- the foundation of vaccination."}, {"id": "c4_01", "ch": 4, "type": "mc", "q": "Which structure is not a component of all cells?", "opts": ["Cell wall", "Cell membrane", "Genetic material", "Ribosomes"], "correct": 0, "exp": "Some cells (e.g., mycoplasmas, animal cells) lack a cell wall."}, {"id": "c4_02", "ch": 4, "type": "mc", "q": "Viruses are not considered living things because", "opts": ["They are not cells", "They cannot reproduce by themselves", "They lack metabolism", "All of these are correct"], "correct": 3, "exp": "Viruses fail all three criteria for life."}, {"id": "c4_03", "ch": 4, "type": "mc", "q": "Which of the following is not found in all bacterial cells?", "opts": ["Cell membrane", "A nucleoid", "Ribosomes", "Cytoskeleton"], "correct": 3, "exp": "Not all bacteria have a cytoskeleton; membrane, nucleoid, and ribosomes are universal."}, {"id": "c4_04", "ch": 4, "type": "mc", "q": "The major locomotor structures in bacteria are", "opts": ["Flagella", "Pili", "Fimbriae", "Cilia"], "correct": 0, "exp": "Flagella provide bacterial motility; pili/fimbriae are for attachment/exchange, cilia are eukaryotic."}, {"id": "c4_05", "ch": 4, "type": "mc", "q": "Pili are appendages in ______ bacteria that serve as a means of ______.", "opts": ["gram-positive, genetic exchange", "gram-positive, attachment", "gram-negative, genetic exchange", "gram-negative, protection"], "correct": 2, "exp": "Pili occur on gram-negative cells and mediate conjugation (genetic exchange)."}, {"id": "c4_06", "ch": 4, "type": "mc", "q": "An example of a glycocalyx is", "opts": ["A capsule", "Pili", "Outer membrane", "A cell wall"], "correct": 0, "exp": "A capsule is a well-organized, tightly bound glycocalyx."}, {"id": "c4_07", "ch": 4, "type": "mc", "q": "Which of the following is a primary bacterial cell wall function?", "opts": ["Transport", "Motility", "Support", "Adhesion"], "correct": 2, "exp": "The cell wall's main job is structural support (and shape)."}, {"id": "c4_08", "ch": 4, "type": "mc", "q": "Which of the following is present in both gram-positive and gram-negative cell walls?", "opts": ["An outer membrane", "Peptidoglycan", "Teichoic acid", "Lipopolysaccharides"], "correct": 1, "exp": "Both have peptidoglycan; only gram-negative has LPS/outer membrane, only gram-positive has teichoic acid."}, {"id": "c4_09", "ch": 4, "type": "mc", "q": "Metachromatic granules are concentrated ______ found in ______.", "opts": ["fat, Mycobacterium", "dipicolinic acid, Bacillus", "sulfur, Thiobacillus", "polyphosphate, Corynebacterium"], "correct": 3, "exp": "Metachromatic (volutin) granules are polyphosphate storage, classic in Corynebacterium."}, {"id": "c4_10", "ch": 4, "type": "mc", "q": "Which of the following prokaryotes lacks cell walls?", "opts": ["Rickettsias", "Mycoplasmas", "Mycobacterium", "Archaea"], "correct": 1, "exp": "Mycoplasmas naturally lack a cell wall and rely on sterols in their membrane for strength."}, {"id": "c4_11", "ch": 4, "type": "mc", "q": "The LPS layer in gram-negative cell walls releases ______ that cause ______.", "opts": ["enzymes, pain", "endotoxins, fever", "teichoic acid, inflammation", "phosphates, lysis"], "correct": 1, "exp": "Lipopolysaccharide (LPS) is itself an endotoxin that triggers fever/inflammation."}, {"id": "c4_12", "ch": 4, "type": "mc", "q": "Bacterial endospores function in", "opts": ["Reproduction", "Survival", "Protein synthesis", "Storage"], "correct": 1, "exp": "Endospores are dormant survival structures, not a means of reproduction."}, {"id": "c4_13", "ch": 4, "type": "mc", "q": "An arrangement in packets of eight cells is described as a", "opts": ["Micrococcus", "Diplococcus", "Tetrad", "Sarcina"], "correct": 3, "exp": "Sarcina = cuboidal packets of 8 cocci."}, {"id": "c4_14", "ch": 4, "type": "mc", "q": "The major difference between a spirochete and a spirillum is", "opts": ["The presence of flagella", "The presence of twists", "The nature of motility", "The size"], "correct": 2, "exp": "Spirochetes move via internal axial filaments (endoflagella); spirilla use external flagella."}, {"id": "c4_15", "ch": 4, "type": "mc", "q": "Which phylum contains bacteria with a gram-positive cell wall?", "opts": ["Proteobacteria", "Chlorobi", "Firmicutes (Bacillota)", "Spirochetes"], "correct": 2, "exp": "Firmicutes (Bacillota) is the classic gram-positive phylum."}, {"id": "c4_16", "ch": 4, "type": "mc", "q": "To which taxonomic group do cyanobacteria belong?", "opts": ["Domain Archaea", "Phylum Actinobacteria", "Domain Bacteria", "Phylum Fusobacteria"], "correct": 2, "exp": "Cyanobacteria are photosynthetic members of Domain Bacteria."}, {"id": "c4_17", "ch": 4, "type": "mc", "q": "Which stain is used to distinguish differences between the cell walls of medically important bacteria?", "opts": ["Simple stain", "Acridine orange stain", "Gram stain", "Negative stain"], "correct": 2, "exp": "The Gram stain differentiates based on cell wall/envelope structure."}, {"id": "c4_18", "ch": 4, "type": "mc", "q": "The first living cells on earth would most likely resemble which of these?", "opts": ["A cyanobacterium", "An endospore former", "A gram-positive cell", "An archaeon"], "correct": 3, "exp": "Archaea are thought to most resemble the earliest cells, adapted to harsh early-earth conditions."}, {"id": "c4_19", "ch": 4, "type": "match", "q": "Match the cell wall component with the type of cell where it is found.", "items": ["Teichoic acid", "Lipopolysaccharide / outer membrane", "Peptidoglycan; cell membrane"], "rights": ["Gram-positive cells", "Gram-negative cells", "Both gram-positive and gram-negative cells"], "exp": "Teichoic acid = gram-positive only; LPS/outer membrane = gram-negative only; peptidoglycan and the cell membrane are shared by both."}, {"id": "c4_20", "ch": 4, "type": "match", "q": "Match each cell type with the statement that best describes its wall.", "items": ["Gram-positive cells", "Gram-negative cells", "Acid-fast cells", "Mycoplasmas"], "rights": ["Cells with a thick layer of peptidoglycan and teichoic acids", "Cells with both an inner and outer membrane plus a thin layer of peptidoglycan", "Cells with a thick layer of mycolic acid (cord factor)", "Cells which lack a peptidoglycan cell wall but have sterols in their membrane"], "exp": "Acid-fast cells (e.g., Mycobacterium) resist Gram staining because of their waxy mycolic acid wall.", "terms": ["Gram stain", "acid-fast"]}, {"id": "c4_21", "ch": 4, "type": "match", "q": "Match the flagellar arrangement term to its description.", "items": ["Polar", "Monotrichous", "Lophotrichous", "Amphitrichous", "Peritrichous"], "rights": ["Flagella at either or both ends of the cell (general term)", "One flagellum attached at one end of the cell", "A tuft of flagella originating from the same point on the cell", "Flagella at both poles of the cell", "Flagella distributed randomly around the entire cell"], "exp": "Polar is the general term; mono/lopho/amphi are specific polar patterns; peritrichous is all-over."}, {"id": "c4_22", "ch": 4, "type": "match", "q": "Match the external appendage to the description of its function.", "items": ["Flagella", "Fimbriae", "Pili", "Axial filaments"], "rights": ["Composed of a filament, hook, and basal body; provide movement to the cell", "Short, bristle-like projections used to attach the cell to other cells or surfaces", "Long, tubular appendages that allow cells to conjugate with other cells", "Long, coiled threads that provide movement to spirochetes"], "exp": "Don't mix up fimbriae (attachment) with pili (conjugation) -- a classic matching trap."}, {"id": "c4_23", "ch": 4, "type": "match", "q": "Match the glycocalyx-related term to its description.", "items": ["Glycocalyx", "Slime layer", "Capsule"], "rights": ["General term for all coatings covering the surface of the cell", "A loosely attached, thin, mucoid layer that protects against drying or nutrient loss", "A layer of polysaccharides/proteins tightly bound to the cell that contributes to pathogenicity"], "exp": "Glycocalyx is the umbrella term; slime layer (loose) and capsule (tightly bound, virulence factor) are its two forms."}, {"id": "c4_24", "ch": 4, "type": "mc", "q": "Going from innermost to outermost, the correct order of generalized bacterial cell structures is:", "opts": ["Cytoplasmic matrix → Cell wall → Cell membrane → Glycocalyx", "Cytoplasmic matrix → Cell membrane → Cell wall → Glycocalyx", "Glycocalyx → Cell wall → Cell membrane → Cytoplasmic matrix (innermost last)", "Cell membrane → Cytoplasmic matrix → Cell wall → Glycocalyx"], "correct": 1, "exp": "Innermost to outermost: cytoplasm, then membrane, then wall, then the outer glycocalyx."}, {"id": "c4_25", "ch": 4, "type": "fill", "q": "The correct order of Gram stain steps is: crystal violet, ______, decolorizer, safranin.", "answers": ["iodine"], "exp": "Mnemonic: “Come In And Stain” -- Crystal violet, Iodine, Alcohol (decolorizer), Safranin.", "terms": ["Gram stain"]}, {"id": "c4_26", "ch": 4, "type": "mc", "q": "The riskiest step in Gram staining -- where over- or under-timing causes most technique errors -- is the:", "opts": ["Primary stain", "Mordant", "Decolorization", "Counterstain"], "correct": 2, "exp": "Decolorization is the highest-risk, most error-prone step in both Gram and acid-fast staining.", "terms": ["Gram stain"]}, {"id": "c4_27", "ch": 4, "type": "tf", "q": "The Gram stain reliably classifies Mycobacterium tuberculosis as either gram-positive or gram-negative.", "correct": false, "exp": "False -- its mycolic-acid-rich wall resists the Gram stain entirely; acid-fast staining is required instead.", "terms": ["acid-fast"]}, {"id": "c4_28", "ch": 4, "type": "mc", "q": "Bacterial capsules contribute to pathogenicity by:", "opts": ["Enhancing antibiotic resistance", "Allowing bacteria to evade the immune system of the host", "Facilitating endospore formation", "Increasing bacterial motility"], "correct": 1, "exp": "Capsules help bacteria evade phagocytosis by the host immune system."}, {"id": "c4_29", "ch": 4, "type": "mc", "q": "What is the difference between a bacterial capsule and a slime layer?", "opts": ["A capsule is loosely attached while a slime layer is tightly bound to the cell", "A capsule is composed primarily of proteins while a slime layer is made of DNA", "A capsule is more tightly bound to the cell, and more organized, than a slime layer", "There is no difference -- the two terms refer to the same structure"], "correct": 2, "exp": "Capsule = tightly bound, organized; slime layer = loosely attached."}, {"id": "c4_30", "ch": 4, "type": "mc", "q": "Which feature is found in all prokaryotic cells?", "opts": ["Cell membrane", "Endospores", "Flagella", "Nucleus"], "correct": 0, "exp": "Cell membrane is universal; endospores, flagella, and nuclei are not."}, {"id": "c4_31", "ch": 4, "type": "mc", "q": "Cell membranes are composed principally of", "opts": ["DNA and protein", "Phospholipids and DNA", "Protein and phospholipids", "Carbohydrates and proteins"], "correct": 2, "exp": "Membranes are a phospholipid bilayer studded with proteins."}, {"id": "d4_01", "ch": 4, "type": "discuss", "q": "Using clay, show how cocci divide in several planes, and how bacilli arrangements (including palisades) occur.", "model": "Cocci dividing in one plane form chains (streptococci); two planes form tetrads; three planes form packets (sarcina) or irregular clusters (staphylococci). Bacilli dividing and staying attached end-to-end form chains or palisades (snapping division, V-shapes)."}, {"id": "d4_02", "ch": 4, "type": "discuss", "q": "Compare a corkscrew and a spring to spirilla and spirochetes' flexibility and locomotion.", "model": "A rigid corkscrew represents a spirillum (stiff helical cell, external flagella rotate the whole rigid cell). A flexible spring represents a spirochete (flexible cell, internal axial filaments flex/corkscrew the body for movement)."}, {"id": "d4_03", "ch": 4, "type": "discuss", "q": "A rod-shaped cell is swimming rapidly forward. (a) What do you know about its structure? (b) Propose another flagellar function besides locomotion.", "model": "(a) It possesses flagella. (b) Flagella can also act as sensory/chemotaxis appendages, or aid attachment/invasion in some pathogens."}, {"id": "d4_04", "ch": 4, "type": "discuss", "q": "Name an acid-fast bacterium and explain what makes it different from other gram-positive bacteria.", "model": "Mycobacterium tuberculosis -- its cell wall is rich in waxy mycolic acid, resisting standard Gram staining and requiring acid-fast staining instead.", "terms": ["acid-fast"]}, {"id": "d4_05", "ch": 4, "type": "discuss", "q": "(a) Name a photosynthetic bacterial group. (b) Describe the two major photosynthetic bacterial groups and their similarities/differences.", "model": "(a) Cyanobacteria. (b) Cyanobacteria perform oxygenic photosynthesis (produce O2, like plants); green/purple sulfur bacteria perform anoxygenic photosynthesis (no O2 produced, using H2S instead of water)."}, {"id": "d4_06", "ch": 4, "type": "discuss", "q": "Propose a hypothesis for how bacteria and archaea together gave rise to eukaryotes.", "model": "Endosymbiotic theory: an archaeal host cell engulfed an aerobic bacterium (ancestor of mitochondria) and, in some lineages, a cyanobacterium (ancestor of chloroplasts), forming a stable symbiosis that became the eukaryotic cell."}, {"id": "d4_07", "ch": 4, "type": "discuss", "q": "What happens to the cell wall if penicillin blocks interbridge (cross-link) synthesis?", "model": "Peptidoglycan cross-linking fails, the wall can't maintain its shape/strength, and the cell undergoes osmotic lysis, especially in a hypotonic environment."}, {"id": "d4_08", "ch": 4, "type": "discuss", "q": "Describe the biofilm-on-a-glass-slide observation technique.", "model": "Suspending a slide in an aquarium for weeks, then air-drying, fixing, and Gram staining it reveals a diverse, layered community of attached cell types -- a hands-on look at natural biofilm formation."}, {"id": "d4_09", "ch": 4, "type": "discuss", "q": "Label the parts of a generalized bacterial cell and describe each part's function.", "model": "See the labeling diagram in this app -- capsule/glycocalyx: protection/adhesion; cell wall: shape/support; cell membrane: transport barrier; cytoplasm: site of metabolism; nucleoid: DNA; flagellum: motility."}, {"id": "d4_10", "ch": 4, "type": "discuss", "q": "Discuss the properties used to define life and which prokaryotic structures carry them out.", "model": "Growth (wall/membrane synthesis), reproduction (binary fission via the nucleoid), metabolism (ribosomes/enzymes), responsiveness (membrane receptors, flagella/chemotaxis), heredity (nucleoid DNA)."}, {"id": "d4_11", "ch": 4, "type": "discuss", "q": "Describe the basic process of biofilm formation.", "model": "Free-floating cells attach to a surface, secrete an extracellular polysaccharide matrix, recruit more cells (often via quorum sensing), and mature into a structured, protected community."}, {"id": "d4_12", "ch": 4, "type": "discuss", "q": "What leads microbiologists to believe archaea are more closely related to eukaryotes than to bacteria?", "model": "Shared rRNA sequence similarities, similar RNA polymerase and ribosomal proteins, and shared histone-like DNA packaging -- all closer to eukaryotic machinery than to bacteria's."}, {"id": "d4_13", "ch": 4, "type": "discuss", "q": "What's required to kill endospores, and how can spores be dated as thousands/millions of years old?", "model": "Killing requires extended high heat (autoclaving, 121°C for 15+ minutes) or strong chemical sterilants. Their extreme dormancy and resistant coats let viable spores survive and later be recovered from ancient sediment or sealed environments."}, {"id": "d4_14", "ch": 4, "type": "discuss", "q": "Which bacteria has a well-developed capsule, Klebsiella or S. aureus? Defend your answer.", "model": "Klebsiella -- encapsulated colonies look large, moist, and mucoid/gummy on agar (e.g., CHROMagar), unlike S. aureus's smaller, non-mucoid colonies."}, {"id": "d4_15", "ch": 4, "type": "discuss", "q": "Why do Clostridium cells stain unevenly under the Gram stain?", "model": "Their endospores don't take up Gram stains, appearing as clear, unstained refractive ovals within the stained vegetative cell body.", "terms": ["Gram stain"]}, {"id": "c5_01", "ch": 5, "type": "mc", "q": "Flagella and cilia are found primarily in", "opts": ["Algae", "Protozoa", "Fungi", "Both a and b"], "correct": 1, "exp": "Protozoa commonly use flagella/cilia for locomotion."}, {"id": "c5_02", "ch": 5, "type": "mc", "q": "Features of the nuclear envelope include", "opts": ["Ribosomes", "A double membrane structure", "Pores that allow communication with the cytoplasm", "b and c"], "correct": 3, "exp": "The nuclear envelope is a double membrane with pores -- both b and c."}, {"id": "c5_03", "ch": 5, "type": "mc", "q": "The cell wall is usually found in which eukaryotes?", "opts": ["Fungi", "Algae", "Protozoa", "a and b"], "correct": 3, "exp": "Fungi and algae have cell walls; protozoa and animal cells do not -- cell walls are NOT universal in eukaryotes."}, {"id": "c5_04", "ch": 5, "type": "mc", "q": "What is embedded in rough endoplasmic reticulum?", "opts": ["Ribosomes", "Golgi apparatus", "Chromatin", "Vesicles"], "correct": 0, "exp": "Ribosomes studding the ER make it “rough.”"}, {"id": "c5_05", "ch": 5, "type": "mc", "q": "Yeasts are ______ fungi, and molds are ______ fungi.", "opts": ["macroscopic, microscopic", "unicellular, filamentous", "motile, nonmotile", "water, terrestrial"], "correct": 1, "exp": "Yeasts: single-celled. Molds: filamentous (hyphae/mycelium)."}, {"id": "c5_06", "ch": 5, "type": "mc", "q": "In general, fungi derive nutrients through", "opts": ["Photosynthesis", "Engulfing bacteria", "Digesting organic substrates", "Parasitism"], "correct": 2, "exp": "Fungi are heterotrophic saprobes/parasites that secrete enzymes to digest organic matter externally."}, {"id": "c5_07", "ch": 5, "type": "mc", "q": "A hypha divided into compartments by cross walls is called", "opts": ["Nonseptate", "Imperfect", "Septate", "Perfect"], "correct": 2, "exp": "Septate hyphae have cross-walls (septa); nonseptate (coenocytic) do not."}, {"id": "c5_08", "ch": 5, "type": "mc", "q": "Algae generally contain some type of", "opts": ["Spore", "Chlorophyll", "Locomotor organelle", "Toxin"], "correct": 1, "exp": "Chlorophyll enables algae's photosynthesis."}, {"id": "c5_09", "ch": 5, "type": "mc", "q": "Which algal group is most closely related to plants?", "opts": ["Diatoms", "Chlorophyta", "Euglenophyta", "Dinoflagellates"], "correct": 1, "exp": "Chlorophyta (green algae) share a common ancestor with land plants."}, {"id": "c5_10", "ch": 5, "type": "mc", "q": "Which characteristic is not typical of protozoan cells?", "opts": ["Locomotor organelle", "Cyst", "Spore", "Trophozoite"], "correct": 2, "exp": "Protozoa form cysts (not spores) as a resistant/dormant stage."}, {"id": "c5_11", "ch": 5, "type": "mc", "q": "The protozoan trophozoite is the", "opts": ["Active feeding stage", "Inactive dormant stage", "Infective stage", "Spore-forming stage"], "correct": 0, "exp": "Trophozoite = the active, feeding/motile form (vs. the dormant cyst)."}, {"id": "c5_12", "ch": 5, "type": "mc", "q": "Humans are infected with Plasmodium through the bite of a", "opts": ["Fly", "Kissing bug", "Mosquito", "Worm"], "correct": 2, "exp": "Anopheles mosquitoes transmit malaria (Plasmodium)."}, {"id": "c5_13", "ch": 5, "type": "mc", "q": "Parasitic helminths reproduce with", "opts": ["Spores", "Eggs and sperm", "Mitosis", "Cysts"], "correct": 1, "exp": "Helminths are animals and reproduce sexually via eggs and sperm."}, {"id": "c5_14", "ch": 5, "type": "mc", "q": "Mitochondria likely originated from", "opts": ["Archaea", "Invaginations of the cell membrane", "Bacteria", "Cyanobacteria"], "correct": 2, "exp": "Mitochondria descend from engulfed aerobic bacteria (endosymbiotic theory); chloroplasts descend from cyanobacteria."}, {"id": "c5_15", "ch": 5, "type": "mc", "q": "Human fungal infections involve and affect what areas of the human body?", "opts": ["Skin", "Mucous membranes", "Lungs", "All of these"], "correct": 3, "exp": "Fungal infections (mycoses) can affect skin, mucous membranes, and lungs."}, {"id": "c5_16", "ch": 5, "type": "tf", "q": "All eukaryotic cells have a cell wall.", "correct": false, "exp": "False -- a common trick answer. Fungi, algae, and plants have cell walls; protozoa and animal cells do not."}, {"id": "c5_17", "ch": 5, "type": "mc", "q": "Evidence supporting the endosymbiotic theory for mitochondria and chloroplasts includes all of the following EXCEPT:", "opts": ["They contain their own circular DNA", "They have 70S (bacteria-sized) ribosomes", "They divide independently via binary fission", "They are surrounded by a single membrane"], "correct": 3, "exp": "They're surrounded by a DOUBLE membrane, not a single one -- that's the exception/trap."}, {"id": "c5_18", "ch": 5, "type": "mc", "q": "A budding yeast cell that fails to fully separate from its parent, forming a chain of cells, is called a:", "opts": ["Hypha", "Pseudohypha", "Mycelium", "Conidium"], "correct": 1, "exp": "Pseudohyphae are chains of incompletely separated budding yeast cells."}, {"id": "d5_01", "ch": 5, "type": "discuss", "q": "Describe algae's principal characteristics that separate them from protozoa.", "model": "Algae are photosynthetic (contain chlorophyll, often have a cell wall); protozoa are heterotrophic and motile, lacking a wall."}, {"id": "d5_02", "ch": 5, "type": "discuss", "q": "How are algae medically important? Give examples.", "model": "Some produce toxins (e.g., red tide dinoflagellates causing paralytic shellfish poisoning); diatoms have industrial uses; most matter ecologically (oxygen production, food chains) rather than being directly pathogenic."}, {"id": "d5_03", "ch": 5, "type": "discuss", "q": "Explain the general characteristics of the protozoan life cycle.", "model": "Alternates between an active, feeding trophozoite stage and a dormant, resistant cyst stage used for transmission and survival."}, {"id": "d5_04", "ch": 5, "type": "discuss", "q": "Identify the supergroups that contain protozoans, and name important pathogens in each.", "model": "E.g., Excavata (Giardia, Trichomonas), Amoebozoa (Entamoeba), Alveolata (Plasmodium, Toxoplasma) -- each with distinct medically important species."}, {"id": "d5_05", "ch": 5, "type": "discuss", "q": "Discuss the adaptations of parasitic worms to their lifestyle.", "model": "Reduced digestive/sensory systems, a protective cuticle, hooks/suckers for attachment, and enormous reproductive output to offset low transmission success."}, {"id": "d5_06", "ch": 5, "type": "discuss", "q": "Outline the basic steps in a protozoan/helminth infection cycle.", "model": "Transmission of an infective form (cyst, or egg/larva) leads to establishment in host tissue, maturation and reproduction, then release of new infective forms back into the environment."}, {"id": "d5_07", "ch": 5, "type": "discuss", "q": "Describe the anatomy and function of the major eukaryotic organelles.", "model": "Nucleus (genetic control), mitochondria (ATP via aerobic respiration), ER (rough: protein synthesis/processing; smooth: lipid synthesis), Golgi (packaging/sorting), lysosomes (digestion), chloroplasts (photosynthesis, in algae)."}, {"id": "d5_08", "ch": 5, "type": "discuss", "q": "Trace the synthesis, processing, and packaging of cell products through the organelle network.", "model": "Ribosomes on rough ER synthesize proteins, the ER folds/modifies them, they're transported to the Golgi for further modification/sorting, then packaged into vesicles and sent to their destination."}, {"id": "d5_09", "ch": 5, "type": "discuss", "q": "(a) What is the reproductive potential of molds in terms of spores? (b) How do mold spores differ from bacterial endospores?", "model": "(a) Molds can produce enormous numbers of spores for widespread dispersal and reproduction. (b) Mold spores are reproductive (increase cell number); bacterial endospores are a single dormant survival structure, not for multiplication."}, {"id": "d5_10", "ch": 5, "type": "discuss", "q": "Compare eukaryotic organelles/structures across fungi, algae, and protozoa.", "model": "Cell wall: fungi (chitin) and algae (cellulose/silica) have one, protozoa do not. Chloroplasts: algae only. Flagella/cilia: common in protozoa and some algae. Spores: fungi (asexual/sexual) and some protozoa (oocysts)."}, {"id": "d5_11", "ch": 5, "type": "discuss", "q": "Explain the ways mitochondria resemble bacteria and chloroplasts resemble cyanobacteria.", "model": "Both organelles have their own circular DNA, 70S ribosomes, double membranes, and divide by binary fission independent of the host cell cycle -- strong evidence for endosymbiotic origin."}, {"id": "d5_12", "ch": 5, "type": "discuss", "q": "Give the common name of a eukaryotic microbe that is unicellular, walled, nonphotosynthetic, nonmotile, and bud-forming.", "model": "Yeast."}, {"id": "d5_13", "ch": 5, "type": "discuss", "q": "How are eukaryotic ribosomes and cell membranes different from those of prokaryotes?", "model": "Eukaryotic ribosomes are larger (80S vs. 70S), and membranes contain sterols (e.g., cholesterol) that most prokaryotic membranes lack."}, {"id": "d5_14", "ch": 5, "type": "discuss", "q": "What general type of multicellular parasite is composed primarily of thin sacs of reproductive organs?", "model": "Cestode (tapeworm)."}, {"id": "d5_15", "ch": 5, "type": "discuss", "q": "(a) Name two parasites transmitted in cyst form. (b) How must a non-cyst-forming protozoan be transmitted, and why?", "model": "(a) Entamoeba histolytica, Giardia lamblia. (b) Must transmit directly (e.g., sexual contact for Trichomonas vaginalis) since fragile trophozoites die quickly outside a host without a protective cyst wall."}, {"id": "d5_16", "ch": 5, "type": "discuss", "q": "What factors could make opportunistic mycoses a growing medical problem?", "model": "Rising numbers of immunocompromised patients (chemo, HIV, transplants, diabetes) let normally harmless fungi cause serious infections."}, {"id": "d5_17", "ch": 5, "type": "discuss", "q": "(a) How are bacterial endospores and protozoan cysts alike? (b) How do they differ?", "model": "(a) Both are dormant, resistant survival stages formed under stress. (b) Endospores are far more heat/chemical resistant and don't increase cell number; cysts are part of a parasite's transmission/infection cycle."}, {"id": "d5_18", "ch": 5, "type": "discuss", "q": "For what reasons would a eukaryotic cell evolve an ER and Golgi apparatus?", "model": "To compartmentalize and efficiently manage the much larger volume of protein/lipid synthesis, folding, modification, and sorting needed as cells grew larger and more complex."}, {"id": "d5_19", "ch": 5, "type": "discuss", "q": "Describe a simple test to determine if a child has pinworms.", "model": "The ‘Scotch tape test’ -- press clear tape against the perianal skin first thing in the morning to collect eggs for microscopic examination."}, {"id": "d5_20", "ch": 5, "type": "discuss", "q": "A species shows both hyphae and budding yeast forms depending on conditions -- what's this trait called, and what organisms show it?", "model": "Dimorphism -- seen in dimorphic fungi (e.g., Histoplasma, Blastomyces), which switch forms depending on temperature/environment."}, {"id": "c7_01", "ch": 7, "type": "mc", "q": "An organic nutrient essential to an organism's metabolism that cannot be synthesized itself is termed a/an", "opts": ["Trace element", "Micronutrient", "Growth factor", "Mineral"], "correct": 2, "exp": "A growth factor is an essential organic compound the organism cannot make itself."}, {"id": "c7_02", "ch": 7, "type": "mc", "q": "The source of the necessary elements of life is", "opts": ["An inorganic environmental reservoir", "The sun", "Rocks", "The air"], "correct": 0, "exp": "Elements ultimately come from the inorganic environment (soil, water, air, minerals)."}, {"id": "c7_03", "ch": 7, "type": "mc", "q": "An organism that can synthesize all its required organic components from CO2 using energy from the sun is a", "opts": ["Photoautotroph", "Photoheterotroph", "Chemoautotroph", "Chemoheterotroph"], "correct": 0, "exp": "Photoautotroph: CO2 carbon source + light energy."}, {"id": "c7_04", "ch": 7, "type": "mc", "q": "An obligate halophile requires high", "opts": ["pH", "Temperature", "Salt", "Pressure"], "correct": 2, "exp": "Halophiles need high salt concentrations to survive."}, {"id": "c7_05", "ch": 7, "type": "mc", "q": "Chemoautotrophs can survive on ______ alone.", "opts": ["Minerals", "CO2", "Minerals and CO2", "Methane"], "correct": 2, "exp": "Chemoautotrophs use inorganic minerals for energy and CO2 for carbon."}, {"id": "c7_06", "ch": 7, "type": "mc", "q": "Which of the following substances are required by all organisms?", "opts": ["Organic nutrients", "Inorganic nutrients", "Growth factors", "Oxygen gas"], "correct": 1, "exp": "All organisms need inorganic nutrients; the other options vary by organism type."}, {"id": "c7_07", "ch": 7, "type": "mc", "q": "A pathogen would most accurately be described as a", "opts": ["Parasite", "Commensal", "Saprobe", "Symbiont"], "correct": 0, "exp": "A pathogen is a parasite that causes disease/harm to its host."}, {"id": "c7_08", "ch": 7, "type": "mc", "q": "Which of the following is true of passive transport?", "opts": ["Requires a gradient", "Uses the cell wall", "Includes endocytosis", "Only moves water"], "correct": 0, "exp": "Passive transport moves substances down their concentration gradient, no energy needed."}, {"id": "c7_09", "ch": 7, "type": "mc", "q": "A cell exposed to a hypertonic environment will ______ by osmosis.", "opts": ["Gain water", "Lose water", "Neither gain nor lose water", "Burst"], "correct": 1, "exp": "In a hypertonic environment (more solute outside), water leaves the cell."}, {"id": "c7_10", "ch": 7, "type": "mc", "q": "Active transport of a substance across a membrane requires", "opts": ["A gradient", "The expenditure of ATP", "Water", "Diffusion"], "correct": 1, "exp": "Active transport moves substances against their gradient, which costs ATP."}, {"id": "c7_11", "ch": 7, "type": "mc", "q": "Psychrophiles would be expected to grow", "opts": ["In hot springs", "On the human body", "At refrigeration temperatures", "At low pH"], "correct": 2, "exp": "Psychrophiles are cold-loving, optimal growth below 15°C."}, {"id": "c7_12", "ch": 7, "type": "mc", "q": "Which of the following is not involved in quorum sensing?", "opts": ["Accumulation of inducer molecules", "A certain level of biofilm density", "Self-monitoring", "Release of genetic material"], "correct": 3, "exp": "Quorum sensing relies on inducer molecule accumulation and population density, not DNA release."}, {"id": "c7_13", "ch": 7, "type": "mc", "q": "Superoxide ion is toxic to strict anaerobes because they lack", "opts": ["Catalase", "Peroxidase", "Dismutase", "Oxidase"], "correct": 2, "exp": "Superoxide dismutase neutralizes superoxide radicals; strict anaerobes lack it."}, {"id": "c7_14", "ch": 7, "type": "mc", "q": "The time required for a cell to undergo binary fission is called the", "opts": ["Exponential growth rate", "Growth curve", "Generation time", "Lag period"], "correct": 2, "exp": "Generation (doubling) time is the time per division cycle."}, {"id": "c7_15", "ch": 7, "type": "mc", "q": "In a viable plate count, each ______ represents a ______ from the sample population.", "opts": ["cell, colony", "colony, cell", "hour, generation", "cell, generation"], "correct": 1, "exp": "Each visible colony arose from one viable cell."}, {"id": "c7_16", "ch": 7, "type": "mc", "q": "The stage in population growth with the highest rate of cell division is the", "opts": ["Stationary phase", "Lag phase", "Exponential phase", "Enlargement phase"], "correct": 2, "exp": "Exponential (log) phase has the fastest division rate."}, {"id": "c7_17", "ch": 7, "type": "match", "q": "Match the statement to the symbiotic term it most accurately describes.", "items": ["Mutualism", "Commensalism", "Parasitism"], "rights": ["Organisms living in an obligatory, mutually beneficial relationship", "One organism benefits while the other is neither harmed nor benefited", "One organism is harmed while providing the other with nutrients and a habitat"], "exp": "Mutualism = both benefit; commensalism = one benefits, other unaffected; parasitism = one benefits, other harmed."}, {"id": "c7_18", "ch": 7, "type": "tf", "q": "Microbial growth refers only to an increase in the number of cells in a population.", "correct": false, "exp": "False -- growth has two aspects: (1) an individual cell synthesizing components and increasing in size, and (2) the population's cell number increasing."}, {"id": "c7_19", "ch": 7, "type": "fill", "q": "With respect to oxygen requirements, an ______ can use gaseous oxygen and possesses enzymes to process toxic oxygen byproducts.", "answers": ["aerobe"], "exp": "Aerobes use O2 and can detoxify its reactive byproducts."}, {"id": "c7_20", "ch": 7, "type": "fill", "q": "An ______ aerobe cannot grow without oxygen.", "answers": ["obligate"], "exp": "Obligate aerobes absolutely require O2."}, {"id": "c7_21", "ch": 7, "type": "fill", "q": "Organisms called ______ metabolize by aerobic respiration but can adapt to anaerobic environments.", "answers": ["facultative anaerobes", "facultative anaerobe"], "exp": "Facultative anaerobes switch between aerobic and anaerobic metabolism."}, {"id": "c7_22", "ch": 7, "type": "fill", "q": "______ fall into the oxygen-requirement group that can only tolerate very minute concentrations of oxygen.", "answers": ["microaerophiles", "microaerophile"], "exp": "Microaerophiles need a little O2, but not much."}, {"id": "c7_23", "ch": 7, "type": "fill", "q": "Organisms that lack the enzymes needed to use oxygen in respiration, and may not tolerate any free oxygen at all, are called ______.", "answers": ["anaerobes", "anaerobe", "strict anaerobes"], "exp": "Anaerobes (strict anaerobes) lack oxygen-detoxifying enzymes entirely."}, {"id": "c7_24", "ch": 7, "type": "match", "q": "Match the bioelement to the statement describing its role.", "items": ["Carbon", "Oxygen", "Potassium", "Phosphorus", "Calcium", "Iron"], "rights": ["Product of respiration and used in photosynthesis", "Necessary for nutrient metabolism by aerobes; a significant element in organic and inorganic compounds", "Plays a role in protein synthesis and membrane transport", "Key component of genetic material in cells", "Stabilizes cell walls and adds resistance to bacterial endospores", "Essential element for the structure of respiratory proteins"], "exp": "Bioelements each have distinct structural/metabolic roles -- phosphorus for DNA/RNA, calcium for endospore resistance, iron for respiratory proteins.", "terms": ["bioelements"]}, {"id": "c7_25", "ch": 7, "type": "mc", "q": "Which mnemonic lists the essential bioelements (SPONCH and beyond)?", "opts": ["“Dear King Philip Came Over For Good Soup”", "“Come In And Stain”", "“C HOPKINS CaFe Na Cl Mgood”", "“King Phillip Came Over For Good Spaghetti”"], "correct": 2, "exp": "C HOPKINS CaFe Na Cl Mgood = Carbon, Hydrogen, Oxygen, Phosphorus, Potassium, Iodine, Nitrogen, Sulfur, Calcium, Iron, Sodium, Chlorine, Magnesium.", "terms": ["bioelements"]}, {"id": "d7_01", "ch": 7, "type": "discuss", "q": "Predict the direction of osmosis between two solutions; which microbe is a halophile?", "model": "Water moves toward the side with higher solute concentration (the hypertonic side). A microbe needing roughly 10% external salt to stay in osmotic balance is a halophile."}, {"id": "d7_02", "ch": 7, "type": "discuss", "q": "Describe the basic metabolism of methanogens.", "model": "They combine H2 and CO2 anaerobically to produce methane (CH4) and water, generating ATP via chemoautotrophy."}, {"id": "d7_03", "ch": 7, "type": "discuss", "q": "Discuss extreme environments and the extremophiles that live there.", "model": "Hyperthermophiles (hydrothermal vents), psychrophiles (glaciers/polar regions), obligate halophiles (salt lakes/Dead Sea), barophiles (deep ocean trenches)."}, {"id": "d7_04", "ch": 7, "type": "discuss", "q": "Differentiate mutualism and syntrophy, with examples.", "model": "Mutualism is an obligatory, tightly co-dependent partnership (e.g., termites and their gut protozoan Trichonympha); syntrophy is a looser, non-obligatory cross-feeding relationship between species (e.g., Azotobacter and Cellulomonas)."}, {"id": "d7_05", "ch": 7, "type": "discuss", "q": "(a) What biochemical events let a biofilm act as a unit via quorum sensing? (b) How does biofilm self-monitoring favor infection?", "model": "(a) Accumulating inducer molecules reach a threshold concentration, triggering synchronized gene expression across the population. (b) Coordinated, simultaneous release of toxins/enzymes can overwhelm host defenses before detection."}, {"id": "d7_06", "ch": 7, "type": "discuss", "q": "Explain growth-curve stages A through D.", "model": "A = Lag (adjusting, little division); B = Exponential/Log (fastest division rate); C = Stationary (nutrients limit growth, death rate approx. equals division rate); D = Death (nutrients depleted, cells dying faster than dividing)."}, {"id": "d7_07", "ch": 7, "type": "discuss", "q": "Fill in a nutritional summary table (carbon source, energy source, example) for photoautotroph, photoheterotroph, chemoautotroph, chemoheterotroph, saprobe, and parasite.", "model": "Photoautotroph: CO2 / light / cyanobacteria. Photoheterotroph: organic / light / some purple non-sulfur bacteria. Chemoautotroph: CO2 / inorganic chemicals / nitrifying bacteria. Chemoheterotroph: organic / organic / most bacteria, fungi, protozoa, humans. Saprobe: organic (dead matter) / organic / decomposers. Parasite: organic (living host) / organic / pathogens."}, {"id": "d7_08", "ch": 7, "type": "discuss", "q": "(a) Could a microbe grow on a medium with only CaCO3, MgNO3, FeCl2, ZnSO4, and glucose? (b) Explain the mnemonic ‘C HOPKINS CaFe Na Cl Mgood.’", "model": "(a) No -- phosphorus is missing, and it's an essential bioelement (SPONCH). (b) Carbon, Hydrogen, Oxygen, Phosphorus, Potassium, Iodine, Nitrogen, Sulfur, Calcium, Iron, Sodium, Chlorine, Magnesium -- the essential bioelements.", "terms": ["bioelements"]}, {"id": "d7_09", "ch": 7, "type": "discuss", "q": "How would you determine the nutrient requirements of a microbe from Mars?", "model": "Systematically test growth on minimal media, omitting one element/compound at a time, to see which are essential."}, {"id": "d7_10", "ch": 7, "type": "discuss", "q": "Why are diabetic ketoacidosis patients susceptible to fungal infections?", "model": "High blood glucose plus lowered pH create an acidic, nutrient-rich environment favoring opportunistic fungi like Rhizopus and Mucor."}, {"id": "d7_11", "ch": 7, "type": "discuss", "q": "How do osmotic pressure and pH contribute to food preservation?", "model": "High salt/sugar creates a hypertonic environment causing plasmolysis in microbes; acidic pH inhibits enzymes of typical spoilage/pathogenic bacteria."}, {"id": "d7_12", "ch": 7, "type": "discuss", "q": "How can anaerobic infections be treated by manipulating gas content?", "model": "Hyperbaric oxygen therapy floods tissue with high-pressure O2, generating toxic superoxide radicals that kill obligate anaerobes like Clostridium perfringens."}, {"id": "d7_13", "ch": 7, "type": "discuss", "q": "Can anaerobes and aerobes coexist in the same habitat?", "model": "Yes -- in microenvironments like dental plaque or gut biofilms, aerobes consume available O2, creating anaerobic pockets where strict anaerobes thrive nearby."}, {"id": "d7_14", "ch": 7, "type": "discuss", "q": "A food sample has 40,960 cells after 4 hours. Project the count after 1 more hour, and after 10 more hours.", "model": "+1 hour (3 generations): 40,960 × 2^3 = 327,680 cells. +10 hours (30 generations): 40,960 × 2^30 ≈ 4.39×10^13 cells -- illustrating why proper refrigeration matters."}, {"id": "d7_15", "ch": 7, "type": "discuss", "q": "Explain Beijerinck's idea: ‘Everything is everywhere, the environment selects.’", "model": "Microbes are dispersed virtually everywhere, but only the specific local conditions (temperature, chemistry, pH) allow particular species to actually grow and dominate."}, {"id": "d7_16", "ch": 7, "type": "discuss", "q": "Compare a mutualistic endosymbiont to a parasitic endosymbiont.", "model": "Both live inside host cells; a mutualistic endosymbiont provides the host useful nutrients/metabolites, while a parasitic endosymbiont drains the host's resources and causes damage."}, {"id": "d7_17", "ch": 7, "type": "discuss", "q": "Graph a psychrophile's vs. an obligate thermophile's growth curve by temperature.", "model": "Psychrophile: growth peaks below 15°C (roughly -15°C to 20°C range). Obligate thermophile: growth peaks above 60-80°C (roughly 45°C to 100°C+ range)."}, {"id": "d7_18", "ch": 7, "type": "discuss", "q": "Explain a viable plate count calculation from serial dilutions.", "model": "Multiply the colony count on a countable plate by the reciprocal of its dilution factor (accounting for volume plated) to back-calculate the total CFU/mL in the original sample."}, {"id": "c8_01", "ch": 8, "type": "mc", "q": "______ is another term for biosynthesis.", "opts": ["Catabolism", "Anabolism", "Metabolism", "Catalyst"], "correct": 1, "exp": "Anabolism = building up/synthesis; catabolism = breaking down."}, {"id": "c8_02", "ch": 8, "type": "mc", "q": "Catabolism is a form of metabolism in which ______ are transformed into ______.", "opts": ["larger, smaller", "smaller, larger", "amino acid, protein", "glucose, starch"], "correct": 0, "exp": "Catabolism breaks larger molecules into smaller ones, releasing energy."}, {"id": "c8_03", "ch": 8, "type": "mc", "q": "An enzyme ______ the activation energy required for a chemical reaction.", "opts": ["increases", "converts", "lowers", "catalyzes"], "correct": 2, "exp": "Enzymes lower the activation energy barrier."}, {"id": "c8_04", "ch": 8, "type": "mc", "q": "An enzyme", "opts": ["Becomes part of the final products", "Is nonspecific for substrate", "Is consumed by the reaction", "Is heat and pH labile"], "correct": 3, "exp": "Enzymes are sensitive to heat and pH (can denature); they are specific and not consumed."}, {"id": "c8_05", "ch": 8, "type": "mc", "q": "Catalysis occurs at the ______ site of an enzyme.", "opts": ["cofactor", "allosteric", "redox", "active"], "correct": 3, "exp": "The active site is where substrate binds and the reaction is catalyzed."}, {"id": "c8_06", "ch": 8, "type": "mc", "q": "Many coenzymes contain", "opts": ["Metals", "Vitamins", "Proteins", "Substrates"], "correct": 1, "exp": "Many coenzymes are vitamin-derived (e.g., NAD+ from niacin)."}, {"id": "c8_07", "ch": 8, "type": "mc", "q": "To digest cellulose in its environment, a fungus produces a/an", "opts": ["Endoenzyme", "Exoenzyme", "Catalase", "Polymerase"], "correct": 1, "exp": "Exoenzymes are secreted outside the cell to digest material in the environment.", "terms": ["enzyme vocab"]}, {"id": "c8_08", "ch": 8, "type": "mc", "q": "Energy in biological systems is primarily", "opts": ["Electrical", "Chemical", "Radiant", "Mechanical"], "correct": 1, "exp": "Biological energy is stored and transferred chemically (e.g., in ATP bonds)."}, {"id": "c8_09", "ch": 8, "type": "mc", "q": "Energy is carried from catabolic to anabolic reactions in the form of ______.", "opts": ["ADP", "high-energy ATP bonds", "coenzymes", "inorganic phosphate"], "correct": 1, "exp": "ATP's high-energy phosphate bonds shuttle energy between reactions."}, {"id": "c8_10", "ch": 8, "type": "mc", "q": "Exergonic reactions", "opts": ["Release potential energy", "Consume energy", "Form bonds", "Occur only outside the cell"], "correct": 0, "exp": "Exergonic = energy-releasing (vs. endergonic = energy-consuming)."}, {"id": "c8_11", "ch": 8, "type": "mc", "q": "A reduced compound is", "opts": ["NAD+", "FAD", "NADH", "ADP"], "correct": 2, "exp": "NADH is the reduced (electron-carrying) form; NAD+ is oxidized."}, {"id": "c8_12", "ch": 8, "type": "mc", "q": "Most oxidation reactions in microbial bioenergetics involve the", "opts": ["Removal of electrons", "Addition of electrons", "Addition of oxygen", "Removal of oxygen"], "correct": 0, "exp": "Oxidation = loss of electrons (often as hydrogen atoms); reduction = gain."}, {"id": "c8_13", "ch": 8, "type": "mc", "q": "A product or products of glycolysis is/are", "opts": ["ATP", "Pyruvic acid", "CO2", "Both a and b"], "correct": 3, "exp": "Glycolysis produces both net ATP and pyruvic acid (no CO2)."}, {"id": "c8_14", "ch": 8, "type": "mc", "q": "Fermentation of a glucose molecule has the potential to produce a net number of ______ ATPs.", "opts": ["4", "2", "38", "32"], "correct": 1, "exp": "Fermentation nets only 2 ATP (from glycolysis) -- no ETC involved."}, {"id": "c8_15", "ch": 8, "type": "mc", "q": "Complete oxidation of glucose in aerobic respiration by a eukaryote could potentially yield a net maximum output of ______ ATPs.", "opts": ["40", "30", "38", "2"], "correct": 2, "exp": "Theoretical max is often cited as 38 ATP (36-38 in eukaryotes due to shuttle costs)."}, {"id": "c8_16", "ch": 8, "type": "mc", "q": "The compound that enters the Krebs cycle is", "opts": ["Citric acid", "Oxaloacetic acid", "Pyruvic acid", "Acetyl coenzyme A"], "correct": 3, "exp": "Acetyl-CoA (from pyruvate via the transition step) enters the Krebs cycle, combining with oxaloacetic acid to form citric acid."}, {"id": "c8_17", "ch": 8, "type": "mc", "q": "The FADH2 formed during the Krebs cycle enters the electron transport system at which site?", "opts": ["NADH dehydrogenase", "Complex II", "Complex IV", "ATP synthase"], "correct": 1, "exp": "FADH2 feeds electrons in at Complex II (lower energy entry than NADH at Complex I)."}, {"id": "c8_18", "ch": 8, "type": "mc", "q": "The proton motive force is the result of", "opts": ["ATP synthase transporting protons during ATP synthesis", "An electron gradient between the matrix and intermembrane space", "A proton gradient between the matrix and intermembrane space of a mitochondrion", "A buildup of negatively charged ions"], "correct": 2, "exp": "The PMF is a proton (H+) gradient, not an electron gradient."}, {"id": "c8_19", "ch": 8, "type": "mc", "q": "Photosynthetic organisms convert the energy of ______ into chemical energy.", "opts": ["Electrons", "Protons", "Photons", "Hydrogen atoms"], "correct": 2, "exp": "Photons (light energy) are converted into chemical energy (ATP/NADPH)."}, {"id": "c8_20", "ch": 8, "type": "mc", "q": "The Calvin cycle operates during which part of photosynthesis?", "opts": ["Only the light-dependent phase", "Only in the dark", "The light-independent phase", "Only during photosystem I"], "correct": 2, "exp": "The Calvin cycle is the light-independent phase (it can run in light, just doesn't require it directly)."}, {"id": "c8_21", "ch": 8, "type": "mc", "q": "The oxygen produced by photosynthesis comes from", "opts": ["CO2", "NO3", "H2O", "Glucose"], "correct": 2, "exp": "Photolysis of water releases O2 during the light-dependent reactions."}, {"id": "c8_22", "ch": 8, "type": "match", "q": "Match each metabolic event to the process it belongs to (glycolysis, Krebs cycle, or electron transport/oxidative phosphorylation).", "items": ["H+ and electrons are delivered to O2 as the final electron acceptor", "Pyruvic acid is formed", "ATP is produced", "H2O is produced", "CO2 is formed", "Fructose diphosphate is split into two 3-carbon fragments", "NADH is oxidized", "ATP synthase is active"], "rights": ["Electron transport chain", "Glycolysis", "All three (glycolysis, Krebs cycle, and electron transport)", "Electron transport chain", "Krebs cycle", "Glycolysis", "Electron transport chain", "Electron transport chain"], "exp": "ATP is produced at all three stages; CO2 only in the Krebs cycle; O2 and H2O only at the electron transport chain."}, {"id": "c8_23", "ch": 8, "type": "tf", "q": "The Krebs cycle provides a significant means to synthesize a small amount of ATP in the absence of oxygen and also to generate pyruvic acid, an essential intermediary metabolite.", "correct": false, "exp": "False -- that description is glycolysis, not the Krebs cycle. Glycolysis makes pyruvic acid, which then enters the Krebs cycle."}, {"id": "c8_24", "ch": 8, "type": "tf", "q": "The Krebs cycle allows the acetyl groups from the breakdown (beta oxidation) of certain fats to enter the pathway and be used as an energy source.", "correct": true, "exp": "True -- fatty acid breakdown feeds acetyl-CoA into the Krebs cycle."}, {"id": "c8_25", "ch": 8, "type": "mc", "q": "Protons (H+) released during electron transport:", "opts": ["Act as coenzymes", "Are passed along the electron transport chain along with the electrons", "Are the terminal electron acceptors", "Are pumped across the membrane, creating the proton motive force"], "correct": 3, "exp": "Protons are pumped across the membrane (not carried along with the electrons) to build the proton motive force."}, {"id": "c8_26", "ch": 8, "type": "mc", "q": "In aerobic respiration, oxygen acts as:", "opts": ["A carrier of electrons, passing them down the chain", "A reducing agent", "The terminal electron acceptor", "A coenzyme"], "correct": 2, "exp": "O2 is the final electron acceptor in aerobic respiration, forming H2O."}, {"id": "c8_27", "ch": 8, "type": "fill", "q": "Glycolysis produces 4 ATP via substrate-level phosphorylation but uses 2 to start, for a net of ______ ATP.", "answers": ["2", "
